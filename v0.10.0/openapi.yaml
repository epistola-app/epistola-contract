openapi: 3.1.0
info:
  title: Epistola API
  description: |
    Document template management API for Epistola Suite.

    ## Versioning
    This API uses header-based versioning via the Accept header.
    Use `application/vnd.epistola.v1+json` for API version 1.

    ## Authentication
    The API uses JWT Bearer tokens for authentication. Two paths are supported:
    - **OAuth 2.0** (recommended): Use Client Credentials flow to obtain a JWT from your IdP
    - **Self-signed JWT**: Register with a public key, then sign short-lived JWTs with your private key

    Both paths use `Authorization: Bearer <jwt>`. Permissions (allowed tenants, roles)
    are managed in Epistola's consumer record, not in JWT claims.

    See the [Authentication Guide](/docs/auth.md) for details.

    ## Client Identity

    All requests must include the following headers for client identification:

    - **`User-Agent`** (required) — identifies the client software stack using standard
      [RFC 9110 §10.1.5](https://www.rfc-editor.org/rfc/rfc9110#name-user-agent) product tokens.
      The first token **must** be `epistola-contract/{version}` indicating the contract
      version the client was built against. Additional product/version pairs can be
      appended to describe the full software stack.
      Example: `epistola-contract/x.y.z valtimo-epistola-plugin/1.2.0 gzac/5.0.0`
    - **`X-EP-Node-Id`** (required) — identifies the specific client node. Use the
      Kubernetes pod name, container ID, or hostname. In local/dev environments,
      the machine hostname is acceptable.

    The generated Epistola client libraries set both headers automatically — `User-Agent`
    with the contract version, and `X-EP-Node-Id` with the hostname. Consumers wrapping
    the client library can append additional product tokens to `User-Agent` for their
    own software and override the node ID as needed.

    ## Error Responses

    The API uses [RFC 9457 Problem Details](https://www.rfc-editor.org/rfc/rfc9457)
    for error responses. Error responses have `Content-Type: application/problem+json`
    and include the following fields:

    - `type` (string, URI) — identifies the problem type; the stable,
      machine-readable discriminator clients should switch on
    - `title` (string) — short human-readable summary
    - `status` (integer) — HTTP status code
    - `detail` (string, optional) — human-readable explanation of this occurrence
    - `instance` (string, URI, optional) — identifies this specific occurrence

    Problem `type` URIs use the `https://epistola.app/errors/{slug}` namespace
    and resolve to human-readable HTML documentation for that problem type.
    A response may also carry domain-specific extension members as top-level
    fields; clients should ignore members they do not recognize.

    For validation errors (`type: .../validation-error`), the response also
    includes an `errors` array with field-level details.

    The canonical problem `type` slugs are registered in
    [`docs/error-types.md`](docs/error-types.md); the machine-readable
    registry is this document's top-level `x-problem-types` extension.

    ## Authorization
    Access is controlled via roles (`reader`, `editor`, `generator`, `manager`,
    `tenant_control`) and tenant permissions. These are set by an administrator
    when approving a consumer registration.
  version: 0.10.0
  contact:
    name: Epistola Team
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: System
    description: |
      System-level endpoints for health checking and metadata exchange.

      ## Ping / Pong

      The `POST /ping` endpoint enables bidirectional metadata exchange between
      clients and the server. It serves two purposes:

      1. **Health checking** — Any client (including load balancers and monitoring
         probes) can send an unauthenticated ping to verify the server is alive.
         The response contains only `status` and `timestamp`.

      2. **Metadata exchange** — Authenticated clients receive a full response
         including server version, API spec version, and node identity. Clients
         can also send their own metadata (name, version, node ID) in the request
         body for server-side logging and diagnostics.

      ### Recommended ping intervals

      - **On startup**: Always ping once before making business requests.
      - **Periodic**: Every 30–60 seconds for ongoing health monitoring.
      - **After failures**: Ping to check server availability before retrying.
  - name: Tenants
    description: Multi-tenant management operations
  - name: Templates
    description: Document template operations
  - name: Themes
    description: Reusable style collections for templates
  - name: Environments
    description: Tenant environment configuration (staging, production, etc.)
  - name: Attributes
    description: Attribute definitions for variant selection criteria
  - name: Variants
    description: Template variant operations (language, brand variations)
  - name: Versions
    description: Template version lifecycle (draft, publish, archive)
  - name: Stencils
    description: Reusable template component operations (CRUD, versioning, usage tracking)
  - name: Catalogs
    description: Catalog import and management operations
  - name: CodeLists
    description: |
      Reusable `{code, label}` collections that attributes can bind to.
      Code lists are tenant + catalog scoped; SUBSCRIBED-catalog code
      lists (e.g. the bundled `system` catalog's BCP-47, ISO 639-1,
      ISO 3166-1 alpha-2) are read-only — PATCH/DELETE return 409.
  - name: Fonts
    description: |
      Font families (tenant + catalog scoped) and the weight/italic faces
      they ship. Read-only over REST — like image assets, families and their
      binaries are managed through the UI and catalog exchange only;
      SUBSCRIBED-catalog families (the bundled `system` fonts) are flagged
      `readOnly: true`.
  - name: Consumers
    description: |
      Tenant-scoped consumer application registration and lifecycle management.

      Each tenant independently manages which applications can access their resources.
      The same application can register in multiple tenants with separate approvals.

      ## Onboarding

      Two registration paths are supported:

      - **Self-signed JWT**: Application calls `POST /tenants/{tenantId}/consumers/register`
        with a public key. Created as `pending` until a tenant manager approves.
      - **OAuth**: First authenticated request to a tenant auto-registers the consumer
        as `pending`. A tenant manager must approve before resources are accessible.

      ## Permissions

      Consumers declare what permissions they need at registration time (or via
      OAuth scopes). The tenant manager reviews and grants equal or fewer permissions
      on approval. Permissions are per-resource (`read`, `write`, `publish`) and
      managed in Epistola's consumer record.

      ## Authentication

      Both paths use `Authorization: Bearer <jwt>`. For self-signed JWT consumers,
      the JWT is short-lived (60s) and signed with the consumer's private key.
  - name: Generation
    description: Asynchronous document generation operations
paths:
  /ping:
    post:
      operationId: ping
      summary: Ping the server and exchange metadata
      description: |
        Bidirectional metadata exchange endpoint for health checking and version discovery.

        ## Two-tier response

        This endpoint supports both unauthenticated and authenticated requests:

        - **Unauthenticated**: Returns only `status` and `timestamp` — useful for load balancers,
          monitoring probes, and basic liveness checks.
        - **Authenticated**: Returns the full response including `details` with server version,
          API spec version, and node identity. The client can also send its own metadata
          (name, version, node ID) in the request body for server-side diagnostics.

        ## Recommended usage

        - **On startup**: Always ping once to verify the server is reachable and discover its
          version before making business requests.
        - **Periodic health check**: Ping every **30–60 seconds** for ongoing health monitoring.
          More frequent pings add unnecessary load; less frequent pings delay issue detection.
        - **On-demand after failures**: When a business request fails, ping to determine whether
          the server is still available before retrying.

        ## Request body

        The request body is entirely optional. An empty body (`{}`) or no body at all is valid
        and returns a basic health response. Include client metadata when you want the server
        to log which clients are connected or to enable future compatibility features.
      tags:
        - System
      security: []
      requestBody:
        required: false
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/PingRequest'
      responses:
        '200':
          description: Server health status and optional metadata
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/PongResponse'
  /tenants:
    get:
      operationId: listTenants
      summary: List all tenants
      description: Retrieve a paginated list of all tenants with optional search filtering.
      tags:
        - Tenants
      x-required-roles:
        - tenant_control
      parameters:
        - name: q
          in: query
          description: Search term for filtering tenants by name
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of tenants
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      operationId: createTenant
      summary: Create a new tenant
      description: Create a new tenant with the given name.
      tags:
        - Tenants
      x-required-roles:
        - tenant_control
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/TenantDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    get:
      operationId: getTenant
      summary: Get tenant by ID
      description: Retrieve details of a specific tenant.
      tags:
        - Tenants
      x-required-roles:
        - reader
        - editor
        - generator
        - manager
        - tenant_control
      responses:
        '200':
          description: Tenant details
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/TenantDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: Update the name of an existing tenant.
      tags:
        - Tenants
      x-required-roles:
        - tenant_control
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/TenantDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteTenant
      summary: Delete a tenant
      description: Delete a tenant and all associated templates.
      tags:
        - Tenants
      x-required-roles:
        - tenant_control
      responses:
        '204':
          description: Tenant deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /tenants/{tenantId}/consumers/register:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    post:
      operationId: registerConsumer
      summary: Register a new consumer in this tenant
      description: |
        Self-service registration for consumer applications using self-signed JWT
        authentication. The consumer is created in `pending` status within this
        tenant until a tenant manager approves the registration.

        This endpoint requires no authentication — the public key in the request
        body establishes the consumer's identity for future authentication.

        OAuth consumers do not use this endpoint. They are auto-registered as
        `pending` on their first authenticated request to this tenant.

        API-key consumers do not use this endpoint either. They are provisioned
        out of band by a tenant manager (api-key creation is a manager-side
        action, not a self-service flow) and materialize directly as `active`.
      tags:
        - Consumers
      security: []
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/RegisterConsumerRequest'
      responses:
        '201':
          description: Consumer registered (status = pending)
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /tenants/{tenantId}/consumers:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    get:
      operationId: listConsumers
      summary: List consumers in this tenant
      description: |
        Retrieve a paginated list of consumers registered in this tenant
        with optional filtering by status.
      tags:
        - Consumers
      x-required-roles:
        - manager
      parameters:
        - name: q
          in: query
          description: Search term for filtering consumers by name or ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by consumer status
          schema:
            type: string
            enum:
              - pending
              - active
              - rejected
              - expired
              - inactive
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of consumers
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerListResponse'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /tenants/{tenantId}/consumers/{consumerId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: consumerId
        in: path
        required: true
        description: Unique slug identifier of the consumer
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    get:
      operationId: getConsumer
      summary: Get consumer by ID
      description: Retrieve details of a specific consumer in this tenant.
      tags:
        - Consumers
      x-required-roles:
        - manager
      responses:
        '200':
          description: Consumer details
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateConsumer
      summary: Update consumer metadata or permissions
      description: Update a consumer's metadata or permissions within this tenant.
      tags:
        - Consumers
      x-required-roles:
        - manager
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateConsumerRequest'
      responses:
        '200':
          description: Consumer updated
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteConsumer
      summary: Delete a consumer
      description: |
        Permanently remove a consumer from this tenant.

        **Effect on generation results:**
        - Partitions assigned to this consumer's nodes are released.
        - Uncollected generation results remain in the system but are no longer
          deliverable via the `/generation/collect` endpoint.
        - Generated documents can still be accessed directly via
          `GET /tenants/{tenantId}/documents/{documentId}`.
        - The `createdBy` field on documents retains the consumer ID
          (orphaned reference).
      tags:
        - Consumers
      x-required-roles:
        - manager
      responses:
        '204':
          description: Consumer deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /tenants/{tenantId}/consumers/{consumerId}/approve:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: consumerId
        in: path
        required: true
        description: Unique slug identifier of the consumer to approve
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    post:
      operationId: approveConsumer
      summary: Approve a pending consumer
      description: |
        Approve a consumer registration within this tenant. Sets the roles and
        optional expiry. The consumer transitions from `pending` to `active`.
      tags:
        - Consumers
      x-required-roles:
        - manager
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/ApproveConsumerRequest'
      responses:
        '200':
          description: Consumer approved (status = active)
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /tenants/{tenantId}/consumers/{consumerId}/reject:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: consumerId
        in: path
        required: true
        description: Unique slug identifier of the consumer to reject
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    post:
      operationId: rejectConsumer
      summary: Reject a pending consumer
      description: |
        Reject a consumer registration. The consumer transitions from `pending`
        to `rejected`. Optionally provide a reason.
      tags:
        - Consumers
      x-required-roles:
        - manager
      requestBody:
        required: false
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/RejectConsumerRequest'
      responses:
        '200':
          description: Consumer rejected (status = rejected)
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /tenants/{tenantId}/consumers/{consumerId}/public-key:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: consumerId
        in: path
        required: true
        description: Unique slug identifier of the consumer
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    put:
      operationId: rotatePublicKey
      summary: Rotate public key
      description: |
        Replace the public key for a self-signed JWT consumer. Must authenticate
        with a valid JWT signed by the current key. After rotation, the old key
        is immediately invalidated.
      tags:
        - Consumers
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/RotatePublicKeyRequest'
      responses:
        '200':
          description: Public key rotated
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ConsumerDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /tenants/{tenantId}/catalogs/{catalogId}/themes:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: catalogId
        in: path
        required: true
        description: Slug identifier of the catalog
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
    get:
      operationId: listThemes
      summary: List themes for a tenant
      description: Retrieve all themes configured for a specific tenant.
      tags:
        - Themes
      x-required-roles:
        - reader
        - editor
        - generator
        - manager
      parameters:
        - name: q
          in: query
          description: Search term to filter themes by name
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of themes
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ThemeListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createTheme
      summary: Create a new theme
      description: Create a new theme for the specified tenant.
      tags:
        - Themes
      x-required-roles:
        - editor
        - manager
      requestBody:
        required: true
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
      responses:
        '201':
          description: Theme created successfully
          content:
            application/vnd.epistola.v1+json:
              schema:
                $ref: '#/components/schemas/ThemeDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /tenants/{tenantId}/catalogs/{catalogId}/themes/{themeId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
      - name: catalogId
        in: path
        required: true
        description: Slug identifier of the catalog
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
      - name: themeId
        in: path
        required: true
        description: Slug identifier of the theme
