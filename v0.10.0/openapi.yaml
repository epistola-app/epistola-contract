          items:
            $ref: '#/components/schemas/CatalogDto'
        page:
          $ref: '#/components/schemas/PageMeta'
    CatalogUpgradeDiff:
      type: object
      description: Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's latest release. Each bucket entry is `"type/slug"` (e.g. `theme/corporate`).
      required:
        - catalogId
        - newVersion
        - upgradeAvailable
        - added
        - removed
        - changed
        - unchanged
        - conflicts
        - blockedByConflicts
      properties:
        catalogId:
          type: string
          description: Catalog slug.
          example: municipality-demo
        previousVersion:
          type:
            - string
            - 'null'
          description: Currently installed release version (null if unknown).
          example: 1.3.0
        newVersion:
          type: string
          description: The source manifest's release version.
          example: 1.4.0
        upgradeAvailable:
          type: boolean
          description: True when there is anything to apply (added/removed/changed).
          example: true
        added:
          type: array
          description: Newly published resources. Not installed on upgrade unless explicitly opted in (UI only — there is no upgrade action over REST).
          items:
            type: string
          example:
            - template/cover-letter
        removed:
          type: array
          description: Resources the new release removed (deleted on upgrade).
          items:
            type: string
          example:
            - theme/legacy
        changed:
          type: array
          description: Installed resources whose published content changed.
          items:
            type: string
          example:
            - theme/corporate
        unchanged:
          type: array
          items:
            type: string
          example:
            - attribute/language
        conflicts:
          type: array
          description: Human-readable cross-catalog references that would block the removal set. Non-empty ⇒ an upgrade would be rejected.
          items:
            type: string
          example:
            - 'Theme ''legacy'' is used by template ''Invoice'' (catalog: billing)'
        blockedByConflicts:
          type: boolean
          description: True when `conflicts` is non-empty.
          example: false
    CodeListDto:
      type: object
      description: |
        A reusable `{code, label}` collection that an attribute can bind to.

        Code lists are tenant + catalog scoped — the same shape attributes follow.
        A code list from a SUBSCRIBED catalog (e.g. the bundled `system` catalog's
        `bcp-47`, `iso-639-1`, `iso-3166-1-alpha2`) is flagged `readOnly: true`;
        PATCH, DELETE, and entry hide-toggles on it return 409.

        Sources: `INLINE` (entries baked into this row) or `URL` (entries fetched
        over HTTPS via the manual "refresh" action). Catalog-imported code lists
        always land as `INLINE` because the entries ship in the catalog manifest.
      required:
        - slug
        - tenantId
        - catalog
        - displayName
        - sourceType
        - authType
        - catalogType
        - readOnly
        - createdAt
        - lastModified
      properties:
        slug:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 50
          description: Slug identifier (unique within `tenant + catalog`).
          example: bcp-47
        tenantId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          example: acme-corp
        catalog:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          description: Slug of the catalog this code list lives in.
          example: system
        displayName:
          type: string
          example: BCP-47 Language Tags
        description:
          type:
            - string
            - 'null'
          example: Curated subset of common BCP-47 language + region tags.
        sourceType:
          type: string
          enum:
            - INLINE
            - URL
          description: Origin of entries — inline (this row) or fetched from a URL.
          example: INLINE
        sourceUrl:
          type:
            - string
            - 'null'
          description: Set only when `sourceType=URL`. HTTPS, file, or classpath.
          example: null
        authType:
          type: string
          enum:
            - NONE
            - API_KEY
            - BEARER
          description: Auth scheme for the URL source. Ignored for INLINE.
          default: NONE
          example: NONE
        catalogType:
          type: string
          enum:
            - AUTHORED
            - SUBSCRIBED
          example: SUBSCRIBED
        readOnly:
          type: boolean
          description: True when `catalogType == SUBSCRIBED`.
          example: true
        lastRefreshedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the last successful URL refresh. Null for INLINE.
          example: null
        lastRefreshError:
          type:
            - string
            - 'null'
          description: Set when the last refresh attempt failed.
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-05-11T00:00:00Z'
        lastModified:
          type: string
          format: date-time
          example: '2026-05-11T00:00:00Z'
      example:
        slug: bcp-47
        tenantId: acme-corp
        catalog: system
        displayName: BCP-47 Language Tags
        description: Curated subset of common BCP-47 language + region tags.
        sourceType: INLINE
        sourceUrl: null
        authType: NONE
        catalogType: SUBSCRIBED
        readOnly: true
        lastRefreshedAt: null
        lastRefreshError: null
        createdAt: '2026-05-11T00:00:00Z'
        lastModified: '2026-05-11T00:00:00Z'
    CodeListEntryDto:
      type: object
      description: |
        A single `{code, label}` entry of a code list.

        `hidden` entries remain valid for existing variants — the validator
        accepts them — but are filtered from pickers by default. This supports
        deprecation, sunset, and tenant-curated subsets without breaking variants
        that already use those codes.
      required:
        - code
        - label
      properties:
        code:
          type: string
          description: Persistable value. What lands on a variant's attribute map.
          example: en-US
        label:
          type: string
          description: Human-readable label shown in pickers.
          example: English (United States)
        sortOrder:
          type: integer
          default: 0
          description: Numeric ordering hint. Same value falls back to code-asc.
          example: 10
        hidden:
          type: boolean
          default: false
          description: Soft-deprecates the entry; existing variants still validate.
          example: false
