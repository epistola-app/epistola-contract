  /tenants/{tenantId}/generation/collect:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique slug identifier of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
    post:
      operationId: collectGenerationResults
      summary: Collect generation results
      description: |
        Collect completed and failed generation results as a compressed NDJSON stream.
        Each line is a self-contained JSON object representing one generation result.

        ## Partition-based routing

        Results are routed to nodes using consistent hashing on the `routingKey`
        from the generation request:

        1. Each result is assigned to a **partition**: `murmur3(routingKey) % totalPartitions`.
           If no routing key was provided, the request ID is used.
        2. Partitions are **assigned to nodes** via consistent hashing. The server
           tracks which nodes are active based on poll frequency.
        3. Each node receives results from its **assigned partitions** only.

        ## Failover

        If a node stops polling (server-configured timeout, default: 60 seconds),
        its partitions are redistributed to the remaining active nodes. Results
        from those partitions are delivered to the new owners. When the node
        returns, partitions are rebalanced again.

        Consistent hashing minimizes disruption — when a node joins or leaves,
        only ~1/N of partitions move.

        ## Partition assignment

        The response metadata (`_meta` line) includes the current partition
        assignment: total partitions, which partitions are assigned to this node,
        and the hash algorithm. Clients can use this to compute routing keys
        that target specific nodes (e.g., to ensure results come back to the
        submitting node).

        ## Acknowledgment

        Each result includes a `sequence` number. Pass the highest successfully
        processed sequence as `acknowledgeUpTo` in the next poll to advance the cursor:

        1. First poll: omit `acknowledgeUpTo` (nothing to acknowledge yet).
        2. Process results. Track the highest `sequence` you successfully handled.
        3. Next poll: `{ "acknowledgeUpTo": 508, "limit": 100 }`.
        4. Server advances per-partition cursors, returns results after 508.

        **Partial acknowledgment**: if you processed results 500-505 out of 500-509,
        set `acknowledgeUpTo: 505`. Results 506-509 are redelivered.

        **After restart**: omit `acknowledgeUpTo`. The server resumes from the last
        acknowledged position. No data loss, no silent acknowledgment.

        ## Compression

        The client specifies preferred compression via `Accept-Encoding`:
        ```
        Accept-Encoding: lz4, zstd, gzip
        ```
        Supported: `lz4` (fastest), `zstd` (best ratio), `gzip` (universal).
        Defaults to `gzip` if not specified.

        ## NDJSON response format

        - **Result lines**: `GenerationResult` objects, one per line
        - **Meta line**: Last line, identified by `_meta: true`, contains `hasMore` and `count`

        ## Adaptive polling

        Use the `hasMore` flag to control polling frequency:
        - `hasMore: true` — poll again immediately (more results available)
        - `hasMore: false` — wait before next poll (caught up)

        Recommended: exponential backoff (1s → 2s → 4s → ... → 30s max), reset on results.
      tags:
        - Generation
      parameters:
        - name: Accept-Encoding
          in: header
          required: false
          description: Preferred compression algorithm(s). Defaults to gzip.
          schema:
            type: string
            default: gzip
          example: lz4, zstd, gzip
      requestBody:
        required: false
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '#/components/schemas/CollectRequest'
      responses:
        '200':
          description: |
            NDJSON stream of generation results. Each line is a JSON object — either a
            `GenerationResult` or a `CollectMeta` (last line, identified by `_meta: true`).
          headers:
            Content-Encoding:
              description: Compression algorithm used.
              schema:
                type: string
                enum:
                  - lz4
                  - zstd
                  - gzip
          content:
            application/vnd.epistola.v1+ndjson:
              schema:
                type: string
                description: |
                  Newline-delimited JSON stream. Each line is a self-contained JSON object.
                  Result lines conform to the GenerationResult schema. The last line conforms
                  to the CollectMeta schema (identified by `_meta: true`).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
components:
  schemas:
    PageMeta:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      properties:
        number:
          type: integer
          description: Current page index (0-based)
          example: 0
        size:
          type: integer
          description: Number of items per page
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of elements across all pages
          example: 1
        totalPages:
          type: integer
          description: Total number of pages
          example: 1
    PingRequest:
      type: object
      description: |
        Client metadata sent to the server as part of a ping request.
        An empty object or no body works as a basic health probe.

        When authenticated, the server uses ping data to maintain a consumer registry.
        The optional `name`, `description`, and `contact` fields allow the application
        to announce itself with human-readable metadata. Combined with the required
        `User-Agent` and `X-EP-Node-Id` headers, the server builds a live view of
        which applications are connected, which nodes they run on, and what versions
        they use.
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Human-readable name of the consuming application.
            Stored by the server as part of the consumer registry.
          example: Invoice Service
        description:
          type: string
          maxLength: 1000
          description: |
            What this application does and why it uses Epistola.
          example: Generates PDF invoices for the billing pipeline
        contact:
          type: string
          maxLength: 255
          description: |
            Team or individual responsible for this application (email, Slack channel, etc.).
          example: billing-team@acme-corp.com
    PongResponse:
      type: object
      description: |
        Server response to a ping request.

        When the request is unauthenticated, only `status` and `timestamp` are returned
        (basic health check). When authenticated, the `details` object is included with
        full server metadata.
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
          description: |
            Current health status of the server.
            - `UP`: All systems operational.
            - `DEGRADED`: Service is running but with reduced capability.
            A server that is completely down cannot respond, so there is no `DOWN` value.
          example: UP
        timestamp:
          type: string
          format: date-time
          description: Server timestamp at the time of the response (ISO 8601)
          example: '2026-04-21T10:30:00Z'
        details:
          $ref: '#/components/schemas/PongDetailsDto'
    PongDetailsDto:
      type: object
      description: |
        Detailed server metadata, only included in the response when the request is authenticated.
      required:
        - serverVersion
        - apiVersion
      properties:
        serverVersion:
          type: string
          description: Semantic version of the running server application
          example: 2.1.0
        apiVersion:
          type: string
          description: The API spec version supported by this server
          example: 0.3.0
        nodeId:
          type: string
          description: Server node identifier (e.g. Kubernetes pod name, hostname)
          example: epistola-server-pod-3a2d1e
        partitions:
          description: |
            Partition assignment for generation result collection, if available.
            Included when the authenticated consumer has an active partition
            assignment in this tenant. Null for new consumers that have not
            yet polled the collect endpoint, or when the request is unauthenticated.

            Clients can use this on startup to compute routing keys that target
            their own node before submitting generation requests.
          $ref: '#/components/schemas/PartitionAssignment'
    ConsumerDto:
      type: object
      description: |
        Represents a consumer application registered within a tenant.

        Consumers are tenant-scoped — each tenant independently manages which
        applications can access their resources. The same application can register
        in multiple tenants with separate approvals.

        Two registration paths are supported:
        - **Self-signed JWT**: Application calls `POST /tenants/{tenantId}/consumers/register`
          with a public key and requested permissions. Created as `pending` until
          a tenant manager approves.
        - **OAuth**: First authenticated request to a tenant auto-registers the consumer
          as `pending`. Requested permissions are derived from JWT scopes.
      required:
        - id
        - tenantId
        - name
        - status
        - authMethod
        - requestedPermissions
        - grantedPermissions
        - nodes
        - createdAt
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: |
            Unique slug identifier of the consumer within this tenant.
            For self-signed JWT consumers, this is self-chosen at registration
            and used as the `iss` claim. For OAuth consumers, this is derived
            from the JWT `client_id` claim.
          example: invoice-service
        tenantId:
          type: string
          description: Tenant this consumer is registered in
          example: acme-corp
        name:
          type: string
          description: Human-readable name of the consuming application
          example: Invoice Service
        description:
          type:
            - string
            - 'null'
          description: What this application does and why it uses Epistola
          example: Generates PDF invoices for the billing pipeline
        contact:
          type:
            - string
            - 'null'
          description: Team or individual responsible for this application
          example: billing-team@acme-corp.com
        status:
          type: string
          enum:
            - pending
            - active
            - rejected
            - expired
            - inactive
          description: |
            Current lifecycle status:
            - `pending`: Registered but awaiting manager approval.
            - `active`: Approved and operational.
            - `rejected`: Manager rejected the registration.
            - `expired`: Approval has expired (expiresAt passed).
            - `inactive`: Manually deactivated by a manager.
          example: active
        authMethod:
          type: string
          enum:
            - oauth
            - self-signed-jwt
            - api-key
          description: |
            How this consumer authenticates:
            - `oauth`: JWT tokens issued by an external Identity Provider.
            - `self-signed-jwt`: Short-lived JWTs signed with the consumer's private key.
            - `api-key`: Long-lived `X-API-Key` header value provisioned by a tenant
              manager. Simpler than the JWT flows; recommended only for trusted
              server-to-server integrations where key rotation is operationally
              manageable. The consumer cannot self-rotate an api key —
              `PUT /consumers/{cid}/public-key` does not apply; rotation requires
              a tenant manager to issue a new key and revoke the old one out of
              band.
          example: self-signed-jwt
        requestedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        publicKey:
          type:
            - string
            - 'null'
          description: |
            PEM-encoded public key for self-signed JWT consumers.
            Null for OAuth consumers.
          example: null
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When this consumer's approval expires. Null means no expiry.
            After this time, the consumer transitions to `expired` status.
          example: '2027-04-22T00:00:00Z'
        rejectionReason:
          type:
            - string
            - 'null'
          description: Reason provided by manager when rejecting the consumer
          example: null
        nodes:
          type: array
          description: Known instances (nodes) of this consumer application
          items:
            $ref: '#/components/schemas/ConsumerNodeDto'
        totalPartitions:
          type:
            - integer
            - 'null'
          description: |
            Total number of partitions for generation result collection.
            Null if the consumer has not yet polled the collect endpoint.
          example: 12
        createdAt:
          type: string
          format: date-time
          description: When the consumer was registered
          example: '2026-04-22T10:00:00Z'
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server last received a request from this consumer
          example: '2026-04-22T14:30:00Z'
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the consumer record was last modified
          example: null
    ConsumerNodeDto:
      type: object
      description: A known instance (node) of a consumer application
      required:
        - nodeId
        - lastSeenAt
      properties:
        nodeId:
          type: string
          description: Node identifier from the `X-EP-Node-Id` header
          example: invoice-service-pod-7f8b9c
        userAgent:
          type:
            - string
            - 'null'
          description: Last seen `User-Agent` header value from this node
          example: epistola-contract/x.y.z valtimo-epistola-plugin/1.2.0
        partitions:
          type: array
          items:
            type: integer
          description: |
            Partition numbers currently assigned to this node for generation
            result collection. Empty if the node has not polled the collect
            endpoint or has no assigned partitions.
          example:
            - 0
            - 1
            - 2
            - 3
        lastSeenAt:
          type: string
          format: date-time
          description: When the server last received a request from this node
          example: '2026-04-22T14:30:00Z'
    ConsumerPermissions:
      type: object
      description: |
        Resource-level permissions for a consumer. Each resource type has its own
        access levels. Higher levels imply lower levels (e.g., `write` implies `read`).
        All default to `none`.

        The generation result collection endpoint (`POST /generation/collect`) is
        accessible to consumers with `generation: read` or higher. No separate
        permission is needed.

        For OAuth consumers, requested permissions are derived from JWT scopes
        using the pattern `epistola:{resource}:{level}` (e.g., `epistola:generation:write`,
        `epistola:templates:publish`).
      properties:
        templates:
          type: string
          enum:
            - none
            - read
            - write
            - publish
          default: none
          description: |
            read = list/get templates.
            write = create/update/delete templates + read.
            publish = publish versions to environments + write.
        variants:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get variants, write = create/update/delete + read
        versions:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get versions, write = create/update drafts + read
        themes:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get themes, write = create/update/delete + read
        environments:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get environments, write = create/update/delete + read
        stencils:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get stencils, write = create/update/publish + read
        catalogs:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list catalogs, write = import catalogs + read
        generation:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: |
            read = view jobs, documents, and collect generation results
            via POST /generation/collect.
            write = submit jobs/preview + read.
        consumers:
          type: string
          enum:
            - none
            - read
            - manage
          default: none
          description: |
            Consumer management within this tenant.
            read = list/view consumers.
            manage = approve/reject/update/delete consumers + read.
    RegisterConsumerRequest:
      type: object
      description: |
        Self-service registration for consumers using self-signed JWT authentication.
        The consumer declares what permissions it needs. A tenant manager will
        review and grant equal or fewer permissions on approval.
      required:
        - id
        - name
        - publicKey
        - requestedPermissions
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: |
            Self-chosen unique slug identifier for the consumer within this tenant.
            Used as the `iss` claim in self-signed JWTs.
          example: invoice-service
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name of the consuming application
          example: Invoice Service
        description:
          type: string
          maxLength: 1000
          description: What this application does and why it uses Epistola
          example: Generates PDF invoices for the billing pipeline
        contact:
          type: string
          maxLength: 255
          description: Team or individual responsible for this application
          example: billing-team@acme-corp.com
        publicKey:
          type: string
          maxLength: 8192
          description: |
            PEM-encoded public key (RSA 2048+ or Ed25519). The corresponding
            private key is used to sign short-lived JWTs for authentication.
          example: |-
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
        requestedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
    ApproveConsumerRequest:
      type: object
      description: |
        Tenant manager approval of a pending consumer. The manager reviews the
        requested permissions and grants equal or fewer. The consumer transitions
        from `pending` to `active`.
      required:
        - grantedPermissions
      properties:
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the approval expires. Null means no expiry.
          example: '2027-04-22T00:00:00Z'
    RejectConsumerRequest:
      type: object
      description: Tenant manager rejection of a pending consumer registration.
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Why the consumer was rejected
          example: Unknown application — contact the platform team for onboarding
    UpdateConsumerRequest:
      type: object
      description: |
        Update consumer metadata or permissions within this tenant.
        All fields are optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated name
        description:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Updated description (null to clear)
        contact:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Updated contact (null to clear)
        status:
          type: string
          enum:
            - active
            - inactive
          description: |
            Set to `inactive` to deactivate, `active` to reactivate.
            Cannot change other statuses (use approve/reject instead).
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Updated expiry (null to remove expiry)
    RotatePublicKeyRequest:
      type: object
      description: |
        Rotate the public key for a self-signed JWT consumer.
        Must authenticate with a valid JWT signed by the current key.
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          maxLength: 8192
          description: New PEM-encoded public key (RSA 2048+ or Ed25519)
          example: |-
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
    ConsumerListResponse:
      description: Paginated list of consumers within a tenant
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerDto'
        page:
          $ref: '#/components/schemas/PageMeta'
    TenantDto:
      type: object
      description: Represents a tenant in the system
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: Unique slug identifier of the tenant (e.g., "acme-corp")
          example: acme-corp
        name:
          type: string
          description: Name of the tenant
          example: Acme Corporation
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the tenant was created
          example: '2026-01-15T09:00:00Z'
      example:
        id: acme-corp
        name: Acme Corporation
        createdAt: '2026-01-15T09:00:00Z'
    CreateTenantRequest:
      type: object
      description: Request body for creating a new tenant
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: |
            Client-provided unique slug identifier for the tenant.
            Must be 3-63 characters, start with a letter, contain only lowercase letters,
            numbers, and non-consecutive hyphens, and not end with a hyphen.
            Reserved words (admin, api, www, system, internal, null, undefined) are not allowed.
          example: acme-corp
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the tenant to create
          example: Acme Corporation
    UpdateTenantRequest:
      type: object
      description: Request body for updating a tenant
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name for the tenant
          example: Acme Corporation Ltd.
    TenantListResponse:
      description: Paginated list of tenants
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          description: List of tenants on this page
          items:
            $ref: '#/components/schemas/TenantDto'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        items:
          - id: acme-corp
            name: Acme Corporation
            createdAt: '2026-01-15T09:00:00Z'
        page:
          number: 0
          size: 20
          totalElements: 1
          totalPages: 1
    ThemeDto:
      type: object
      description: A theme defines reusable styling that can be applied across multiple templates
      required:
        - id
        - tenantId
        - name
        - documentStyles
        - createdAt
        - lastModified
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 20
          description: Slug identifier of the theme (e.g., "corporate")
          example: corporate
        tenantId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: Slug identifier of the tenant this theme belongs to
          example: acme-corp
        name:
          type: string
          description: Name of the theme
          example: Corporate Theme
        description:
          type: string
          description: Optional description of the theme
          example: Default corporate branding with Acme colors and fonts
        documentStyles:
          $ref: '#/components/schemas/DocumentStylesDto'
        pageSettings:
          $ref: '#/components/schemas/PageSettingsDto'
        blockStylePresets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BlockStylePresetDto'
          description: Named block style presets (like CSS classes). Key is the preset name.
          example:
            heading:
              label: Heading
              styles:
                fontSize: 18pt
                fontWeight: bold
              applicableTo:
                - text
            caption:
              label: Caption
              styles:
                fontSize: 9pt
                color: '#666666'
        spacingUnit:
          type: number
          minimum: 1
          maximum: 16
          description: |
            Base spacing unit in points for the spacing scale system. All sp values
            are multiples of this value (e.g., with spacingUnit=4, 2sp resolves
            to 8pt). Null means default (4pt).
          example: 4
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the theme was created
          example: '2026-01-17T11:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the theme was last modified
          example: '2026-01-18T14:30:00Z'
      example:
        id: corporate
        tenantId: acme-corp
        name: Corporate Theme
        description: Default corporate branding with Acme colors and fonts
        documentStyles:
          fontFamily: Helvetica
          fontSize: 12pt
          fontWeight: normal
          color: '#333333'
          lineHeight: '1.5'
          letterSpacing: 0.5pt
          textAlign: left
        pageSettings:
          format: A4
          orientation: portrait
          margins:
            top: 20
            right: 20
            bottom: 20
            left: 20
        blockStylePresets:
          heading:
            label: Heading
            styles:
              fontSize: 18pt
              fontWeight: bold
              marginBottom: 4sp
            applicableTo:
              - text
          caption:
            label: Caption
            styles:
              fontSize: 9pt
              color: '#666666'
        spacingUnit: 4
        createdAt: '2026-01-17T11:00:00Z'
        lastModified: '2026-01-18T14:30:00Z'
    DocumentStylesDto:
      type: object
      description: |
        Document-level style overrides. Open object — the available style properties are
        driven by the style registry (e.g. fontFamily, fontSize, color, lineHeight, etc.).
        Keys are camelCase CSS property names, values are strings.

        **Supported units:**
        - `pt` — points (1/72 inch). The native PDF unit, used for all sizes.
        - `sp` — spacing scale. Multiplier of the theme's `spacingUnit` (default 4pt).
          Example: `"2sp"` = 2 × 4pt = 8pt.
        - `mm` — millimeters. Used for page margins only.

        Examples: `"12pt"`, `"2sp"`, `"1.5sp"`.
      example:
        fontFamily: Helvetica
        fontSize: 12pt
        fontWeight: normal
        color: '#333333'
        lineHeight: '1.5'
        letterSpacing: 0.5pt
        textAlign: left
    PageSettingsDto:
      type: object
      description: Page layout settings
      properties:
        format:
          type: string
          enum:
            - A4
            - Letter
            - Custom
          description: Page format
          example: A4
        orientation:
          type: string
          enum:
            - portrait
            - landscape
          description: Page orientation
          example: portrait
        margins:
          $ref: '#/components/schemas/MarginsDto'
        backgroundColor:
          type: string
          description: Page background color (CSS color value)
          example: '#ffffff'
      example:
        format: A4
        orientation: portrait
        margins:
          top: 40
          right: 40
          bottom: 40
          left: 40
    MarginsDto:
      type: object
      description: Page margins in millimeters
      properties:
        top:
          type: integer
          minimum: 0
          description: Top margin in mm
          example: 40
        right:
          type: integer
          minimum: 0
          description: Right margin in mm
          example: 40
        bottom:
          type: integer
          minimum: 0
          description: Bottom margin in mm
          example: 40
        left:
          type: integer
          minimum: 0
          description: Left margin in mm
          example: 40
      example:
        top: 40
        right: 40
        bottom: 40
        left: 40
    CreateThemeRequest:
