            type: object
            properties:
              recipientName:
                type: string
            required:
              - recipientName
    UpdateStencilDraftRequest:
      type: object
      description: Request body for updating a draft stencil version
      properties:
        content:
          $ref: '#/components/schemas/TemplateDocumentDto'
        parameterSchema:
          type:
            - object
            - 'null'
          description: |
            Optional typed input parameters for this draft version, as a JSON Schema
            object (`{ "type": "object", "properties": {...}, "required": [...] }`). Property
            types are limited to string / number / integer / boolean (optionally
            `format: date`/`date-time`) or arrays of those primitives.

            Updating a draft is a **full replacement**: this field is applied as-is, so
            omitting it (or sending null) clears any parameter schema currently on the
            draft. Send the complete schema (alongside the complete `content`) to keep it.
          example:
