          maxLength: 50
          description: Slug identifier of the catalog containing the template
          example: default
        templateId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: Slug identifier of template to use for generation
          example: invoice
        variantId:
