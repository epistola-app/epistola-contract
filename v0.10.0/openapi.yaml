            - string
            - 'null'
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: Slug identifier of the variant to use (mutually exclusive with attributes)
          example: english
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/VariantSelectionAttribute'
          description: Attribute criteria for auto-selecting a variant (mutually exclusive with variantId)
        versionId:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 200
          description: Explicit version ID (version number, 1-200, mutually exclusive with environmentId). If neither versionId nor environmentId is provided, the latest published version is used.
          example: 1
        environmentId:
          type:
            - string
            - 'null'
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 30
          description: Slug identifier of environment to determine version from (mutually exclusive with versionId). If neither versionId nor environmentId is provided, the latest published version is used.
          example: null
        data:
          type: object
          description: JSON data to populate the template
          example:
            customer:
              name: Jane Smith
              email: jane.smith@example.com
              taxId: US123456789
              address:
                street: 123 Main Street
                city: Springfield
                postalCode: '62704'
                country: US
            invoiceNumber: INV-2026-001
            issueDate: '2026-02-01'
            dueDate: '2026-03-01'
            lineItems:
              - description: Consulting Services (40h)
                quantity: 40
                unitPrice: 150
                taxRate: 21
              - description: Software License - Enterprise
                quantity: 1
                unitPrice: 2500
                taxRate: 21
              - description: Travel Expenses
                quantity: 1
                unitPrice: 384.5
                taxRate: 0
            notes: Payment due within 30 days. Please reference invoice number on transfer.
            currency: EUR
        filename:
          type:
            - string
            - 'null'
          description: Optional filename for the generated document
          maxLength: 255
          example: invoice-2026-001.pdf
        correlationId:
          type:
            - string
            - 'null'
          description: Client-provided ID for tracking documents across systems
          maxLength: 255
          example: order-7890
        routingKey:
          type:
            - string
            - 'null'
          description: |
            Optional key that determines which consumer node receives the result
            via the `/generation/collect` endpoint. Results with the same routing key
            are always delivered to the same node (consistent hashing).

            Common strategies:
            - Use a business key (e.g., customer ID, order ID) for locality —
              all results for the same entity go to the same node.
            - Omit to default to the request ID (even distribution, no affinity).

            The routing key is hashed to a partition number. Partition-to-node
            assignment is managed by the server and reported in the collect
            response metadata.
          maxLength: 255
          example: order-7890
