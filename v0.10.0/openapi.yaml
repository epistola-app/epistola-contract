    CreateCodeListRequest:
      type: object
      description: |
        Request body for creating a new code list.

        `entries` is required when `sourceType == INLINE` and must contain at least
        one entry with a unique `code`. For `sourceType == URL`, omit `entries` —
        they'll be populated by the first manual refresh.

        Writing to a SUBSCRIBED catalog (e.g. `system`) returns 409.
      required:
        - slug
        - displayName
        - sourceType
      properties:
        slug:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 50
          example: priorities
        displayName:
          type: string
          example: Priorities
        description:
          type:
            - string
            - 'null'
          example: Customer-facing priority levels for outbound documents.
        sourceType:
          type: string
          enum:
            - INLINE
            - URL
          example: INLINE
        sourceUrl:
          type:
            - string
            - 'null'
          example: null
        authType:
          type: string
          enum:
            - NONE
            - API_KEY
            - BEARER
          default: NONE
        credential:
          type:
            - string
            - 'null'
          description: |
            Plaintext credential for the URL source (API key or bearer token).
            Stored at rest unencrypted in this iteration — encryption is a
            separate work item.
          example: null
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CodeListEntryDto'
          default: []
          example:
            - code: low
              label: Low
              sortOrder: 1
            - code: normal
              label: Normal
              sortOrder: 2
            - code: high
              label: High
              sortOrder: 3
    UpdateCodeListRequest:
      type: object
      description: |
        Request body for updating a code list. All fields optional (PATCH semantics).
        Omitting `entries` leaves them untouched; providing `entries` replaces them
        atomically. Updates to SUBSCRIBED-catalog code lists return 409.
      properties:
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
        sourceUrl:
          type:
            - string
            - 'null'
        authType:
          type: string
          enum:
            - NONE
            - API_KEY
            - BEARER
        credential:
          type:
            - string
            - 'null'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CodeListEntryDto'
    ImportCatalogResponse:
      type: object
      description: Result of importing a catalog ZIP archive
      required:
        - catalogKey
        - catalogName
        - installed
        - updated
        - failed
        - total
        - aborted
      properties:
        catalogKey:
          type: string
          description: Slug identifier of the imported catalog
          example: valtimo-demo
        catalogName:
          type: string
          description: Display name of the imported catalog
          example: Valtimo Demo Catalog
        installed:
          type: integer
          description: Number of resources newly installed
          example: 5
        updated:
          type: integer
          description: Number of resources updated
          example: 2
        failed:
          type: integer
          description: Number of resources that failed to import
          example: 0
        total:
          type: integer
          description: Total number of resources in the catalog
          example: 7
        aborted:
          type: boolean
          description: |
            `true` when a SUBSCRIBED-catalog ZIP upgrade was **aborted**: a
            resource install failed, so stale resources were **not** pruned and
            the catalog's installed-release pointers were **not** advanced — the
            catalog is unchanged on its previous release and a re-import is a
            meaningful retry. When `false`, the import finalized: any `failed`
            resources are permanent for this import and the catalog moved
            forward. Always `false` for AUTHORED imports (merge/replace).
          example: false
    ImportTemplateResultDto:
      type: object
      description: Import result for a single template
      required:
        - slug
        - status
        - version
      properties:
        slug:
          type: string
          description: Template slug that was imported
          example: subsidiebesluit
        status:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - failed
          description: |
            Result status:
            - `created`: Template was newly created
            - `updated`: Existing template was updated
            - `unchanged`: Template already existed with same content (no changes made)
            - `failed`: Import failed for this template (see errorMessage)
          example: created
        version:
          type: string
          description: Version that was imported
          example: 1.0.0
        publishedTo:
          type: array
          description: Environments the template was published to
          items:
            type: string
          example:
            - production
        errorMessage:
          type:
            - string
            - 'null'
          description: Error message if status is "failed"
      example:
        slug: subsidiebesluit
        status: created
        version: 1.0.0
        publishedTo:
          - production
    ValidateTemplateDataRequest:
      type: object
      description: Request body for validating template input data against the template's JSON Schema
      required:
        - data
      properties:
        data:
          type: object
          description: Template input data to validate against the template's schema
          example:
            customer:
              name: Jane Smith
              email: jane.smith@example.com
              taxId: US123456789
              address:
                street: 123 Main Street
                city: Springfield
                postalCode: '62704'
                country: US
            invoiceNumber: INV-2026-001
            issueDate: '2026-02-01'
            dueDate: '2026-03-01'
            lineItems:
              - description: Consulting Services (40h)
                quantity: 40
                unitPrice: 150
                taxRate: 21
              - description: Software License - Enterprise
                quantity: 1
                unitPrice: 2500
                taxRate: 21
            currency: EUR
    TemplateDataValidationResult:
      type: object
      description: Result of validating template input data
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Whether the data passed validation
          example: true
        errors:
          type: array
          description: List of validation errors (empty when valid is true)
          items:
            $ref: '#/components/schemas/TemplateDataValidationError'
      example:
        valid: true
        errors: []
    TemplateDataValidationError:
      type: object
      description: A single validation error from JSON Schema validation
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: JSON path to the invalid field (JSON Pointer format)
          example: $.customer.email
        message:
          type: string
          description: Human-readable error message describing the validation failure
          example: must be a valid email address
        keyword:
          type: string
          description: JSON Schema validation keyword that failed (e.g., "type", "format", "required", "minLength")
          example: format
      example:
        path: $.customer.email
        message: must be a valid email address
        keyword: format
