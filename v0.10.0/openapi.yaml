    StencilDto:
      type: object
      description: |
        Full stencil with all details including version summaries.
        A stencil is a reusable template component that can be inserted into any template.
        Each stencil has versioned content following the same draft/published/archived lifecycle as template versions.
      required:
        - id
        - tenantId
        - name
        - versions
        - createdAt
        - lastModified
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: Slug identifier of the stencil (e.g., "corporate-header")
          example: corporate-header
        tenantId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: Slug identifier of the tenant this stencil belongs to
          example: acme-corp
        name:
          type: string
          description: Display name of the stencil
          example: Corporate Header
        description:
          type:
            - string
            - 'null'
          description: Optional description of what this stencil provides
          example: Standard corporate header with logo, company name, and address block
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization and search
          example:
            - header
            - corporate
        versions:
          type: array
          description: Summary of all versions for this stencil
          items:
            $ref: '#/components/schemas/StencilVersionSummaryDto'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stencil was created
          example: '2026-03-01T10:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the stencil was last modified
          example: '2026-03-15T14:30:00Z'
      example:
        id: corporate-header
        tenantId: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        versions:
          - id: 1
            status: published
            createdAt: '2026-03-01T10:00:00Z'
            publishedAt: '2026-03-02T09:00:00Z'
            archivedAt: null
          - id: 2
            status: draft
            createdAt: '2026-03-15T14:30:00Z'
            publishedAt: null
            archivedAt: null
        createdAt: '2026-03-01T10:00:00Z'
        lastModified: '2026-03-15T14:30:00Z'
    StencilSummaryDto:
      type: object
      description: Summary view of a stencil for list displays
      required:
        - id
        - tenantId
        - name
        - latestPublishedVersion
        - createdAt
        - lastModified
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: Slug identifier of the stencil
          example: corporate-header
        tenantId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 63
          description: Slug identifier of the tenant this stencil belongs to
          example: acme-corp
        name:
          type: string
          description: Display name of the stencil
          example: Corporate Header
        description:
          type:
            - string
            - 'null'
          description: Optional description of what this stencil provides
          example: Standard corporate header with logo, company name, and address block
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization and search
          example:
            - header
            - corporate
        latestPublishedVersion:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 200
          description: Version number of the latest published version, or null if no version is published
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stencil was created
          example: '2026-03-01T10:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the stencil was last modified
          example: '2026-03-15T14:30:00Z'
      example:
        id: corporate-header
        tenantId: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        latestPublishedVersion: 1
        createdAt: '2026-03-01T10:00:00Z'
        lastModified: '2026-03-15T14:30:00Z'
    StencilVersionDto:
      type: object
      description: |
        Stencil version with content and lifecycle state.
        The content is a TemplateDocument fragment (nodes + slots subgraph) that gets copied
        into a template when the stencil is inserted.
      required:
        - id
        - stencilId
        - status
        - createdAt
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 200
          description: Version number (1-200)
          example: 1
        stencilId:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: Slug identifier of the stencil this version belongs to
          example: corporate-header
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          description: Lifecycle status of this version
          example: published
        content:
          $ref: '#/components/schemas/TemplateDocumentDto'
        parameterSchema:
          type:
            - object
            - 'null'
          description: |
            Typed input parameters declared by this stencil version, expressed as a
            JSON Schema object (`{ "type": "object", "properties": {...}, "required": [...] }`).
            Property types are limited to string / number / integer / boolean (optionally
            with `format: date` or `date-time`) or arrays of those primitives. Omitted or
            null means the stencil declares no parameters. When a template embeds this
            stencil, each parameter is bound to a JSONata expression via the consumer
            node's `parameterBindings` prop (see `NodeDto.props`).
          example:
            type: object
            properties:
              recipientName:
                type: string
                description: Recipient display name
            required:
              - recipientName
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the version was created
          example: '2026-03-01T10:00:00Z'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the version was published
          example: '2026-03-02T09:00:00Z'
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the version was archived
          example: null
      example:
        id: 1
        stencilId: corporate-header
        status: published
        content:
          modelVersion: 1
          root: node-root
          nodes:
            node-root:
              id: node-root
              type: container
              slots:
                - slot-root-children
              styles: {}
              props: {}
            node-logo:
              id: node-logo
              type: image
              slots: []
              styles:
                marginBottom: 2sp
              props:
                src: '{{company.logo}}'
                alt: Company logo
            node-company-name:
              id: node-company-name
              type: text
              slots: []
              styles:
                fontSize: 18pt
                fontWeight: bold
              props:
                content: '{{company.name}}'
          slots:
            slot-root-children:
              id: slot-root-children
              nodeId: node-root
              name: children
              children:
                - node-logo
                - node-company-name
          themeRef:
            type: inherit
        parameterSchema:
          type: object
          properties:
            recipientName:
              type: string
              description: Recipient display name
          required:
            - recipientName
        createdAt: '2026-03-01T10:00:00Z'
        publishedAt: '2026-03-02T09:00:00Z'
        archivedAt: null
    StencilVersionSummaryDto:
      type: object
      description: Summary view of a stencil version for list displays
      required:
        - id
        - status
        - createdAt
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 200
          description: Version number (1-200)
          example: 1
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          description: Lifecycle status of this version
          example: published
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the version was created
          example: '2026-03-01T10:00:00Z'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the version was published
          example: '2026-03-02T09:00:00Z'
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the version was archived
          example: null
      example:
        id: 1
        status: published
        createdAt: '2026-03-01T10:00:00Z'
        publishedAt: '2026-03-02T09:00:00Z'
        archivedAt: null
    CreateStencilRequest:
