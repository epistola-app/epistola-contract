name: Release to Maven Central

on:
  # Main releases: triggered by creating a GitHub Release (e.g., gh release create v0.2.0)
  release:
    types: [published]
  # Hotfix releases: any push to a release branch auto-releases
  push:
    branches:
      - 'release/**'

jobs:
  # Validate and bundle spec
  validate-and-bundle:
    name: Validate and bundle spec
    runs-on: ubuntu-latest
    outputs:
      api_version: ${{ steps.version.outputs.api_version }}
      release_version: ${{ steps.version.outputs.version }}
      is_release_event: ${{ steps.source.outputs.is_release_event }}
    steps:
      - name: Determine release source
        id: source
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release_event=true" >> $GITHUB_OUTPUT
          else
            echo "is_release_event=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Validate release source and extract version
        if: github.event_name == 'release'
        id: tag_version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag must be a SemVer tag such as v0.14.0 or v0.14.0-rc.1"
            exit 1
          fi
          TAG_API_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          eval "$(contracts/api/scripts/spec-version.sh --env)"
          if [ "$TAG_API_VERSION" != "$API_VERSION" ]; then
            echo "::error::Release tag API version ($TAG_API_VERSION) does not match spec API version ($API_VERSION)"
            exit 1
          fi

          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          RELEASE_COMMIT="${GITHUB_SHA}^{commit}"
          ALLOWED_SOURCE=false
          while IFS= read -r ref; do
            if git merge-base --is-ancestor "$RELEASE_COMMIT" "$ref"; then
              echo "Release commit is contained in ${ref#refs/remotes/origin/}"
              ALLOWED_SOURCE=true
              break
            fi
          done < <(
            {
              echo refs/remotes/origin/main
              git for-each-ref --format='%(refname)' refs/remotes/origin/release/
            }
          )
          if [ "$ALLOWED_SOURCE" != true ]; then
            echo "::error::Release commit must be contained in main or a release/* branch"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "api_version=${TAG_API_VERSION}" >> $GITHUB_OUTPUT
          echo "Release version from tag: ${VERSION}"

      - name: Calculate version for release branch
        if: github.event_name == 'push'
        id: branch_version
        uses: ./.github/actions/calculate-version
        with:
          mode: release

      - name: Set version output
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ steps.tag_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "api_version=${{ steps.tag_version.outputs.api_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.branch_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "api_version=${{ steps.branch_version.outputs.api_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate release branch version
        if: github.event_name == 'push'
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH" == release/* ]]; then
            BRANCH_VERSION="${BRANCH#release/}"
            API_VERSION="${{ steps.version.outputs.api_version }}"
            if [[ "$BRANCH_VERSION" != "$API_VERSION" ]]; then
              echo "::error::Branch version ($BRANCH_VERSION) does not match spec version ($API_VERSION)"
              echo "::error::Release branch 'release/$BRANCH_VERSION' must have spec version '$BRANCH_VERSION.x'"
              exit 1
            fi
            echo "Branch version matches spec version"
          fi

      - name: Bundle spec
        uses: ./.github/actions/bundle-spec
        with:
          version: ${{ steps.version.outputs.version }}

  # Build and test all modules before publishing anything.
  # This prevents half-releases where one module publishes but the other fails.
  build:
    needs: validate-and-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: contracts/api/protocol-java
            needs_spec: false
          - module: contracts/api/clients/kotlin-spring-restclient
            needs_spec: true
          - module: contracts/api/clients/jakarta
            needs_spec: true
          - module: contracts/api/server-stubs/kotlin-springboot4
            needs_spec: true
          - module: contracts/catalog
            needs_spec: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download bundled spec
        if: matrix.needs_spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        if: matrix.module != 'contracts/catalog'
        working-directory: ${{ matrix.module }}
        run: ./gradlew build -Pversion=${{ needs.validate-and-bundle.outputs.release_version }}

      - name: Build and test catalog Maven artifacts
        if: matrix.module == 'contracts/catalog'
        working-directory: contracts/catalog
        run: ./gradlew build sourcesJar dokkaJavadocJar -Pversion=${{ needs.validate-and-bundle.outputs.release_version }}

      - name: Install catalog npm dependencies
        if: matrix.module == 'contracts/catalog'
        working-directory: contracts/catalog
        run: pnpm install --frozen-lockfile

      - name: Build and pack catalog npm artifact
        if: matrix.module == 'contracts/catalog'
        working-directory: contracts/catalog
        run: |
          npm version ${{ needs.validate-and-bundle.outputs.release_version }} --no-git-tag-version --allow-same-version
          pnpm generate:types
          pnpm build
          mkdir -p release/npm
          npm pack --pack-destination release/npm

      - name: Verify catalog release artifacts
        if: matrix.module == 'contracts/catalog'
        working-directory: contracts/catalog
        run: |
          TARBALL=$(find release/npm -maxdepth 1 -name '*.tgz' -print -quit)
          scripts/check-release-artifacts.sh \
            "${{ needs.validate-and-bundle.outputs.release_version }}" \
            "$PWD/$TARBALL"

      - name: Upload tested catalog npm artifact
        if: matrix.module == 'contracts/catalog'
        uses: actions/upload-artifact@v7
        with:
          name: npm-epistola-catalog-${{ needs.validate-and-bundle.outputs.release_version }}
          path: contracts/catalog/release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Build and test the .NET client before publishing anything (parallels the gradle build job).
  build-dotnet:
    needs: validate-and-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        working-directory: contracts/api/clients/dotnet-httpclient
        run: ./generate.sh && dotnet test Epistola.Client.sln -c Release

  # Build and test the Python client before publishing anything (parallels the gradle build job).
  build-python:
    needs: validate-and-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        working-directory: contracts/api/clients/python-urllib3
        run: ./generate.sh && uv run --group dev pytest

  # Reserve the version by creating a git tag before publishing (release branches only).
  # For GitHub Release events the tag already exists.
  create-tag:
    needs: [validate-and-bundle, build, build-dotnet, build-python]
    if: needs.validate-and-bundle.outputs.is_release_event == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release tag
        run: |
          git tag v${{ needs.validate-and-bundle.outputs.release_version }}
          git push origin v${{ needs.validate-and-bundle.outputs.release_version }}

  # Only publish after ALL builds succeed and version tag is reserved
  publish:
    needs: [validate-and-bundle, build, build-dotnet, build-python, create-tag]
    # Always run after builds succeed — create-tag may be skipped for release events
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-dotnet.result == 'success' &&
      needs.build-python.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - module: contracts/api/protocol-java
            artifact_id: protocol-java
            needs_spec: false
          - module: contracts/api/clients/kotlin-spring-restclient
            artifact_id: client-spring3-restclient
            needs_spec: true
          - module: contracts/api/clients/jakarta
            artifact_id: client-jakarta
            needs_spec: true
          - module: contracts/api/server-stubs/kotlin-springboot4
            artifact_id: server-kotlin-springboot4
            needs_spec: true
          - module: contracts/catalog
            artifact_id: epistola-catalog
            needs_spec: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundled spec
        if: matrix.needs_spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Publish to Maven Central
        working-directory: ${{ matrix.module }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral -Pversion=${{ needs.validate-and-bundle.outputs.release_version }}

      - name: Download tested catalog npm artifact
        if: matrix.module == 'contracts/catalog'
        uses: actions/download-artifact@v7
        with:
          name: npm-epistola-catalog-${{ needs.validate-and-bundle.outputs.release_version }}
          path: contracts/catalog/release/npm

      - name: Setup npm registry
        if: matrix.module == 'contracts/catalog'
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: matrix.module == 'contracts/catalog'
        working-directory: contracts/catalog
        run: npm publish release/npm/*.tgz --provenance --access public

  # Publish the .NET client release to NuGet.org (parallels the gradle publish job)
  publish-dotnet:
    needs: [validate-and-bundle, build, build-dotnet, build-python, create-tag]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-dotnet.result == 'success' &&
      needs.build-python.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    # OIDC trusted publishing to NuGet.org — no stored API key (mirrors the npm OIDC publish).
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: NuGet trusted-publishing login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # Your personal nuget.org profile name (public, not a secret). This is NOT the package
          # owner — the trusted-publisher policy selects Epistola as the owner separately.
          user: sdegroot

      - name: Pack and publish to NuGet.org
        working-directory: contracts/api/clients/dotnet-httpclient
        run: |
          ./generate.sh
          dotnet pack src/Epistola.Client/Epistola.Client.csproj -c Release -p:Version=${{ needs.validate-and-bundle.outputs.release_version }} -o nupkgs
          dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Generate SBOM (CycloneDX)
        working-directory: contracts/api/clients/dotnet-httpclient
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          # SBOM of the shipped package's runtime dependency closure (excludes test/build tooling).
          dotnet CycloneDX src/Epistola.Client/Epistola.Client.csproj \
            --output sbom --json --filename epistola-dotnet-client-sbom.json \
            --set-version ${{ needs.validate-and-bundle.outputs.release_version }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-sbom
          path: contracts/api/clients/dotnet-httpclient/sbom/epistola-dotnet-client-sbom.json

  # Publish the Python client release to PyPI (parallels the gradle/nuget publish jobs)
  publish-python:
    needs: [validate-and-bundle, build, build-dotnet, build-python, create-tag]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-dotnet.result == 'success' &&
      needs.build-python.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    # OIDC trusted publishing to PyPI — no stored token (mirrors the npm/NuGet OIDC publishes).
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build wheel + sdist
        working-directory: contracts/api/clients/python-urllib3
        # Version comes from the stamped spec's info.version via generate.sh -> contract_version.py
        # (release version is already valid PEP 440; no normalisation needed).
        run: |
          ./generate.sh
          uv build

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: contracts/api/clients/python-urllib3/dist
          skip-existing: true

  # Verify the public catalog artifacts from clean consumers before finalizing the release.
  verify-catalog-release:
    needs: [validate-and-bundle, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and Java
        uses: ./.github/actions/setup-build-tools

      - name: Wait for Maven Central catalog artifacts
        env:
          VERSION: ${{ needs.validate-and-bundle.outputs.release_version }}
        run: |
          BASE="https://repo1.maven.org/maven2/app/epistola/contract/epistola-catalog/$VERSION"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$BASE/epistola-catalog-$VERSION.pom" --output catalog.pom &&
               curl --fail --silent --show-error "$BASE/epistola-catalog-$VERSION.jar" --output catalog.jar &&
               curl --fail --silent --show-error "$BASE/epistola-catalog-$VERSION-javadoc.jar" --output catalog-javadoc.jar; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Catalog $VERSION did not become available from Maven Central"
              exit 1
            fi
            sleep 30
          done
          grep -F '<artifactId>epistola-catalog</artifactId>' catalog.pom
          unzip -Z1 catalog.jar | grep -Fx 'app/epistola/catalog/validation/CatalogValidator.class'
          unzip -Z1 catalog.jar | grep -Fx 'META-INF/epistola-catalog/component-registry.json'
          unzip -Z1 catalog-javadoc.jar | grep -Fx 'index.html'

      - name: Wait for and consume npm catalog artifact
        env:
          VERSION: ${{ needs.validate-and-bundle.outputs.release_version }}
        run: |
          for attempt in $(seq 1 20); do
            PUBLISHED=$(npm view "@epistola.app/epistola-catalog@$VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Catalog $VERSION did not become available from npm"
              exit 1
            fi
            sleep 30
          done
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "@epistola.app/epistola-catalog@$VERSION"
          node --input-type=module <<'NODE'
          import { MAX_STENCIL_NESTING_DEPTH } from '@epistola.app/epistola-catalog'
          import { componentRegistry, styleRegistry } from '@epistola.app/epistola-catalog/registry'

          if (MAX_STENCIL_NESTING_DEPTH !== 5) throw new Error('unexpected stencil nesting limit')
          if (!componentRegistry?.components?.length) throw new Error('component registry is empty')
          if (!styleRegistry?.groups?.length) throw new Error('style registry is empty')
          NODE

  # Upload release assets and create GitHub release for release branch pushes
  finalize-release:
    needs: [validate-and-bundle, publish, publish-dotnet, publish-python, verify-catalog-release]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      needs.publish-dotnet.result == 'success' &&
      needs.publish-python.result == 'success' &&
      needs.verify-catalog-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Download .NET SBOM
        uses: actions/download-artifact@v7
        with:
          name: dotnet-sbom

      - name: Upload assets to existing GitHub Release
        if: needs.validate-and-bundle.outputs.is_release_event == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" contracts/api/build/openapi.yaml epistola-dotnet-client-sbom.json --clobber --repo "${{ github.repository }}"

      - name: Create GitHub Release (release branch)
        if: needs.validate-and-bundle.outputs.is_release_event == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-and-bundle.outputs.release_version }}
          name: v${{ needs.validate-and-bundle.outputs.release_version }}
          files: |
            contracts/api/build/openapi.yaml
            epistola-dotnet-client-sbom.json
          body: |
            ## v${{ needs.validate-and-bundle.outputs.release_version }}

            ### Maven Coordinates
            ```xml
            <dependency>
                <groupId>app.epistola.contract</groupId>
                <artifactId>client-spring3-restclient</artifactId>
                <version>${{ needs.validate-and-bundle.outputs.release_version }}</version>
            </dependency>

            <dependency>
                <groupId>app.epistola.contract</groupId>
                <artifactId>server-kotlin-springboot4</artifactId>
                <version>${{ needs.validate-and-bundle.outputs.release_version }}</version>
            </dependency>

            <dependency>
                <groupId>app.epistola.contract</groupId>
                <artifactId>epistola-catalog</artifactId>
                <version>${{ needs.validate-and-bundle.outputs.release_version }}</version>
            </dependency>
            ```

            ### Gradle (Kotlin DSL)
            ```kotlin
            implementation("app.epistola.contract:client-spring3-restclient:${{ needs.validate-and-bundle.outputs.release_version }}")
            implementation("app.epistola.contract:server-kotlin-springboot4:${{ needs.validate-and-bundle.outputs.release_version }}")
            implementation("app.epistola.contract:epistola-catalog:${{ needs.validate-and-bundle.outputs.release_version }}")
            ```

            ### npm
            ```bash
            npm install @epistola.app/epistola-catalog@${{ needs.validate-and-bundle.outputs.release_version }}
            ```

            ### NuGet (.NET)
            ```bash
            dotnet add package Epistola.Contract.Client --version ${{ needs.validate-and-bundle.outputs.release_version }}
            ```

            ### pip (Python)
            ```bash
            pip install epistola-client==${{ needs.validate-and-bundle.outputs.release_version }}
            ```

            ### OpenAPI Spec
            The bundled OpenAPI specification is attached as `openapi.yaml`.

            ### Software Bill of Materials
            A CycloneDX SBOM for the .NET client's dependency closure is attached as `epistola-dotnet-client-sbom.json`.
          draft: false
          prerelease: false
          generate_release_notes: true

  # Publish mock server after successful release
  mock-server:
    name: Publish Mock Server
    needs: [validate-and-bundle, publish]
    if: |
      always() &&
      needs.publish.result == 'success'
    uses: ./.github/workflows/mock-server.yml
    with:
      version: ${{ needs.validate-and-bundle.outputs.release_version }}
    permissions:
      contents: read
      packages: write
