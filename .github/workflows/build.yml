name: Build and Test

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types: [opened, synchronize, labeled]

jobs:
  license:
    name: Check License Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Check license metadata
        run: make license-check

  # OpenAPI spec validation and bundling
  spec-validation:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Bundle spec
        uses: ./.github/actions/bundle-spec

      - name: Check error-registry sync
        run: contracts/api/scripts/check-error-registry.sh

      - name: Check media-type allowlist
        run: contracts/api/scripts/check-media-types.sh

  # Shared wire-protocol logic (consumed by both JVM clients and the server stubs)
  protocol:
    name: Protocol (Java)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/api/protocol-java
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        run: ./gradlew build

  # Kotlin Spring RestClient build
  kotlin-client:
    name: Kotlin Client (Spring RestClient)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/api/clients/kotlin-spring-restclient
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        run: ./gradlew build

  # Jakarta EE client build (MicroProfile Rest Client)
  jakarta-client:
    name: Jakarta EE Client (MicroProfile Rest Client)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/api/clients/jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      # Does not include deploymentTest: that needs Docker and a WildFly image.
      # Run it locally with ./gradlew deploymentTest -PdeploymentTest.
      - name: Build and test
        run: ./gradlew build

  # Kotlin server stubs build
  kotlin-server:
    name: Kotlin Server (Spring)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/api/server-stubs/kotlin-springboot4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        run: ./gradlew build

  # .NET HttpClient client build
  dotnet-client:
    name: .NET Client (HttpClient)
    needs: spec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        working-directory: contracts/api/clients/dotnet-httpclient
        run: ./generate.sh && dotnet test Epistola.Client.sln -c Release

  # Python urllib3 client build
  python-client:
    name: Python Client (urllib3)
    needs: spec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        working-directory: contracts/api/clients/python-urllib3
        run: ./generate.sh && uv run --group dev pytest && uv build

  # Editor model build (no OpenAPI spec dependency)
  epistola-catalog:
    name: Epistola Catalog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/catalog

      - name: Build and test
        run: ./gradlew build sourcesJar dokkaJavadocJar

      - name: Verify TypeScript type generation
        run: pnpm generate:types

      - name: Build and verify npm package
        run: |
          pnpm build
          npm pack --dry-run
