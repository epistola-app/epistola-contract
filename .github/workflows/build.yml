name: Build and Test

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types: [opened, synchronize, labeled]

jobs:
  # OpenAPI spec validation and bundling
  spec-validation:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Bundle spec
        uses: ./.github/actions/bundle-spec

      - name: Check error-registry sync
        run: scripts/check-error-registry.sh

      - name: Check media-type allowlist
        run: scripts/check-media-types.sh

  # Kotlin Spring RestClient build
  kotlin-client:
    name: Kotlin Client (Spring RestClient)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-kotlin-spring-restclient
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        run: ./gradlew build

  # Kotlin server stubs build
  kotlin-server:
    name: Kotlin Server (Spring)
    needs: spec-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-kotlin-springboot4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        run: ./gradlew build

  # .NET HttpClient client build
  dotnet-client:
    name: .NET Client (HttpClient)
    needs: spec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: tools

      - name: Build and test
        working-directory: client-dotnet-httpclient
        run: ./generate.sh && dotnet test Epistola.Client.sln -c Release

  # Python urllib3 client build
  python-client:
    name: Python Client (urllib3)
    needs: spec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: tools

      - name: Build and test
        working-directory: client-python-urllib3
        run: ./generate.sh && uv run --group dev pytest && uv build

  # Editor model build (no OpenAPI spec dependency)
  epistola-catalog:
    name: Editor Model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epistola-catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: epistola-catalog

      - name: Build and test
        run: ./gradlew build

      - name: Verify TypeScript type generation
        run: pnpm generate:types

      - name: Build and verify npm package
        run: pnpm build
