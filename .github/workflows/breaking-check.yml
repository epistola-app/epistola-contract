name: API Breaking Change Check

on:
  pull_request:
    paths:
      - 'contracts/api/openapi.yaml'
      - 'contracts/api/paths/**'
      - 'contracts/api/components/**'
      - 'contracts/catalog/schemas/**'

jobs:
  breaking-changes:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Bundle current spec
        run: |
          mkdir -p contracts/api/build
          contracts/api/tools/node_modules/.bin/redocly bundle contracts/api/openapi.yaml -o contracts/api/build/openapi.yaml
          node contracts/api/scripts/normalize-bundle.mjs contracts/api/build/openapi.yaml

      - name: Get base branch spec
        run: |
          mkdir -p .oasdiff/base
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/api/openapi.yaml" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" -- contracts/api/openapi.yaml contracts/api/paths contracts/api/components contracts/catalog/schemas | tar -xC .oasdiff/base
            BASE_SPEC=.oasdiff/base/contracts/api/openapi.yaml
          elif git cat-file -e "origin/${{ github.base_ref }}:epistola-api.yaml" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" -- epistola-api.yaml spec | tar -xC .oasdiff/base
            BASE_SPEC=.oasdiff/base/epistola-api.yaml
          else
            BASE_SPEC=
          fi
          if [ -n "$BASE_SPEC" ]; then
            contracts/api/tools/node_modules/.bin/redocly bundle "$BASE_SPEC" -o .oasdiff/base-openapi.yaml
          else
            cp contracts/api/build/openapi.yaml .oasdiff/base-openapi.yaml
          fi

      # oasdiff comes from mise (see mise.toml), so local `make breaking` and CI
      # run the same pinned version. Results go to files to avoid routing the
      # (potentially very large) diff output through GitHub Actions step
      # outputs / process arguments, which can exceed ARG_MAX and fail with
      # "Argument list too long".
      # Informational only: breaking changes are reported in the PR comment, not
      # gated. This project ships intentional breaking changes under SemVer 0.x
      # (commits marked `!`), so the check surfaces them for review rather than
      # blocking the merge. `|| true` keeps a non-zero oasdiff exit from failing
      # the job.
      - name: Check for breaking changes
        run: |
          oasdiff breaking --flatten-allof --flatten-params \
            .oasdiff/base-openapi.yaml contracts/api/build/openapi.yaml \
            > .oasdiff/breaking.txt 2>&1 || true
          # Strip the summary line oasdiff prints when nothing is found so the
          # comment step can detect "empty" cleanly.
          if grep -q "^No breaking changes" .oasdiff/breaking.txt; then
            : > .oasdiff/breaking.txt
          fi

      - name: Generate API changelog
        run: |
          oasdiff changelog --flatten-allof --flatten-params \
            .oasdiff/base-openapi.yaml contracts/api/build/openapi.yaml \
            > .oasdiff/changelog.txt 2>&1 || true
          if grep -q "^No changes" .oasdiff/changelog.txt; then
            : > .oasdiff/changelog.txt
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch { return ''; }
            };

            // GitHub comment bodies are capped at 65536 chars; truncate to stay well under.
            const MAX = 50000;
            const clip = (s) => s.length > MAX
              ? s.slice(0, MAX) + '\n... (truncated, see workflow logs for full output)'
              : s;

            const breaking = clip(read('.oasdiff/breaking.txt'));
            const changelog = clip(read('.oasdiff/changelog.txt'));

            let body = '## API Change Report\n\n';

            if (breaking) {
              body += '### Breaking Changes\n\n';
              body += 'The following breaking changes were detected:\n\n';
              body += '```\n' + breaking + '\n```\n\n';
            }

            if (changelog) {
              body += '### Changelog\n\n';
              body += '```\n' + changelog + '\n```\n\n';
            }

            if (!breaking && !changelog) {
              body += 'No API changes detected.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## API Change Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
