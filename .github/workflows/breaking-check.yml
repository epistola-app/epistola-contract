name: API Breaking Change Check

on:
  pull_request:
    paths:
      - 'epistola-api.yaml'
      - 'spec/**'

jobs:
  breaking-changes:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle current spec
        run: npx @redocly/cli bundle epistola-api.yaml -o openapi.yaml

      - name: Get base branch spec
        run: |
          mkdir -p .oasdiff
          git show origin/${{ github.base_ref }}:epistola-api.yaml > .oasdiff/base-spec.yaml 2>/dev/null || echo "No base spec found"
          if [ -f .oasdiff/base-spec.yaml ]; then
            # Bundle needs the spec/ directory from the base branch too
            git archive origin/${{ github.base_ref }} -- spec/ 2>/dev/null | tar -xC .oasdiff/ || true
            npx @redocly/cli bundle .oasdiff/base-spec.yaml -o .oasdiff/base-openapi.yaml 2>/dev/null || cp .oasdiff/base-spec.yaml .oasdiff/base-openapi.yaml
          else
            cp openapi.yaml .oasdiff/base-openapi.yaml
          fi

      # Run oasdiff directly via its container and write results to files.
      # This avoids routing the (potentially very large) diff output through
      # GitHub Actions step outputs / process arguments, which can exceed
      # ARG_MAX and fail with "Argument list too long".
      - name: Check for breaking changes
        id: breaking
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}:/data" tufin/oasdiff \
            breaking /data/.oasdiff/base-openapi.yaml /data/openapi.yaml \
            --fail-on ERR > .oasdiff/breaking.txt 2>&1
          status=$?
          set -e
          # Strip the trailing summary line oasdiff prints when no breaking
          # changes are found so the comment step can detect "empty" cleanly.
          if grep -q "^No breaking changes" .oasdiff/breaking.txt; then
            : > .oasdiff/breaking.txt
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Generate API changelog
        run: |
          docker run --rm -v "${{ github.workspace }}:/data" tufin/oasdiff \
            changelog /data/.oasdiff/base-openapi.yaml /data/openapi.yaml \
            > .oasdiff/changelog.txt 2>&1 || true
          if grep -q "^No changes" .oasdiff/changelog.txt; then
            : > .oasdiff/changelog.txt
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch { return ''; }
            };

            // GitHub comment bodies are capped at 65536 chars; truncate to stay well under.
            const MAX = 50000;
            const clip = (s) => s.length > MAX
              ? s.slice(0, MAX) + '\n... (truncated, see workflow logs for full output)'
              : s;

            const breaking = clip(read('.oasdiff/breaking.txt'));
            const changelog = clip(read('.oasdiff/changelog.txt'));

            let body = '## API Change Report\n\n';

            if (breaking) {
              body += '### Breaking Changes\n\n';
              body += 'The following breaking changes were detected:\n\n';
              body += '```\n' + breaking + '\n```\n\n';
            }

            if (changelog) {
              body += '### Changelog\n\n';
              body += '```\n' + changelog + '\n```\n\n';
            }

            if (!breaking && !changelog) {
              body += 'No API changes detected.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## API Change Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail on breaking changes
        if: steps.breaking.outputs.exit_code != '0'
        run: |
          echo "Breaking changes detected:"
          cat .oasdiff/breaking.txt
          exit 1
