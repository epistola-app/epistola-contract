name: Publish Snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_detection:
        description: 'Skip change detection and publish all modules'
        required: false
        default: false
        type: boolean

jobs:
  # Validate and bundle OpenAPI spec first
  spec-validation:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    outputs:
      snapshot_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Calculate snapshot version
        id: version
        uses: ./.github/actions/calculate-version
        with:
          mode: snapshot

      - name: Bundle spec
        uses: ./.github/actions/bundle-spec
        with:
          version: ${{ steps.version.outputs.version }}

  # Detect which modules have changes
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      protocol: ${{ steps.filter.outputs.protocol }}
      client: ${{ steps.filter.outputs.client }}
      jakarta: ${{ steps.filter.outputs.jakarta }}
      server: ${{ steps.filter.outputs.server }}
      epistola-catalog: ${{ steps.filter.outputs.epistola-catalog }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spec:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
            protocol:
              - 'contracts/api/protocol-java/**'
            client:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/protocol-java/**'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
              - 'contracts/api/clients/kotlin-spring-restclient/**'
            jakarta:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/protocol-java/**'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
              - 'contracts/api/clients/jakarta/**'
            server:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/protocol-java/**'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
              - 'contracts/api/server-stubs/kotlin-springboot4/**'
            epistola-catalog:
              - 'contracts/catalog/**'
            dotnet:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
              - 'contracts/api/clients/dotnet-httpclient/**'
            python:
              - 'contracts/api/openapi.yaml'
              - 'contracts/api/paths/**'
              - 'contracts/api/components/**'
              - 'contracts/catalog/schemas/**'
              - 'contracts/api/clients/python-urllib3/**'

  # Build and test modules in parallel before publishing.
  # This prevents half-releases where one module publishes but the other fails.
  build:
    name: Build ${{ matrix.module }}
    needs: [spec-validation, detect-changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: contracts/api/protocol-java
            filter: protocol
            needs_spec: false
          - module: contracts/api/clients/kotlin-spring-restclient
            filter: client
            needs_spec: true
          - module: contracts/api/clients/jakarta
            filter: jakarta
            needs_spec: true
          - module: contracts/api/server-stubs/kotlin-springboot4
            filter: server
            needs_spec: true
          - module: contracts/catalog
            filter: epistola-catalog
            needs_spec: false
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs[matrix.filter] }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true' && matrix.needs_spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools

      - name: Build and test
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: ${{ matrix.module }}
        run: ./gradlew build -Pversion=${{ needs.spec-validation.outputs.snapshot_version }}

  # Only publish after all builds succeed
  publish:
    name: Publish ${{ matrix.artifact_id }} Snapshot
    needs: [spec-validation, detect-changes, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: contracts/api/clients/kotlin-spring-restclient
            artifact_id: client-spring3-restclient
            filter: client
            needs_spec: true
          - module: contracts/api/clients/jakarta
            artifact_id: client-jakarta
            filter: jakarta
            needs_spec: true
          - module: contracts/api/server-stubs/kotlin-springboot4
            artifact_id: server-kotlin-springboot4
            filter: server
            needs_spec: true
          - module: contracts/catalog
            artifact_id: epistola-catalog
            filter: epistola-catalog
            needs_spec: false
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs[matrix.filter] }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true' && matrix.needs_spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools

      - name: Publish snapshot to Maven Central
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: ${{ matrix.module }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral -Pversion=${{ needs.spec-validation.outputs.snapshot_version }}

  # Build the .NET client before publishing its snapshot
  build-dotnet:
    name: Build .NET Client
    needs: [spec-validation, detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs.dotnet }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: contracts/api/clients/dotnet-httpclient
        run: ./generate.sh && dotnet test Epistola.Client.sln -c Release

  # Publish the .NET client snapshot to NuGet.org (prerelease)
  publish-dotnet:
    name: Publish .NET Snapshot to GitHub Packages
    needs: [spec-validation, detect-changes, build-dotnet]
    runs-on: ubuntu-latest
    # NuGet.org has no transient snapshot feed and prereleases there are permanent/public,
    # so snapshots go to GitHub Packages (nuget.org is reserved for releases).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs.dotnet }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Pack and publish snapshot to GitHub Packages
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: contracts/api/clients/dotnet-httpclient
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NuGet uses lowercase prerelease labels; 0.11-SNAPSHOT -> 0.11.0-snapshot
          NUGET_VERSION="${{ needs.spec-validation.outputs.snapshot_version }}"
          NUGET_VERSION="${NUGET_VERSION/SNAPSHOT/snapshot}"
          ./generate.sh
          dotnet pack src/Epistola.Client/Epistola.Client.csproj -c Release -p:Version="$NUGET_VERSION" -o nupkgs
          dotnet nuget add source --username ${{ github.repository_owner }} --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "nupkgs/*.nupkg" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate

  # Build the Python client before publishing its snapshot
  build-python:
    name: Build Python Client
    needs: [spec-validation, detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs.python }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build and test
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: contracts/api/clients/python-urllib3
        run: |
          ./generate.sh
          # PEP 440 dev version; 0.12-SNAPSHOT -> 0.12.0.dev<run_number>.
          # The package is installed before tests, so stamp the generated version before `uv run`.
          BASE="${{ needs.spec-validation.outputs.snapshot_version }}"
          BASE="${BASE%-SNAPSHOT}"
          case "$BASE" in
            *.*.*) : ;;
            *.*) BASE="${BASE}.0" ;;
          esac
          PY_VERSION="${BASE}.dev${GITHUB_RUN_NUMBER}"
          echo "Python snapshot test version: $PY_VERSION"
          sed -i "s/^CONTRACT_VERSION = .*/CONTRACT_VERSION = \"${PY_VERSION}\"/" \
            src/epistola_client/_generated/contract_version.py
          uv run --group dev pytest

  # Publish the Python client snapshot to TestPyPI.
  # GitHub Packages has no PyPI registry and pypi.org is reserved for releases (prereleases
  # there are permanent/public), so snapshots go to TestPyPI via OIDC trusted publishing — a
  # real pip-installable index, symmetric with the release job's pypi.org publish.
  publish-python:
    name: Publish Python Snapshot to TestPyPI
    needs: [spec-validation, detect-changes, build-python]
    runs-on: ubuntu-latest
    # OIDC trusted publishing to TestPyPI — no stored token.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check if should run
        id: should_run
        env:
          CHANGED: ${{ needs.detect-changes.outputs.python }}
          SKIP_DETECTION: ${{ inputs.skip_detection }}
        run: |
          if [ "$CHANGED" == "true" ] || [ "$SKIP_DETECTION" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: steps.should_run.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        if: steps.should_run.outputs.enabled == 'true'
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Build snapshot wheel + sdist
        if: steps.should_run.outputs.enabled == 'true'
        working-directory: contracts/api/clients/python-urllib3
        run: |
          ./generate.sh
          # PEP 440 dev version; 0.11-SNAPSHOT -> 0.11.0.dev<run_number>.
          # GITHUB_RUN_NUMBER is globally unique per workflow run, so each snapshot gets a
          # distinct, monotonically increasing version that TestPyPI accepts (no local segment).
          BASE="${{ needs.spec-validation.outputs.snapshot_version }}"
          BASE="${BASE%-SNAPSHOT}"
          case "$BASE" in
            *.*.*) : ;;
            *.*) BASE="${BASE}.0" ;;
          esac
          PY_VERSION="${BASE}.dev${GITHUB_RUN_NUMBER}"
          echo "Python snapshot version: $PY_VERSION"
          # hatchling reads the version from the derived contract_version.py
          sed -i "s/^CONTRACT_VERSION = .*/CONTRACT_VERSION = \"${PY_VERSION}\"/" \
            src/epistola_client/_generated/contract_version.py
          uv build

      - name: Publish to TestPyPI (OIDC trusted publishing)
        if: steps.should_run.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: contracts/api/clients/python-urllib3/dist
          skip-existing: true

  # Publish mock server snapshot when spec changes
  mock-server:
    name: Publish Mock Server Snapshot
    needs: [spec-validation, detect-changes]
    if: needs.detect-changes.outputs.spec == 'true' || inputs.skip_detection == true
    uses: ./.github/workflows/mock-server.yml
    with:
      version: ${{ needs.spec-validation.outputs.snapshot_version }}
    permissions:
      contents: read
      packages: write
