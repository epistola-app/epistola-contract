name: Feature Snapshot

on:
  push:
    branches: ['feature/*']

jobs:
  # Validate spec and calculate version
  prepare:
    name: Validate and Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version
        with:
          mode: feature-snapshot

      - name: Bundle spec
        uses: ./.github/actions/bundle-spec

  # Build and publish all modules
  publish:
    name: Publish ${{ matrix.module }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: contracts/api/clients/kotlin-spring-restclient
            needs_spec: true
            publish_task: 'publishAllPublicationsToGitHubPackagesRepository'
          - module: contracts/api/clients/jakarta
            needs_spec: true
            publish_task: 'publishAllPublicationsToGitHubPackagesRepository'
          - module: contracts/api/server-stubs/kotlin-springboot4
            needs_spec: true
            publish_task: 'publishAllPublicationsToGitHubPackagesRepository'
          - module: contracts/catalog
            needs_spec: false
            publish_task: 'publishAllPublicationsToGitHubPackagesRepository'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        if: matrix.needs_spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ matrix.module }}
        run: ./gradlew ${{ matrix.publish_task }} -Pversion=${{ needs.prepare.outputs.version }}

  # Publish the .NET client feature snapshot to the GitHub Packages NuGet feed
  publish-dotnet:
    name: Publish .NET Feature Snapshot
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundled spec
        uses: actions/download-artifact@v7
        with:
          name: openapi-spec
          path: contracts/api/build

      - name: Setup tools
        uses: ./.github/actions/setup-build-tools
        with:
          install-npm-deps: 'true'
          npm-working-directory: contracts/api/tools

      - name: Pack and publish to GitHub Packages
        working-directory: contracts/api/clients/dotnet-httpclient
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NuGet uses lowercase prerelease labels
          NUGET_VERSION="${{ needs.prepare.outputs.version }}"
          NUGET_VERSION="${NUGET_VERSION/SNAPSHOT/snapshot}"
          ./generate.sh
          dotnet pack src/Epistola.Client/Epistola.Client.csproj -c Release -p:Version="$NUGET_VERSION" -o nupkgs
          dotnet nuget add source --username ${{ github.repository_owner }} --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "nupkgs/*.nupkg" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate

  # The Python client has no feature-snapshot publish: for feature branches, build and install
  # locally instead (`make publish-local`, or
  # `cd contracts/api/clients/python-urllib3 && ./generate.sh && uv build`
  # then `pip install dist/*.whl`). Mainline snapshots still publish to TestPyPI (snapshot.yml).
