name: Calculate Version
description: Calculate the snapshot or feature-snapshot version from the OpenAPI spec

inputs:
  mode:
    description: 'Version mode: snapshot or feature-snapshot (a release takes its version from its tag)'
    required: true

outputs:
  version:
    description: 'The calculated version (e.g., 0.2-SNAPSHOT, 0.2.0-my-feature-SNAPSHOT)'
    value: ${{ steps.calc.outputs.version }}
  api_version:
    description: 'The major.minor API version from the spec (e.g., 0.2)'
    value: ${{ steps.calc.outputs.api_version }}

runs:
  using: composite
  steps:
    - name: Calculate version
      id: calc
      shell: bash
      run: |
        # Read spec version via the shared parser (single source of truth)
        eval "$(contracts/api/scripts/spec-version.sh --env)"
        echo "api_version=${API_VERSION}" >> $GITHUB_OUTPUT
        echo "Spec version: ${SPEC_VERSION}, API version: ${API_VERSION}"

        MODE="${{ inputs.mode }}"
        case "$MODE" in
          snapshot)
            VERSION="${API_VERSION}-SNAPSHOT"
            ;;
          feature-snapshot)
            BRANCH_SUFFIX="${GITHUB_REF_NAME#feature/}"
            VERSION="${SPEC_VERSION}-${BRANCH_SUFFIX}-SNAPSHOT"
            ;;
          *)
            echo "::error::Unknown version mode: ${MODE}"
            exit 1
            ;;
        esac

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Calculated version (${MODE}): ${VERSION}"
