name: Bundle OpenAPI Spec
description: Validate, bundle, and optionally version-stamp the OpenAPI spec

inputs:
  version:
    description: 'Version to inject into the bundled spec (optional)'
    required: false
    default: ''
  upload-artifact:
    description: 'Whether to upload the bundled spec as an artifact'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pinned spec tools
      shell: bash
      run: pnpm -C contracts/api/tools install --frozen-lockfile

    - name: Validate OpenAPI spec
      shell: bash
      run: contracts/api/tools/node_modules/.bin/redocly lint contracts/api/openapi.yaml --config contracts/api/redocly.yaml

    - name: Bundle OpenAPI spec
      shell: bash
      run: |
        mkdir -p contracts/api/build
        contracts/api/tools/node_modules/.bin/redocly bundle contracts/api/openapi.yaml -o contracts/api/build/openapi.yaml

    - name: Inject version into bundled spec
      if: inputs.version != ''
      shell: bash
      run: |
        sed -i "0,/^\s*version:/{s/^\(\s*version:\s*\).*/\1\"${{ inputs.version }}\"/}" contracts/api/build/openapi.yaml
        echo "Set bundled OpenAPI version to ${{ inputs.version }}"
        grep 'version:' contracts/api/build/openapi.yaml | head -1

    - name: Upload bundled spec
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: openapi-spec
        path: contracts/api/build/openapi.yaml
        retention-days: 1
