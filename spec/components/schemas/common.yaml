# Shared building blocks used across domain schema files.

PageMeta:
  type: object
  required:
    - page
    - size
    - totalElements
    - totalPages
  properties:
    page:
      type: integer
      description: Current page number (0-based)
      example: 0
    size:
      type: integer
      description: Number of items per page
      example: 20
    totalElements:
      type: integer
      format: int64
      description: Total number of elements
      example: 1
    totalPages:
      type: integer
      description: Total number of pages
      example: 1
