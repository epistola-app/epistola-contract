CatalogDto:
  type: object
  required:
    - id
    - name
    - type
  properties:
    id:
      type: string
      description: Catalog slug identifier
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog type
      example: AUTHORED
    releasedVersion:
      type: [string, "null"]
      description: >-
        The catalog's current version label. For AUTHORED catalogs this is the
        latest released SemVer (null until first released). For SUBSCRIBED
        catalogs this is the installed release version.
      example: "1.4.0"
    fingerprint:
      type: [string, "null"]
      description: >-
        Lowercase hex SHA-256 of the catalog's canonical content
        (deterministic, excludes volatile fields). Identifies content
        independently of the version label. Null when never released / produced
        before fingerprinting.
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogUpgradeDiff:
  type: object
  description: >-
    Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's
    latest release. Each bucket entry is `"type/slug"` (e.g. `theme/corporate`).
  required:
    - catalogId
    - newVersion
    - upgradeAvailable
    - added
    - removed
    - changed
    - unchanged
    - conflicts
    - blockedByConflicts
  properties:
    catalogId:
      type: string
      description: Catalog slug.
      example: municipality-demo
    previousVersion:
      type: [string, "null"]
      description: Currently installed release version (null if unknown).
      example: "1.3.0"
    newVersion:
      type: string
      description: The source manifest's release version.
      example: "1.4.0"
    upgradeAvailable:
      type: boolean
      description: True when there is anything to apply (added/removed/changed).
      example: true
    added:
      type: array
      description: >-
        Newly published resources. Not installed on upgrade unless explicitly
        opted in (UI only — there is no upgrade action over REST).
      items:
        type: string
      example: ["template/cover-letter"]
    removed:
      type: array
      description: Resources the new release removed (deleted on upgrade).
      items:
        type: string
      example: ["theme/legacy"]
    changed:
      type: array
      description: Installed resources whose published content changed.
      items:
        type: string
      example: ["theme/corporate"]
    unchanged:
      type: array
      items:
        type: string
      example: ["attribute/language"]
    conflicts:
      type: array
      description: >-
        Human-readable cross-catalog references that would block the removal
        set. Non-empty ⇒ an upgrade would be rejected.
      items:
        type: string
      example: ["Theme 'legacy' is used by template 'Invoice' (catalog: billing)"]
    blockedByConflicts:
      type: boolean
      description: True when `conflicts` is non-empty.
      example: false

ReleaseCatalogRequest:
  type: object
  required:
    - releaseVersion
  properties:
    releaseVersion:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      description: Strictly increasing SemVer release label.
      example: "1.4.0"
    notes:
      type:
        - string
        - 'null'
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.

ReleaseCatalogResponse:
  type: object
  required:
    - version
    - fingerprint
    - releasedAt
    - unchangedContent
  properties:
    version:
      type: string
      example: "1.4.0"
    fingerprint:
      type: string
      pattern: '^[a-f0-9]{64}$'
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    releasedAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false

UpgradeCatalogRequest:
  type: object
  properties:
    includeNewSlugs:
      type: array
      description: Newly added `type/slug` resources from the preview to install during the upgrade.
      items:
        type: string
      default: []
      example:
        - template/cover-letter

UpgradeCatalogResponse:
  type: object
  required:
    - newVersion
    - installResults
    - removedResources
    - aborted
  properties:
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    newVersion:
      type: string
      example: "1.4.0"
    installResults:
      type: array
      items:
        $ref: '#/CatalogInstallResultDto'
    removedResources:
      type: array
      items:
        $ref: '#/RemovedCatalogResourceDto'
    aborted:
      type: boolean
      description: True when one or more resource installs failed and the catalog was left unchanged.
      example: false

CatalogInstallResultDto:
  type: object
  required:
    - type
    - slug
    - status
  properties:
    type:
      type: string
      example: template
    slug:
      type: string
      example: cover-letter
    status:
      type: string
      enum:
        - INSTALLED
        - UPDATED
        - SKIPPED
        - FAILED
      example: UPDATED
    errorMessage:
      type:
        - string
        - 'null'
      example: null

RemovedCatalogResourceDto:
  type: object
  required:
    - type
    - slug
  properties:
    type:
      type: string
      example: theme
    slug:
      type: string
      example: legacy
