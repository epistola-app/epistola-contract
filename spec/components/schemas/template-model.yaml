TemplateDocumentDto:
  type: object
  description: |
    Root schema for an Epistola template document using the node/slot graph model.
    The document is a flat graph of nodes connected through slots, with a single root node.

    ### Page-header nodes

    Nodes whose `type` is `pageheader` are page-decoration nodes that render at the
    top of every generated page (not part of the body flow). A document may contain
    **at most two** `pageheader` nodes, both placed at the document root (siblings of
    the body root). Their order in the root slot's `children` array is the
    positional selector for which header applies to which page:

    | Header count | Page 1                    | Page 2 and onward         |
    | ------------ | ------------------------- | ------------------------- |
    | 0            | (no header)               | (no header)               |
    | 1            | the sole `pageheader`     | the sole `pageheader`     |
    | 2            | the first `pageheader`    | the second `pageheader`   |

    The mapping is purely positional — there is no selector property on the node.

    ### Page-footer nodes

    Nodes whose `type` is `pagefooter` are the bottom-of-page counterpart: they
    render at the bottom of every generated page. A document may contain **at
    most one** `pagefooter` node, also placed at the document root. Its
    `hideOnFirstPage` prop (boolean) suppresses the footer on the first page;
    `height` sets the reserved band height (e.g. `"60pt"`).

    Cardinality (max 2 for `pageheader`, max 1 for `pagefooter`) and root-level
    placement are enforced by the suite's server-side template validator, not by
    this OpenAPI schema, because `NodeDto` is intentionally generic across all
    node types.
  required:
    - modelVersion
    - root
    - nodes
    - slots
    - themeRef
  properties:
    modelVersion:
      type: integer
      const: 1
      description: Schema version for forward-compatibility detection
      example: 1
    root:
      type: string
      minLength: 1
      description: ID of the root node in the document tree
      example: node-root
    nodes:
      type: object
      additionalProperties:
        $ref: '#/NodeDto'
      description: Flat map of all nodes keyed by node ID
      example:
        node-root:
          id: node-root
          type: container
          slots:
            - slot-root-children
          styles: {}
          props: {}
        node-header:
          id: node-header
          type: text
          slots: []
          styles:
            fontSize: "24pt"
            fontWeight: bold
          props:
            content:
              type: doc
              content:
                - type: paragraph
                  content:
                    - type: text
                      text: "Invoice "
                    - type: expression
                      attrs:
                        expression: invoiceNumber
        node-columns:
          id: node-columns
          type: columns
          slots:
            - slot-col-0
            - slot-col-1
          styles: {}
          props:
            columnSizes:
              - 1
              - 1
            gap: 0
        node-from:
          id: node-from
          type: text
          slots: []
          styles: {}
          props:
            content:
              type: doc
              content:
                - type: paragraph
                  content:
                    - type: text
                      text: "From:"
                      marks:
                        - type: bold
                    - type: hardBreak
                    - type: text
                      text: "Acme Corporation"
                    - type: hardBreak
                    - type: text
                      text: "1 Enterprise Way"
                    - type: hardBreak
                    - type: text
                      text: "Springfield, IL 62704"
        node-to:
          id: node-to
          type: text
          slots: []
          styles: {}
          props:
            content:
              type: doc
              content:
                - type: paragraph
                  content:
                    - type: text
                      text: "To:"
                      marks:
                        - type: bold
                    - type: hardBreak
                    - type: expression
                      attrs:
                        expression: customer.name
                    - type: hardBreak
                    - type: text
                      text: "{{customer.address.street}}"
                    - type: hardBreak
                    - type: text
                      text: "{{customer.address.city}}, {{customer.address.postalCode}}"
    slots:
      type: object
      additionalProperties:
        $ref: '#/SlotDto'
      description: Flat map of all slots keyed by slot ID
      example:
        slot-root-children:
          id: slot-root-children
          nodeId: node-root
          name: children
          children:
            - node-header
            - node-columns
        slot-col-0:
          id: slot-col-0
          nodeId: node-columns
          name: column-0
          children:
            - node-from
        slot-col-1:
          id: slot-col-1
          nodeId: node-columns
          name: column-1
          children:
            - node-to
    themeRef:
      $ref: '#/ThemeRefDto'
    pageSettingsOverride:
      $ref: './themes.yaml#/PageSettingsDto'
    documentStylesOverride:
      $ref: './themes.yaml#/DocumentStylesDto'
  example:
    modelVersion: 1
    root: node-root
    nodes:
      node-root:
        id: node-root
        type: container
        slots:
          - slot-root-children
        styles: {}
        props: {}
      node-header:
        id: node-header
        type: text
        slots: []
        styles:
          fontSize: "24pt"
          fontWeight: bold
        props:
          content:
            type: doc
            content:
              - type: paragraph
                content:
                  - type: text
                    text: "Invoice "
                  - type: expression
                    attrs:
                      expression: invoiceNumber
      node-columns:
        id: node-columns
        type: columns
        slots:
          - slot-col-0
          - slot-col-1
        styles: {}
        props:
          columnSizes:
            - 1
            - 1
          gap: 0
      node-from:
        id: node-from
        type: text
        slots: []
        styles: {}
        props:
          content:
            type: doc
            content:
              - type: paragraph
                content:
                  - type: text
                    text: "From:"
                    marks:
                      - type: bold
                  - type: hardBreak
                  - type: text
                    text: "Acme Corporation"
                  - type: hardBreak
                  - type: text
                    text: "1 Enterprise Way"
                  - type: hardBreak
                  - type: text
                    text: "Springfield, IL 62704"
      node-to:
        id: node-to
        type: text
        slots: []
        styles: {}
        props:
          content:
            type: doc
            content:
              - type: paragraph
                content:
                  - type: text
                    text: "To:"
                    marks:
                      - type: bold
                  - type: hardBreak
                  - type: expression
                    attrs:
                      expression: customer.name
                  - type: hardBreak
                  - type: text
                    text: "{{customer.address.street}}"
                  - type: hardBreak
                  - type: text
                    text: "{{customer.address.city}}, {{customer.address.postalCode}}"
    slots:
      slot-root-children:
        id: slot-root-children
        nodeId: node-root
        name: children
        children:
          - node-header
          - node-columns
      slot-col-0:
        id: slot-col-0
        nodeId: node-columns
        name: column-0
        children:
          - node-from
      slot-col-1:
        id: slot-col-1
        nodeId: node-columns
        name: column-1
        children:
          - node-to
    themeRef:
      type: inherit

NodeDto:
  type: object
  description: |
    A node in the template document graph. Represents a content or layout element.

    The `type` field is open-ended; the suite recognises body-flow types such as
    `text`, `container`, `columns`, `table`, and page-decoration types such as
    `pageheader` and `pagefooter`. See `TemplateDocumentDto` for the rules that
    govern page-decoration placement and the positional first-page / running
    mapping.
  required:
    - id
    - type
    - slots
  properties:
    id:
      type: string
      minLength: 1
      description: Unique identifier for this node within the document
      example: node-header
    type:
      type: string
      minLength: 1
      description: Node type identifier (e.g. 'text', 'container', 'columns', 'table')
      example: text
    slots:
      type: array
      items:
        type: string
        minLength: 1
      description: Ordered slot IDs owned by this node
      example: []
    styles:
      type: object
      description: |
        Inline style overrides. Values use pt (points), sp (spacing scale), or mm (page margins).
        Examples: `"12pt"`, `"2sp"`, `"1.5sp"`.
      example:
        fontSize: "24pt"
        marginBottom: "3sp"
        fontWeight: bold
    stylePreset:
      type: string
      description: Reference to a named preset in the theme's block style presets
      example: heading
    props:
      type: object
      description: |
        Type-specific properties (rich-text content, expression config, column
        sizing, etc.).

        ### Rich-text content (`text` nodes)

        The `content` prop of a `text` node is a rich-text document **object**
        (ProseMirror document JSON), not a plain string:

        ```json
        { "type": "doc", "content": [ { "type": "paragraph", "content": [ ... ] } ] }
        ```

        Block-level entries are `paragraph` or `heading` (with `attrs.level`
        1–6). Their inline content is a sequence of:

        - `text` runs — `{ "type": "text", "text": "..." }`, optionally with
          `marks` (e.g. `bold`, `italic`, `underline`, `strike`, `link`).
          `{{ ... }}` placeholders inside the text are interpolated as JSONata
          expressions against the input data at render time.
        - `expression` nodes —
          `{ "type": "expression", "attrs": { "expression": "<JSONata>" } }`,
          evaluated against the input data at render time.
        - `hardBreak` — a line break within the same paragraph.

        ### Layout props (`columns` nodes)

        A `columns` node sizes its columns with `columnSizes` (array of relative
        weights, one entry per `column-{i}` slot, e.g. `[1, 1]` for two equal
        columns) and spaces them with `gap` (number).

        ### Image props (`image` nodes)

        An `image` node references an uploaded asset via `assetId` (plus optional
        `catalogKey` when the asset lives in another catalog) — not a URL. Other
        props: `alt` (string), `decorative` (boolean), `width` / `height`
        (unit strings, e.g. `"120pt"`), `aspectRatioLocked` (boolean).

        ### Stencil nodes

        On a `stencil` node the props identify the embedded stencil version and
        carry its parameter wiring:

        - `stencilId` — slug of the stencil to embed.
        - `catalogKey` — catalog containing the stencil; null/omitted means the
          same catalog as the owning template.
        - `version` — the stencil version number the node is pinned to.
        - `isDraft` — true when the node tracks the stencil's draft instead of a
          published version.
        - `parameterBindings` — object mapping each declared parameter name to the
          JSONata expression that produces its value, evaluated against the template's
          data model at render time (e.g. `{ "recipientName": "customer.name" }`).
        - `parameterSchemaSnapshot` — a copy of the source stencil version's
          `parameterSchema` (see `StencilVersionDto.parameterSchema`), captured at
          insertion so the schema travels with the node.
        - `paramsAlias` — optional string naming the scope the parameters are exposed
          under inside the stencil content; defaults to `params`.
      example:
        content:
          type: doc
          content:
            - type: paragraph
              content:
                - type: text
                  text: "Invoice {{invoiceNumber}}"
  example:
    id: node-header
    type: text
    slots: []
    styles:
      fontSize: "24pt"
      fontWeight: bold
    props:
      content:
        type: doc
        content:
          - type: paragraph
            content:
              - type: text
                text: "Invoice {{invoiceNumber}}"

SlotDto:
  type: object
  description: A slot in the template document graph. Slots are containers owned by nodes that hold ordered child nodes.
  required:
    - id
    - nodeId
    - name
    - children
  properties:
    id:
      type: string
      minLength: 1
      description: Unique identifier for this slot within the document
      example: slot-root-children
    nodeId:
      type: string
      minLength: 1
      description: ID of the parent node that owns this slot
      example: node-root
    name:
      type: string
      minLength: 1
      description: Semantic slot name (e.g. 'children', 'column-0', 'cell-0-1', 'body')
      example: children
    children:
      type: array
      items:
        type: string
        minLength: 1
      description: Ordered child node IDs in this slot
      example:
        - node-header
        - node-columns
  example:
    id: slot-root-children
    nodeId: node-root
    name: children
    children:
      - node-header
      - node-columns

ThemeRefDto:
  type: object
  description: |
    Reference to a theme for this template document.
    When type is "inherit", the theme is inherited from the variant/template hierarchy.
    When type is "override", the themeId field specifies which theme to use.
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - inherit
        - override
      description: |
        Theme reference strategy.
        "inherit" uses the theme from the variant/template hierarchy.
        "override" uses the theme specified by themeId.
      example: inherit
    themeId:
      type: string
      minLength: 1
      description: Slug identifier of the theme to use. Required when type is "override".
      example: corporate
  example:
    type: inherit

BlockStylePresetDto:
  type: object
  description: A named block style preset (like a CSS class) that can be applied to nodes
  required:
    - label
    - styles
  properties:
    label:
      type: string
      description: Human-readable label for the preset
      example: Heading
    styles:
      type: object
      description: |
        Style properties for this preset. Values use pt (points) or sp (spacing scale).
        Examples: `"18pt"`, `"4sp"`.
      example:
        fontSize: "18pt"
        marginBottom: "4sp"
        fontWeight: bold
    applicableTo:
      type: array
      items:
        type: string
      description: Node types this preset can be applied to. Absent or empty means all types.
      example:
        - text
        - container
  example:
    label: Heading
    styles:
      fontSize: "18pt"
      fontWeight: bold
    applicableTo:
      - text
      - container
