catalogs:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listCatalogs
    summary: List catalogs for a tenant
    description: Returns all catalogs (authored and subscribed) for the specified tenant.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of catalogs
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade-preview:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      description: Slug identifier of the SUBSCRIBED catalog
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: previewCatalogUpgrade
    summary: Preview a catalog upgrade
    description: |
      Preview what upgrading a SUBSCRIBED catalog to its source's latest
      release would do, **without applying it**. Re-fetches the source
      manifest and diffs it against the installed release (source-vs-source):
      added / removed / changed / unchanged resources (each `type/slug`), plus
      any cross-catalog conflicts that would block removals.

      Read-only. Apply the returned change set with `POST .../upgrade`.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The upgrade diff.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogUpgradeDiff'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-release:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      description: Slug identifier of the AUTHORED catalog
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  post:
    operationId: releaseCatalog
    summary: Release an authored catalog
    description: Cut a new immutable SemVer release for an AUTHORED catalog.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_PUBLISH]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogRequest'
    responses:
      '200':
        description: Catalog released.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-upgrade:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      description: Slug identifier of the SUBSCRIBED catalog
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  post:
    operationId: upgradeCatalog
    summary: Upgrade a subscribed catalog
    description: |
      Re-fetch the source catalog and apply an upgrade to an existing SUBSCRIBED
      catalog. Existing resources are upgraded in place. New resources are only
      installed when listed in `includeNewSlugs`.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    requestBody:
      required: false
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpgradeCatalogRequest'
    responses:
      '200':
        description: Upgrade result.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/UpgradeCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
