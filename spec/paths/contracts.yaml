contract-draft:
  parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  post:
    operationId: createContractDraft
    summary: Create a contract draft
    description: Create a draft data-contract version for a template, or return the existing draft.
    tags:
      - Contracts
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '200':
        description: Existing draft returned.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/contracts.yaml#/CreateContractDraftResponse'
      '201':
        description: Draft created.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/contracts.yaml#/CreateContractDraftResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
  patch:
    operationId: updateContractDraft
    summary: Update a contract draft
    description: Update a template's draft data contract. A draft is created automatically if none exists.
    tags:
      - Contracts
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/contracts.yaml#/UpdateContractDraftRequest'
    responses:
      '200':
        description: Draft updated.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/contracts.yaml#/UpdateContractDraftResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '422':
        $ref: '../components/responses/problem-responses.yaml#/UnprocessableEntityError'

contract-publish:
  parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  post:
    operationId: publishContractDraft
    summary: Publish a contract draft
    description: |
      Publish the current draft data contract. When the draft contains breaking
      schema changes, send `confirmed: true` to publish after reviewing the impact.
    tags:
      - Contracts
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: false
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/contracts.yaml#/PublishContractRequest'
    responses:
      '200':
        description: Publish result or breaking-change preview.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/contracts.yaml#/PublishContractResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

