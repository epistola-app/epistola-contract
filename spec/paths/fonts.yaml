fonts:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      description: Slug identifier of the catalog.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  get:
    operationId: listFonts
    summary: List font families in a catalog
    description: |
      Retrieve all font families in the given tenant + catalog, each with the
      weight/italic faces it ships. Families from a SUBSCRIBED catalog (e.g.
      the bundled `system` catalog) are flagged `readOnly: true`.

      Read-only: font families and their binaries are managed through the UI
      and catalog exchange only — there is no create/update/delete over REST.
    tags:
      - Fonts
    x-required-roles:
      - reader
      - editor
      - generator
      - manager
    responses:
      '200':
        description: List of font families.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/fonts.yaml#/FontListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        description: Tenant or catalog not found.
        content:
          application/problem+json:
            schema:
              $ref: '../components/responses/errors.yaml#/ProblemDetail'

fonts-slug:
  parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: fontSlug
      in: path
      required: true
      description: Slug of the font family.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 2
        maxLength: 64
  get:
    operationId: getFont
    summary: Get a font family
    tags:
      - Fonts
    x-required-roles:
      - reader
      - editor
      - generator
      - manager
    responses:
      '200':
        description: Font family.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/fonts.yaml#/FontDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        description: Font family not found.
        content:
          application/problem+json:
            schema:
              $ref: '../components/responses/errors.yaml#/ProblemDetail'
