# RFC 9457 Problem Details for HTTP APIs
# https://www.rfc-editor.org/rfc/rfc9457
# (RFC 9457 obsoletes RFC 7807)

ProblemDetail:
  type: object
  description: RFC 9457 Problem Details for HTTP APIs
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri
      default: about:blank
      description: |
        URI that identifies the problem type and is the stable, machine-readable
        discriminator clients should switch on. Application-level errors use a
        dereferenceable `https://epistola.app/errors/{slug}` URI; framework-level
        errors with no specific type default to `about:blank`.
      example: https://epistola.app/errors/not-found
    title:
      type: string
      description: Short human-readable summary of the problem type
      example: Not Found
    status:
      type: integer
      description: HTTP status code
      example: 404
    detail:
      type: string
      description: Human-readable explanation specific to this occurrence
      example: Tenant with ID 'acme-corp' was not found
    instance:
      type: string
      format: uri-reference
      description: URI reference that identifies this specific occurrence of the problem
      example: /api/tenants/acme-corp/catalogs/default/templates?q=invoice

# Extension for validation errors with field-level details
ValidationProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: '#/ValidationError'

ValidationError:
  type: object
  description: A single field validation error
  required:
    - field
    - message
  properties:
    field:
      type: string
      description: The field that failed validation
      example: name
    message:
      type: string
      description: Description of the validation failure
      example: must not be blank
    rejectedValue:
      description: The value that was rejected (if applicable)

DataModelValidationProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        validationErrors:
          type: object
          description: >-
            Map of data-example name to the list of failures that example produced
            when validated against the template's data model.
          additionalProperties:
            type: array
            items:
              $ref: '#/DataModelValidationError'

ReleaseDependenciesMissingProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        missingDependencies:
          type: array
          description: >-
            Each release of another catalog the deployed release renders with, directly or through
            another dependency, that cannot be had, in the order the release lists its
            dependencies.
          items:
            $ref: '../schemas/environments.yaml#/MissingReleaseDependency'

ReleaseDependenciesUnreleasedProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        unreleasedDependencies:
          type: array
          description: >-
            Each draft of another catalog that the released draft's dependency declarations name,
            directly or through the declarations of such a draft, in the order the declarations list
            them, each before the drafts it names in turn.
          items:
            $ref: '../schemas/catalogs.yaml#/UnreleasedCatalogDependency'

CatalogReadOnlyProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        readOnlyReason:
          $ref: '../schemas/catalogs.yaml#/CatalogReadOnlyReason'
          description: >-
            Why the catalog cannot be changed in this installation, as `CatalogDto.readOnlyReason`
            reports it.

MergeConflictsUnresolvedProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        unresolvedConflicts:
          type: array
          description: >-
            Each conflict of the merge that the request gave no resolution, as
            `resourceType/resourceKey` (`template/invoice`, a setting `catalog/defaultTheme`), ordered by
            type, then key.
          items:
            type: string

MergeBaseMissingProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        version:
          type: string
          description: >-
            The version of the release to get first: the merge base, the closest release both the
            draft and the release descend from, which this installation does not have.
          example: "1.0.0"
        fingerprint:
          type: string
          description: >-
            That release's catalog fingerprint, in the form that names its algorithm (`v5:<hex>`),
            so that the release obtained can be checked to be the one meant.
          example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogRenderingDefaultsTooNewProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        renderingDefaultsVersion:
          type: string
          description: >-
            The rendering defaults version the release names in its `release.metadata`, as it names
            it (a number this installation does not have, or a value it cannot read).
          example: "9"
        supportedVersion:
          type: integer
          description: The newest rendering defaults version this installation has.
          example: 6

DataModelValidationError:
  type: object
  description: A single data-example validation failure against the data model
  required:
    - path
    - message
  properties:
    path:
      type: string
      description: JSON pointer/path to the location in the example that failed
      example: /name
    message:
      type: string
      description: Description of the validation failure
      example: required property 'name' not found

# Extension for template data that breaks the template's data contract
TemplateDataValidationProblemDetail:
  allOf:
    - $ref: '#/ValidationProblemDetail'
    - type: object
      properties:
        missingFields:
          type: array
          description: >-
            Absent fields, outermost node first, in schema declaration order. Paths are JSON
            Pointers into the request's `data`.
          items:
            $ref: '../schemas/validation.yaml#/MissingDataField'
        invalidFields:
          type: array
          description: Supplied values that break the contract. Paths are JSON Pointers into `data`.
          items:
            $ref: '../schemas/validation.yaml#/InvalidDataField'
