# RFC 9457 Problem Details for HTTP APIs
# https://www.rfc-editor.org/rfc/rfc9457
# (RFC 9457 obsoletes RFC 7807)

ProblemDetail:
  type: object
  description: RFC 9457 Problem Details for HTTP APIs
  required:
    - type
    - title
    - status
  properties:
    type:
      type: string
      format: uri
      default: about:blank
      description: |
        URI that identifies the problem type and is the stable, machine-readable
        discriminator clients should switch on: `https://epistola.app/errors/{slug}`, one of
        the types `x-problem-types` registers. It is always exactly that URI, so compare it
        as a whole; the page it opens explains the type in general.
      example: https://epistola.app/errors/not-found
    title:
      type: string
      description: Short human-readable summary of the problem type
      example: Not Found
    status:
      type: integer
      description: HTTP status code
      example: 404
    detail:
      type: string
      description: Human-readable explanation specific to this occurrence
      example: Tenant with ID 'acme-corp' was not found
    instance:
      type: string
      format: uri-reference
      description: URI reference that identifies this specific occurrence of the problem
      example: /api/tenants/acme-corp/catalogs/default/templates?q=invoice
    help:
      type: string
      format: uri
      description: |
        A page that explains this problem with the context of this request: the `type` URI
        with query parameters naming, from this contract, what the request was, such as
        `operation` (its `operationId`). The page gives the hints for that context, and the
        general explanation of the type otherwise. It names the contract's terms only, never
        a value from the request or the installation, so it can be shared or logged as it is.
        Optional; a server may leave it out. Do not compare it: switch on `type`.
      example: https://epistola.app/errors/not-found?operation=getTemplate

# Extension for validation errors with field-level details
ValidationProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: '#/ValidationError'

ValidationError:
  type: object
  description: A single field validation error
  required:
    - field
    - message
  properties:
    field:
      type: string
      description: The field that failed validation
      example: name
    message:
      type: string
      description: Description of the validation failure
      example: must not be blank
    code:
      type: string
      description: |
        Why the field failed, machine-readably: one of the codes `x-validation-codes` registers.
        A constraint code names the JSON Schema keyword of this contract that the value broke
        (`required`, `pattern`, `max-length`, ...); a template code a finding in template or
        stencil content (`stencil-recursion`); a domain code a rule the server applies beyond the
        schema (`catalog-namespace-not-held`). Optional: a server may leave it out, and
        new codes may be added in a minor version, so keep a default branch. Show `message` to a
        person.
      example: pattern
    rejectedValue:
      description: The value that was rejected (if applicable)

DataModelValidationProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        validationErrors:
          type: object
          description: >-
            Map of each failing data example's `key` to the list of failures that example
            produced when validated against the template's data model. Keyed by `key`, not by
            `name`: a name is display text and need not be unique.
          additionalProperties:
            type: array
            items:
              $ref: '#/DataModelValidationError'

ReleaseDependenciesMissingProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        missingDependencies:
          type: array
          description: >-
            Each release of another catalog the deployed release renders with, directly or through
            another dependency, that cannot be had, in the order the release lists its
            dependencies.
          items:
            $ref: '../schemas/environments.yaml#/MissingReleaseDependency'

ReleaseDependenciesUnreleasedProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        unreleasedDependencies:
          type: array
          description: >-
            Each draft of another catalog that the released draft's dependency declarations name,
            directly or through the declarations of such a draft, in the order the declarations list
            them, each before the drafts it names in turn.
          items:
            $ref: '../schemas/catalogs.yaml#/UnreleasedCatalogDependency'

CatalogReadOnlyProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        readOnlyReason:
          $ref: '../schemas/catalogs.yaml#/CatalogReadOnlyReason'
          description: >-
            Why the catalog cannot be changed in this installation, as `CatalogDto.readOnlyReason`
            reports it.

MergeConflictsUnresolvedProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        unresolvedConflicts:
          type: array
          description: >-
            Each conflict of the merge that the request gave no resolution, as
            `resourceType/resourceKey` (`template/invoice`, a setting `catalog/defaultTheme`), ordered by
            type, then key.
          items:
            type: string

MergeBaseMissingProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        version:
          type: string
          description: >-
            The version of the release to get first: the merge base, the closest release both the
            draft and the release descend from, which this installation does not have.
          example: "1.0.0"
        fingerprint:
          type: string
          description: >-
            That release's catalog fingerprint, in the form that names its algorithm (`v5:<hex>`),
            so that the release obtained can be checked to be the one meant.
          example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogVersionBehindProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      required:
        - behind
      properties:
        behind:
          type: array
          description: >-
            The versions of the releases the draft is behind and the request did not acknowledge:
            name each in `acknowledgedBehind` to release it anyway, once its changes are applied by
            hand or left out on purpose.
          items:
            $ref: '../schemas/identifiers.yaml#/ReleaseVersion'
          example: ["1.5.0"]

ReleaseInUseProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        environments:
          type: array
          description: >-
            The environments that deploy the release; undeploy it from each first. Empty when none
            does.
          items:
            $ref: '../schemas/identifiers.yaml#/EnvironmentKey'
          example: [production]
        pinnedBy:
          type: array
          description: >-
            The releases of other catalogs that pin it, and render with it. Empty when none does.
          items:
            $ref: '../schemas/catalogs.yaml#/CatalogReleaseRefDto'

AmbiguousVariantProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      required:
        - tiedVariants
      properties:
        tiedVariants:
          type: array
          description: >-
            The keys of the variants that match the request's attributes equally well. Name one by
            `variantKey`, or send attributes that tell them apart.
          items:
            $ref: '../schemas/identifiers.yaml#/ResourceKey'
          example: [english, english-legal]

CatalogRenderingDefaultsTooNewProblemDetail:
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        renderingDefaultsVersion:
          type: string
          description: >-
            The rendering defaults version the release names in its `release.metadata`, as it names
            it (a number this installation does not have, or a value it cannot read).
          example: "9"
        supportedVersion:
          type: integer
          description: The newest rendering defaults version this installation has.
          example: 6

ForbiddenProblemDetail:
  description: >-
    A refused authorization (`forbidden`, 403). Every member is optional, and which ones are present
    says what was refused: a permission in a tenant (`requiredPermission` and `tenantKey`), access to
    the tenant itself (`tenantKey` alone), a platform role (`requiredPlatformRole`), or a policy the
    server applies (`reason`). A client that knows none of them still knows the request was refused.
  allOf:
    - $ref: '#/ProblemDetail'
    - type: object
      properties:
        requiredPermission:
          type: string
          description: >-
            The permission the caller lacks, named as the operation's `x-required-permissions`
            names it. Grant the caller, or the API key, a role that carries it.
          example: TEMPLATE_EDIT
        requiredPlatformRole:
          type: string
          description: >-
            The platform role the caller lacks, named as the operation's `x-required-platform-roles`
            names it.
          example: TENANT_MANAGER
        tenantKey:
          type: string
          description: >-
            The tenant the refusal is about. Alone, without `requiredPermission`, the caller has no
            access to this tenant at all.
          example: acme-corp
        reason:
          type: string
          description: >-
            Why a policy refused the request, when the server decides by policy rather than by the
            permissions a role carries, so that there is no single permission to grant. Text for a
            person to read, not a code to switch on.
          example: Only the release board deploys to production environments.

DataModelValidationError:
  type: object
  description: A single data-example validation failure against the data model
  required:
    - path
    - message
  properties:
    path:
      type: string
      description: JSON pointer/path to the location in the example that failed
      example: /name
    message:
      type: string
      description: Description of the validation failure
      example: required property 'name' not found

# Extension for template data that breaks the template's data contract
TemplateDataValidationProblemDetail:
  allOf:
    - $ref: '#/ValidationProblemDetail'
    - type: object
      properties:
        missingFields:
          type: array
          description: >-
            Absent fields, outermost node first, in schema declaration order. Paths are JSON
            Pointers into the request's `data`.
          items:
            $ref: '../schemas/validation.yaml#/MissingDataField'
        invalidFields:
          type: array
          description: Supplied values that break the contract. Paths are JSON Pointers into `data`.
          items:
            $ref: '../schemas/validation.yaml#/InvalidDataField'
