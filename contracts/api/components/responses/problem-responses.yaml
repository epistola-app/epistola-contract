# Reusable RFC 9457 problem responses, one per canonical problem `type` slug.
# See docs/error-types.md for the full registry. Authentication/authorization
# responses (401/403) live in auth-errors.yaml.

ValidationFailedError:
  description: The request body or parameters failed validation
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ValidationProblemDetail'
      example:
        type: https://epistola.app/errors/validation-error
        title: Bad Request
        status: 400
        detail: The request body failed validation
        errors:
          - field: name
            message: must not be blank

BadRequestError:
  description: >-
    The request is malformed or not applicable to the resource's current
    state, but not a field-level validation failure (no `errors[]`)
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/bad-request
        title: Bad Request
        status: 400
        detail: The request cannot be applied to the resource's current state

NotFoundError:
  description: The requested resource was not found
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/not-found
        title: Not Found
        status: 404
        detail: The requested resource was not found

ConflictError:
  description: The request conflicts with the current state of the resource
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/conflict
        title: Conflict
        status: 409
        detail: The request conflicts with the current state of the resource

ResourceModifiedError:
  description: >-
    The resource changed since the `ETag` sent as `If-Match` was read, so the update was refused and
    nothing changed. Read the resource again, reapply your change to what you read, and send the
    update with the new `ETag`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/resource-modified
        title: Resource Modified
        status: 412
        detail: "The resource changed since revision 7 was read; it is now at revision 8"

ReleaseDependenciesMissingError:
  description: >-
    The request conflicts with the current state of the resource. When the release renders with
    releases of other catalogs that the tenant does not have, that an imported archive does not
    carry, and that cannot be fetched, the problem is
    `release-dependencies-missing` and `missingDependencies` lists each one and why. Other conflicts
    use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesMissingProblemDetail'
      example:
        type: https://epistola.app/errors/release-dependencies-missing
        title: Release Dependencies Missing
        status: 409
        detail: "letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0"
        missingDependencies:
          - registry: exchange.epistola.app
            namespace: epistola
            catalogKey: system
            version: 3.2.0
            reason: unavailable

ReleaseDependenciesUnreleasedError:
  description: >-
    The request conflicts with the current state of the resource. When the draft's dependency
    declarations name drafts of other catalogs and the request does not release them along
    (`releaseDependencies`), the problem is `release-dependencies-unreleased` and
    `unreleasedDependencies` lists each such draft. Other conflicts (a draft that is behind releases
    not acknowledged, a draft taken along that cannot be released) use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesUnreleasedProblemDetail'
      example:
        type: https://epistola.app/errors/release-dependencies-unreleased
        title: Release Dependencies Unreleased
        status: 409
        detail: "letters uses drafts of other catalogs: acme-corp/branding (House style 2027)"
        unreleasedDependencies:
          - registry: exchange.epistola.app
            namespace: acme-corp
            catalogKey: branding
            releaseId: r4t8w2nc
            releaseName: House style 2027

EnvironmentDeploymentRefusedError:
  description: >-
    The request conflicts with the current state of the resource. When the environment is marked
    production while it serves a draft of a catalog, the problem is `environment-deployment-refused`:
    a production environment serves only releases. Other conflicts use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/environment-deployment-refused
        title: Environment Deployment Refused
        status: 409
        detail: "production serves only releases: it serves the draft Spring fixes of letters"

EnvironmentDeploymentConflictError:
  description: >-
    The request conflicts with the current state of the resource. When the release cannot be
    deployed to this environment, a draft to a production environment, the problem is
    `environment-deployment-refused`. When the release renders with releases of other catalogs that
    the tenant does not have and that cannot be fetched, the problem is
    `release-dependencies-missing` and `missingDependencies` lists each one and why. Other conflicts
    use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesMissingProblemDetail'
      examples:
        draftOnProduction:
          summary: A draft deployed to a production environment
          value:
            type: https://epistola.app/errors/environment-deployment-refused
            title: Environment Deployment Refused
            status: 409
            detail: "production serves only releases: it cannot serve a draft of letters"
        dependenciesMissing:
          summary: Dependency releases that cannot be had
          value:
            type: https://epistola.app/errors/release-dependencies-missing
            title: Release Dependencies Missing
            status: 409
            detail: "letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0"
            missingDependencies:
              - registry: exchange.epistola.app
                namespace: epistola
                catalogKey: system
                version: 3.2.0
                reason: unavailable

TemplateDataInvalidError:
  description: >-
    The request failed validation. When the template data breaks the template's data contract, the
    problem is `template-data-invalid`: `errors[]` lists each field (`field` a JSON Pointer into the
    request body), and `missingFields` and `invalidFields` describe what to supply or correct. Other
    request validation failures use `validation-error`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/TemplateDataValidationProblemDetail'
      example:
        type: https://epistola.app/errors/template-data-invalid
        title: Template Data Invalid
        status: 400
        detail: "Data validation failed: /customer/name: is required"
        errors:
          - field: /data/customer/name
            message: is required
        missingFields:
          - path: /customer/name
            required: true
            schema:
              type: string
        invalidFields: []

UnprocessableEntityError:
  description: >-
    The request was well-formed but cannot be processed because its content is
    semantically invalid (e.g. supplied data examples do not match the data model).
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/DataModelValidationProblemDetail'
      example:
        type: https://epistola.app/errors/data-model-validation-error
        title: Data Model Validation Error
        status: 422
        detail: Data examples failed validation against schema
        validationErrors:
          "Example 1":
            - path: /name
              message: required property 'name' not found

RateLimitedError:
  description: Too many requests; retry after the period indicated by the Retry-After header
  headers:
    Retry-After:
      description: Seconds to wait before retrying
      schema:
        type: integer
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/rate-limited
        title: Too Many Requests
        status: 429
        detail: Rate limit exceeded

CatalogSourceBadGatewayError:
  description: >-
    The catalog's source, its registry or a mirror of it the server is configured with, answered with an
    error or with something that is not a valid answer, so the request could not be carried out and
    nothing was installed. The problem is `catalog-source-unavailable`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/catalog-source-unavailable
        title: Catalog Source Unavailable
        status: 502
        detail: "registry.gemeente-x.nl answered 500 for huisstijl/branding"

CatalogSourceUnavailableError:
  description: >-
    The catalog's source, its registry or a mirror of it the server is configured with, could not be
    reached or did not answer in time, so the request could not be carried out and nothing was
    installed. The problem is `catalog-source-unavailable`. `Retry-After`, when present, says how
    long to wait before trying again.
  headers:
    Retry-After:
      description: Seconds to wait before retrying, when the server can tell
      schema:
        type: integer
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/catalog-source-unavailable
        title: Catalog Source Unavailable
        status: 503
        detail: "registry.gemeente-x.nl could not be reached"
