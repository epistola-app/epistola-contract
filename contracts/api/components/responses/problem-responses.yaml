# Reusable RFC 9457 problem responses, one per canonical problem `type` slug.
# See docs/error-types.md for the full registry. Authentication/authorization
# responses (401/403) live in auth-errors.yaml.

ValidationFailedError:
  description: The request body or parameters failed validation
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ValidationProblemDetail'
      example:
        type: https://epistola.app/errors/validation-error
        title: Bad Request
        status: 400
        detail: The request body failed validation
        errors:
          - field: name
            message: must not be blank

BadRequestError:
  description: >-
    The request is malformed or not applicable to the resource's current
    state, but not a field-level validation failure (no `errors[]`)
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/bad-request
        title: Bad Request
        status: 400
        detail: The request cannot be applied to the resource's current state

ReleaseRegistryNotFoundError:
  description: >-
    The addressed resource does not exist. When the release registry the request names is not one
    this installation has configured or is connected to (alpha), the problem is
    `release-registry-not-found`. Other missing resources (a catalog, a release, a version the
    registry does not hold) use `not-found`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      examples:
        registryNotFound:
          summary: A release registry this installation does not have
          value:
            type: https://epistola.app/errors/release-registry-not-found
            title: Release Registry Not Found
            status: 404
            detail: "There is no release registry called 'acme'. This installation has: exchange"
        notFound:
          summary: A release the registry does not hold
          value:
            type: https://epistola.app/errors/not-found
            title: Not Found
            status: 404
            detail: "acme has no release 1.4.0 of acme-corp/letters"

ReleasePublicationConflictError:
  description: >-
    The release cannot be published as asked (alpha), and nothing was sent. When the registry holds
    this version with other content, the problem is `release-number-taken`: one number names one
    release. When the registry grants namespaces (the Exchange) and does not grant this
    installation the catalog's namespace, it is `namespace-not-granted`. Other conflicts (the path
    names a draft: only a released release is published) use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      examples:
        releaseNumberTaken:
          summary: The registry holds this version with other content
          value:
            type: https://epistola.app/errors/release-number-taken
            title: Release Number Taken
            status: 409
            detail: "acme already has acme-corp/letters 1.4.0 with other content. One number names one release: release the changes under a new number."
        namespaceNotGranted:
          summary: The Exchange does not grant the catalog's namespace
          value:
            type: https://epistola.app/errors/namespace-not-granted
            title: Namespace Not Granted
            status: 409
            detail: "The Exchange connection does not grant the namespace acme-corp"

CatalogImportBadRequestError:
  description: >-
    The archive cannot be installed: it is not a valid catalog archive, or it fails validation
    (`bad-request`). When the release renders with rendering defaults this installation does not
    have, newer or unknown, as its `release.metadata` names them, the problem is
    `catalog-rendering-defaults-too-new`: `renderingDefaultsVersion` is what the release names and
    `supportedVersion` the newest this installation has; upgrade Epistola to receive it. Nothing
    was installed.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/CatalogRenderingDefaultsTooNewProblemDetail'
      examples:
        invalidArchive:
          summary: An archive that fails validation
          value:
            type: https://epistola.app/errors/bad-request
            title: Bad Request
            status: 400
            detail: "The archive has no catalog.json"
        renderingDefaultsTooNew:
          summary: A release that renders with rendering defaults this installation lacks
          value:
            type: https://epistola.app/errors/catalog-rendering-defaults-too-new
            title: Catalog Rendering Defaults Too New
            status: 400
            detail: "letters 1.1.0 renders with rendering defaults version 9, which this Epistola does not have (it has up to 6). Upgrade Epistola to receive this release."
            renderingDefaultsVersion: "9"
            supportedVersion: 6

CatalogInstallBadRequestError:
  description: >-
    The request failed validation (`validation-error`, `errors[]`). When the release renders with
    rendering defaults this installation does not have, newer or unknown, as its
    `release.metadata` names them, the problem is `catalog-rendering-defaults-too-new`:
    `renderingDefaultsVersion` is what the release names and `supportedVersion` the newest this
    installation has; upgrade Epistola to receive it. Nothing was installed.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/CatalogRenderingDefaultsTooNewProblemDetail'
      examples:
        renderingDefaultsTooNew:
          summary: A release that renders with rendering defaults this installation lacks
          value:
            type: https://epistola.app/errors/catalog-rendering-defaults-too-new
            title: Catalog Rendering Defaults Too New
            status: 400
            detail: "letters 1.1.0 renders with rendering defaults version 9, which this Epistola does not have (it has up to 6). Upgrade Epistola to receive this release."
            renderingDefaultsVersion: "9"
            supportedVersion: 6
        validationFailed:
          summary: A request that failed validation
          value:
            type: https://epistola.app/errors/validation-error
            title: Bad Request
            status: 400
            detail: The request failed validation
            errors:
              - field: version
                message: must be a release version

NotFoundError:
  description: The requested resource was not found
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/not-found
        title: Not Found
        status: 404
        detail: The requested resource was not found

ConflictError:
  description: The request conflicts with the current state of the resource
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/conflict
        title: Conflict
        status: 409
        detail: The request conflicts with the current state of the resource

CatalogReadOnlyError:
  description: >-
    The request conflicts with the current state of the resource. When the catalog cannot be
    changed in this installation (`CatalogDto.editable` is false), the problem is
    `catalog-read-only` and `readOnlyReason` says why: the installation only receives and runs
    releases (`editing-disabled`), or the server supplies the catalog itself
    (`supplied-by-epistola`). Other conflicts use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/CatalogReadOnlyProblemDetail'
      example:
        type: https://epistola.app/errors/catalog-read-only
        title: Catalog Read Only
        status: 409
        detail: "exchange.epistola.app/epistola/system is supplied by Epistola and cannot be changed"
        readOnlyReason: supplied-by-epistola

MergeConflictError:
  description: >-
    The request conflicts with the current state of the draft (alpha). When conflicts of the merge
    have no resolution, the problem is `merge-conflicts-unresolved` and `unresolvedConflicts` lists
    each. When the result would hold a reference that does not resolve (a resource the release
    removes that the draft still uses, or a reference within the catalog or into another catalog,
    through the release a declared dependency pins, that the result lacks), it is `merge-refused`,
    and its `detail` names what is missing and what to choose. When the
    draft or the release changed since the preview named by `expectedToken`, it is
    `merge-preview-outdated`. When this installation does not have the merge base (the closest
    release both lines descend from), it is `merge-base-missing`, and `version` and `fingerprint`
    name that release. When the catalog cannot be changed in this installation, it is
    `catalog-read-only` (`readOnlyReason`).
    Other conflicts (the path names a released release, not a draft) use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/MergeConflictsUnresolvedProblemDetail'
      example:
        type: https://epistola.app/errors/merge-conflicts-unresolved
        title: Merge Conflicts Unresolved
        status: 409
        detail: "Merging 1.5.0 into Redesign 2027 needs a choice for: template/invoice"
        unresolvedConflicts:
          - template/invoice

MergeSidesConflictError:
  description: >-
    The sides of the entry cannot be read (alpha). When this installation does not have the merge
    base (the closest release both lines descend from), the problem is `merge-base-missing`, and
    `version` and `fingerprint` name that release, to install first. Other conflicts (the path names
    a released release, not a draft) use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/MergeBaseMissingProblemDetail'
      example:
        type: https://epistola.app/errors/merge-base-missing
        title: Merge Base Missing
        status: 409
        detail: "To merge v1.0.1, this installation needs v1.0.0, the release both come from."
        version: 1.0.0
        fingerprint: v5:9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b

MergeNotApplicableError:
  description: >-
    The merge does not apply (alpha): the draft already contains the release (its base, or merged
    before), or a resolution names a resource that is not a conflict of the merge.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/merge-not-applicable
        title: Merge Not Applicable
        status: 422
        detail: "Redesign 2027 of letters already contains 1.5.0"

ResourceModifiedError:
  description: >-
    The resource changed since the `ETag` sent as `If-Match` was read, so the update was refused and
    nothing changed. Read the resource again, reapply your change to what you read, and send the
    update with the new `ETag`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/resource-modified
        title: Resource Modified
        status: 412
        detail: "The resource changed since revision 7 was read; it is now at revision 8"

ReleaseDependenciesMissingError:
  description: >-
    The release cannot be received (`importCatalog`, `installCatalogRelease`,
    `installRegistryRelease`), and nothing was installed. When the release renders with releases of
    other catalogs that the tenant does not have, that an imported archive does not carry, and that
    cannot be fetched, the problem is `release-dependencies-missing` and `missingDependencies` lists
    each one and why. When its number or id names another release here (the tenant has this
    version of the catalog, or of a release it pins, with another fingerprint, or another release
    or a draft of the catalog has its release id), it is `release-number-taken`: one number and one
    id name one release. Other conflicts (the tenant has a catalog under that key in another
    registry or namespace, one that receives its releases from another source, or a catalog without
    a source to install from) use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesMissingProblemDetail'
      examples:
        releaseDependenciesMissing:
          summary: Releases it pins cannot be had
          value:
            type: https://epistola.app/errors/release-dependencies-missing
            title: Release Dependencies Missing
            status: 409
            detail: "letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0"
            missingDependencies:
              - registry: exchange.epistola.app
                namespace: epistola
                catalogKey: system
                version: 3.2.0
                reason: unavailable
        releaseNumberTaken:
          summary: The tenant has this version with other content
          value:
            type: https://epistola.app/errors/release-number-taken
            title: Release Number Taken
            status: 409
            detail: "This tenant has letters 1.4.0 with other content (fingerprint v5:9f3a…, the archive's v5:1c2b…); one number names one release."

ReleaseDependenciesUnreleasedError:
  description: >-
    The request conflicts with the current state of the resource. When the draft's dependency
    declarations name drafts of other catalogs and the request does not release them along
    (`releaseDependencies`), the problem is `release-dependencies-unreleased` and
    `unreleasedDependencies` lists each such draft. When the catalog cannot be changed in this
    installation, the problem is `catalog-read-only` (`readOnlyReason`). Other conflicts (a draft
    that is behind releases not acknowledged, a draft taken along that cannot be released) use
    `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesUnreleasedProblemDetail'
      example:
        type: https://epistola.app/errors/release-dependencies-unreleased
        title: Release Dependencies Unreleased
        status: 409
        detail: "letters uses drafts of other catalogs: acme-corp/branding (House style 2027)"
        unreleasedDependencies:
          - registry: exchange.epistola.app
            namespace: acme-corp
            catalogKey: branding
            releaseId: r4t8w2nc
            releaseName: House style 2027

EnvironmentDeploymentRefusedError:
  description: >-
    The request conflicts with the current state of the resource. When the environment is marked
    production while it serves a draft of a catalog, the problem is `environment-deployment-refused`:
    a production environment serves only releases. Other conflicts use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/environment-deployment-refused
        title: Environment Deployment Refused
        status: 409
        detail: "production serves only releases: it serves the draft Spring fixes of letters"

EnvironmentDeploymentConflictError:
  description: >-
    The request conflicts with the current state of the resource. When the release cannot be
    deployed to this environment, a draft to a production environment, the problem is
    `environment-deployment-refused`. When the release renders with releases of other catalogs that
    the tenant does not have and that cannot be fetched, the problem is
    `release-dependencies-missing` and `missingDependencies` lists each one and why. Other conflicts
    use `conflict`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ReleaseDependenciesMissingProblemDetail'
      examples:
        draftOnProduction:
          summary: A draft deployed to a production environment
          value:
            type: https://epistola.app/errors/environment-deployment-refused
            title: Environment Deployment Refused
            status: 409
            detail: "production serves only releases: it cannot serve a draft of letters"
        dependenciesMissing:
          summary: Dependency releases that cannot be had
          value:
            type: https://epistola.app/errors/release-dependencies-missing
            title: Release Dependencies Missing
            status: 409
            detail: "letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0"
            missingDependencies:
              - registry: exchange.epistola.app
                namespace: epistola
                catalogKey: system
                version: 3.2.0
                reason: unavailable

TemplateDataInvalidError:
  description: >-
    The request failed validation. When the template data breaks the template's data contract, the
    problem is `template-data-invalid`: `errors[]` lists each field (`field` a JSON Pointer into the
    request body), and `missingFields` and `invalidFields` describe what to supply or correct. Other
    request validation failures use `validation-error`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/TemplateDataValidationProblemDetail'
      example:
        type: https://epistola.app/errors/template-data-invalid
        title: Template Data Invalid
        status: 400
        detail: "Data validation failed: /customer/name: is required"
        errors:
          - field: /data/customer/name
            message: is required
        missingFields:
          - path: /customer/name
            required: true
            schema:
              type: string
        invalidFields: []

UnprocessableEntityError:
  description: >-
    The request was well-formed but cannot be processed because its content is
    semantically invalid (e.g. supplied data examples do not match the data model).
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/DataModelValidationProblemDetail'
      example:
        type: https://epistola.app/errors/data-model-validation-error
        title: Data Model Validation Error
        status: 422
        detail: Data examples failed validation against schema
        validationErrors:
          "Example 1":
            - path: /name
              message: required property 'name' not found

RateLimitedError:
  description: Too many requests; retry after the period indicated by the Retry-After header
  headers:
    Retry-After:
      description: Seconds to wait before retrying
      schema:
        type: integer
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/rate-limited
        title: Too Many Requests
        status: 429
        detail: Rate limit exceeded

CatalogSourceBadGatewayError:
  description: >-
    The catalog's source, its registry or a mirror of it the server is configured with, or the
    release registry the request names (alpha), answered with an error or with something that is
    not a valid answer, so the request could not be carried out and nothing was installed or
    published. The problem is `catalog-source-unavailable`.
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/catalog-source-unavailable
        title: Catalog Source Unavailable
        status: 502
        detail: "registry.gemeente-x.nl answered 500 for huisstijl/branding"

CatalogSourceUnavailableError:
  description: >-
    The catalog's source, its registry or a mirror of it the server is configured with, or the
    release registry the request names (alpha), could not be reached or did not answer in time, so
    the request could not be carried out and nothing was installed or published. The problem is `catalog-source-unavailable`. `Retry-After`, when present, says how
    long to wait before trying again.
  headers:
    Retry-After:
      description: Seconds to wait before retrying, when the server can tell
      schema:
        type: integer
  content:
    application/problem+json:
      schema:
        $ref: './errors.yaml#/ProblemDetail'
      example:
        type: https://epistola.app/errors/catalog-source-unavailable
        title: Catalog Source Unavailable
        status: 503
        detail: "registry.gemeente-x.nl could not be reached"
