FontVariantDto:
  type: object
  description: One face of a font family — CSS numeric `weight` (1–1000) + `italic`.
  required:
    - weight
    - italic
  properties:
    weight:
      type: integer
      minimum: 1
      maximum: 1000
      description: CSS font-weight (400 = regular, 700 = bold).
      example: 400
    italic:
      type: boolean
      example: false

FontDto:
  type: object
  description: |
    A font family: a thin, tenant + catalog scoped grouping over the
    weight/italic faces it ships. Faces are backed by uploaded assets or
    bundled classpath files; this view exposes metadata only (no binaries).

    A family from a SUBSCRIBED catalog (e.g. the bundled `system` catalog's
    `inter`, `roboto`, …) is flagged `readOnly: true`.

    **Read-only over REST.** Font families and their binaries are managed
    through the UI and catalog exchange only — there is no create/update/delete
    via this API, unlike images, which can be uploaded (`uploadImage`) and
    deleted (`deleteImage`). (Write access may be revisited later.)
  required:
    - key
    - name
    - kind
    - registry
    - namespace
    - catalogKey
    - catalogType
    - readOnly
    - variants
    - createdAt
    - lastModified
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key (unique within `tenant + catalog`).
      example: inter
    name:
      type: string
      description: Human-readable family name.
      example: Inter
    kind:
      type: string
      enum: [sans, serif, mono, condensed, display]
      description: Broad typeface classification, used by the editor picker.
      example: sans
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog this resource lives in, unique within its registry and namespace
      example: system
    catalogType:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog ownership; SUBSCRIBED catalogs are read-only.
    readOnly:
      type: boolean
      description: True when the owning catalog is SUBSCRIBED.
    variants:
      type: array
      description: The weight/italic faces this family ships.
      items:
        $ref: '#/FontVariantDto'
    createdAt:
      type: string
      format: date-time
    lastModified:
      type: string
      format: date-time

FontListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/FontDto'
    page:
      $ref: './common.yaml#/PageMeta'
