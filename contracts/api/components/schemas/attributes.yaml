AttributeDto:
  type: object
  description: |
    An attribute definition for variant selection within a tenant.

    An attribute is constrained in exactly one of three ways:
      - **Free format** — `allowedValues` is empty and `codeListBinding` is null.
      - **Inline values** — `allowedValues` is non-empty; `codeListBinding` is null.
      - **Bound to a code list** — `codeListBinding` is set; `allowedValues` is empty.

    Attributes from a SUBSCRIBED catalog (e.g. the bundled `system` catalog)
    are flagged `readOnly: true`. Writes to them via this API return 409.
  required:
    - slug
    - tenantId
    - namespace
    - catalogKey
    - displayName
    - catalogType
    - readOnly
    - allowedValues
    - createdAt
    - lastModified
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 1
      maxLength: 50
      description: |
        Slug identifier of the attribute (unique within `tenant + catalog`).
      example: locale
    tenantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Slug identifier of the tenant this attribute belongs to.
      example: acme-corp
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: exchange.epistola.app/epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog this resource lives in, unique within its namespace
      example: system
    displayName:
      type: string
      description: Human-readable display name.
      example: Locale
    description:
      type:
        - string
        - 'null'
      description: Human-readable description of the attribute.
      example: BCP-47 language + region tag (e.g. en-US, nl-NL).
    allowedValues:
      type: array
      items:
        type: string
      description: |
        Allowed values when the attribute uses the inline-values constraint.
        Empty for free-format and code-list-bound attributes.
      default: []
      example: []
    codeListBinding:
      type:
        - object
        - 'null'
      description: |
        Set when the attribute is bound to a code list. The bound list may live
        in this same catalog or in another catalog of the same tenant (e.g. a
        local attribute binding to `system/iso-639-1`). Another catalog must be one the attribute's
        catalog declares as a dependency.
      required:
        - catalogKey
        - slug
      properties:
        namespace:
          type: [string, "null"]
          pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
          minLength: 3
          maxLength: 320
          description: |
            Namespace of the catalog the bound code list belongs to. Omitted in a request: the
            attribute's own namespace. A response writes it in full. A list in another catalog is
            read from the release of that catalog the attribute's catalog depends on.
          example: exchange.epistola.app/epistola
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          description: Key of the catalog the bound code list belongs to.
          example: system
        slug:
          type: string
          description: Code list slug within that catalog.
          example: bcp-47
    catalogType:
      type: string
      enum:
        - AUTHORED
        - SUBSCRIBED
      description: |
        Origin of the attribute's catalog. AUTHORED catalogs are tenant-managed;
        SUBSCRIBED catalogs are read-only mirrors of an upstream source.
      example: SUBSCRIBED
    readOnly:
      type: boolean
      description: |
        True when `catalogType == SUBSCRIBED`. Clients should disable editing
        affordances; PATCH and DELETE on these attributes return 409.
      example: true
    createdAt:
      type: string
      format: date-time
      example: "2026-01-16T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      example: "2026-05-11T12:00:00Z"
  example:
    slug: locale
    tenantId: acme-corp
    namespace: exchange.epistola.app/epistola
    catalogKey: system
    displayName: Locale
    description: BCP-47 language + region tag (e.g. en-US, nl-NL).
    allowedValues: []
    codeListBinding:
      namespace: exchange.epistola.app/epistola
      catalogKey: system
      slug: bcp-47
    catalogType: SUBSCRIBED
    readOnly: true
    createdAt: "2026-01-16T10:00:00Z"
    lastModified: "2026-05-11T12:00:00Z"

CreateAttributeRequest:
  type: object
  description: |
    Request body for creating a new attribute definition.

    Exactly one constraint shape is allowed:
      - Omit both `allowedValues` and `codeListBinding` for free-format.
      - Provide a non-empty `allowedValues` for inline values.
      - Provide `codeListBinding` for code-list-bound (and leave `allowedValues` empty).
    Mixing the two is rejected with 422.
  required:
    - key
    - displayName
  properties:
    key:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 1
      maxLength: 50
      example: priority
    displayName:
      type: string
      example: Priority
    description:
      type:
        - string
        - 'null'
      example: Customer-facing priority of the document.
    allowedValues:
      type: array
      items:
        type: string
      default: []
      example: [low, normal, high]
    codeListBinding:
      type:
        - object
        - 'null'
      required:
        - catalogKey
        - slug
      properties:
        namespace:
          type: [string, "null"]
          pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
          minLength: 3
          maxLength: 320
          description: |
            Namespace of the catalog the bound code list belongs to. Omitted in a request: the
            attribute's own namespace. A response writes it in full. A list in another catalog is
            read from the release of that catalog the attribute's catalog depends on.
          example: exchange.epistola.app/epistola
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          example: system
        slug:
          type: string
          example: iso-639-1

UpdateAttributeRequest:
  type: object
  description: |
    Request body for updating an attribute definition. All fields are optional
    (PATCH semantics). Constraint kind may switch — e.g. unset `codeListBinding`
    and provide `allowedValues` to move from bound to inline. Attempting to
    update an attribute from a SUBSCRIBED catalog returns 409.
  properties:
    displayName:
      type: string
    description:
      type:
        - string
        - 'null'
    allowedValues:
      type: array
      items:
        type: string
    codeListBinding:
      type:
        - object
        - 'null'
      required:
        - catalogKey
        - slug
      properties:
        namespace:
          type: [string, "null"]
          pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
          minLength: 3
          maxLength: 320
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
        slug:
          type: string

AttributeListResponse:
  description: List of attribute definitions
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of attribute definitions
      items:
        $ref: '#/AttributeDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - slug: locale
        tenantId: acme-corp
        namespace: exchange.epistola.app/epistola
        catalogKey: system
        displayName: Locale
        allowedValues: []
        codeListBinding: { namespace: exchange.epistola.app/epistola, catalogKey: system, slug: bcp-47 }
        catalogType: SUBSCRIBED
        readOnly: true
        createdAt: "2026-01-16T10:00:00Z"
        lastModified: "2026-05-11T12:00:00Z"
      - slug: priority
        tenantId: acme-corp
        namespace: exchange.epistola.app/acme-corp
        catalogKey: default
        displayName: Priority
        allowedValues: [low, normal, high]
        codeListBinding: null
        catalogType: AUTHORED
        readOnly: false
        createdAt: "2026-01-16T10:30:00Z"
        lastModified: "2026-01-16T10:30:00Z"
    page:
      number: 0
      size: 20
      totalElements: 2
      totalPages: 1
