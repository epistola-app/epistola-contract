AttributeDto:
  type: object
  description: |
    An attribute definition for variant selection within a tenant.

    An attribute is constrained in exactly one of three ways:
      - **Free format** — `allowedValues` is empty and `codeListBinding` is null.
      - **Inline values** — `allowedValues` is non-empty; `codeListBinding` is null.
      - **Bound to a code list** — `codeListBinding` is set; `allowedValues` is empty.

    Attributes from a subscribed catalog (e.g. the bundled `system` catalog)
    are flagged `readOnly: true`. Writes to them via this API return 409.
  required:
    - key
    - tenantKey
    - registry
    - namespace
    - catalogKey
    - displayName
    - catalogType
    - readOnly
    - allowedValues
    - createdAt
    - lastModified
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: |
        Key of the attribute (unique within `tenant + catalog`).
      example: locale
    tenantKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Key of the tenant this attribute belongs to.
      example: acme-corp
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog this resource lives in, unique within its registry and namespace
      example: system
    displayName:
      type: string
      description: Human-readable display name.
      example: Locale
    description:
      type:
        - string
        - 'null'
      description: Human-readable description of the attribute.
      example: BCP-47 language + region tag (e.g. en-US, nl-NL).
    allowedValues:
      type: array
      items:
        type: string
      description: |
        Allowed values when the attribute uses the inline-values constraint.
        Empty for free-format and code-list-bound attributes.
      default: []
      example: []
    codeListBinding:
      type:
        - object
        - 'null'
      description: |
        Set when the attribute is bound to a code list. The bound list may live
        in this same catalog or in another catalog of the same tenant (e.g. a
        local attribute binding to `system/iso-639-1`). Another catalog must be one the attribute's
        catalog declares as a dependency.
      required:
        - registry
        - namespace
        - catalogKey
        - key
      properties:
        registry:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          maxLength: 253
          description: Registry of the catalog the bound code list belongs to, written in full
          example: exchange.epistola.app
        namespace:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
          description: Namespace of the catalog the bound code list belongs to, within its registry
          example: epistola
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          description: Key of the catalog the bound code list belongs to.
          example: system
        key:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          description: Code list key within that catalog.
          example: bcp-47
    catalogType:
      $ref: './catalogs.yaml#/CatalogType'
      description: The type of the attribute's catalog; a subscribed catalog's attributes are read-only.
    readOnly:
      type: boolean
      description: |
        True when `catalogType` is `subscribed`. Clients should disable editing
        affordances; PATCH and DELETE on these attributes return 409.
      example: true
    createdAt:
      type: string
      format: date-time
      example: "2026-01-16T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      example: "2026-05-11T12:00:00Z"
  example:
    key: locale
    tenantKey: acme-corp
    registry: exchange.epistola.app
    namespace: epistola
    catalogKey: system
    displayName: Locale
    description: BCP-47 language + region tag (e.g. en-US, nl-NL).
    allowedValues: []
    codeListBinding:
      registry: exchange.epistola.app
      namespace: epistola
      catalogKey: system
      key: bcp-47
    catalogType: subscribed
    readOnly: true
    createdAt: "2026-01-16T10:00:00Z"
    lastModified: "2026-05-11T12:00:00Z"

CreateAttributeRequest:
  type: object
  description: |
    Request body for creating a new attribute definition.

    Exactly one constraint shape is allowed:
      - Omit both `allowedValues` and `codeListBinding` for free-format.
      - Provide a non-empty `allowedValues` for inline values.
      - Provide `codeListBinding` for code-list-bound (and leave `allowedValues` empty).
    Mixing the two is refused with 400 `validation-error`.
  required:
    - key
    - displayName
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: priority
    displayName:
      type: string
      example: Priority
    description:
      type:
        - string
        - 'null'
      example: Customer-facing priority of the document.
    allowedValues:
      type: array
      items:
        type: string
      default: []
      example: [low, normal, high]
    codeListBinding:
      type:
        - object
        - 'null'
      required:
        - catalogKey
        - key
      properties:
        registry:
          type: [string, "null"]
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          maxLength: 253
          description: |
            Registry of the catalog the bound code list belongs to. Omitted or null: the registry of
            the attribute's own catalog (not the default registry). Set only together with
            `namespace`.
          example: null
        namespace:
          type: [string, "null"]
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
          description: |
            Namespace of the catalog the bound code list belongs to, within its registry. Omitted or
            null: the namespace of the attribute's own catalog.
          example: null
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          example: system
        key:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          description: Key of the bound code list
          example: iso-639-1

UpdateAttributeRequest:
  type: object
  description: |
    Request body for updating an attribute definition. All fields are optional
    (PATCH semantics). Constraint kind may switch — e.g. unset `codeListBinding`
    and provide `allowedValues` to move from bound to inline. Attempting to
    update an attribute from a subscribed catalog returns 409.
  properties:
    displayName:
      type: string
    description:
      type:
        - string
        - 'null'
    allowedValues:
      type: array
      items:
        type: string
    codeListBinding:
      type:
        - object
        - 'null'
      required:
        - catalogKey
        - key
      properties:
        registry:
          type: [string, "null"]
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          maxLength: 253
          description: |
            Registry of the catalog the bound code list belongs to. Omitted or null: the registry of
            the attribute's own catalog (not the default registry). Set only together with
            `namespace`.
          example: null
        namespace:
          type: [string, "null"]
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
          description: |
            Namespace of the catalog the bound code list belongs to, within its registry. Omitted or
            null: the namespace of the attribute's own catalog.
          example: null
        catalogKey:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
        key:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
          description: Key of the bound code list

AttributeListResponse:
  description: List of attribute definitions
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of attribute definitions
      items:
        $ref: '#/AttributeDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - key: locale
        tenantKey: acme-corp
        registry: exchange.epistola.app
        namespace: epistola
        catalogKey: system
        displayName: Locale
        allowedValues: []
        codeListBinding: { registry: exchange.epistola.app, namespace: epistola, catalogKey: system, key: bcp-47 }
        catalogType: subscribed
        readOnly: true
        createdAt: "2026-01-16T10:00:00Z"
        lastModified: "2026-05-11T12:00:00Z"
      - key: priority
        tenantKey: acme-corp
        registry: exchange.epistola.app
        namespace: acme-corp
        catalogKey: default
        displayName: Priority
        allowedValues: [low, normal, high]
        codeListBinding: null
        catalogType: authored
        readOnly: false
        createdAt: "2026-01-16T10:30:00Z"
        lastModified: "2026-01-16T10:30:00Z"
    page:
      number: 0
      size: 20
      total: 2
      totalPages: 1
