# Shared building blocks used across domain schema files.

# Pagination metadata carried under the `page` property of every list response
# (Spring PagedModel shape). The request-side page index is the `page` query
# parameter; the response-side index is `number` here, matching Spring.
PageMeta:
  type: object
  required:
    - number
    - size
    - totalElements
    - totalPages
  properties:
    number:
      type: integer
      description: Current page index (0-based)
      example: 0
    size:
      type: integer
      description: Number of items per page
      example: 20
    totalElements:
      type: integer
      format: int64
      description: Total number of elements across all pages
      example: 1
    totalPages:
      type: integer
      description: Total number of pages
      example: 1

ResourceStatus:
  type: string
  enum:
    - new
    - modified
    - ready
    - released
  description: |
    How a resource in the working copy stands against its catalog's latest release.

    - `new`: in no release yet, and not marked ready.
    - `modified`: changed since the latest release, and not marked ready since.
    - `ready`: changed since the latest release (or new), and marked ready since its last edit.
    - `released`: the same as in the latest release.

    A catalog release refuses while any resource is `new` or `modified`; it contains the whole
    working copy, so marking ready is a review checkpoint, not a filter.
  example: ready
