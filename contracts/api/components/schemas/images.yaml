ImageDto:
  type: object
  description: |
    An image in a catalog, as metadata. The image itself is fetched through
    `GET .../images/{imageKey}/content`.

    A template places an image by referencing its `key` from an image node, as `props.imageKey`
    alongside the owning catalog's `props.catalogKey`.
  required:
    - key
    - tenantKey
    - registry
    - namespace
    - catalogKey
    - readOnly
    - name
    - mediaType
    - sizeBytes
    - createdAt
  properties:
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: |
        The image's key, unique within its catalog. It is the value a template references as
        `props.imageKey`, the image's key in a catalog export, and the `{imageKey}` that addresses
        the image in this API.

        An image this installation creates has a generated UUID as its key. An image from a catalog
        published elsewhere may have a readable one, such as `municipality-mark`. Treat it as an
        opaque string either way.
      example: "4a64f2f9-2c7a-4d26-9cf7-d34c7ce92280"
    tenantKey:
      $ref: './identifiers.yaml#/TenantKey'
      example: acme-corp
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog this resource lives in, unique within its registry and namespace
      example: default
    readOnly:
      type: boolean
      description: |
        True when the image's catalog cannot be changed in this installation (its `CatalogDto.editable`
        is false; `readOnlyReason` there says why). Clients disable editing affordances; writes to
        it are refused with 409 `catalog-read-only`.
      example: false
    name:
      type: string
      minLength: 1
      maxLength: 255
      example: logo.svg
    mediaType:
      type: string
      description: |
        The image's MIME type. Supported image types are deployment-configured; common ones are
        `image/png`, `image/jpeg`, `image/svg+xml`, and `image/webp`.
      example: image/svg+xml
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
      maximum: 5242880
      example: 12482
    width:
      type:
        - integer
        - 'null'
      minimum: 1
      description: Width in pixels when known; null for SVG.
      example: 512
    height:
      type:
        - integer
        - 'null'
      minimum: 1
      description: Height in pixels when known; null for SVG.
      example: 128
    createdAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"

ImageListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/ImageDto'
    page:
      $ref: './common.yaml#/PageMeta'
