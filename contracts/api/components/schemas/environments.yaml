EnvironmentDto:
  type: object
  description: Tenant environment for version activation (e.g., staging, production)
  required:
    - id
    - tenantId
    - name
    - createdAt
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 30
      description: |
        Slug identifier of the environment

        Sent by every server on contract 1.3.0 or later. Not required, because a server on an
        older 1.x contract omits it and a client must still read its responses: when it is
        absent, read `id`, which carries the same value. Required from 2.0.0, which removes
        `id` (epistola-app/epistola-contract#84).
      example: production
    id:
      type: string
      deprecated: true
      description: |
        **Deprecated — use `slug`.** The same value, under the name the portable catalog
        format already uses. Removed in 2.0.0 (epistola-app/epistola-contract#84).
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 30
      example: production
    tenantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Slug identifier of the tenant this environment belongs to
      example: acme-corp
    name:
      type: string
      description: Name of the environment (e.g., staging, production)
      example: Production
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the environment was created
      example: "2026-01-16T10:00:00Z"
  example:
    slug: production
    id: production
    tenantId: acme-corp
    name: Production
    createdAt: "2026-01-16T10:00:00Z"

CreateEnvironmentRequest:
  type: object
  description: Request body for creating a new environment
  required:
    - id
    - name
  properties:
    id:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 30
      description: Slug identifier for the environment (e.g., production, staging, development)
      example: production
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Name of the environment to create
      example: Production

UpdateEnvironmentRequest:
  type: object
  description: Request body for updating an environment
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: New name for the environment
      example: Production (EU)

EnvironmentListResponse:
  description: List of environments
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of environments
      items:
        $ref: '#/EnvironmentDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - slug: production
        id: production
        tenantId: acme-corp
        name: Production
        createdAt: "2026-01-16T10:00:00Z"
      - slug: staging
        id: staging
        tenantId: acme-corp
        name: Staging
        createdAt: "2026-01-16T10:30:00Z"
    page:
      number: 0
      size: 20
      totalElements: 2
      totalPages: 1
