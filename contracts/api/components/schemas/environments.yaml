EnvironmentDto:
  type: object
  description: A deployment stage (e.g., staging, production) that serves catalog releases, possibly several of one catalog
  required:
    - slug
    - tenantId
    - name
    - createdAt
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 30
      description: |
        Slug identifier of the environment
      example: production
    tenantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Slug identifier of the tenant this environment belongs to
      example: acme-corp
    name:
      type: string
      description: Name of the environment (e.g., staging, production)
      example: Production
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the environment was created
      example: "2026-01-16T10:00:00Z"
  example:
    slug: production
    tenantId: acme-corp
    name: Production
    createdAt: "2026-01-16T10:00:00Z"

CreateEnvironmentRequest:
  type: object
  description: Request body for creating a new environment
  required:
    - id
    - name
  properties:
    id:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 30
      description: Slug identifier for the environment (e.g., production, staging, development)
      example: production
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Name of the environment to create
      example: Production

UpdateEnvironmentRequest:
  type: object
  description: Request body for updating an environment
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: New name for the environment
      example: Production (EU)

EnvironmentListResponse:
  description: List of environments
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of environments
      items:
        $ref: '#/EnvironmentDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - slug: production
        tenantId: acme-corp
        name: Production
        createdAt: "2026-01-16T10:00:00Z"
      - slug: staging
        tenantId: acme-corp
        name: Staging
        createdAt: "2026-01-16T10:30:00Z"
    page:
      number: 0
      size: 20
      totalElements: 2
      totalPages: 1

DeploymentDto:
  type: object
  description: One catalog release an environment serves
  required:
    - namespace
    - catalogKey
    - releaseVersion
    - deployedAt
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: some-namespace
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its namespace
      example: letters
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.4.0"
    deployedAt:
      type: string
      format: date-time
      example: "2026-10-02T07:30:00Z"

DeploymentListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/DeploymentDto'

DeploymentEventDto:
  type: object
  description: One change to what an environment serves
  required:
    - namespace
    - catalogKey
    - releaseVersion
    - action
    - changedAt
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: some-namespace
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its namespace
      example: letters
    action:
      type: string
      enum:
        - deployed
        - undeployed
      example: deployed
    releaseVersion:
      type: string
      maxLength: 50
      description: The release deployed or undeployed
      example: "1.4.1"
    changedAt:
      type: string
      format: date-time
      example: "2026-10-02T07:30:00Z"
    changedBy:
      type: [string, "null"]
      description: Display name of who made the change; null for a system change
      example: Jane Smith

DeploymentHistoryResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/DeploymentEventDto'
    page:
      $ref: './common.yaml#/PageMeta'
