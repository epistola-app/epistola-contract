EnvironmentDto:
  type: object
  description: A deployment stage (e.g., staging, production) that serves catalog versions, possibly several releases of one catalog and a draft
  required:
    - key
    - tenantKey
    - name
    - production
    - createdAt
  properties:
    key:
      $ref: './identifiers.yaml#/EnvironmentKey'
      description: |
        Key of the environment
      example: production
    tenantKey:
      $ref: './identifiers.yaml#/TenantKey'
      description: Key of the tenant this environment belongs to
      example: acme-corp
    name:
      type: string
      description: Name of the environment (e.g., staging, production)
      example: Production
    production:
      type: boolean
      description: |
        A production environment serves only releases: deploying a draft there is refused (see
        `deployCatalogVersion`).
      example: true
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the environment was created
      example: "2026-01-16T10:00:00Z"
  example:
    key: production
    tenantKey: acme-corp
    name: Production
    production: true
    createdAt: "2026-01-16T10:00:00Z"

CreateEnvironmentRequest:
  type: object
  description: Request body for creating a new environment
  required:
    - key
    - name
  properties:
    key:
      $ref: './identifiers.yaml#/EnvironmentKey'
      description: Key of the environment (e.g., production, staging, development)
      example: production
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Name of the environment to create
      example: Production
    production:
      type: boolean
      default: false
      description: |
        Whether the environment is a production environment, which serves only releases.
        Omitted: false.
      example: true

UpdateEnvironmentRequest:
  type: object
  description: Request body for updating an environment
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: New name for the environment
      example: Production (EU)
    production:
      type: [boolean, "null"]
      description: |
        Mark the environment as production, which serves only releases, or unmark it. Omitted or
        null: unchanged. Marking it while it serves a draft of any catalog is refused with 409
        (`environment-deployment-refused`); undeploy the draft first.
      example: true

EnvironmentListResponse:
  description: List of environments
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of environments
      items:
        $ref: '#/EnvironmentDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - key: production
        tenantKey: acme-corp
        name: Production
        production: true
        createdAt: "2026-01-16T10:00:00Z"
      - key: staging
        tenantKey: acme-corp
        name: Staging
        production: false
        createdAt: "2026-01-16T10:30:00Z"
    page:
      number: 0
      size: 20
      total: 2
      totalPages: 1

DeploymentDto:
  type: object
  description: |
    One catalog version an environment serves: a release, or a draft rendered live. An environment
    serves at most one draft of a catalog.
  required:
    - registry
    - namespace
    - catalogKey
    - versionId
    - kind
    - releaseVersion
    - draftName
    - deployedAt
    - lastUsedAt
    - documentsRequested
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    versionId:
      $ref: './identifiers.yaml#/CatalogVersionId'
      description: |
        The version the environment serves, by its `versionId`. A draft keeps it when it is
        released, so a deployed draft that is released is a deployment of that release.
    kind:
      $ref: '#/DeploymentKind'
    releaseVersion:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: The release the environment serves. Null for a draft.
      example: "1.4.0"
    draftName:
      type: [string, "null"]
      maxLength: 100
      description: The name of the draft the environment serves. Null for a release.
      example: null
    deployedAt:
      type: string
      format: date-time
      example: "2026-10-02T07:30:00Z"
    lastUsedAt:
      type: [string, "null"]
      format: date-time
      description: |
        When a generation request through this environment was last accepted for this version; null
        when none has been since it was deployed.

        A request is counted when it names this environment and is accepted and rendered with this
        deployed version. Requests naming no environment are not counted. Updated within about a
        minute of the request, and reset when the version is undeployed; a deployed draft that is
        released keeps its counts, as the same deployment. Together with `documentsRequested` it
        shows which deployed versions nobody uses any more, before undeploying them.
      example: "2026-10-17T14:05:00Z"
    documentsRequested:
      type: integer
      format: int64
      minimum: 0
      description: |
        How many generation requests through this environment were accepted for this version since
        it was deployed. Counted, updated and reset as `lastUsedAt` describes.
      example: 1284

DeploymentKind:
  type: string
  description: |
    - `release`: a released version, served at its number (`releaseVersion`).
    - `draft`: a draft, rendered live with no release (`draftName`). Never in a production
      environment.
  enum:
    - release
    - draft
  example: release

MissingReleaseDependency:
  type: object
  description: A release of another catalog that a release renders with, which could not be served
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - reason
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The release of the catalog depended on that the deployed version renders with
    reason:
      $ref: '#/MissingReleaseDependencyReason'

MissingReleaseDependencyReason:
  type: string
  description: |
    Why a dependency release cannot be used:

    - `unavailable`: the tenant does not have the release, and it could not be fetched from its
      registry or any configured mirror, or the copy did not match its recorded fingerprint.
  enum:
    - unavailable
  example: unavailable

DeploymentListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/DeploymentDto'

DeploymentEventDto:
  type: object
  description: One change to what an environment serves
  required:
    - registry
    - namespace
    - catalogKey
    - versionId
    - kind
    - releaseVersion
    - draftName
    - action
    - changedAt
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    action:
      type: string
      description: |
        - `deployed`, `undeployed`: the environment started or stopped serving the version. A
          draft replaced by deploying another, and a deployed draft that was discarded, are
          `undeployed`.
        - `released`: the deployed draft was released; the environment now serves the release it
          became, at `releaseVersion`, with the same `versionId`. `draftName` is the draft's name
          at the time.
      enum:
        - deployed
        - undeployed
        - released
      example: deployed
    versionId:
      $ref: './identifiers.yaml#/CatalogVersionId'
      description: The version deployed, undeployed or released, by its `versionId`
    kind:
      $ref: '#/DeploymentKind'
      description: |
        What the version was after the change: `draft` for a draft deployed or undeployed,
        `release` for a release, and for a draft that was `released`.
    releaseVersion:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The release deployed or undeployed, or the release a deployed draft became. Null for a
        draft deployed or undeployed.
      example: "1.4.1"
    draftName:
      type: [string, "null"]
      maxLength: 100
      description: |
        The draft's name at the time: for a draft deployed or undeployed, and for one `released`.
        Null for a release deployed or undeployed.
      example: null
    changedAt:
      type: string
      format: date-time
      example: "2026-10-02T07:30:00Z"
    changedBy:
      type: [string, "null"]
      description: Display name of who made the change; null for a system change
      example: Jane Smith

DeploymentHistoryResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/DeploymentEventDto'
    page:
      $ref: './common.yaml#/PageMeta'
