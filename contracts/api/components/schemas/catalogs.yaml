CatalogDto:
  type: object
  description: |
    A catalog: its identity, type and highest release. It does not list the catalog's releases or
    drafts; `listCatalogReleases` does, each with its `status` (`?status=draft` for the drafts only).
  required:
    - registry
    - namespace
    - catalogKey
    - name
    - type
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      $ref: '#/CatalogType'
    highestVersion:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: >-
        The version of the catalog's highest release. For authored catalogs null until
        first released. For subscribed catalogs the highest installed release.
      example: "1.4.0"
    fingerprint:
      oneOf:
        - $ref: './identifiers.yaml#/Fingerprint'
        - type: 'null'
      description: |
        The canonical fingerprint of the content of the highest release (`highestVersion`;
        deterministic, excludes volatile fields), which identifies content independently of the
        version. It names the algorithm that computed it, as the catalog archive does:
        `v5:` and lowercase SHA-256 hex. Null when the catalog has no release.
      example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

AvailableCatalogReleases:
  type: object
  description: |
    The releases the source of a subscribed catalog offers that the tenant has not installed, older
    lines included, each with what it changed against the closest installed release below it and
    whether the releases it pins are present. Nothing is installed by reading it.
  required:
    - registry
    - namespace
    - catalogKey
    - available
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    available:
      type: array
      description: |
        Every release the source offers that the tenant has not installed, lowest first: not only
        those above the highest installed release, so a fix to an older line (`1.4.1`) is listed
        while the tenant has `2.0.0`. Empty when the tenant has every release the source offers.
      items:
        $ref: '#/AvailableReleaseDto'

AvailableReleaseDto:
  type: object
  description: A release the source of a subscribed catalog offers, which the tenant does not have
  required:
    - version
    - comparedTo
    - changes
    - dependencies
  properties:
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The release's version
    comparedTo:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The release `changes` is measured against: the closest release the tenant has installed
        numbered below this one. Null when the tenant has no release numbered below it.
      example: "1.4.0"
    changes:
      type: array
      description: |
        The resources the release added, modified or removed against `comparedTo`, not against the
        release before it; every resource it has, as added, when `comparedTo` is null
      items:
        $ref: '#/ReleasedChangeDto'
    dependencies:
      type: array
      description: |
        The releases of other catalogs the release pins (`catalogDependencies`), each with whether
        the tenant has it. Installing the release (`installCatalogRelease`) installs those it does
        not have first, fetched from their registries. Empty when the release pins none.
      items:
        $ref: '#/AvailableReleaseDependencyDto'

AvailableReleaseDependencyDto:
  type: object
  description: A release of another catalog that an available release pins
  required:
    - registry
    - namespace
    - catalogKey
    - version
    - present
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The version of the release of the catalog depended on that the pin names
    present:
      type: boolean
      description: |
        True when the tenant has the release; false when installing the available release would have
        to fetch it, and is refused with `release-dependencies-missing` when it cannot
      example: true

InstallCatalogReleaseResponse:
  type: object
  description: |
    Result of installing a release of a subscribed catalog from its source: the release it
    installed, or found already present, reported as `ImportCatalogResponse` reports an import.
    Nothing was updated in place or removed. A schema of its own rather than
    `ImportCatalogResponse`: it carries no `catalogName` (the catalog exists already), and its
    dependency lists name the releases fetched from their sources rather than those an archive
    carries.
  required:
    - registry
    - namespace
    - catalogKey
    - version
    - newlyInstalled
    - total
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The version of the release installed, which the tenant now has
    newlyInstalled:
      type: boolean
      description: |
        `true` when this request installed the release; `false` when the tenant already had it, with
        the same fingerprint, and nothing changed.
      example: true
    total:
      type: integer
      description: Number of resources in the release
      example: 7
    installedDependencies:
      type: array
      description: |
        The releases the release pins, directly or through other pins, that were fetched and
        installed, as `catalogKey vVERSION`, in the order it installed them. Empty when it installed
        none.
      items:
        type: string
      example: ["shared v1.1.0"]
    presentDependencies:
      type: array
      description: |
        The releases the release pins, directly or through other pins, that this tenant had already,
        with the same fingerprint, as `catalogKey vVERSION`. Empty when there are none.
      items:
        type: string
      example: []

ReleaseDependencyDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - version
    - direct
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The version of the release of the catalog the release renders with
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogChangesDto:
  type: object
  description: How a release differs from its base
  required:
    - releasable
    - dependenciesChanged
    - changes
  properties:
    base:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The release the draft started from (once released, the base it had as a draft);
        null when there is none
      example: "1.4.0"
    releasable:
      type: boolean
      description: |
        True when the release is a draft, no resource is `new` or `modified`, every stencil instance
        fits its stencil, every catalog a resource references is a declared dependency that pins a
        release the tenant has or names a draft (released along with it, `releaseDependencies`),
        and something changed
      example: false
    dependenciesChanged:
      type: boolean
      description: True when the declared dependencies differ from the base's
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the base
        that is no longer in this release.
      example: modified

CatalogDependencyRequirement:
  type: object
  description: |
    Another catalog this catalog's resources may reference, and the exact release of it they render
    with, or, in a draft, a draft of it. A catalog declares each catalog it depends on once: every
    reference into that catalog resolves through this one declaration, so a release renders with
    exactly the release it pins. Exactly one of `version` and `releaseId` is given (omitted
    and null are not given); neither, or both, is refused with 400.
  required:
    - namespace
    - catalogKey
  properties:
    registry:
      oneOf:
        - $ref: './identifiers.yaml#/Registry'
        - type: 'null'
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Omitted
        or null: the default registry, which the server configures. A response always names it in
        full.
      example: null
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    version:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The version of the exact release of the catalog depended on that this catalog renders with,
        never a range.
      example: "1.3.0"
    releaseId:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseId'
        - type: 'null'
      description: |
        A draft of the catalog depended on, by its `releaseId` (a `CatalogReleaseId`), an authored
        catalog of this tenant, that this draft renders with live, unreleased changes included. A
        released release never pins a draft: releasing this draft is refused
        (`release-dependencies-unreleased`) unless the request releases the named draft along with
        it (`releaseDependencies`). Once the named draft is released on its own, the declaration
        pins it at its version.
      example: null

CatalogDependencyDto:
  type: object
  description: |
    A declared dependency and the exact release it pins, or, in a draft, the draft of it the draft
    uses
  required:
    - registry
    - namespace
    - catalogKey
    - version
    - releaseId
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    version:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The version of the exact release of the catalog depended on that this release renders
        with, as declared. Null when the declaration names a draft (`releaseId`), and for a declaration that
        came from a catalog archive migrated from wire v7 or earlier, which pins no release:
        releasing the draft is refused until one is declared.
      example: "1.3.0"
    releaseId:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseId'
        - type: 'null'
      description: |
        The draft of the catalog depended on that this draft renders with, by its `releaseId` (a
        `CatalogReleaseId`), as declared. Null when the declaration pins a released release, and
        always once this release is released: a released release never pins a draft.
      example: null

CatalogDependencyListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDependencyDto'

UpdateCatalogDependenciesRequest:
  type: object
  description: The complete set of dependencies of the draft
  required:
    - dependencies
  properties:
    dependencies:
      type: array
      description: |
        Each catalog depended on, at most once. The catalog cannot depend on itself, and a draft
        named must be a draft of the catalog the entry names.
      items:
        $ref: '#/CatalogDependencyRequirement'

CatalogType:
  type: string
  enum:
    - authored
    - subscribed
  description: |
    Where a catalog's releases come from:

    - `authored`: the tenant writes it. Drafts are started, edited and released here.
    - `subscribed`: published elsewhere. The tenant only installs its releases, from an archive or
      from its source (`installCatalogRelease`), and its resources are read-only: every write to
      one is refused with 409.

    The import that creates a catalog names its type, and nothing changes it afterwards.
  example: authored

CatalogReleaseStatus:
  type: string
  enum:
    - draft
    - released
  description: |
    - `draft`: editable, with no version. Never exported, never published to a registry, and never
      matched by a version range; rendered only by preview and by an environment it is deployed to.
    - `released`: immutable, with a version. A draft gets its version when it is released, and
      keeps its `releaseId` and its name.
  example: draft

CatalogReleaseDto:
  type: object
  description: |
    One release of a catalog, in status `draft` (a draft release, or draft: editable, with no
    version) or `released` (immutable, with a version). A catalog has any number of drafts, each
    named, each on a fixed base, and each released on its own; a draft gets its version when it is
    released, and keeps its `releaseId` and its name. Each draft is an independent copy, and nothing
    is merged between them.
  required:
    - releaseId
    - version
    - status
    - dependencies
    - deployedTo
    - behind
  properties:
    version:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: The release's version, unique in its catalog. Null for a draft.
      example: "2.0.0"
    releaseId:
      $ref: './identifiers.yaml#/CatalogReleaseId'
      description: |
        The release's id, which addresses it (`…/releases/{releaseId}`), as a draft and, once
        released, alongside its `version`.
    name:
      type: [string, "null"]
      maxLength: 100
      description: |
        The release's name, given when it was started as a draft and unique among the catalog's
        drafts. A release keeps its name when it is released. Null only for a release that has none:
        one installed by import or from its source, which a catalog archive carries no name for.
      example: Redesign 2027
    status:
      $ref: '#/CatalogReleaseStatus'
    base:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The release a draft started from, which its changes are measured against and its version
        follows from; once released, the base it had as a draft. It is fixed: it does not move when
        other releases are released. Null when the catalog had no release when the
        draft was started.
      example: "1.4.0"
    createdFrom:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseId'
        - type: 'null'
      description: |
        The `releaseId` of the draft this draft was copied from, unreleased changes included, when it was
        started from another draft (it then has that draft's base); null when it was started from a
        release, its base, or from nothing
      example: null
    createdAt:
      type: [string, "null"]
      format: date-time
      description: When the draft was started; null for a release installed from elsewhere
      example: "2026-10-01T09:00:00Z"
    behind:
      type: array
      description: |
        For a draft, the releases it is behind, lowest first: relative to the version releasing it
        now would give it (`previewCatalogDraftRelease`), each release whose version is above its
        base and below that version, and each release released after the draft was started whose
        version is below that version (other than its base). The draft does not contain their changes
        unless an author applied them by hand, which the server cannot tell. Releasing a draft that
        is behind must acknowledge them (`acknowledgedBehind`); releasing it as another version
        recomputes them for that version. Empty when there are none, and once it is released.
      items:
        $ref: '#/BehindReleaseDto'
      example: []
    releasedAt:
      type: [string, "null"]
      format: date-time
      description: When the release was released; null for a draft
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      description: The release notes; null for a draft
      example: null
    fingerprint:
      oneOf:
        - $ref: './identifiers.yaml#/Fingerprint'
        - type: 'null'
      description: |
        The canonical fingerprint of the released content, naming the algorithm that computed it
        (`v5:` and lowercase SHA-256 hex), the same value as `release.fingerprint` in the release's
        catalog archive. Null for a draft.
      example: null
    dependencies:
      type: array
      description: |
        Once released, the release of every other catalog it renders with, as its declared
        dependencies pinned them when it was released: the catalogs it declares directly, and the
        releases those pin in turn. Each catalog appears once. Empty for a draft, whose declared
        dependencies are listed by `listCatalogDependencies`.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: |
        Keys of the environments that serve this release (`deployCatalogRelease`), a draft or a
        released one
      items:
        type: string
      example: []
    defaultTheme:
      $ref: '#/CatalogThemeReference'
      description: |
        The release's default theme. A render uses the variant's own theme when its
        template model overrides it (`themeRef`), else the theme its template names (part of the
        template's catalog content, `themeKey` in the archive; this API does not expose it), else
        this one. It is part of the release's content, as
        `catalog.defaultTheme` in its catalog archive, so once released it renders with exactly
        this theme. Absent when the release has none: such a template renders with the rendering
        defaults alone. No render reads a tenant-wide default theme.
    presets:
      type: array
      description: |
        The block style presets the release declares, as `catalog.presets` in its
        catalog archive: what a block's `stylePreset` may name, together with the presets of the
        catalogs it depends on. A theme's `blockStylePresets` supplies their styles. Empty when the
        release declares none; an editor then offers the presets its themes style.
      items:
        $ref: '#/CatalogPresetDto'
      example: []

BehindReleaseDto:
  type: object
  description: A released release a draft is behind, and what it changed
  required:
    - version
    - changes
  properties:
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The release's version
    changes:
      type: array
      description: |
        The resources the release changed against its own base, which an author may need to apply
        to the draft by hand
      items:
        $ref: '#/ReleasedChangeDto'

ReleasedChangeDto:
  type: object
  description: |
    A resource a release added, modified or removed against another release: its base, for a release
    a draft is behind; `comparedTo`, for a release the source of a subscribed catalog offers
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: The resource's key within its type
      example: invoice
    change:
      type: string
      enum:
        - added
        - modified
        - removed
      example: modified

CatalogReleaseListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogReleaseDto'
    page:
      $ref: './common.yaml#/PageMeta'

CreateCatalogReleaseRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        What people call the draft, e.g. "Redesign 2027" or "Fixes 1.4": unique among the catalog's
        drafts, ignoring case.
      example: Redesign 2027
    from:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseRef'
        - type: 'null'
      description: |
        What the draft starts as a copy of, by its `releaseId` or, once released, its version: a
        released release, which becomes its base; or another draft, unreleased changes included, on
        that draft's base.
        Omitted: the catalog's highest release, or nothing (an empty draft with no base) when the
        catalog has no release.
      example: "1.4.0"

UpdateCatalogReleaseRequest:
  type: object
  description: |
    A partial update of a draft's own settings: its name, its default theme and its declared
    presets. A member that is omitted keeps its current value.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: The draft's new name, under the same rules as when it was started. Omitted keeps it.
      example: Redesign 2028
    defaultTheme:
      oneOf:
        - $ref: '#/CatalogThemeReference'
        - type: 'null'
      description: |
        The draft's new default theme: a theme in the catalog itself or in a catalog the draft
        declares as a dependency. Omitted keeps the current one; null clears it, so that a template
        that names no theme renders with the rendering defaults alone. A theme that cannot be found,
        or a catalog the draft does not declare, is refused with 400.
    presets:
      type: [array, 'null']
      description: |
        The draft's declared presets, replacing the current list as a whole. Omitted keeps the
        current list; null or an empty array clears it. Keys are unique within the list, which is
        refused with 400 otherwise.
      items:
        $ref: '#/CatalogPresetDto'

CatalogThemeReference:
  type: object
  description: |
    A reference to a theme from a release, qualified like every other cross-catalog
    reference: an omitted `catalogKey`, `namespace` or `registry` means the referring catalog's own.
  required:
    - key
  properties:
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the theme
      example: corporate
    catalogKey:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogKey'
        - type: 'null'
      description: Key of the catalog holding the theme. Omitted or null means the referring catalog.
      example: brand
    namespace:
      oneOf:
        - $ref: './identifiers.yaml#/Namespace'
        - type: 'null'
      description: |
        Namespace of the catalog holding the theme, within its registry. Omitted or null means the
        referring catalog's namespace.
      example: acme-corp
    registry:
      oneOf:
        - $ref: './identifiers.yaml#/Registry'
        - type: 'null'
      description: |
        Registry of the catalog holding the theme, written in full. Omitted or null means the
        referring catalog's registry, never an installation default. Naming one requires a
        `namespace`.
      example: exchange.epistola.app

CatalogPresetDto:
  type: object
  description: |
    A block style preset a release declares: what a block's `stylePreset` names,
    and the key a theme's `blockStylePresets` styles it under.
  required:
    - key
    - name
  properties:
    key:
      $ref: './identifiers.yaml#/PresetKey'
      description: The preset's key, unique within the release's presets
      example: muted
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name shown to authors
      example: Muted
    description:
      type: [string, 'null']
      maxLength: 500
      description: Optional description shown to authors
      example: Grey, smaller text for asides

CatalogDraftReleasePreview:
  type: object
  description: |
    The version a draft would be released as, from the kind of change it holds against its base. A
    change is breaking when something a caller of the base relies on is removed or narrowed: a
    resource, a variant, a value, or what a data contract or a stencil's interface accepts. A
    draft may be released as a higher version, never a lower one.
  required:
    - reasons
    - needed
    - suggested
  properties:
    base:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: The draft's base, which it is measured against; null when it has none
      example: "1.4.0"
    changeKind:
      type: [string, "null"]
      enum: [none, additive, breaking, null]
      description: |
        - `none`: fixes only, a patch.
        - `additive`: something added (a resource, a variant, a value, a widened data contract), a minor.
        - `breaking`: something removed or narrowed, a major.
        Null when there is nothing to compare with: no base, or the base kept no content.
      example: additive
    reasons:
      type: array
      description: Each change that makes it more than a fix, naming the resource, breaking first. Empty for a fix.
      items:
        type: string
      example: ["template 'reminder': added"]
    needed:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: |
        The version the changes need: the base raised by the kind of change (its patch, minor or
        major), or `1.0.0` without a base. Equal to `suggested` unless another release already has it.
    suggested:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: |
        The version releasing without a `version` gives: `needed`, or, when another release already
        has it, the next free version of the same kind (from `1.4.0`, a fix is `1.4.1`, or `1.4.2`
        when `1.4.1` exists; a breaking change is `2.0.0`, or `3.0.0` when `2.0.0` exists). The
        draft's `behind` is computed against it.

ReleaseCatalogDraftRequest:
  type: object
  properties:
    version:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        The version to release it as: one no release of the catalog has, above its base, and no
        lower than its changes need (`needed` in `previewCatalogDraftRelease`), or the request is
        refused with 400. Omitted: `suggested`.
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    acknowledgedBehind:
      type: array
      description: |
        The versions of the releases the author confirms this draft may be behind: their changes
        were applied by hand, or left out on purpose. Releasing a draft that is behind is refused
        with 409 unless this names every release it is behind for the version it is released as;
        naming others changes nothing.
      items:
        $ref: './identifiers.yaml#/ReleaseVersion'
      example: ["1.5.0"]
    releaseDependencies:
      type: boolean
      default: false
      description: |
        Release the drafts of other catalogs that this draft's dependency declarations name
        (`releaseId`), along with it. Each is released first, recursively (a draft it names in turn
        before it), as the version its changes need, with no notes, in the same transaction: all or
        nothing. Each is refused as releasing it alone would be (it is behind, it is not
        releasable, …), and then nothing is released. The new release pins the releases they
        became. False or omitted: a draft whose declarations name a draft is refused with 409
        (`release-dependencies-unreleased`).
      example: false

ReleaseCatalogDraftResponse:
  type: object
  required:
    - release
    - unchangedContent
    - draftsBehind
    - releasedDependencies
  properties:
    release:
      $ref: '#/CatalogReleaseDto'
      description: The release, now released, with the same `releaseId` and name it had as a draft
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false
    draftsBehind:
      type: array
      description: |
        The catalog's drafts this release puts behind, by name: its version is below the version
        each of them would be released as, so its changes do not reach them unless an author
        applies them by hand. Empty when none.
      items:
        type: string
        maxLength: 100
      example: ["Redesign 2027"]
    releasedDependencies:
      type: array
      description: |
        The drafts of other catalogs released along with this one (`releaseDependencies`), each as
        the release it became, in the order they were released: every catalog's dependencies
        before it. Empty when none.
      items:
        $ref: '#/ReleasedDependencyDto'

ReleasedDependencyDto:
  type: object
  description: A draft of another catalog released along with a release, and the release it became
  required:
    - registry
    - namespace
    - catalogKey
    - releaseId
    - version
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog, unique within its registry and namespace
      example: branding
    releaseId:
      $ref: './identifiers.yaml#/CatalogReleaseId'
      description: The draft that was released, which keeps its `releaseId` once released
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The version it was released as, which the new release pins

UnreleasedCatalogDependency:
  type: object
  description: |
    A draft of another catalog that a dependency declaration names, which must be released before
    a release can pin it
  required:
    - registry
    - namespace
    - catalogKey
    - releaseId
    - releaseName
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog depended on, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog depended on, unique within its registry and namespace
      example: branding
    releaseId:
      $ref: './identifiers.yaml#/CatalogReleaseId'
      description: The draft the declaration names
    releaseName:
      type: string
      maxLength: 100
      description: The draft's name
      example: House style 2027
