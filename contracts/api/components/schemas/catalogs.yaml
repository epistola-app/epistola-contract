CatalogDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - name
    - type
    - drafts
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog type
      example: AUTHORED
    releasedVersion:
      type: [string, "null"]
      description: >-
        The catalog's highest released version. For AUTHORED catalogs null until
        first released. For SUBSCRIBED catalogs the highest installed release.
      example: "1.4.0"
    drafts:
      type: array
      description: >-
        The catalog's open drafts: its next version first, then long-term work, oldest first. A draft
        has no number until it is released. Empty for a SUBSCRIBED catalog.
      items:
        $ref: '#/CatalogDraftSummary'
    fingerprint:
      type: [string, "null"]
      pattern: '^(v[1-9][0-9]*:)?[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the latest release's content (deterministic, excludes volatile
        fields), which identifies content independently of the version label. It names the
        algorithm that computed it, as the catalog archive does: `v5:` and lowercase SHA-256 hex.
        A bare hex value is a fingerprint recorded before contract 2.0 whose algorithm was not
        recorded; it cannot be checked against content. Null when never released or produced before
        fingerprinting.
      example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogUpgradeDiff:
  type: object
  description: >-
    Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's
    latest release. Each bucket entry is `"type/key"` (e.g. `theme/corporate`).
  required:
    - registry
    - namespace
    - catalogKey
    - newVersion
    - upgradeAvailable
    - added
    - removed
    - changed
    - unchanged
    - conflicts
    - blockedByConflicts
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    previousVersion:
      type: [string, "null"]
      description: Currently installed release version (null if unknown).
      example: "1.3.0"
    newVersion:
      type: string
      description: The source manifest's release version.
      example: "1.4.0"
    upgradeAvailable:
      type: boolean
      description: True when there is anything to apply (added/removed/changed).
      example: true
    added:
      type: array
      description: >-
        Newly published resources. Not installed on upgrade unless explicitly
        opted in (UI only — there is no upgrade action over REST).
      items:
        type: string
      example: ["template/cover-letter"]
    removed:
      type: array
      description: Resources the new release removed (deleted on upgrade).
      items:
        type: string
      example: ["theme/legacy"]
    changed:
      type: array
      description: Installed resources whose published content changed.
      items:
        type: string
      example: ["theme/corporate"]
    unchanged:
      type: array
      items:
        type: string
      example: ["attribute/language"]
    conflicts:
      type: array
      description: >-
        Human-readable cross-catalog references that would block the removal
        set. Non-empty ⇒ an upgrade would be rejected.
      items:
        type: string
      example: ["Theme 'legacy' is used by template 'Invoice' (catalog: billing)"]
    blockedByConflicts:
      type: boolean
      description: True when `conflicts` is non-empty.
      example: false

UpgradeCatalogResponse:
  type: object
  required:
    - newVersion
    - installResults
    - removedResources
    - aborted
  properties:
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    newVersion:
      type: string
      example: "1.4.0"
    installResults:
      type: array
      items:
        $ref: '#/CatalogInstallResultDto'
    removedResources:
      type: array
      items:
        $ref: '#/RemovedCatalogResourceDto'
    aborted:
      type: boolean
      description: True when one or more resource installs failed and the catalog was left unchanged.
      example: false

CatalogInstallResultDto:
  type: object
  required:
    - type
    - key
    - status
  properties:
    type:
      type: string
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: cover-letter
    status:
      type: string
      enum:
        - INSTALLED
        - UPDATED
        - SKIPPED
        - FAILED
      example: UPDATED
    errorMessage:
      type:
        - string
        - 'null'
      example: null

RemovedCatalogResourceDto:
  type: object
  required:
    - type
    - key
  properties:
    type:
      type: string
      example: theme
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: legacy

ReleaseDependencyDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - direct
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.3.0"
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogChangesDto:
  type: object
  description: How a catalog version differs from its base
  required:
    - releasable
    - dependenciesChanged
    - changes
  properties:
    base:
      type: [string, "null"]
      maxLength: 50
      description: The highest released version below this one; null when there is none
      example: "1.4.0"
    releasable:
      type: boolean
      description: |
        True when the version is a draft, no resource is `new` or `modified`, every stencil instance
        fits its stencil, every catalog a resource references is a declared
        dependency that resolves to a release, and something changed
      example: false
    dependenciesChanged:
      type: boolean
      description: True when the declared dependencies differ from the base's
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the base
        that is no longer in this version.
      example: modified

CatalogDependencyRequirement:
  type: object
  description: |
    Another catalog this catalog's resources may reference, and which of its releases they render
    with. A catalog declares each catalog it depends on once: every reference into that catalog
    resolves through this one declaration, so a release renders with exactly one release of it.
  required:
    - namespace
    - catalogKey
    - version
  properties:
    registry:
      type: [string, "null"]
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Omitted
        or null: the default registry, which the server configures. A response always names it in
        full.
      example: null
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    version:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Which releases of the catalog satisfy the dependency, as a version selector: see
        "Version selectors" in the API description. The highest installed release that satisfies
        it is used.
      example: "1.3.0"

CatalogDependencyDto:
  type: object
  description: A declared dependency, and the release it resolves to now
  required:
    - registry
    - namespace
    - catalogKey
    - version
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    version:
      type: string
      minLength: 1
      maxLength: 100
      description: The version selector as declared
      example: "1.3.0"
    resolvedVersion:
      type: [string, "null"]
      maxLength: 50
      description: |
        The release the version renders with: for a released version, the one it was cut with; for
        a draft, the highest installed release of the catalog
        that satisfies `version`. Null when none does, which blocks a release.
      example: "1.3.0"

CatalogDependencyListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDependencyDto'

UpdateCatalogDependenciesRequest:
  type: object
  description: The complete set of dependencies of the draft
  required:
    - dependencies
  properties:
    dependencies:
      type: array
      description: |
        Each catalog depended on, at most once. The catalog cannot depend on itself.
      items:
        $ref: '#/CatalogDependencyRequirement'

CatalogVersionStatus:
  type: string
  enum:
    - draft
    - released
  description: |
    - `draft`: editable. Never rendered by generation, deployed, exported or published.
    - `released`: immutable, and numbered. A draft is numbered when it is released; the next
      version then continues, as a draft on that release.
  example: draft

CatalogDraftSummary:
  type: object
  description: An open draft of a catalog, as `CatalogDto` lists it
  required:
    - draftId
    - isNext
  properties:
    draftId:
      type: string
      format: uuid
      description: The draft's id, which addresses it; the next version is also addressed as `next`
      example: 0193a6b2-7f4e-7c1d-9a2b-3c4d5e6f7a8b
    isNext:
      type: boolean
      description: The catalog's next version, where everyday work goes
      example: true
    name:
      type: [string, "null"]
      maxLength: 100
      description: Long-term work's name; null for the next version
      example: null

CatalogVersionDto:
  type: object
  description: |
    One version of a catalog: a draft or a released version (ADR 0002, amendment 2). A draft is
    numbered when it is released. Every AUTHORED catalog has one **next version** (`isNext`), the
    draft everyday work goes into and the only one that is released; any other draft is **long-term
    work**, named, kept apart until it is ready. Each draft is an independent copy, and nothing is
    merged between them.
  required:
    - version
    - status
    - isNext
    - dependencies
    - deployedTo
    - behind
  properties:
    version:
      type: [string, "null"]
      maxLength: 50
      description: A released version's SemVer number, unique in its catalog. Null for a draft.
      example: "2.0.0"
    draftId:
      type: [string, "null"]
      format: uuid
      description: |
        A draft's id, which addresses it (`…/versions/{draftId}`) for as long as it is open; the next
        version is also addressed as `next`. Null for a released version.
      example: null
    isNext:
      type: boolean
      description: The catalog's next version. False for long-term work and released versions.
      example: false
    name:
      type: [string, "null"]
      maxLength: 100
      description: Long-term work's name. Null for the next version, which is always "Next version", and for a released version.
      example: null
    status:
      $ref: '#/CatalogVersionStatus'
    base:
      type: [string, "null"]
      maxLength: 50
      description: |
        The released version this one started from, which its changes are measured against: for the
        next version, the release it continues on; for long-term work, the release it was started
        from (or the next version's base, when it was started from the next version). It does not
        move when other versions are released. Null when there is none.
      example: "1.4.0"
    createdFrom:
      type: [string, "null"]
      maxLength: 50
      description: |
        The released version a draft was copied from when that is not its base, or `next` when it was
        copied from the next version, unreleased changes included; null otherwise
      example: null
    createdAt:
      type: [string, "null"]
      format: date-time
      description: When the version was opened; null for a release installed from elsewhere
      example: "2026-10-01T09:00:00Z"
    behind:
      type: array
      description: |
        For a draft, the released versions above its base, lowest first. The draft does not contain
        their changes unless an author applied them by hand, which the server cannot tell. The next
        version continues on each release, so it is behind none in the ordinary course; long-term work
        is behind every release published since it started. Releasing a draft that is behind must
        acknowledge them (`acknowledgedBehind`). Empty when there are none, and for a released
        version.
      items:
        $ref: '#/BehindReleaseDto'
      example: []
    releasedAt:
      type: [string, "null"]
      format: date-time
      description: When the version was released; null for a draft
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      description: The release notes; null for a draft
      example: null
    fingerprint:
      type: [string, "null"]
      pattern: '^(v[1-9][0-9]*:)?[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the released content, naming the algorithm that computed it
        (`v5:` and lowercase SHA-256 hex), the same value as `release.fingerprint` in the release's
        catalog archive. A bare hex value is a fingerprint recorded before contract 2.0 whose
        algorithm was not recorded. Null for a draft.
      example: null
    contentRetained:
      type: [boolean, "null"]
      description: |
        For a released version, whether it kept its content. Only such a release can be rendered,
        deployed or exported; releases cut before releases retained content cannot. Null for a
        draft.
      example: null
    dependencies:
      type: array
      description: |
        For a released version, the release of every other catalog it renders with, resolved from
        the declared dependencies when it was released: the catalogs it declares directly, and the
        ones those depend on in turn. Each catalog appears once. Empty for a draft, whose declared
        dependencies are listed by `listCatalogDependencies`.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: Keys of the environments that serve this version; empty for a draft
      items:
        type: string
      example: []

BehindReleaseDto:
  type: object
  description: A released version a draft is behind, and what that release changed
  required:
    - version
    - changes
  properties:
    version:
      type: string
      maxLength: 50
      description: The released version
      example: "1.5.0"
    changes:
      type: array
      description: |
        The resources the release changed against its own base, which an author may need to apply
        to the draft by hand
      items:
        $ref: '#/ReleasedChangeDto'

ReleasedChangeDto:
  type: object
  description: A resource a release added, modified or removed against its base
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: The resource's key within its type
      example: invoice
    change:
      type: string
      enum:
        - added
        - modified
        - removed
      example: modified

CatalogVersionListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogVersionDto'
    page:
      $ref: './common.yaml#/PageMeta'

CreateCatalogDraftRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        What people call the work, e.g. "Redesign 2027": unique among the catalog's drafts, ignoring
        case, and not "Next version" or `next`.
      example: Redesign 2027
    from:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        A released version to start from, which becomes its base. Omitted: a copy of the next
        version, unreleased changes included, on the next version's base.
      example: null

PromoteCatalogDraftRequest:
  type: object
  properties:
    keepPreviousAs:
      type: [string, "null"]
      minLength: 1
      maxLength: 100
      description: |
        Keep the draft that was the next version as long-term work under this name. Omitted: it is
        discarded with its changes.
      example: null
    acknowledgedBehind:
      type: array
      description: |
        The releases published since the work started that the caller confirms it may leave out
        (their changes applied by hand, or left out on purpose). Promoting work that is behind
        releases is refused with 409 unless this names every one.
      items:
        type: string
        maxLength: 50
      example: ["1.4.1"]

RenameCatalogDraftRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: The work's new name, under the same rules as when it was started
      example: Redesign 2028

CatalogDraftReleasePreview:
  type: object
  description: |
    The number a draft would be released as (ADR 0002, amendment 2): from the kind of change it holds
    against the latest release, by ADR 0001's rule of what breaks. A release may be numbered higher,
    never lower.
  required:
    - reasons
    - suggested
  properties:
    latest:
      type: [string, "null"]
      maxLength: 50
      description: The latest release the draft is measured against; null when the catalog was never released
      example: "1.4.0"
    changeKind:
      type: [string, "null"]
      enum: [none, additive, breaking, null]
      description: |
        - `none`: fixes only, a patch.
        - `additive`: something added (a resource, a variant, a value, a widened data contract), a minor.
        - `breaking`: something removed or narrowed, a major.
        Null when there is nothing to compare with: never released, or the latest release kept no
        content.
      example: additive
    reasons:
      type: array
      description: Each change that makes it more than a fix, naming the resource, breaking first. Empty for a fix.
      items:
        type: string
      example: ["template 'reminder': added"]
    suggested:
      type: string
      maxLength: 50
      description: The lowest number that fits, which releasing without a `version` uses
      example: "1.5.0"

ReleaseCatalogDraftRequest:
  type: object
  properties:
    version:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The number to release it as: above every release, and no lower than its changes need
        (`previewCatalogDraftRelease`), or the request is refused with 400. Omitted: the number its
        changes need.
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    acknowledgedBehind:
      type: array
      description: |
        The released versions the author confirms this draft may be behind: their changes were
        applied by hand, or left out on purpose. Releasing a draft that is behind is refused with
        409 unless this names every version in its `behind`; naming others changes nothing.
      items:
        type: string
        maxLength: 50
      example: ["1.5.0"]

ReleaseCatalogDraftResponse:
  type: object
  required:
    - catalogVersion
    - unchangedContent
    - draftsBehind
  properties:
    catalogVersion:
      $ref: '#/CatalogVersionDto'
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false
    draftsBehind:
      type: array
      description: |
        The long-term work now behind this release, by name: its changes do not reach it. Empty when
        none. The next version continues on the release.
      items:
        type: string
        maxLength: 100
      example: ["Redesign 2027"]
