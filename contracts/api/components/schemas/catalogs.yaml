CatalogDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - name
    - type
    - drafts
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      $ref: '#/CatalogType'
    highestReleaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: >-
        The number of the catalog's highest release. For authored catalogs null until
        first released. For subscribed catalogs the highest installed release.
      example: "1.4.0"
    drafts:
      type: array
      description: >-
        The catalog's open drafts, oldest first. A draft has no number until it is released. Empty
        for a subscribed catalog, and for an authored catalog with no draft open.
      items:
        $ref: '#/CatalogDraftSummary'
    fingerprint:
      type: [string, "null"]
      pattern: '^v[1-9][0-9]*:[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the content of the highest release (`highestReleaseVersion`;
        deterministic, excludes volatile fields), which identifies content independently of the
        release number. It names the algorithm that computed it, as the catalog archive does:
        `v5:` and lowercase SHA-256 hex. Null when the catalog has no release.
      example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

AvailableCatalogReleases:
  type: object
  description: |
    The releases the source of a subscribed catalog offers that the tenant has not installed, older
    lines included, each with what it changed against the closest installed release below it and
    whether the releases it pins are present. Nothing is installed by reading it.
  required:
    - registry
    - namespace
    - catalogKey
    - available
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    available:
      type: array
      description: |
        Every release the source offers that the tenant has not installed, lowest first: not only
        those above the highest installed release, so a fix to an older line (`1.4.1`) is listed
        while the tenant has `2.0.0`. Empty when the tenant has every release the source offers.
      items:
        $ref: '#/AvailableReleaseDto'

AvailableReleaseDto:
  type: object
  description: A release the source of a subscribed catalog offers, which the tenant does not have
  required:
    - releaseVersion
    - comparedTo
    - changes
    - dependencies
  properties:
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release's number
    comparedTo:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The release `changes` is measured against: the closest release the tenant has installed
        numbered below this one. Null when the tenant has no release numbered below it.
      example: "1.4.0"
    changes:
      type: array
      description: |
        The resources the release added, modified or removed against `comparedTo`, not against the
        release before it; every resource it has, as added, when `comparedTo` is null
      items:
        $ref: '#/ReleasedChangeDto'
    dependencies:
      type: array
      description: |
        The releases of other catalogs the release pins (`catalogDependencies`), each with whether
        the tenant has it. Installing the release (`installCatalogRelease`) installs those it does
        not have first, fetched from their registries. Empty when the release pins none.
      items:
        $ref: '#/AvailableReleaseDependencyDto'

AvailableReleaseDependencyDto:
  type: object
  description: A release of another catalog that an available release pins
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - present
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release of the catalog depended on that the pin names
    present:
      type: boolean
      description: |
        True when the tenant has the release; false when installing the available release would have
        to fetch it, and is refused with `release-dependencies-missing` when it cannot
      example: true

InstallCatalogReleaseResponse:
  type: object
  description: |
    Result of installing a release of a subscribed catalog from its source: the release it
    installed, or found already present, reported as `ImportCatalogResponse` reports an import.
    Nothing was updated in place or removed. A schema of its own rather than
    `ImportCatalogResponse`: it carries no `catalogName` (the catalog exists already), and its
    dependency lists name the releases fetched from their sources rather than those an archive
    carries.
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - newlyInstalled
    - total
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release installed, which the tenant now has
    newlyInstalled:
      type: boolean
      description: |
        `true` when this request installed the release; `false` when the tenant already had it, with
        the same fingerprint, and nothing changed.
      example: true
    total:
      type: integer
      description: Number of resources in the release
      example: 7
    installedDependencies:
      type: array
      description: |
        The releases the release pins, directly or through other pins, that were fetched and
        installed, as `catalogKey vVERSION`, in the order it installed them. Empty when it installed
        none.
      items:
        type: string
      example: ["shared v1.1.0"]
    presentDependencies:
      type: array
      description: |
        The releases the release pins, directly or through other pins, that this tenant had already,
        with the same fingerprint, as `catalogKey vVERSION`. Empty when there are none.
      items:
        type: string
      example: []

ReleaseDependencyDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - direct
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release of the catalog the release renders with
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogChangesDto:
  type: object
  description: How a catalog version differs from its base
  required:
    - releasable
    - dependenciesChanged
    - changes
  properties:
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The release the draft started from (for a released version, the base of the draft it was);
        null when there is none
      example: "1.4.0"
    releasable:
      type: boolean
      description: |
        True when the version is a draft, no resource is `new` or `modified`, every stencil instance
        fits its stencil, every catalog a resource references is a declared dependency that pins a
        release the tenant has or names a draft (released along with it, `releaseDependencies`),
        and something changed
      example: false
    dependenciesChanged:
      type: boolean
      description: True when the declared dependencies differ from the base's
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the base
        that is no longer in this version.
      example: modified

CatalogDependencyRequirement:
  type: object
  description: |
    Another catalog this catalog's resources may reference, and the exact release of it they render
    with, or, in a draft, a draft of it. A catalog declares each catalog it depends on once: every
    reference into that catalog resolves through this one declaration, so a release renders with
    exactly the release it pins. Exactly one of `releaseVersion` and `versionId` is given (omitted
    and null are not given); neither, or both, is refused with 400.
  required:
    - namespace
    - catalogKey
  properties:
    registry:
      type: [string, "null"]
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Omitted
        or null: the default registry, which the server configures. A response always names it in
        full.
      example: null
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The exact release of the catalog depended on that this catalog renders with, never a range.
      example: "1.3.0"
    versionId:
      type: [string, "null"]
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 4
      maxLength: 36
      description: |
        A draft of the catalog depended on, by its `versionId` (a `CatalogVersionId`), an authored
        catalog of this tenant, that this draft renders with live, unreleased changes included. A release never pins a draft: releasing
        this draft is refused (`release-dependencies-unreleased`) unless the request releases the
        named draft along with it (`releaseDependencies`). Released on its own, the draft becomes a
        release, and the declaration then names that release.
      example: null

CatalogDependencyDto:
  type: object
  description: |
    A declared dependency and the exact release it pins, or, in a draft, the draft of it the draft
    uses
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - versionId
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The exact release of the catalog depended on that this catalog version renders with, as
        declared. Null when the declaration names a draft (`versionId`), and for a declaration that
        came from a catalog archive migrated from wire v7 or earlier, which pins no release:
        releasing the draft is refused until one is declared.
      example: "1.3.0"
    versionId:
      type: [string, "null"]
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 4
      maxLength: 36
      description: |
        The draft of the catalog depended on that this draft renders with, by its `versionId` (a
        `CatalogVersionId`), as declared. Null when
        the declaration pins a release, and always for a released version: a release never pins a
        draft.
      example: null

CatalogDependencyListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDependencyDto'

UpdateCatalogDependenciesRequest:
  type: object
  description: The complete set of dependencies of the draft
  required:
    - dependencies
  properties:
    dependencies:
      type: array
      description: |
        Each catalog depended on, at most once. The catalog cannot depend on itself, and a draft
        named must be a draft of the catalog the entry names.
      items:
        $ref: '#/CatalogDependencyRequirement'

ReleaseVersion:
  type: string
  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  maxLength: 50
  description: |
    The number of one released catalog version: a SemVer core version, `MAJOR.MINOR.PATCH` without
    leading zeros, unique in its catalog. Not a version range.
  example: "1.4.0"

CatalogVersionId:
  type: string
  pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  minLength: 4
  maxLength: 36
  description: |
    The id of one catalog version, opaque and assigned by the server, unique within its
    catalog. A version gets it when it is started as a draft and keeps it when it is released; a
    release installed by import or from its source gets one when it is installed. It
    addresses the version (`…/versions/{versionId}`) for as long as the version exists, as a draft
    and as a release alike: a released version is addressed by its `versionId` or by its number,
    interchangeably.

    Lowercase letters, digits and single hyphens, 4 to 36 characters. It never contains a dot, so
    it cannot be mistaken for a release number. A UUID fits; a server is recommended, not required,
    to use a short random id instead, about 8 characters from a lowercase alphabet without
    look-alikes (no `0`/`o`, `1`/`l`/`i`), such as `k7m2x9qa`, which people can read and type.
  example: k7m2x9qa

CatalogType:
  type: string
  enum:
    - authored
    - subscribed
  description: |
    Where a catalog's releases come from:

    - `authored`: the tenant writes it. Drafts are started, edited and released here.
    - `subscribed`: published elsewhere. The tenant only installs its releases, from an archive or
      from its source (`installCatalogRelease`), and its resources are read-only: every write to
      one is refused with 409.

    The import that creates a catalog names its type, and nothing changes it afterwards.
  example: authored

CatalogVersionStatus:
  type: string
  enum:
    - draft
    - released
  description: |
    - `draft`: editable. Never exported or published, and never matched by a version range;
      rendered only by preview and by an environment it is deployed to.
    - `released`: immutable, and numbered. A draft is numbered when it is released, and is then
      the released version at that number.
  example: draft

CatalogDraftSummary:
  type: object
  description: An open draft of a catalog, as `CatalogDto` lists it
  required:
    - versionId
    - name
  properties:
    versionId:
      $ref: '#/CatalogVersionId'
      description: The draft's id, which addresses it, and the release it becomes
    name:
      type: string
      maxLength: 100
      description: The draft's name, unique among the catalog's drafts
      example: Redesign 2027
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: The release the draft started from; null when the catalog had no release then
      example: "1.4.0"

CatalogVersionDto:
  type: object
  description: |
    One version of a catalog: a draft or a released version. A catalog has any number of
    drafts, each named, each on a fixed base, and each released on its own; a draft is numbered when
    it is released, and keeps its `versionId`. Each draft is an independent copy, and nothing is
    merged between them.
  required:
    - versionId
    - releaseVersion
    - status
    - dependencies
    - deployedTo
    - behind
  properties:
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: A released version's SemVer number, unique in its catalog. Null for a draft.
      example: "2.0.0"
    versionId:
      $ref: '#/CatalogVersionId'
      description: |
        The version's id, which addresses it (`…/versions/{versionId}`), as a draft and, once
        released, as the release, which its `releaseVersion` number addresses too.
    name:
      type: [string, "null"]
      maxLength: 100
      description: A draft's name, unique among the catalog's drafts. Null for a released version.
      example: null
    status:
      $ref: '#/CatalogVersionStatus'
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The release a draft started from, which its changes are measured against and its number
        follows from; for a released version, the base of the draft it was. It is fixed: it does
        not move when other versions are released. Null when the catalog had no release when the
        draft was started.
      example: "1.4.0"
    createdFrom:
      type: [string, "null"]
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 4
      maxLength: 36
      description: |
        The `versionId` of the draft this draft was copied from, unreleased changes included, when it was
        started from another draft (it then has that draft's base); null when it was started from a
        release, its base, or from nothing
      example: null
    createdAt:
      type: [string, "null"]
      format: date-time
      description: When the draft was started; null for a release installed from elsewhere
      example: "2026-10-01T09:00:00Z"
    behind:
      type: array
      description: |
        For a draft, the releases it is behind, lowest first: relative to the number releasing it
        now would give it (`previewCatalogDraftRelease`), each release that is numbered above its
        base and below that number, and each release published after the draft was started that is
        numbered below that number (other than its base). The draft does not contain their changes
        unless an author applied them by hand, which the server cannot tell. Releasing a draft that
        is behind must acknowledge them (`acknowledgedBehind`); releasing it as another number
        recomputes them for that number. Empty when there are none, and for a released version.
      items:
        $ref: '#/BehindReleaseDto'
      example: []
    releasedAt:
      type: [string, "null"]
      format: date-time
      description: When the version was released; null for a draft
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      description: The release notes; null for a draft
      example: null
    fingerprint:
      type: [string, "null"]
      pattern: '^v[1-9][0-9]*:[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the released content, naming the algorithm that computed it
        (`v5:` and lowercase SHA-256 hex), the same value as `release.fingerprint` in the release's
        catalog archive. Null for a draft.
      example: null
    dependencies:
      type: array
      description: |
        For a released version, the release of every other catalog it renders with, as its declared
        dependencies pinned them when it was released: the catalogs it declares directly, and the
        releases those pin in turn. Each catalog appears once. Empty for a draft, whose declared
        dependencies are listed by `listCatalogDependencies`.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: |
        Keys of the environments that serve this version (`deployCatalogVersion`), a release or a
        draft
      items:
        type: string
      example: []
    defaultTheme:
      $ref: '#/CatalogThemeReference'
      description: |
        The version's default theme. A render uses the variant's own theme when its
        template model overrides it (`themeRef`), else the theme its template names (part of the
        template's catalog content, `themeKey` in the archive; this API does not expose it), else
        this one. It is part of the version's content, as
        `catalog.defaultTheme` in its catalog archive, so a released version renders with exactly
        this theme. Absent when the version has none: such a template renders with the rendering
        defaults alone. No render reads a tenant-wide default theme.
    presets:
      type: array
      description: |
        The block style presets the version declares, as `catalog.presets` in its
        catalog archive: what a block's `stylePreset` may name, together with the presets of the
        catalogs it depends on. A theme's `blockStylePresets` supplies their styles. Empty when the
        version declares none; an editor then offers the presets its themes style.
      items:
        $ref: '#/CatalogPresetDto'
      example: []

BehindReleaseDto:
  type: object
  description: A released version a draft is behind, and what that release changed
  required:
    - releaseVersion
    - changes
  properties:
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The released version's number
    changes:
      type: array
      description: |
        The resources the release changed against its own base, which an author may need to apply
        to the draft by hand
      items:
        $ref: '#/ReleasedChangeDto'

ReleasedChangeDto:
  type: object
  description: |
    A resource a release added, modified or removed against another release: its base, for a release
    a draft is behind; `comparedTo`, for a release the source of a subscribed catalog offers
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: The resource's key within its type
      example: invoice
    change:
      type: string
      enum:
        - added
        - modified
        - removed
      example: modified

CatalogVersionListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogVersionDto'
    page:
      $ref: './common.yaml#/PageMeta'

CreateCatalogDraftRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        What people call the draft, e.g. "Redesign 2027" or "Fixes 1.4": unique among the catalog's
        drafts, ignoring case.
      example: Redesign 2027
    from:
      type: [string, "null"]
      pattern: '^([a-z0-9]+(-[a-z0-9]+)*|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
      minLength: 4
      maxLength: 50
      description: |
        What the draft starts as a copy of, by its `versionId` or, for a release, its number: a
        released version, which becomes its base; or another draft, unreleased changes included, on
        that draft's base.
        Omitted: the catalog's highest release, or nothing (an empty draft with no base) when the
        catalog has no release.
      example: "1.4.0"

UpdateCatalogDraftRequest:
  type: object
  description: |
    A partial update of a draft's own settings: its name, its default theme and its declared
    presets. A member that is omitted keeps its current value.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: The draft's new name, under the same rules as when it was started. Omitted keeps it.
      example: Redesign 2028
    defaultTheme:
      oneOf:
        - $ref: '#/CatalogThemeReference'
        - type: 'null'
      description: |
        The draft's new default theme: a theme in the catalog itself or in a catalog the draft
        declares as a dependency. Omitted keeps the current one; null clears it, so that a template
        that names no theme renders with the rendering defaults alone. A theme that cannot be found,
        or a catalog the draft does not declare, is refused with 400.
    presets:
      type: [array, 'null']
      description: |
        The draft's declared presets, replacing the current list as a whole. Omitted keeps the
        current list; null or an empty array clears it. Keys are unique within the list, which is
        refused with 400 otherwise.
      items:
        $ref: '#/CatalogPresetDto'

CatalogThemeReference:
  type: object
  description: |
    A reference to a theme from a catalog version, qualified like every other cross-catalog
    reference: an omitted `catalogKey`, `namespace` or `registry` means the referring catalog's own.
  required:
    - key
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the theme
      example: corporate
    catalogKey:
      type: [string, 'null']
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog holding the theme. Omitted or null means the referring catalog.
      example: brand
    namespace:
      type: [string, 'null']
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: |
        Namespace of the catalog holding the theme, within its registry. Omitted or null means the
        referring catalog's namespace.
      example: acme-corp
    registry:
      type: [string, 'null']
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog holding the theme, written in full. Omitted or null means the
        referring catalog's registry, never an installation default. Naming one requires a
        `namespace`.
      example: exchange.epistola.app

CatalogPresetDto:
  type: object
  description: |
    A block style preset a catalog version declares: what a block's `stylePreset` names,
    and the key a theme's `blockStylePresets` styles it under.
  required:
    - key
    - name
  properties:
    key:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 1
      maxLength: 50
      description: The preset's key, unique within the version's presets
      example: muted
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name shown to authors
      example: Muted
    description:
      type: [string, 'null']
      maxLength: 500
      description: Optional description shown to authors
      example: Grey, smaller text for asides

CatalogDraftReleasePreview:
  type: object
  description: |
    The number a draft would be released as, from the kind of change it holds against its base. A
    change is breaking when something a caller of the base relies on is removed or narrowed: a
    resource, a variant, a value, or what a data contract or a stencil's interface accepts. A
    release may be numbered higher, never lower.
  required:
    - reasons
    - needed
    - suggested
  properties:
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: The draft's base, which it is measured against; null when it has none
      example: "1.4.0"
    changeKind:
      type: [string, "null"]
      enum: [none, additive, breaking, null]
      description: |
        - `none`: fixes only, a patch.
        - `additive`: something added (a resource, a variant, a value, a widened data contract), a minor.
        - `breaking`: something removed or narrowed, a major.
        Null when there is nothing to compare with: no base, or the base kept no content.
      example: additive
    reasons:
      type: array
      description: Each change that makes it more than a fix, naming the resource, breaking first. Empty for a fix.
      items:
        type: string
      example: ["template 'reminder': added"]
    needed:
      $ref: '#/ReleaseVersion'
      description: |
        The number the changes need: the base raised by the kind of change (its patch, minor or
        major), or `1.0.0` without a base. Equal to `suggested` unless another release already has it.
    suggested:
      $ref: '#/ReleaseVersion'
      description: |
        The number releasing without a `releaseVersion` gives: `needed`, or, when another release already
        has it, the next free number of the same kind (from `1.4.0`, a fix is `1.4.1`, or `1.4.2`
        when `1.4.1` exists; a breaking change is `2.0.0`, or `3.0.0` when `2.0.0` exists). The
        draft's `behind` is computed against it.

ReleaseCatalogDraftRequest:
  type: object
  properties:
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The number to release it as: one no release of the catalog has, above its base, and no
        lower than its changes need (`needed` in `previewCatalogDraftRelease`), or the request is
        refused with 400. Omitted: `suggested`.
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    acknowledgedBehind:
      type: array
      description: |
        The released versions the author confirms this draft may be behind: their changes were
        applied by hand, or left out on purpose. Releasing a draft that is behind is refused with
        409 unless this names every version it is behind for the number it is released as; naming
        others changes nothing.
      items:
        $ref: '#/ReleaseVersion'
      example: ["1.5.0"]
    releaseDependencies:
      type: boolean
      default: false
      description: |
        Release the drafts of other catalogs that this draft's dependency declarations name
        (`versionId`), along with it. Each is released first, recursively (a draft it names in turn
        before it), numbered as its changes need with no notes, in the same transaction: all or
        nothing. Each is refused as releasing it alone would be (it is behind, it is not
        releasable, …), and then nothing is released. The new release pins the releases they
        became. False or omitted: a draft whose declarations name a draft is refused with 409
        (`release-dependencies-unreleased`).
      example: false

ReleaseCatalogDraftResponse:
  type: object
  required:
    - catalogVersion
    - unchangedContent
    - draftsBehind
    - releasedDependencies
  properties:
    catalogVersion:
      $ref: '#/CatalogVersionDto'
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false
    draftsBehind:
      type: array
      description: |
        The catalog's drafts this release puts behind, by name: its number is below the number
        each of them would be released as, so its changes do not reach them unless an author
        applies them by hand. Empty when none.
      items:
        type: string
        maxLength: 100
      example: ["Redesign 2027"]
    releasedDependencies:
      type: array
      description: |
        The drafts of other catalogs released along with this one (`releaseDependencies`), each as
        the release it became, in the order they were released: every catalog's dependencies
        before it. Empty when none.
      items:
        $ref: '#/ReleasedDependencyDto'

ReleasedDependencyDto:
  type: object
  description: A draft of another catalog released along with a release, and the release it became
  required:
    - registry
    - namespace
    - catalogKey
    - versionId
    - releaseVersion
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: branding
    versionId:
      $ref: '#/CatalogVersionId'
      description: The draft that was released, which now addresses the release it became
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release it became, which the new release pins

UnreleasedCatalogDependency:
  type: object
  description: |
    A draft of another catalog that a dependency declaration names, which must be released before
    a release can pin it
  required:
    - registry
    - namespace
    - catalogKey
    - versionId
    - draftName
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: branding
    versionId:
      $ref: '#/CatalogVersionId'
      description: The draft the declaration names
    draftName:
      type: string
      maxLength: 100
      description: The draft's name
      example: House style 2027
