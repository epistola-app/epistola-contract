CatalogDto:
  type: object
  required:
    - namespace
    - catalogKey
    - name
    - type
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: exchange.epistola.app/acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its namespace
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog type
      example: AUTHORED
    releasedVersion:
      type: [string, "null"]
      description: >-
        The catalog's current version label. For AUTHORED catalogs this is the
        latest released SemVer (null until first released). For SUBSCRIBED
        catalogs this is the installed release version.
      example: "1.4.0"
    fingerprint:
      type: [string, "null"]
      description: >-
        Lowercase hex SHA-256 of the catalog's canonical content
        (deterministic, excludes volatile fields). Identifies content
        independently of the version label. Null when never released / produced
        before fingerprinting.
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogUpgradeDiff:
  type: object
  description: >-
    Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's
    latest release. Each bucket entry is `"type/slug"` (e.g. `theme/corporate`).
  required:
    - namespace
    - catalogKey
    - newVersion
    - upgradeAvailable
    - added
    - removed
    - changed
    - unchanged
    - conflicts
    - blockedByConflicts
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: some-namespace
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its namespace
      example: letters
    previousVersion:
      type: [string, "null"]
      description: Currently installed release version (null if unknown).
      example: "1.3.0"
    newVersion:
      type: string
      description: The source manifest's release version.
      example: "1.4.0"
    upgradeAvailable:
      type: boolean
      description: True when there is anything to apply (added/removed/changed).
      example: true
    added:
      type: array
      description: >-
        Newly published resources. Not installed on upgrade unless explicitly
        opted in (UI only — there is no upgrade action over REST).
      items:
        type: string
      example: ["template/cover-letter"]
    removed:
      type: array
      description: Resources the new release removed (deleted on upgrade).
      items:
        type: string
      example: ["theme/legacy"]
    changed:
      type: array
      description: Installed resources whose published content changed.
      items:
        type: string
      example: ["theme/corporate"]
    unchanged:
      type: array
      items:
        type: string
      example: ["attribute/language"]
    conflicts:
      type: array
      description: >-
        Human-readable cross-catalog references that would block the removal
        set. Non-empty ⇒ an upgrade would be rejected.
      items:
        type: string
      example: ["Theme 'legacy' is used by template 'Invoice' (catalog: billing)"]
    blockedByConflicts:
      type: boolean
      description: True when `conflicts` is non-empty.
      example: false

ReleaseCatalogRequest:
  type: object
  required:
    - releaseVersion
  properties:
    releaseVersion:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      description: Strictly increasing SemVer release label.
      example: "1.4.0"
    notes:
      type:
        - string
        - 'null'
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.

ReleaseCatalogResponse:
  type: object
  required:
    - version
    - fingerprint
    - releasedAt
    - unchangedContent
  properties:
    version:
      type: string
      example: "1.4.0"
    fingerprint:
      type: string
      pattern: '^[a-f0-9]{64}$'
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    releasedAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false

UpgradeCatalogResponse:
  type: object
  required:
    - newVersion
    - installResults
    - removedResources
    - aborted
  properties:
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    newVersion:
      type: string
      example: "1.4.0"
    installResults:
      type: array
      items:
        $ref: '#/CatalogInstallResultDto'
    removedResources:
      type: array
      items:
        $ref: '#/RemovedCatalogResourceDto'
    aborted:
      type: boolean
      description: True when one or more resource installs failed and the catalog was left unchanged.
      example: false

CatalogInstallResultDto:
  type: object
  required:
    - type
    - slug
    - status
  properties:
    type:
      type: string
      example: template
    slug:
      type: string
      example: cover-letter
    status:
      type: string
      enum:
        - INSTALLED
        - UPDATED
        - SKIPPED
        - FAILED
      example: UPDATED
    errorMessage:
      type:
        - string
        - 'null'
      example: null

RemovedCatalogResourceDto:
  type: object
  required:
    - type
    - slug
  properties:
    type:
      type: string
      example: theme
    slug:
      type: string
      example: legacy

CatalogReleaseDto:
  type: object
  description: An immutable release of a catalog
  required:
    - releaseVersion
    - fingerprint
    - releasedAt
    - contentRetained
    - dependencies
    - deployedTo
  properties:
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.4.0"
    fingerprint:
      type: string
      pattern: '^[a-f0-9]{64}$'
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    releasedAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    contentRetained:
      type: boolean
      description: |
        Whether the release kept its content. Only such a release can be rendered, deployed or
        exported as released; releases cut before releases retained content cannot.
      example: true
    dependencies:
      type: array
      description: |
        The release of every other catalog this release renders with, resolved from the declared
        dependencies when it was cut: the catalogs it declares directly, and the ones those depend
        on in turn. Each catalog appears once. A release whose dependencies would need two releases
        of one catalog is refused.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: Slug identifiers of the environments that serve this release
      items:
        type: string
      example:
        - production

ReleaseDependencyDto:
  type: object
  required:
    - namespace
    - catalogKey
    - releaseVersion
    - direct
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog. A response always writes it in full (`exchange.epistola.app/some-namespace`, or a
        domain such as `acme.com`); a request may omit the default exchange (`some-namespace`).
      example: some-namespace
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its namespace
      example: letters
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.3.0"
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogReleaseListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogReleaseDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogChangesDto:
  type: object
  description: How the catalog's working copy differs from its latest release
  required:
    - releasable
    - dependenciesChanged
    - changes
  properties:
    latestRelease:
      type: [string, "null"]
      maxLength: 50
      description: The latest release; null when the catalog was never released
      example: "1.4.0"
    releasable:
      type: boolean
      description: |
        True when no resource is `new` or `modified`, no stencil instance is held back, every
        catalog a resource references is a declared dependency that resolves to a release, and
        something changed
      example: false
    dependenciesChanged:
      type: boolean
      description: True when the declared dependencies differ from the latest release's
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - slug
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    slug:
      type: string
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the latest
        release that is no longer in the working copy.
      example: modified
    heldBackInstances:
      type: integer
      minimum: 0
      description: For a stencil, how many of its instances are held back
      example: 0

CatalogDependencyRequirement:
  type: object
  description: |
    Another catalog this catalog's resources may reference, and which of its releases they render
    with. A catalog declares each catalog it depends on once: every reference into that catalog
    resolves through this one declaration, so a release renders with exactly one release of it.
  required:
    - namespace
    - catalogKey
    - version
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: |
        Namespace of the catalog depended on. A response always writes it in full
        (`exchange.epistola.app/some-namespace`, or a domain such as `acme.com`); a request may omit
        the default exchange (`some-namespace`).
      example: exchange.epistola.app/epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its namespace
      example: system
    version:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Which releases of the catalog satisfy the dependency, as a version selector: see
        "Version selectors" in the API description. The highest installed release that satisfies
        it is used.
      example: "1.3.0"

CatalogDependencyDto:
  type: object
  description: A declared dependency, and the release it resolves to now
  required:
    - namespace
    - catalogKey
    - version
  properties:
    namespace:
      type: string
      pattern: '^([a-z][a-z0-9]*(-[a-z0-9]+)*|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?)$'
      minLength: 3
      maxLength: 320
      description: Namespace of the catalog depended on, written in full
      example: exchange.epistola.app/epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its namespace
      example: system
    version:
      type: string
      minLength: 1
      maxLength: 100
      description: The version selector as declared
      example: "1.3.0"
    resolvedVersion:
      type: [string, "null"]
      maxLength: 50
      description: |
        The release the working copy renders with now: the highest installed release of the catalog
        that satisfies `version`. Null when none does, which blocks a release.
      example: "1.3.0"

CatalogDependencyListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDependencyDto'

UpdateCatalogDependenciesRequest:
  type: object
  description: The complete set of dependencies of the catalog's working copy
  required:
    - dependencies
  properties:
    dependencies:
      type: array
      description: |
        Each catalog depended on, at most once. The catalog cannot depend on itself.
      items:
        $ref: '#/CatalogDependencyRequirement'
