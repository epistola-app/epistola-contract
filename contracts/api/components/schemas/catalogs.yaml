CatalogDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - name
    - type
    - drafts
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog type
      example: AUTHORED
    releasedVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: >-
        The catalog's highest released version. For AUTHORED catalogs null until
        first released. For SUBSCRIBED catalogs the highest installed release.
      example: "1.4.0"
    drafts:
      type: array
      description: >-
        The catalog's open drafts, oldest first. A draft has no number until it is released. Empty
        for a SUBSCRIBED catalog, and for an AUTHORED catalog with no draft open.
      items:
        $ref: '#/CatalogDraftSummary'
    fingerprint:
      type: [string, "null"]
      pattern: '^(v[1-9][0-9]*:)?[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the latest release's content (deterministic, excludes volatile
        fields), which identifies content independently of the version label. It names the
        algorithm that computed it, as the catalog archive does: `v5:` and lowercase SHA-256 hex.
        A bare hex value is a fingerprint recorded before contract 2.0 whose algorithm was not
        recorded; it cannot be checked against content. Null when never released or produced before
        fingerprinting.
      example: v5:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogUpgradeDiff:
  type: object
  description: >-
    Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's
    latest release. Each bucket entry is `"type/key"` (e.g. `theme/corporate`).
  required:
    - registry
    - namespace
    - catalogKey
    - newVersion
    - upgradeAvailable
    - added
    - removed
    - changed
    - unchanged
    - conflicts
    - blockedByConflicts
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    previousVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: Currently installed release version (null if unknown).
      example: "1.3.0"
    newVersion:
      $ref: '#/ReleaseVersion'
      description: The source manifest's release version.
    upgradeAvailable:
      type: boolean
      description: True when there is anything to apply (added/removed/changed).
      example: true
    added:
      type: array
      description: >-
        Newly published resources. Not installed on upgrade unless explicitly
        opted in (UI only — there is no upgrade action over REST).
      items:
        type: string
      example: ["template/cover-letter"]
    removed:
      type: array
      description: Resources the new release removed (deleted on upgrade).
      items:
        type: string
      example: ["theme/legacy"]
    changed:
      type: array
      description: Installed resources whose published content changed.
      items:
        type: string
      example: ["theme/corporate"]
    unchanged:
      type: array
      items:
        type: string
      example: ["attribute/language"]
    conflicts:
      type: array
      description: >-
        Human-readable cross-catalog references that would block the removal
        set. Non-empty ⇒ an upgrade would be rejected.
      items:
        type: string
      example: ["Theme 'legacy' is used by template 'Invoice' (catalog: billing)"]
    blockedByConflicts:
      type: boolean
      description: True when `conflicts` is non-empty.
      example: false

UpgradeCatalogResponse:
  type: object
  required:
    - newVersion
    - installResults
    - removedResources
    - aborted
  properties:
    previousVersion:
      type:
        - string
        - 'null'
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      example: "1.3.0"
    newVersion:
      $ref: '#/ReleaseVersion'
    installResults:
      type: array
      items:
        $ref: '#/CatalogInstallResultDto'
    removedResources:
      type: array
      items:
        $ref: '#/RemovedCatalogResourceDto'
    aborted:
      type: boolean
      description: True when one or more resource installs failed and the catalog was left unchanged.
      example: false

CatalogInstallResultDto:
  type: object
  required:
    - type
    - key
    - status
  properties:
    type:
      type: string
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: cover-letter
    status:
      type: string
      enum:
        - INSTALLED
        - UPDATED
        - SKIPPED
        - FAILED
      example: UPDATED
    errorMessage:
      type:
        - string
        - 'null'
      example: null

RemovedCatalogResourceDto:
  type: object
  required:
    - type
    - key
  properties:
    type:
      type: string
      example: theme
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: legacy

ReleaseDependencyDto:
  type: object
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - direct
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: letters
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release of the catalog the release renders with
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogChangesDto:
  type: object
  description: How a catalog version differs from its base
  required:
    - releasable
    - dependenciesChanged
    - changes
  properties:
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The release the draft started from (for a released version, the base of the draft it was);
        null when there is none
      example: "1.4.0"
    releasable:
      type: boolean
      description: |
        True when the version is a draft, no resource is `new` or `modified`, every stencil instance
        fits its stencil, every catalog a resource references is a declared dependency that pins a
        release the tenant has or names a draft (released along with it, `releaseDependencies`),
        and something changed
      example: false
    dependenciesChanged:
      type: boolean
      description: True when the declared dependencies differ from the base's
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the base
        that is no longer in this version.
      example: modified

CatalogDependencyRequirement:
  type: object
  description: |
    Another catalog this catalog's resources may reference, and the exact release of it they render
    with, or, in a draft, a draft of it. A catalog declares each catalog it depends on once: every
    reference into that catalog resolves through this one declaration, so a release renders with
    exactly the release it pins. Exactly one of `releaseVersion` and `draftId` is given (omitted and
    null are not given); neither, or both, is refused with 400.
  required:
    - namespace
    - catalogKey
  properties:
    registry:
      type: [string, "null"]
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Omitted
        or null: the default registry, which the server configures. A response always names it in
        full.
      example: null
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The exact release of the catalog depended on that this catalog renders with, not a range.
        Ranges (such as `^1.0.0`) may come in a later 2.x, as an addition.
      example: "1.3.0"
    draftId:
      type: [string, "null"]
      format: uuid
      description: |
        A draft of the catalog depended on, an AUTHORED catalog of this tenant, that this draft
        renders with live, unreleased changes included. A release never pins a draft: releasing
        this draft is refused (`release-dependencies-unreleased`) unless the request releases the
        named draft along with it (`releaseDependencies`). Released on its own, the draft becomes a
        release, and the declaration then names that release.
      example: null

CatalogDependencyDto:
  type: object
  description: |
    A declared dependency and the exact release it pins, or, in a draft, the draft of it the draft
    uses
  required:
    - registry
    - namespace
    - catalogKey
    - releaseVersion
    - draftId
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on: the exchange or domain its namespace lives in. Always
        written in full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: epistola
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: system
    releaseVersion:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The exact release of the catalog depended on that this catalog version renders with, as
        declared. Null when the declaration names a draft (`draftId`), and for a declaration that
        came from a catalog archive migrated from wire v7 or earlier, which pins no release:
        releasing the draft is refused until one is declared.
      example: "1.3.0"
    draftId:
      type: [string, "null"]
      format: uuid
      description: |
        The draft of the catalog depended on that this draft renders with, as declared. Null when
        the declaration pins a release, and always for a released version: a release never pins a
        draft.
      example: null

CatalogDependencyListResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDependencyDto'

UpdateCatalogDependenciesRequest:
  type: object
  description: The complete set of dependencies of the draft
  required:
    - dependencies
  properties:
    dependencies:
      type: array
      description: |
        Each catalog depended on, at most once. The catalog cannot depend on itself, and a draft
        named must be a draft of the catalog the entry names.
      items:
        $ref: '#/CatalogDependencyRequirement'

ReleaseVersion:
  type: string
  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  maxLength: 50
  description: |
    The number of one released catalog version: a SemVer core version, `MAJOR.MINOR.PATCH` without
    leading zeros, unique in its catalog. Not a version selector.
  example: "1.4.0"

CatalogVersionStatus:
  type: string
  enum:
    - draft
    - released
  description: |
    - `draft`: editable. Never rendered by generation, deployed, exported or published.
    - `released`: immutable, and numbered. A draft is numbered when it is released, and is then
      the released version at that number.
  example: draft

CatalogDraftSummary:
  type: object
  description: An open draft of a catalog, as `CatalogDto` lists it
  required:
    - draftId
    - name
  properties:
    draftId:
      type: string
      format: uuid
      description: The draft's id, which addresses it
      example: 0193a6b2-7f4e-7c1d-9a2b-3c4d5e6f7a8b
    name:
      type: string
      maxLength: 100
      description: The draft's name, unique among the catalog's drafts
      example: Redesign 2027
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: The release the draft started from; null when the catalog had no release then
      example: "1.4.0"

CatalogVersionDto:
  type: object
  description: |
    One version of a catalog: a draft or a released version (ADR 0002). A catalog has any number of
    drafts, each named, each on a fixed base, and each released on its own; a draft is numbered when
    it is released. Each draft is an independent copy, and nothing is merged between them.
  required:
    - version
    - status
    - dependencies
    - deployedTo
    - behind
  properties:
    version:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: A released version's SemVer number, unique in its catalog. Null for a draft.
      example: "2.0.0"
    draftId:
      type: [string, "null"]
      format: uuid
      description: |
        A draft's id, which addresses it (`…/versions/{draftId}`) for as long as it is a draft.
        Once the draft is released the id addresses nothing (404); the release is addressed by its
        number. Null for a released version.
      example: null
    name:
      type: [string, "null"]
      maxLength: 100
      description: A draft's name, unique among the catalog's drafts. Null for a released version.
      example: null
    status:
      $ref: '#/CatalogVersionStatus'
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The release a draft started from, which its changes are measured against and its number
        follows from; for a released version, the base of the draft it was. It is fixed: it does
        not move when other versions are released. Null when the catalog had no release when the
        draft was started.
      example: "1.4.0"
    createdFrom:
      type: [string, "null"]
      format: uuid
      description: |
        The id of the draft this draft was copied from, unreleased changes included, when it was
        started from another draft (it then has that draft's base); null when it was started from a
        release, its base, or from nothing
      example: null
    createdAt:
      type: [string, "null"]
      format: date-time
      description: When the draft was started; null for a release installed from elsewhere
      example: "2026-10-01T09:00:00Z"
    behind:
      type: array
      description: |
        For a draft, the releases it is behind, lowest first: relative to the number releasing it
        now would give it (`previewCatalogDraftRelease`), each release that is numbered above its
        base and below that number, and each release published after the draft was started that is
        numbered below that number (other than its base). The draft does not contain their changes
        unless an author applied them by hand, which the server cannot tell. Releasing a draft that
        is behind must acknowledge them (`acknowledgedBehind`); releasing it as another number
        recomputes them for that number. Empty when there are none, and for a released version.
      items:
        $ref: '#/BehindReleaseDto'
      example: []
    releasedAt:
      type: [string, "null"]
      format: date-time
      description: When the version was released; null for a draft
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      description: The release notes; null for a draft
      example: null
    fingerprint:
      type: [string, "null"]
      pattern: '^(v[1-9][0-9]*:)?[0-9a-f]{64}$'
      description: |
        The canonical fingerprint of the released content, naming the algorithm that computed it
        (`v5:` and lowercase SHA-256 hex), the same value as `release.fingerprint` in the release's
        catalog archive. A bare hex value is a fingerprint recorded before contract 2.0 whose
        algorithm was not recorded. Null for a draft.
      example: null
    dependencies:
      type: array
      description: |
        For a released version, the release of every other catalog it renders with, as its declared
        dependencies pinned them when it was released: the catalogs it declares directly, and the
        releases those pin in turn. Each catalog appears once. Empty for a draft, whose declared
        dependencies are listed by `listCatalogDependencies`.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: Keys of the environments that serve this version; empty for a draft
      items:
        type: string
      example: []

BehindReleaseDto:
  type: object
  description: A released version a draft is behind, and what that release changed
  required:
    - version
    - changes
  properties:
    version:
      $ref: '#/ReleaseVersion'
      description: The released version
    changes:
      type: array
      description: |
        The resources the release changed against its own base, which an author may need to apply
        to the draft by hand
      items:
        $ref: '#/ReleasedChangeDto'

ReleasedChangeDto:
  type: object
  description: A resource a release added, modified or removed against its base
  required:
    - type
    - key
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: The resource's key within its type
      example: invoice
    change:
      type: string
      enum:
        - added
        - modified
        - removed
      example: modified

CatalogVersionListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogVersionDto'
    page:
      $ref: './common.yaml#/PageMeta'

CreateCatalogDraftRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        What people call the draft, e.g. "Redesign 2027" or "Fixes 1.4": unique among the catalog's
        drafts, ignoring case.
      example: Redesign 2027
    from:
      type: [string, "null"]
      pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
      maxLength: 50
      description: |
        What the draft starts as a copy of: a released version, by its number, which becomes its
        base; or another draft, by its `draftId`, unreleased changes included, on that draft's base.
        Omitted: the catalog's highest release, or nothing (an empty draft with no base) when the
        catalog has no release.
      example: "1.4.0"

RenameCatalogDraftRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: The draft's new name, under the same rules as when it was started
      example: Redesign 2028

CatalogDraftReleasePreview:
  type: object
  description: |
    The number a draft would be released as (ADR 0002): from the kind of change it holds against
    its base, by ADR 0001's rule of what breaks. A release may be numbered higher, never lower.
  required:
    - reasons
    - needed
    - suggested
  properties:
    base:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: The draft's base, which it is measured against; null when it has none
      example: "1.4.0"
    changeKind:
      type: [string, "null"]
      enum: [none, additive, breaking, null]
      description: |
        - `none`: fixes only, a patch.
        - `additive`: something added (a resource, a variant, a value, a widened data contract), a minor.
        - `breaking`: something removed or narrowed, a major.
        Null when there is nothing to compare with: no base, or the base kept no content.
      example: additive
    reasons:
      type: array
      description: Each change that makes it more than a fix, naming the resource, breaking first. Empty for a fix.
      items:
        type: string
      example: ["template 'reminder': added"]
    needed:
      $ref: '#/ReleaseVersion'
      description: |
        The number the changes need: the base raised by the kind of change (its patch, minor or
        major), or `1.0.0` without a base. Equal to `suggested` unless another release already has it.
    suggested:
      $ref: '#/ReleaseVersion'
      description: |
        The number releasing without a `version` gives: `needed`, or, when another release already
        has it, the next free number of the same kind (from `1.4.0`, a fix is `1.4.1`, or `1.4.2`
        when `1.4.1` exists; a breaking change is `2.0.0`, or `3.0.0` when `2.0.0` exists). The
        draft's `behind` is computed against it.

ReleaseCatalogDraftRequest:
  type: object
  properties:
    version:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: |
        The number to release it as: one no release of the catalog has, above its base, and no
        lower than its changes need (`needed` in `previewCatalogDraftRelease`), or the request is
        refused with 400. Omitted: `suggested`.
      example: null
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    acknowledgedBehind:
      type: array
      description: |
        The released versions the author confirms this draft may be behind: their changes were
        applied by hand, or left out on purpose. Releasing a draft that is behind is refused with
        409 unless this names every version it is behind for the number it is released as; naming
        others changes nothing.
      items:
        $ref: '#/ReleaseVersion'
      example: ["1.5.0"]
    releaseDependencies:
      type: boolean
      default: false
      description: |
        Release the drafts of other catalogs that this draft's dependency declarations name
        (`draftId`), along with it. Each is released first, recursively (a draft it names in turn
        before it), numbered as its changes need with no notes, in the same transaction: all or
        nothing. Each is refused as releasing it alone would be (it is behind, it is not
        releasable, …), and then nothing is released. The new release pins the releases they
        became. False or omitted: a draft whose declarations name a draft is refused with 409
        (`release-dependencies-unreleased`).
      example: false

ReleaseCatalogDraftResponse:
  type: object
  required:
    - catalogVersion
    - unchangedContent
    - draftsBehind
    - releasedDependencies
  properties:
    catalogVersion:
      $ref: '#/CatalogVersionDto'
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false
    draftsBehind:
      type: array
      description: |
        The catalog's drafts this release puts behind, by name: its number is below the number
        each of them would be released as, so its changes do not reach them unless an author
        applies them by hand. Empty when none.
      items:
        type: string
        maxLength: 100
      example: ["Redesign 2027"]
    releasedDependencies:
      type: array
      description: |
        The drafts of other catalogs released along with this one (`releaseDependencies`), each as
        the release it became, in the order they were released: every catalog's dependencies
        before it. Empty when none.
      items:
        $ref: '#/ReleasedDependencyDto'

ReleasedDependencyDto:
  type: object
  description: A draft of another catalog released along with a release, and the release it became
  required:
    - registry
    - namespace
    - catalogKey
    - draftId
    - releaseVersion
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog, unique within its registry and namespace
      example: branding
    draftId:
      type: string
      format: uuid
      description: The draft that was released, which no longer addresses anything
      example: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
    releaseVersion:
      $ref: '#/ReleaseVersion'
      description: The release it became, which the new release pins

UnreleasedCatalogDependency:
  type: object
  description: |
    A draft of another catalog that a dependency declaration names, which must be released before
    a release can pin it
  required:
    - registry
    - namespace
    - catalogKey
    - draftId
    - draftName
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog depended on. Always written in full, the default registry by its
        name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog depended on, within its registry
      example: acme-corp
    catalogKey:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the catalog depended on, unique within its registry and namespace
      example: branding
    draftId:
      type: string
      format: uuid
      description: The draft the declaration names
      example: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
    draftName:
      type: string
      maxLength: 100
      description: The draft's name
      example: House style 2027
