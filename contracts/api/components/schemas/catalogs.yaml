CatalogDto:
  type: object
  required:
    - slug
    - name
    - type
  properties:
    slug:
      type: string
      description: |
        Catalog slug identifier
      example: municipality-demo
    name:
      type: string
      description: Display name
      example: Municipality Demo Catalog
    description:
      type: [string, "null"]
      description: Optional description
    type:
      type: string
      enum: [AUTHORED, SUBSCRIBED]
      description: Catalog type
      example: AUTHORED
    releasedVersion:
      type: [string, "null"]
      description: >-
        The catalog's current version label. For AUTHORED catalogs this is the
        latest released SemVer (null until first released). For SUBSCRIBED
        catalogs this is the installed release version.
      example: "1.4.0"
    fingerprint:
      type: [string, "null"]
      description: >-
        Lowercase hex SHA-256 of the catalog's canonical content
        (deterministic, excludes volatile fields). Identifies content
        independently of the version label. Null when never released / produced
        before fingerprinting.
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70

CatalogListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogUpgradeDiff:
  type: object
  description: >-
    Source-vs-source preview of upgrading a SUBSCRIBED catalog to its source's
    latest release. Each bucket entry is `"type/slug"` (e.g. `theme/corporate`).
  required:
    - catalogId
    - newVersion
    - upgradeAvailable
    - added
    - removed
    - changed
    - unchanged
    - conflicts
    - blockedByConflicts
  properties:
    catalogId:
      type: string
      description: Catalog slug.
      example: municipality-demo
    previousVersion:
      type: [string, "null"]
      description: Currently installed release version (null if unknown).
      example: "1.3.0"
    newVersion:
      type: string
      description: The source manifest's release version.
      example: "1.4.0"
    upgradeAvailable:
      type: boolean
      description: True when there is anything to apply (added/removed/changed).
      example: true
    added:
      type: array
      description: >-
        Newly published resources. Not installed on upgrade unless explicitly
        opted in (UI only — there is no upgrade action over REST).
      items:
        type: string
      example: ["template/cover-letter"]
    removed:
      type: array
      description: Resources the new release removed (deleted on upgrade).
      items:
        type: string
      example: ["theme/legacy"]
    changed:
      type: array
      description: Installed resources whose published content changed.
      items:
        type: string
      example: ["theme/corporate"]
    unchanged:
      type: array
      items:
        type: string
      example: ["attribute/language"]
    conflicts:
      type: array
      description: >-
        Human-readable cross-catalog references that would block the removal
        set. Non-empty ⇒ an upgrade would be rejected.
      items:
        type: string
      example: ["Theme 'legacy' is used by template 'Invoice' (catalog: billing)"]
    blockedByConflicts:
      type: boolean
      description: True when `conflicts` is non-empty.
      example: false

ReleaseCatalogRequest:
  type: object
  required:
    - releaseVersion
  properties:
    releaseVersion:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      description: Strictly increasing SemVer release label.
      example: "1.4.0"
    notes:
      type:
        - string
        - 'null'
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.

ReleaseCatalogResponse:
  type: object
  required:
    - version
    - fingerprint
    - releasedAt
    - unchangedContent
  properties:
    version:
      type: string
      example: "1.4.0"
    fingerprint:
      type: string
      pattern: '^[a-f0-9]{64}$'
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    releasedAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"
    unchangedContent:
      type: boolean
      description: True when the release content matches a previous release fingerprint.
      example: false

UpgradeCatalogResponse:
  type: object
  required:
    - newVersion
    - installResults
    - removedResources
    - aborted
  properties:
    previousVersion:
      type:
        - string
        - 'null'
      example: "1.3.0"
    newVersion:
      type: string
      example: "1.4.0"
    installResults:
      type: array
      items:
        $ref: '#/CatalogInstallResultDto'
    removedResources:
      type: array
      items:
        $ref: '#/RemovedCatalogResourceDto'
    aborted:
      type: boolean
      description: True when one or more resource installs failed and the catalog was left unchanged.
      example: false

CatalogInstallResultDto:
  type: object
  required:
    - type
    - slug
    - status
  properties:
    type:
      type: string
      example: template
    slug:
      type: string
      example: cover-letter
    status:
      type: string
      enum:
        - INSTALLED
        - UPDATED
        - SKIPPED
        - FAILED
      example: UPDATED
    errorMessage:
      type:
        - string
        - 'null'
      example: null

RemovedCatalogResourceDto:
  type: object
  required:
    - type
    - slug
  properties:
    type:
      type: string
      example: theme
    slug:
      type: string
      example: legacy

CatalogReleaseDto:
  type: object
  description: An immutable release of a catalog
  required:
    - releaseVersion
    - fingerprint
    - releasedAt
    - contentRetained
    - dependencies
    - deployedTo
  properties:
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.4.0"
    fingerprint:
      type: string
      pattern: '^[a-f0-9]{64}$'
      example: 9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    releasedAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"
    notes:
      type: [string, "null"]
      maxLength: 4000
      example: Compatibility updates for the municipality catalog.
    contentRetained:
      type: boolean
      description: |
        Whether the release kept its content. Only such a release can be rendered, deployed or
        exported as released; releases cut before releases retained content cannot.
      example: true
    dependencies:
      type: array
      description: |
        The release of every other catalog this release renders with, recorded when it was cut:
        the catalogs its resources reference directly, and the ones those reach in turn.
      items:
        $ref: '#/ReleaseDependencyDto'
    deployedTo:
      type: array
      description: Slug identifiers of the environments that serve this release
      items:
        type: string
      example:
        - production

ReleaseDependencyDto:
  type: object
  required:
    - catalogId
    - releaseVersion
    - direct
  properties:
    catalogId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: system
    releaseVersion:
      type: string
      maxLength: 50
      example: "1.3.0"
    direct:
      type: boolean
      description: True when the release's own resources reference the catalog; false when only reached through another dependency
      example: true

CatalogReleaseListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/CatalogReleaseDto'
    page:
      $ref: './common.yaml#/PageMeta'

CatalogChangesDto:
  type: object
  description: How the catalog's working copy differs from its latest release
  required:
    - releasable
    - changes
  properties:
    latestRelease:
      type: [string, "null"]
      maxLength: 50
      description: The latest release; null when the catalog was never released
      example: "1.4.0"
    releasable:
      type: boolean
      description: True when no resource is `new` or `modified`, no stencil instance is held back, and something changed
      example: false
    changes:
      type: array
      items:
        $ref: '#/ResourceChangeDto'

ResourceChangeDto:
  type: object
  required:
    - type
    - slug
    - change
  properties:
    type:
      type: string
      description: The resource type, as the portable catalog format names it
      example: template
    slug:
      type: string
      example: monthly-invoice
    change:
      type: string
      enum:
        - new
        - modified
        - ready
        - removed
      description: |
        `new`, `modified` and `ready` as in ResourceStatus; `removed` for a resource in the latest
        release that is no longer in the working copy.
      example: modified
    heldBackInstances:
      type: integer
      minimum: 0
      description: For a stencil, how many of its instances are held back
      example: 0
