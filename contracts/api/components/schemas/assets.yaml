AssetDto:
  type: object
  description: Asset metadata. Binary content is fetched separately through the content endpoint.
  required:
    - key
    - tenantId
    - catalog
    - catalogType
    - readOnly
    - name
    - mediaType
    - mediaCategory
    - sizeBytes
    - createdAt
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 50
      description: |
        The asset's public key, unique within its catalog. This is the value that appears in
        template content as `props.assetId` and travels in a catalog export as the asset's slug.

        Historically every asset key was a generated UUID, and it still is for assets this
        installation creates. A catalog published elsewhere may name its assets readably —
        `municipality-mark` — and such an asset has a key that is not a UUID.
      example: "4a64f2f9-2c7a-4d26-9cf7-d34c7ce92280"
    id:
      type: string
      format: uuid
      deprecated: true
      description: |
        **Deprecated — use `key`.** The same value, typed as a UUID.

        The name was always wrong: this is an asset's public key, not its identity. Every other
        catalog resource is addressed by a readable key, and assets were the exception only because
        theirs was generated.

        Every asset an Epistola Suite creates has a UUID key and reports it here unchanged. The
        field is **absent** for an asset whose key is not a UUID, and a client still reading `id`
        rather than `key` will fail to deserialize such an asset — a required UUID is missing. Note
        what it takes to reach one: a catalog that names its assets readably, installed from a
        registry. No released Epistola Suite can install a catalog from a registry at all, so no
        existing deployment holds such an asset, and a client that adopts `key` before that
        capability ships never meets the case.

        Operations that address an asset by path still take a UUID, so an asset with a readable key
        cannot yet be fetched or deleted through them. Widening those parameters changes the type
        generated clients pass and is therefore held for a major version.
      example: "4a64f2f9-2c7a-4d26-9cf7-d34c7ce92280"
    tenantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      example: acme-corp
    catalog:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      description: Catalog that owns the asset.
      example: default
    catalogType:
      type: string
      enum:
        - AUTHORED
        - SUBSCRIBED
      example: AUTHORED
    readOnly:
      type: boolean
      description: True when the asset belongs to a SUBSCRIBED catalog.
      example: false
    name:
      type: string
      minLength: 1
      maxLength: 255
      example: logo.svg
    mediaType:
      type: string
      description: MIME type from the deployment's asset type registry.
      example: image/svg+xml
    mediaCategory:
      type: string
      enum:
        - IMAGE
        - FONT
        - OTHER
      description: Broad behavioral class derived from `mediaType`.
      example: IMAGE
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
      maximum: 5242880
      example: 12482
    width:
      type:
        - integer
        - 'null'
      minimum: 1
      description: Image width in pixels when known; null for SVG and non-images.
      example: 512
    height:
      type:
        - integer
        - 'null'
      minimum: 1
      description: Image height in pixels when known; null for SVG and non-images.
      example: 128
    createdAt:
      type: string
      format: date-time
      example: "2026-07-23T10:00:00Z"

AssetListResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/AssetDto'
    page:
      $ref: './common.yaml#/PageMeta'
