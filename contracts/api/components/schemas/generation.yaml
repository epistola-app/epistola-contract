        total: 1
        completedCount: 1
        failedCount: 0
        errorMessage: null
        createdAt: "2026-02-01T08:00:00Z"
        startedAt: "2026-02-01T08:00:01Z"
        completedAt: "2026-02-01T08:00:03Z"
        progressPercentage: 100.0
    page:
      number: 0
      size: 20
      total: 1
      totalPages: 1

