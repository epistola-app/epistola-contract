      description: |
        The id of the release rendered (`CatalogReleaseId`), always given from 2.0 on:
        a released release's, which it had as a draft, or a draft's, when an
        environment renders one live (`deployCatalogRelease`; `version` is then null).
        Null only for one made before 2.0, which no release made.
      example: k3x9q2ab
    releaseName:
      type: [string, "null"]
      maxLength: 100
      description: |
        The name of the release rendered, at render time: a draft's, or a released release's, which
        keeps the name it had as a draft. Null for a release that has none, as one installed by
        import or from its source.
      example: Redesign 2027
    filename:
      type: string
      description: Filename of the document
      example: "invoice-2026-001.pdf"
    correlationId:
      type: [string, "null"]
      description: Client-provided ID for tracking documents across systems
      example: "order-7890"
    contentType:
      type: string
      description: MIME type of the document
      example: "application/pdf"
    sizeBytes:
      type: integer
      format: int64
      description: Size of the document in bytes
      example: 184320
    createdAt:
      type: string
      format: date-time
      description: When the document was generated
      example: "2026-02-01T08:00:03Z"
    createdBy:
      type: [string, "null"]
      description: |
        Who requested the document: the `id` of the consumer whose request generated it (see the
        Consumers API, experimental). It is kept when that consumer is deleted. Null when the
        server records none.
      example: null
  example:
    documentId: "770e8400-e29b-41d4-a716-446655440002"
    tenantKey: acme-corp
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    templateKey: invoice
    variantKey: english
    version: "1.4.0"
    filename: "invoice-2026-001.pdf"
    correlationId: "order-7890"
    contentType: "application/pdf"
    sizeBytes: 184320
    createdAt: "2026-02-01T08:00:03Z"
    createdBy: null

DocumentListResponse:
  description: Paginated list of documents
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of documents on this page
      items:
        $ref: '#/DocumentDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - documentId: "770e8400-e29b-41d4-a716-446655440002"
        tenantKey: acme-corp
        registry: exchange.epistola.app
        namespace: acme-corp
        catalogKey: letters
        templateKey: invoice
        variantKey: english
        version: "1.4.0"
        filename: "invoice-2026-001.pdf"
        correlationId: "order-7890"
        contentType: "application/pdf"
        sizeBytes: 184320
        createdAt: "2026-02-01T08:00:03Z"
        createdBy: null
    page:
      number: 0
      size: 20
      total: 1
      totalPages: 1

GenerationJobStatus:
  type: string
  description: |
    Where a generation job stands: `pending` until a worker takes it, `in-progress` while its items
    render, then `completed` (every item done; some may have failed), `failed` (the job itself
    could not run) or `cancelled` (`cancelGenerationJob`).
  enum: [pending, in-progress, completed, failed, cancelled]

GenerationJobType:
  type: string
  description: A job of one document (`generateDocument`) or of several (`generateDocumentBatch`).
  enum: [single, batch]

GenerationItemStatus:
  type: string
  description: |
    Where one item of a generation job stands: `pending`, `in-progress`, then `completed` or
    `failed`, or `cancelled` when its job was cancelled before the item rendered.
  enum: [pending, in-progress, completed, failed, cancelled]
