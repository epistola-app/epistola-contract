DocumentDto:
  type: object
  description: Generated document metadata
  required:
    - id
    - tenantKey
    - registry
    - namespace
    - catalogKey
    - templateKey
    - variantKey
    - version
    - filename
    - contentType
    - sizeBytes
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the document
      example: "770e8400-e29b-41d4-a716-446655440002"
    tenantKey:
      $ref: './identifiers.yaml#/TenantKey'
      description: Key of the tenant that owns this document
      example: acme-corp
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the template's catalog, written in full (the default registry by its name, never
        `~`)
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the template's catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the template's catalog, unique within its registry and namespace
      example: letters
    templateKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the template used to generate this document
      example: invoice
    variantKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the variant used to generate this document
      example: english
    version:
      oneOf:
        - $ref: './identifiers.yaml#/ReleaseVersion'
        - type: 'null'
      description: |
        Release of the template's catalog this document was generated from. Null when it was
        rendered from a draft.
      example: "1.4.0"
    releaseId:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseId'
        - type: 'null'
      description: |
        The id of the release rendered (`CatalogReleaseId`), always given from 2.0 on:
        a released release's, which it had as a draft, or a draft's, when an
        environment renders one live (`deployCatalogRelease`; `version` is then null).
        Null only for one made before 2.0, which no release made.
      example: k3x9q2ab
    draftLabel:
      type: [string, "null"]
      maxLength: 100
      description: |
        The name of that draft at render time. Null when rendered from a released one.
      example: null
    filename:
      type: string
      description: Filename of the document
      example: "invoice-2026-001.pdf"
    correlationId:
      type: [string, "null"]
      description: Client-provided ID for tracking documents across systems
      example: "order-7890"
    contentType:
      type: string
      description: MIME type of the document
      example: "application/pdf"
    sizeBytes:
      type: integer
      format: int64
      description: Size of the document in bytes
      example: 184320
    createdAt:
      type: string
      format: date-time
      description: When the document was generated
      example: "2026-02-01T08:00:03Z"
    createdBy:
      type: [string, "null"]
      description: |
        Who requested the document: the `id` of the consumer whose request generated it (see the
        Consumers API, experimental). It is kept when that consumer is deleted. Null when the
        server records none.
      example: null
  example:
    id: "770e8400-e29b-41d4-a716-446655440002"
    tenantKey: acme-corp
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    templateKey: invoice
    variantKey: english
    version: "1.4.0"
    filename: "invoice-2026-001.pdf"
    correlationId: "order-7890"
    contentType: "application/pdf"
    sizeBytes: 184320
    createdAt: "2026-02-01T08:00:03Z"
    createdBy: null

