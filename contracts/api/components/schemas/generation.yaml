# Document Generation Schemas

PreviewDocumentRequest:
  type: object
  description: |
    Request to preview a single document synchronously. Returns the PDF directly.

    **Important**: This endpoint is for preview purposes only.
    - The output is **not PDF/A compliant**
    - The endpoint is **rate-limited** — do not use for production document generation
    - There are **no guarantees on latency or throughput**
    - Generated documents are **not stored** — use the async generation endpoint for production use

    Specify either variantKey (explicit) or attributes (auto-select) but not both.
  required:
    - namespace
    - catalogKey
    - templateKey
    - data
  properties:
    registry:
      oneOf:
        - $ref: './identifiers.yaml#/Registry'
        - type: 'null'
      description: |
        Registry of the catalog containing the template: the exchange or domain its namespace lives
        in. Omitted or null: the default registry, which the server configures. A response always
        names it in full.
      example: null
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog containing the template, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog containing the template, unique within its registry and namespace
      example: letters
    templateKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the template to use for preview
      example: invoice
    variantKey:
      oneOf:
        - $ref: './identifiers.yaml#/ResourceKey'
        - type: 'null'
      description: Key of the variant to use (mutually exclusive with attributes)
      example: english
    attributes:
      type: array
      items:
        $ref: '#/VariantSelectionAttribute'
      description: Attribute criteria for auto-selecting a variant (mutually exclusive with variantKey)
    versionRange:
      type: [string, "null"]
      minLength: 1
      maxLength: 256
      description: |
        Which release of the template's catalog to render, as a version range (see "Version
        ranges" in the API description); the highest release that satisfies it is rendered.
        With `environmentKey`, only the releases that environment serves are considered (see
        "Deploying"); a draft deployed there never matches a range. Omitted: the highest release,
        or with `environmentKey` the catalog's draft deployed to that environment if there is one,
        else the highest release it serves.
      example: null
    environmentKey:
      oneOf:
        - $ref: './identifiers.yaml#/EnvironmentKey'
        - type: 'null'
      description: |
        Key of an environment. With no `versionRange`, the catalog's draft deployed to the
        environment is rendered live if there is one (the document then carries `releaseId` and
        `releaseName`), else the highest release of the template's catalog the environment serves.
        With a `versionRange`, the highest served release that satisfies it; a draft never matches
        a range (`deployCatalogRelease`). The request is refused with 404 `not-found` when the
        environment serves no such release.
      example: null
    draft:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogReleaseId'
        - type: 'null'
      description: |
        Render a draft of the template's catalog, including changes not yet released, by its
        `releaseId` (a `CatalogReleaseId`; mutually exclusive with versionRange and environmentKey). A
        version range never matches a draft; a generated document renders one only through an
        environment it is deployed to (`deployCatalogRelease`).
      example: null
    data:
      type: object
      description: JSON data to populate the template
      example:
        customer:
          name: "Jane Smith"
          email: "jane.smith@example.com"
          taxId: "US123456789"
          address:
            street: "123 Main Street"
            city: "Springfield"
            postalCode: "62704"
            country: US
        invoiceNumber: "INV-2026-001"
        issueDate: "2026-02-01"
        dueDate: "2026-03-01"
        lineItems:
          - description: "Consulting Services (40h)"
            quantity: 40
            unitPrice: 150.00
            taxRate: 21
          - description: "Software License - Enterprise"
            quantity: 1
            unitPrice: 2500.00
            taxRate: 21
          - description: "Travel Expenses"
            quantity: 1
            unitPrice: 384.50
            taxRate: 0
        notes: "Payment due within 30 days. Please reference invoice number on transfer."
        currency: EUR

VariantSelectionAttribute:
  type: object
  description: |
    An attribute criterion for variant selection: the attribute, by its key and the catalog that
    defines it, and the value a variant must have for it.

    Without `catalogKey`, `key` names an attribute of the template's own catalog. With `catalogKey`,
    it names an attribute of the catalog with that alias in the dependency declarations of the
    release that renders (`listCatalogDependencies`), as the template's content names that catalog
    (see "Catalog identity"); the template's own catalog key names its own catalog. An alias the
    release does not declare names no attribute, so no variant has a value for it.
  required:
    - key
    - value
  properties:
    catalogKey:
      oneOf:
        - $ref: './identifiers.yaml#/CatalogAlias'
        - type: 'null'
      description: |
        The alias of the catalog that defines the attribute, as the dependency declarations of the
        release that renders give it. Omitted or null: the template's own catalog.
      example: system
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the attribute, in the catalog that defines it.
      example: locale
    value:
      type: string
      description: Attribute value to match.
      example: en-US
    required:
      type: boolean
      default: true
      description: If true, variant MUST match this attribute. If false, it's preferred but not mandatory.

GenerateDocumentRequest:
  type: object
  description: Request to generate a single document. Specify either variantKey (explicit) or attributes (auto-select) but not both.
  required:
    - namespace
    - catalogKey
    - templateKey
    - data
  properties:
    registry:
      oneOf:
        - $ref: './identifiers.yaml#/Registry'
        - type: 'null'
      description: |
        Registry of the catalog containing the template: the exchange or domain its namespace lives
        in. Omitted or null: the default registry, which the server configures. A response always
        names it in full.
      example: null
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog containing the template, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the catalog containing the template, unique within its registry and namespace
      example: letters
    templateKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the template to use for generation
      example: invoice
    variantKey:
      oneOf:
        - $ref: './identifiers.yaml#/ResourceKey'
        - type: 'null'
      description: Key of the variant to use (mutually exclusive with attributes)
      example: english
    attributes:
      type: array
      items:
        $ref: '#/VariantSelectionAttribute'
      description: Attribute criteria for auto-selecting a variant (mutually exclusive with variantKey)
    versionRange:
      type: [string, "null"]
      minLength: 1
      maxLength: 256
      description: |
        Which release of the template's catalog to render, as a version range (see "Version
        ranges" in the API description); the highest release that satisfies it is rendered.
        With `environmentKey`, only the releases that environment serves are considered (see
        "Deploying"); a draft deployed there never matches a range. Omitted: the highest release,
        or with `environmentKey` the catalog's draft deployed to that environment if there is one,
        else the highest release it serves.
      example: null
    environmentKey:
      oneOf:
        - $ref: './identifiers.yaml#/EnvironmentKey'
        - type: 'null'
      description: |
        Key of an environment. With no `versionRange`, the catalog's draft deployed to the
        environment is rendered live if there is one (the document then carries `releaseId` and
        `releaseName`), else the highest release of the template's catalog the environment serves.
        With a `versionRange`, the highest served release that satisfies it; a draft never matches
        a range (`deployCatalogRelease`). The request is refused with 404 `not-found` when the
        environment serves no such release.
      example: null
    data:
      type: object
      description: JSON data to populate the template
      example:
        customer:
          name: "Jane Smith"
          email: "jane.smith@example.com"
          taxId: "US123456789"
          address:
            street: "123 Main Street"
            city: "Springfield"
            postalCode: "62704"
            country: US
        invoiceNumber: "INV-2026-001"
        issueDate: "2026-02-01"
        dueDate: "2026-03-01"
        lineItems:
          - description: "Consulting Services (40h)"
            quantity: 40
            unitPrice: 150.00
            taxRate: 21
          - description: "Software License - Enterprise"
            quantity: 1
            unitPrice: 2500.00
            taxRate: 21
          - description: "Travel Expenses"
            quantity: 1
            unitPrice: 384.50
            taxRate: 0
        notes: "Payment due within 30 days. Please reference invoice number on transfer."
        currency: EUR
    filename:
      type: [string, "null"]
      description: Optional filename for the generated document
      maxLength: 255
      example: "invoice-2026-001.pdf"
    correlationId:
      type: [string, "null"]
      description: Client-provided ID for tracking documents across systems
      maxLength: 255
      example: "order-7890"
    routingKey:
      type: [string, "null"]
      description: |
        Optional key that determines which consumer node receives the result
        via the `/generation/collect` endpoint. Results with the same routing key
        are always delivered to the same node (consistent hashing).

        Common strategies:
        - Use a business key (e.g., customer ID, order ID) for locality —
          all results for the same entity go to the same node.
        - Omit to default to the request ID (even distribution, no affinity).

        The routing key is hashed to a partition number. Partition-to-node
        assignment is managed by the server and reported in the collect
        response metadata.
      maxLength: 255
      example: "order-7890"

