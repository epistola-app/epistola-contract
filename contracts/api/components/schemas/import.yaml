ImportTemplatesRequest:
  type: object
  description: Request body for bulk template import (create-or-update)
  required:
    - templates
  properties:
    templates:
      type: array
      minItems: 1
      maxItems: 50
      description: List of template definitions to import
      items:
        $ref: '#/ImportTemplateDto'
  example:
    templates:
      - key: subsidiebesluit
        name: Subsidiebesluit
        version: "1.0.0"
        dataModel:
          type: object
          properties:
            beneficiary:
              type: object
              properties:
                name:
                  type: string
        dataExamples:
          - key: voorbeeld
            name: Voorbeeld
            data:
              beneficiary:
                name: "Gemeente Amsterdam"
        templateModel:
          modelVersion: 1
          root: node-root
          nodes:
            node-root:
              id: node-root
              type: container
              slots:
                - slot-root-children
              styles: {}
              props: {}
          slots:
            slot-root-children:
              id: slot-root-children
              nodeId: node-root
              name: children
              children: []
          themeRef:
            type: inherit
        variants:
          - key: default
            title: Standaard
            isDefault: true
            attributes:
              language: nl

ImportTemplateDto:
  type: object
  description: |
    A single template definition for import. Contains the full template structure
    including metadata, data model, visual layout and variants. Importing fills the
    draft; releasing the draft and deploying the release are separate steps.
  required:
    - key
    - name
    - version
    - templateModel
    - variants
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the template
      example: subsidiebesluit
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: Display name of the template
      example: Subsidiebesluit
    description:
      type: [string, "null"]
      maxLength: 2000
      description: Plain-text notes on the template for its authors (design decisions, known gaps). Not rendered.
      example: Monthly invoice; the payment block follows the 2026 house style.
    version:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: Semantic version of the template definition (for change tracking by callers)
      example: "1.0.0"
    dataModel:
      type: object
      description: JSON Schema defining the expected data structure for template rendering
    dataExamples:
      type: array
      description: Example data sets for testing template rendering
      items:
        $ref: './templates.yaml#/DataExampleDto'
    templateModel:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    variants:
      type: array
      minItems: 1
      description: |
        Variant definitions to create or update. At least one variant is required,
        and exactly one must have `isDefault: true`.
      items:
        $ref: '#/ImportVariantDto'
  example:
    key: subsidiebesluit
    name: Subsidiebesluit
    version: "1.0.0"
    dataModel:
      type: object
      properties:
        beneficiary:
          type: object
          properties:
            name:
              type: string
    templateModel:
      modelVersion: 1
      root: node-root
      nodes:
        node-root:
          id: node-root
          type: container
          slots:
            - slot-root-children
          styles: {}
          props: {}
      slots:
        slot-root-children:
          id: slot-root-children
          nodeId: node-root
          name: children
          children: []
      themeRef:
        type: inherit
    variants:
      - key: default
        title: Standaard
        attributes:
          language: nl

ImportVariantDto:
  type: object
  description: Variant definition within an import template
  required:
    - key
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the variant, unique within its template
      example: default
    title:
      type:
        - string
        - 'null'
      description: Human-readable title for the variant
      example: Standaard
    attributes:
      type: object
      additionalProperties:
        type: string
      description: Variant attributes for selection criteria
      example:
        language: nl
    isDefault:
      type: boolean
      default: false
      description: Whether this variant is the default variant for the template. Exactly one variant per template must have isDefault=true.
    templateModel:
      $ref: '../../../catalog/schemas/template-document.schema.json'
  example:
    key: default
    title: Standaard
    isDefault: true
    attributes:
      language: nl

ImportTemplatesResponse:
  type: object
  description: Response for bulk template import
  required:
    - results
  properties:
    results:
      type: array
      description: Import result for each template in the request (same order)
      items:
        $ref: '#/ImportTemplateResultDto'
  example:
    results:
      - key: subsidiebesluit
        status: created
        version: "1.0.0"

ImportTemplateResultDto:
  type: object
  description: Import result for a single template
  required:
    - key
    - status
    - version
  properties:
    key:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Key of the template that was imported
      example: subsidiebesluit
    status:
      type: string
      enum:
        - created
        - updated
        - unchanged
        - failed
      description: |
        Result status:
        - `created`: Template was newly created
        - `updated`: Existing template was updated
        - `unchanged`: Template already existed with same content (no changes made)
        - `failed`: Import failed for this template (see errorMessage)
      example: created
    version:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      maxLength: 50
      description: Version that was imported
      example: "1.0.0"
    errorMessage:
      type:
        - string
        - 'null'
      description: Error message if status is "failed"
  example:
    key: subsidiebesluit
    status: created
    version: "1.0.0"

ImportCatalogResponse:
  type: object
  description: Result of importing a catalog ZIP archive
  required:
    - registry
    - namespace
    - catalogKey
    - catalogName
    - installed
    - updated
    - failed
    - total
    - aborted
  properties:
    registry:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      maxLength: 253
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      type: string
      description: Key of the imported catalog, unique within its registry and namespace
      example: valtimo-demo
    catalogName:
      type: string
      description: Display name of the imported catalog
      example: Valtimo Demo Catalog
    catalogVersion:
      type: [string, "null"]
      pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
      maxLength: 50
      description: |
        The catalog version the archive went into: the draft of an AUTHORED catalog (its id), or the
        release a SUBSCRIBED catalog installed (its SemVer number). Null when the import was aborted.
      example: 0193a6b2-7f4e-7c1d-9a2b-3c4d5e6f7a8b
    installed:
      type: integer
      description: Number of resources newly installed
      example: 5
    updated:
      type: integer
      description: Number of resources updated
      example: 2
    failed:
      type: integer
      description: Number of resources that failed to import
      example: 0
    total:
      type: integer
      description: Total number of resources in the catalog
      example: 7
    aborted:
      type: boolean
      description: |
        `true` when a SUBSCRIBED-catalog ZIP upgrade was **aborted**: a
        resource install failed, so stale resources were **not** pruned and
        the catalog's installed-release pointers were **not** advanced — the
        catalog is unchanged on its previous release and a re-import is a
        meaningful retry. When `false`, the import finalized: any `failed`
        resources are permanent for this import and the catalog moved
        forward. Always `false` for AUTHORED imports (merge/replace).
      example: false
    installedDependencies:
      type: array
      description: |
        For a catalog bundle: the catalogs it uses that the import installed, as `catalogKey vVERSION`,
        in the order it installed them. Empty for a single archive.
      items:
        type: string
      example: ["shared v1.0.0"]
    presentDependencies:
      type: array
      description: For a catalog bundle, the catalogs it uses this tenant had already at the bundled release.
      items:
        type: string
      example: []
