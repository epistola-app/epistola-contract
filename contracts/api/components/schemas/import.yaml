ImportCatalogResponse:
  type: object
  description: |
    Result of importing a catalog archive: the release it installed, or found already present. An
    import never creates or changes a draft.
  required:
    - registry
    - namespace
    - catalogKey
    - catalogName
    - version
    - newlyInstalled
    - total
  properties:
    registry:
      $ref: './identifiers.yaml#/Registry'
      description: |
        Registry of the catalog: the exchange or domain its namespace lives in. Always written in
        full, the default registry by its name, never `~`.
      example: exchange.epistola.app
    namespace:
      $ref: './identifiers.yaml#/Namespace'
      description: Namespace of the catalog, within its registry
      example: acme-corp
    catalogKey:
      $ref: './identifiers.yaml#/CatalogKey'
      description: Key of the imported catalog, unique within its registry and namespace
      example: valtimo-demo
    catalogName:
      type: string
      description: Display name of the imported catalog
      example: Valtimo Demo Catalog
    version:
      $ref: './identifiers.yaml#/ReleaseVersion'
      description: The version of the release the archive carries, which the tenant now has.
    newlyInstalled:
      type: boolean
      description: |
        `true` when this import installed the release; `false` when the tenant already had it, with
        the same fingerprint, and nothing changed.
      example: true
    total:
      type: integer
      description: Number of resources in the release
      example: 7
    installedDependencies:
      type: array
      description: |
        The releases the archive carries (under `dependencies/`) that the import installed, in the
        order it installed them. Empty when it carries none.
      items:
        $ref: './catalogs.yaml#/InstalledCatalogReleaseDto'
    presentDependencies:
      type: array
      description: |
        The releases the archive carries (under `dependencies/`) that this tenant had already, with
        the same fingerprint. Empty when it carries none.
      items:
        $ref: './catalogs.yaml#/InstalledCatalogReleaseDto'
      example: []
