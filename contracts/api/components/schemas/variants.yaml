VariantDto:
  type: object
  description: Full template variant, with the status of its working copy
  required:
    - slug
    - templateId
    - title
    - attributes
    - isDefault
    - status
    - createdAt
    - lastModified
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: |
        Slug identifier of the variant
      example: english
    templateId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Slug identifier of the template this variant belongs to
      example: invoice
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: Human-readable title for the variant
      example: English Invoice
    description:
      type:
        - string
        - 'null'
      description: Description of the variant
      example: English language invoice for international customers
    attributes:
      type: object
      additionalProperties:
        type: string
      description: Variant attributes for selection criteria (e.g., language=dutch, brand=acme)
      example:
        locale: en-US
        brand: acme
    isDefault:
      type: boolean
      description: Whether this variant is the default for its template
      example: false
    status:
      $ref: './common.yaml#/ResourceStatus'
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the variant was created
      example: "2026-01-21T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      description: Timestamp when the variant was last modified
      example: "2026-01-28T11:30:00Z"
  example:
    slug: english
    templateId: invoice
    title: English Invoice
    description: English language invoice for international customers
    attributes:
      locale: en-US
      brand: acme
    isDefault: false
    status: ready
    createdAt: "2026-01-21T10:00:00Z"
    lastModified: "2026-01-28T11:30:00Z"

VariantSummaryDto:
  type: object
  description: Summary view of a variant for inclusion in template responses
  required:
    - slug
    - title
    - attributes
    - isDefault
    - status
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: |
        Slug identifier of the variant
      example: english
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: Human-readable title for the variant
      example: English Invoice
    attributes:
      type: object
      additionalProperties:
        type: string
      description: Variant attributes for selection criteria
      example:
        locale: en-US
        brand: acme
    isDefault:
      type: boolean
      description: Whether this variant is the default for its template
      example: false
    status:
      $ref: './common.yaml#/ResourceStatus'
  example:
    slug: english
    title: English Invoice
    attributes:
      locale: en-US
      brand: acme
    isDefault: false
    status: ready

CreateVariantRequest:
  type: object
  description: Request body for creating a new variant
  required:
    - id
    - title
  properties:
    id:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Client-provided slug identifier for the variant
      example: english
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: Human-readable title for the variant
      example: English Invoice
    description:
      type:
        - string
        - 'null'
      description: Description of the variant
      example: English language invoice for international customers
    attributes:
      type: object
      additionalProperties:
        type: string
      description: Variant attributes for selection criteria for this variant
      example:
        locale: en-US
        brand: acme

UpdateVariantRequest:
  type: object
  description: Request body for updating a variant
  required:
    - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: Human-readable title for the variant
      example: English Invoice (Updated)
    description:
      type:
        - string
        - 'null'
      description: Description of the variant
      example: Updated English language invoice
    attributes:
      type: object
      additionalProperties:
        type: string
      description: Updated attributes for this variant
      example:
        locale: en-US
        brand: acme
        region: north-america

VariantListResponse:
  description: List of template variants
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of variants
      items:
        $ref: '#/VariantDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - slug: english
        templateId: invoice
        title: English Invoice
        description: English language invoice for international customers
        attributes:
          locale: en-US
          brand: acme
        isDefault: true
        status: ready
        createdAt: "2026-01-21T10:00:00Z"
        lastModified: "2026-01-28T11:30:00Z"
    page:
      number: 0
      size: 20
      totalElements: 1
      totalPages: 1

UpdateVariantContentRequest:
  type: object
  description: The variant's new template model, replacing its working copy
  required:
    - templateModel
  properties:
    templateModel:
      $ref: '../../../catalog/schemas/template-document.schema.json'

VariantContentDto:
  type: object
  description: |
    A variant's working copy: the content being edited, and how it stands against the catalog's
    latest release.
  required:
    - variantId
    - templateModel
    - status
    - lastModified
  properties:
    variantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Slug identifier of the variant
      example: english
    templateModel:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    status:
      $ref: './common.yaml#/ResourceStatus'
    lastModified:
      type: string
      format: date-time
      description: When the working copy was last edited
      example: "2026-01-28T11:30:00Z"
    readyAt:
      type: [string, "null"]
      format: date-time
      description: When the current content was marked ready; null unless the status is `ready`
      example: null
