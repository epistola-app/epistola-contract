CreateStencilRequest:
  type: object
  description: Request body for creating a new stencil
  required:
    - id
    - name
  properties:
    id:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Client-provided slug identifier for the stencil
      example: corporate-header
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: Display name of the stencil
      example: Corporate Header
    description:
      type: string
      maxLength: 1000
      description: Optional description of what this stencil provides
      example: Standard corporate header with logo, company name, and address block
    tags:
      type: array
      items:
        type: string
        maxLength: 50
      maxItems: 20
      description: Tags for categorization and search
      example:
        - header
        - corporate
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: |
        Optional typed input parameters for the stencil's initial draft version, as a
        JSON Schema object (`{ "type": "object", "properties": {...}, "required": [...] }`).
        Property types are limited to string / number / integer / boolean (optionally
        `format: date`/`date-time`) or arrays of those primitives. Omit or send null to
        declare no parameters.
      example:
        type: object
        properties:
          recipientName:
            type: string
        required:
          - recipientName

UpdateStencilRequest:
  type: object
  description: Request body for updating a stencil's metadata (all fields optional)
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: New display name for the stencil
      example: Corporate Header (Updated)
    description:
      type:
        - string
        - 'null'
      maxLength: 1000
      description: Updated description (null to clear)
      example: Updated corporate header with new branding
    tags:
      type: array
      items:
        type: string
        maxLength: 50
      maxItems: 20
      description: Updated tags (replaces existing tags)
      example:
        - header
        - corporate
        - branding

StencilUsageDto:
  type: object
  description: A template variant that uses the stencil, and whether its instance is held back
  required:
    - templateId
    - templateName
    - variantId
    - heldBack
  properties:
    templateId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Slug identifier of the template using this stencil
      example: monthly-invoice
    templateName:
      type: string
      description: Display name of the template
      example: Monthly Invoice
    variantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Slug identifier of the variant
      example: english
    heldBack:
      type: boolean
      description: |
        True when the stencil's ready content breaks this instance, so it still renders the content
        it had. The catalog release refuses until it is resolved.
      example: false
  example:
    templateId: monthly-invoice
    templateName: Monthly Invoice
    variantId: english
    heldBack: false

StencilListResponse:
  description: List of stencils
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of stencil summaries
      items:
        $ref: '#/StencilSummaryDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - slug: corporate-header
        id: corporate-header
        tenantId: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        status: released
        createdAt: "2026-03-01T10:00:00Z"
        lastModified: "2026-03-15T14:30:00Z"
    page:
      number: 0
      size: 20
      totalElements: 1
      totalPages: 1

StencilUsageListResponse:
  description: The template variants that use a stencil
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of template usages
      items:
        $ref: '#/StencilUsageDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - templateId: monthly-invoice
        templateName: Monthly Invoice
        variantId: english
        heldBack: false
    page:
      number: 0
      size: 20
      totalElements: 1
      totalPages: 1

UpdateStencilContentRequest:
  type: object
  description: |
    The stencil's new content, replacing its working copy. An edit clears the ready mark.
  properties:
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: |
        Optional typed input parameters for the stencil, as a JSON Schema
        object (`{ "type": "object", "properties": {...}, "required": [...] }`). Property
        types are limited to string / number / integer / boolean (optionally
        `format: date`/`date-time`) or arrays of those primitives.

        Updating the content is a **full replacement**: this field is applied as-is, so
        omitting it (or sending null) clears any parameter schema currently on the
        stencil. Send the complete schema (alongside the complete `content`) to keep it.
      example:
        type: object
        properties:
          recipientName:
            type: string
        required:
          - recipientName

StencilContentDto:
  type: object
  description: |
    A stencil's working copy: the TemplateDocument fragment that is inserted into templates, its
    parameters, and how it stands against the catalog's latest release.
  required:
    - stencilId
    - content
    - status
    - lastModified
  properties:
    stencilId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: Slug identifier of the stencil
      example: corporate-header
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: Typed input parameters of the stencil, as a JSON Schema object
    status:
      $ref: './common.yaml#/ResourceStatus'
    lastModified:
      type: string
      format: date-time
      description: When the working copy was last edited
      example: "2026-03-15T14:30:00Z"
    readyAt:
      type: [string, "null"]
      format: date-time
      description: When the current content was marked ready; null unless the status is `ready`
      example: null

MarkStencilReadyResponse:
  type: object
  description: |
    The stencil, now ready, and the instances its change holds back.

    Marking a stencil ready moves every instance whose templates the change does not break to the
    new content: an unchanged interface, or one that accepts more than before. An instance the change
    breaks (a removed or retyped placeholder or parameter it fills) is **held back** on the content it
    had, and the catalog release refuses until each held-back instance is resolved by editing its
    template variant.
  required:
    - stencil
    - heldBack
  properties:
    stencil:
      $ref: '#/StencilContentDto'
    heldBack:
      type: array
      description: The instances the change holds back; empty when every instance moved
      items:
        $ref: '#/StencilUsageDto'
