StencilDto:
  type: object
  description: |
    Full stencil with all details.
    A stencil is a reusable template component that can be inserted into any template. Its content
    is edited in the working copy and marked ready; templates render its ready content.
  required:
    - id
    - tenantId
    - name
    - status
    - createdAt
    - lastModified
  properties:
    slug:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      description: |
        Slug identifier of the stencil (e.g., "corporate-header")

        Sent by every server on contract 1.3.0 or later. Not required, because a server on an
        older 1.x contract omits it and a client must still read its responses: when it is
        absent, read `id`, which carries the same value. Required from 2.0.0, which removes
        `id` (epistola-app/epistola-contract#84).
      example: corporate-header
    id:
      type: string
      deprecated: true
      description: |
        **Deprecated — use `slug`.** The same value, under the name the portable catalog
        format already uses. Removed in 2.0.0 (epistola-app/epistola-contract#84).
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 50
      example: corporate-header
    tenantId:
      type: string
      pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
      minLength: 3
      maxLength: 63
      description: Slug identifier of the tenant this stencil belongs to
      example: acme-corp
    name:
      type: string
      description: Display name of the stencil
      example: Corporate Header
    description:
      type:
        - string
        - 'null'
      description: Optional description of what this stencil provides
      example: Standard corporate header with logo, company name, and address block
    tags:
      type: array
      items:
        type: string
      description: Tags for categorization and search
      example:
        - header
        - corporate
    status:
      $ref: './common.yaml#/ResourceStatus'
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the stencil was created
      example: "2026-03-01T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      description: Timestamp when the stencil was last modified
      example: "2026-03-15T14:30:00Z"
  example:
    slug: corporate-header
    id: corporate-header
    tenantId: acme-corp
    name: Corporate Header
    description: Standard corporate header with logo, company name, and address block
    tags:
      - header
      - corporate
    status: ready
    createdAt: "2026-03-01T10:00:00Z"
    lastModified: "2026-03-15T14:30:00Z"

