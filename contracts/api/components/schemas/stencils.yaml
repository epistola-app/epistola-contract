StencilDto:
  type: object
  description: |
    Full stencil with all details.
    A stencil is a reusable template component that can be inserted into any template. Its content
    is edited in a draft of its catalog and marked ready. A template holds an instance of it by
    reference, not a copy, and renders the stencil's content as it is in the same catalog version
    (or, for a stencil in another catalog, in the release that dependency pins), whatever its
    status: marking it ready is a review checkpoint, not what makes templates use it.
  required:
    - key
    - tenantKey
    - name
    - status
    - createdAt
    - lastModified
  properties:
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: |
        Key of the stencil (e.g., "corporate-header")
      example: corporate-header
    tenantKey:
      $ref: './identifiers.yaml#/TenantKey'
      description: Key of the tenant this stencil belongs to
      example: acme-corp
    name:
      type: string
      description: Display name of the stencil
      example: Corporate Header
    description:
      type:
        - string
        - 'null'
      description: Optional description of what this stencil provides
      example: Standard corporate header with logo, company name, and address block
    tags:
      type: array
      items:
        type: string
      description: Tags for categorization and search
      example:
        - header
        - corporate
    status:
      $ref: './common.yaml#/ResourceStatus'
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the stencil was created
      example: "2026-03-01T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      description: Timestamp when the stencil was last modified
      example: "2026-03-15T14:30:00Z"
  example:
    key: corporate-header
    tenantKey: acme-corp
    name: Corporate Header
    description: Standard corporate header with logo, company name, and address block
    tags:
      - header
      - corporate
    status: ready
    createdAt: "2026-03-01T10:00:00Z"
    lastModified: "2026-03-15T14:30:00Z"

StencilSummaryDto:
  type: object
  description: Summary view of a stencil for list displays
  required:
    - key
    - tenantKey
    - name
    - status
    - createdAt
    - lastModified
  properties:
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: |
        Key of the stencil
      example: corporate-header
    tenantKey:
      $ref: './identifiers.yaml#/TenantKey'
      description: Key of the tenant this stencil belongs to
      example: acme-corp
    name:
      type: string
      description: Display name of the stencil
      example: Corporate Header
    description:
      type:
        - string
        - 'null'
      description: Optional description of what this stencil provides
      example: Standard corporate header with logo, company name, and address block
    tags:
      type: array
      items:
        type: string
      description: Tags for categorization and search
      example:
        - header
        - corporate
    status:
      $ref: './common.yaml#/ResourceStatus'
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the stencil was created
      example: "2026-03-01T10:00:00Z"
    lastModified:
      type: string
      format: date-time
      description: Timestamp when the stencil was last modified
      example: "2026-03-15T14:30:00Z"
  example:
    key: corporate-header
    tenantKey: acme-corp
    name: Corporate Header
    description: Standard corporate header with logo, company name, and address block
    tags:
      - header
      - corporate
    status: released
    createdAt: "2026-03-01T10:00:00Z"
    lastModified: "2026-03-15T14:30:00Z"

CreateStencilRequest:
  type: object
  description: Request body for creating a new stencil
  required:
    - key
    - name
  properties:
    key:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Client-chosen key for the stencil
      example: corporate-header
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: Display name of the stencil
      example: Corporate Header
    description:
      type: string
      maxLength: 1000
      description: Optional description of what this stencil provides
      example: Standard corporate header with logo, company name, and address block
    tags:
      type: array
      items:
        type: string
        maxLength: 50
      maxItems: 20
      description: Tags for categorization and search
      example:
        - header
        - corporate
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: |
        Optional typed input parameters for the stencil's initial content, as a
        JSON Schema object (`{ "type": "object", "properties": {...}, "required": [...] }`).
        Property types are limited to string / number / integer / boolean (optionally
        `format: date`/`date-time`) or arrays of those primitives. Omit it, send null, or send
        a schema that declares no parameters (`{}`) to declare none.
      example:
        type: object
        properties:
          recipientName:
            type: string
        required:
          - recipientName

UpdateStencilRequest:
  type: object
  description: Request body for updating a stencil's metadata (all fields optional)
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: New display name for the stencil
      example: Corporate Header (Updated)
    description:
      type:
        - string
        - 'null'
      maxLength: 1000
      description: Updated description (null to clear)
      example: Updated corporate header with new branding
    tags:
      type: array
      items:
        type: string
        maxLength: 50
      maxItems: 20
      description: Updated tags (replaces existing tags)
      example:
        - header
        - corporate
        - branding

StencilUsageDto:
  type: object
  description: |
    A template variant that uses the stencil, and whether its instance fits the stencil's content in
    this catalog version. An instance refers to the stencil and renders the stencil as it is; one that does not fit
    (it fills a placeholder the stencil no longer has, or leaves a required parameter unbound) blocks
    the catalog release until its template variant is edited.
  required:
    - templateKey
    - templateName
    - variantKey
    - fits
    - problems
  properties:
    templateKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the template using this stencil
      example: monthly-invoice
    templateName:
      type: string
      description: Display name of the template
      example: Monthly Invoice
    variantKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the variant
      example: english
    fits:
      type: boolean
      description: True when the instance fits the stencil's content; false blocks the release
      example: true
    problems:
      type: array
      description: Why the instance does not fit; empty when it fits
      items:
        type: string
      example: []
  example:
    templateKey: monthly-invoice
    templateName: Monthly Invoice
    variantKey: english
    fits: true
    problems: []

StencilListResponse:
  description: List of stencils
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of stencil summaries
      items:
        $ref: '#/StencilSummaryDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - key: corporate-header
        tenantKey: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        status: released
        createdAt: "2026-03-01T10:00:00Z"
        lastModified: "2026-03-15T14:30:00Z"
    page:
      number: 0
      size: 20
      total: 1
      totalPages: 1

StencilUsageListResponse:
  description: The template variants that use a stencil
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      description: List of template usages
      items:
        $ref: '#/StencilUsageDto'
    page:
      $ref: './common.yaml#/PageMeta'
  example:
    items:
      - templateKey: monthly-invoice
        templateName: Monthly Invoice
        variantKey: english
        fits: true
        problems: []
    page:
      number: 0
      size: 20
      total: 1
      totalPages: 1

UpdateStencilContentRequest:
  type: object
  description: |
    The stencil's new content, replacing its content in the draft. An edit clears the ready mark.
  properties:
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: |
        Optional typed input parameters for the stencil, as a JSON Schema
        object (`{ "type": "object", "properties": {...}, "required": [...] }`). Property
        types are limited to string / number / integer / boolean (optionally
        `format: date`/`date-time`) or arrays of those primitives.

        Omitted or null, the stencil keeps the parameter schema it has, so a client that only
        changes the content cannot drop the parameters the templates using it bind. A schema
        replaces it whole. A schema that declares no parameters (`{}`, or an object schema
        without properties) removes it: the stencil then has no parameters, and reports none.
      example:
        type: object
        properties:
          recipientName:
            type: string
        required:
          - recipientName

StencilContentDto:
  type: object
  description: |
    A stencil's content in one catalog version: the TemplateDocument fragment that every instance
    of the stencil renders (instances refer to it rather than copy it), its parameters, and how it stands
    against that version's base.
  required:
    - stencilKey
    - content
    - status
    - lastModified
  properties:
    stencilKey:
      $ref: './identifiers.yaml#/ResourceKey'
      description: Key of the stencil
      example: corporate-header
    content:
      $ref: '../../../catalog/schemas/template-document.schema.json'
    parameterSchema:
      type:
        - object
        - 'null'
      description: Typed input parameters of the stencil, as a JSON Schema object
    status:
      $ref: './common.yaml#/ResourceStatus'
    lastModified:
      type: string
      format: date-time
      description: When the content was last edited
      example: "2026-03-15T14:30:00Z"
    readyAt:
      type: [string, "null"]
      format: date-time
      description: When the current content was marked ready; null unless the status is `ready`
      example: null

MarkStencilReadyResponse:
  type: object
  description: |
    The stencil, now ready, and the instances of it that do not fit its content.

    Marking a stencil ready records that its content is reviewed, and nothing else: every instance
    refers to the stencil, so it already renders the stencil as it is. An instance the content breaks (it fills a
    placeholder the stencil no longer has, or leaves a required parameter unbound) is listed in
    `notFitting`, and the catalog release refuses until its template variant is edited.
  required:
    - stencil
    - notFitting
  properties:
    stencil:
      $ref: '#/StencilContentDto'
    notFitting:
      type: array
      description: The instances that do not fit the stencil's content; empty when every one fits
      items:
        $ref: '#/StencilUsageDto'
