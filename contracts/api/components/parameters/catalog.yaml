# Shared path parameters that address one catalog.
#
# A catalog's identity is its registry, its namespace and its key together, never the key alone:
# two publishers can each publish a catalog called `letters`. See "Catalog identity" in the API
# description.

Registry:
  name: registry
  in: path
  required: true
  description: |
    Registry of the catalog: the exchange (`exchange.epistola.app`) or the domain that publishes
    it (`acme.com`), in normal domain order.

    `~` means the installation's **default registry**, which the server configures; it is not part
    of this contract. The default registry may also be named in full, and both address the same
    catalog. A client may send `~` as it is or percent-encoded as `%7E`; the server accepts both.
  schema:
    $ref: '../schemas/identifiers.yaml#/RegistryOrDefault'
  example: '~'

Namespace:
  name: namespace
  in: path
  required: true
  description: |
    Namespace of the catalog, within its registry. The same namespace in two registries is two
    different namespaces.
  schema:
    $ref: '../schemas/identifiers.yaml#/Namespace'
  example: acme-corp

CatalogKey:
  name: catalogKey
  in: path
  required: true
  description: Key of the catalog, unique within its registry and namespace
  schema:
    $ref: '../schemas/identifiers.yaml#/CatalogKey'
  example: letters

CatalogVersion:
  name: catalogVersion
  in: path
  required: true
  description: |
    A version of the catalog, by its `versionId` (`CatalogVersionId`) or, once it is
    released, by its exact SemVer number: both address the same version. A draft has no number
    until it is released, so it is addressed by its `versionId` alone; releasing it keeps the id,
    which then addresses the release. Writes to a released version are refused with 409, whichever
    way it is addressed. A `versionId` never contains a dot, so the two cannot be confused. A
    discarded draft's id addresses nothing (404).
  schema:
    $ref: '../schemas/identifiers.yaml#/CatalogVersionRef'
  example: k7m2x9qa
