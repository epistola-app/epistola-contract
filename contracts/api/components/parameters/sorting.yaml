# Sorting query parameters for list endpoints.
#
# `direction` is shared: a fixed asc/desc enum (default desc). The field to sort by is per
# resource, each list its own enum of the fields it sorts by, so a client is told which values
# exist. A list that sorts by nothing has neither parameter; adding one later is additive.

TemplateSort:
  name: sort
  in: query
  required: false
  description: |
    Field to sort the templates by. Omitted, the server's default order applies.
  schema:
    type: string
    enum: [name, createdAt, lastModified]
    # Generated constant names: `name` is reserved on a Kotlin enum (`Enum.name`).
    x-enum-varnames: [byName, byCreatedAt, byLastModified]

Direction:
  name: direction
  in: query
  required: false
  description: |
    Sort direction, applied when a `sort` field is selected. An unsupported value
    is rejected.
  schema:
    type: string
    enum: [asc, desc]
    default: desc
