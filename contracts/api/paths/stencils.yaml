stencils:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: listStencils
    summary: List the stencils in a release of a catalog
    description: Retrieve the stencils of this release, optionally filtered by search term or tags.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    parameters:
      - name: q
        in: query
        description: Search term for filtering stencils by name or description
        schema:
          type: string
      - name: tag
        in: query
        description: Filter stencils by tag
        schema:
          type: string
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of stencils
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createStencil
    summary: Create a new stencil
    description: |
      Create a stencil in the draft. `content` and `parameterSchema`, when given, are its initial
      content and parameters; the stencil starts with status `new`. A stencil has no releases of
      its own: it is released with its catalog, as every resource in it is.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/CreateStencilRequest'
    responses:
      '201':
        description: Stencil created successfully
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The stencil's address (`getStencil`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

stencils-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getStencil
    summary: Get a stencil by key
    description: Retrieve a stencil's details in this release, with its status against the release's base.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    responses:
      '200':
        description: Stencil details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateStencil
    summary: Update a stencil
    description: |
      Update a stencil's metadata (name, description, tags).
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/UpdateStencilRequest'
    responses:
      '200':
        description: Stencil updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteStencil
    summary: Delete a stencil
    description: |
      Delete the stencil from the draft. The templates and stencils that use it hold a reference,
      not a copy, so their instances then name a stencil that does not exist: they are
      not changed, and the draft cannot be released until they are edited (`listStencilUsage`
      lists them beforehand). Refused with 409 outside a draft.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    responses:
      '204':
        description: Stencil deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

stencil-content:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getStencilContent
    summary: Get the stencil's content
    description: The stencil's content in this release, with its status against the release's base.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    responses:
      '200':
        description: The stencil's content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateStencilContent
    summary: Update the stencil's content in a draft
    description: |
      Replaces the stencil's content in the draft, and its parameters when `parameterSchema` is
      given: left out, they stay; `{}` removes them. Every template and stencil in the draft that
      uses the stencil renders the new content at once: an instance refers to the stencil and holds
      no copy of it. The edit clears the stencil's ready mark; instances the new content
      no longer fits are reported (`listStencilUsage`, `markStencilReady`) and block the release.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/UpdateStencilContentRequest'
    responses:
      '200':
        description: The updated content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilContentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

stencil-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  post:
    operationId: markStencilReady
    summary: Mark the stencil ready
    description: |
      Records that the stencil's current content is reviewed, and nothing else: every instance
      already renders the stencil as it is, since an instance refers to it rather than copying it. The response names the instances that do not
      fit the content, which block the catalog release.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    responses:
      '200':
        description: The stencil, and the instances that do not fit it
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/MarkStencilReadyResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

stencil-usage:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: listStencilUsage
    summary: List the template variants that use the stencil
    description: Every template variant in this release with an instance of the stencil, and whether that instance fits the stencil.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: The template variants using the stencil
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilUsageListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
