stencils:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: listStencils
    summary: List stencils for a tenant
    description: Retrieve all stencils belonging to a specific tenant, optionally filtered by search term or tags.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    parameters:
      - name: q
        in: query
        description: Search term for filtering stencils by name or description
        schema:
          type: string
      - name: tag
        in: query
        description: Filter stencils by tag
        schema:
          type: string
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of stencils
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createStencil
    summary: Create a new stencil
    description: |
      Create a new stencil for the specified tenant. If content is provided,
      a draft version (version 1) is automatically created with that content.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/CreateStencilRequest'
    responses:
      '201':
        description: Stencil created successfully
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

stencils-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: getStencil
    summary: Get stencil by ID
    description: Retrieve details of a specific stencil including its version summaries.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    responses:
      '200':
        description: Stencil details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateStencil
    summary: Update a stencil
    description: |
      Update a stencil's metadata (name, description, tags).
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/UpdateStencilRequest'
    responses:
      '200':
        description: Stencil updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteStencil
    summary: Delete a stencil
    description: |
      Delete a stencil and all its versions. Templates that already contain
      copies of this stencil's content are not affected (the embedded content remains).
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    responses:
      '204':
        description: Stencil deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

stencil-content:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: getStencilContent
    summary: Get the stencil's content
    description: The stencil's content in this catalog version, with its status against the version's base.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_VIEW]
    responses:
      '200':
        description: The stencil's content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateStencilContent
    summary: Update the stencil's content in a draft
    description: |
      Replaces the stencil's content in the draft, and its parameters when `parameterSchema` is
      given: left out, they stay; `{}` removes them. Templates keep rendering the stencil's ready
      content until this content is marked ready.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/stencils.yaml#/UpdateStencilContentRequest'
    responses:
      '200':
        description: The updated content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/StencilContentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

stencil-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: stencilKey
      in: path
      required: true
      description: Key of the stencil
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  post:
    operationId: markStencilReady
    summary: Mark the stencil ready
    description: |
      Records that the stencil's current content is reviewed, and nothing else: every instance
      already renders the stencil as it is (ADR 0006). The response names the instances that do not
      fit the content, which block the catalog release.
    tags:
      - Stencils
    x-required-permissions: [STENCIL_EDIT]
    responses:
      '200':
        description: The stencil, and the instances that do not fit it
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/stencils.yaml#/MarkStencilReadyResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

