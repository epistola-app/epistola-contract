# Consumer Registration and Lifecycle Endpoints (tenant-scoped)

consumer-register:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: registerConsumer
    x-experimental: true
    summary: Register a new consumer in this tenant
    description: |
      **Experimental** (see the Consumers tag).

      Self-service registration for consumer applications using self-signed JWT
      authentication. The consumer is created in `pending` status within this
      tenant until a tenant manager approves the registration.

      This endpoint requires no authentication — the public key in the request
      body establishes the consumer's identity for future authentication.

      OAuth consumers do not use this endpoint. They are auto-registered as
      `pending` on their first authenticated request to this tenant.

      API-key consumers do not use this endpoint either. They are provisioned
      out of band by a tenant manager (api-key creation is a manager-side
      action, not a self-service flow) and materialize directly as `active`.
    tags:
      - Consumers
    security: []
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/RegisterConsumerRequest'
    responses:
      '201':
        description: Consumer registered (status = pending)
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The consumer's address (`getConsumer`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

consumer-collection:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listConsumers
    x-experimental: true
    summary: List consumers in this tenant
    description: |
      **Experimental** (see the Consumers tag).

      Retrieve a paginated list of consumers registered in this tenant
      with optional filtering by status.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    parameters:
      - name: q
        in: query
        description: Search term for filtering consumers by name or ID
        schema:
          type: string
      - name: status
        in: query
        description: Filter by consumer status
        schema:
          type: string
          enum: [pending, active, rejected, expired, inactive]
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: List of consumers
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'

consumer-resource:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: consumerId
      in: path
      required: true
      description: Unique slug identifier of the consumer
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: getConsumer
    x-experimental: true
    summary: Get consumer by ID
    description: |
      **Experimental** (see the Consumers tag).

      Retrieve details of a specific consumer in this tenant.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    responses:
      '200':
        description: Consumer details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateConsumer
    x-experimental: true
    summary: Update consumer metadata or permissions
    description: |
      **Experimental** (see the Consumers tag).

      Update a consumer's metadata or permissions within this tenant.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/UpdateConsumerRequest'
    responses:
      '200':
        description: Consumer updated
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteConsumer
    x-experimental: true
    summary: Delete a consumer
    description: |
      **Experimental** (see the Consumers tag).

      Permanently remove a consumer from this tenant.

      **Effect on generation results:**
      - Partitions assigned to this consumer's nodes are released.
      - Uncollected generation results remain in the system but are no longer
        deliverable via the `/generation/collect` endpoint.
      - Generated documents can still be accessed directly via
        `GET /tenants/{tenantKey}/documents/{documentId}`.
      - The `createdBy` field on documents retains the consumer ID
        (orphaned reference).
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    responses:
      '204':
        description: Consumer deleted
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

consumer-approve:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: consumerId
      in: path
      required: true
      description: Unique slug identifier of the consumer to approve
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: approveConsumer
    x-experimental: true
    summary: Approve a pending consumer
    description: |
      **Experimental** (see the Consumers tag).

      Approve a consumer registration within this tenant. Sets the granted
      permissions and optional expiry. The consumer transitions from `pending`
      to `active`.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/ApproveConsumerRequest'
    responses:
      '200':
        description: Consumer approved (status = active)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

consumer-reject:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: consumerId
      in: path
      required: true
      description: Unique slug identifier of the consumer to reject
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: rejectConsumer
    x-experimental: true
    summary: Reject a pending consumer
    description: |
      **Experimental** (see the Consumers tag).

      Reject a consumer registration. The consumer transitions from `pending`
      to `rejected`. Optionally provide a reason.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    requestBody:
      required: false
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/RejectConsumerRequest'
    responses:
      '200':
        description: Consumer rejected (status = rejected)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

consumer-public-key:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: consumerId
      in: path
      required: true
      description: Unique slug identifier of the consumer
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  put:
    operationId: rotatePublicKey
    x-experimental: true
    summary: Rotate public key
    description: |
      **Experimental** (see the Consumers tag).

      Replace the public key for a self-signed JWT consumer. Only the consumer itself may rotate
      it: the request must carry a self-signed JWT (`Authorization: Bearer`) issued by the consumer
      named in the path (`iss`) and signed with its current key. No permission and no API key
      admits anyone else, a tenant manager included: an API key, or a JWT of another consumer, is
      refused with 403. After rotation, the old key is immediately invalidated.

      An API-key consumer cannot rotate this way; a tenant manager issues a new key and revokes the
      old one out of band.
    tags:
      - Consumers
    x-required-authentication: true
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/RotatePublicKeyRequest'
    responses:
      '200':
        description: Public key rotated
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
