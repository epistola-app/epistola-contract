      in: path
      required: true
      description: Unique slug identifier of the consumer to approve
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: approveConsumer
    x-experimental: true
    summary: Approve a pending consumer
    description: |
      **Experimental** — Epistola Suite may not implement this operation yet.

      Approve a consumer registration within this tenant. Sets the granted
      permissions and optional expiry. The consumer transitions from `pending`
      to `active`.
    tags:
      - Consumers
    x-required-permissions: [TENANT_USERS]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/consumers.yaml#/ApproveConsumerRequest'
    responses:
      '200':
        description: Consumer approved (status = active)
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/consumers.yaml#/ConsumerDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

