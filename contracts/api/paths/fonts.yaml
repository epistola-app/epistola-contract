fonts:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
  get:
    operationId: listFonts
    summary: List font families in a catalog
    description: |
      Retrieve all font families in the given tenant + catalog, each with the
      weight/italic faces it ships. Families of a catalog that cannot be
      changed in this installation (e.g. the bundled `system` catalog) are
      flagged `readOnly: true`.

      Read-only: font families and their binaries are managed through the UI
      and catalog exchange only — there is no create/update/delete over REST.
    tags:
      - Fonts
    x-required-permissions: [REFERENCE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of font families.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/fonts.yaml#/FontListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

fonts-key:
  parameters:
    - name: tenantKey
      in: path
      required: true
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: fontKey
      in: path
      required: true
      description: Key of the font family.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
  get:
    operationId: getFont
    summary: Get a font family
    tags:
      - Fonts
    x-required-permissions: [REFERENCE_VIEW]
    responses:
      '200':
        description: Font family.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/fonts.yaml#/FontDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
