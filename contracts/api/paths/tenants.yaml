tenants:
  get:
    operationId: listTenants
    summary: List the tenants the caller can access
    description: |
      A page of the tenants the authenticated caller may access, optionally filtered by `q`. A
      caller whose credential is bound to one tenant, such as a tenant's API key, sees that tenant
      only; a tenant it cannot access is never listed, so the list does not reveal which tenants
      exist.
    tags:
      - Tenants
    x-required-authentication: true
    parameters:
      - name: q
        in: query
        description: Search term for filtering tenants by name
        schema:
          type: string
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: List of tenants
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/tenants.yaml#/TenantListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'

  post:
    operationId: createTenant
    summary: Create a new tenant
    description: Create a new tenant with the given key and name. A key another tenant already has is refused with 409.
    tags:
      - Tenants
    x-required-platform-roles: [TENANT_MANAGER]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/tenants.yaml#/CreateTenantRequest'
    responses:
      '201':
        description: Tenant created successfully
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The tenant's address (`getTenant`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/tenants.yaml#/TenantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

tenants-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'

  get:
    operationId: getTenant
    summary: Get a tenant by key
    description: Retrieve details of a specific tenant.
    tags:
      - Tenants
    x-required-authentication: true
    responses:
      '200':
        description: Tenant details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/tenants.yaml#/TenantDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateTenant
    summary: Update a tenant
    description: |
      Update the name of an existing tenant.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Tenants
    x-required-permissions: [TENANT_SETTINGS]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/tenants.yaml#/UpdateTenantRequest'
    responses:
      '200':
        description: Tenant updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/tenants.yaml#/TenantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'
  delete:
    operationId: deleteTenant
    summary: Delete a tenant
    description: Delete a tenant and all associated templates.
    tags:
      - Tenants
    x-required-platform-roles: [TENANT_MANAGER]
    responses:
      '204':
        description: Tenant deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
