templates:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: listTemplates
    summary: List the templates in a release of a catalog
    description: Retrieve the document templates of this release.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - name: q
        in: query
        description: Search term for filtering templates by name
        schema:
          type: string
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of templates
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/templates.yaml#/TemplateListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createTemplate
    summary: Create a new template
    description: Create a document template in the draft.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/templates.yaml#/CreateTemplateRequest'
    responses:
      '201':
        description: Template created successfully
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The template's address (`getTemplate`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/templates.yaml#/TemplateDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'

templates-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getTemplate
    summary: Get a template by key
    description: Retrieve details of a specific document template including its model and data examples.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Template details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/templates.yaml#/TemplateDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateTemplate
    summary: Update a template
    description: |
      Update a document template's properties, data model or data examples in the draft. The data contract is part of the template: an edit clears the template's ready mark, and
      a change that breaks callers is reported when the catalog is released, not here.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/templates.yaml#/UpdateTemplateRequest'
    responses:
      '200':
        description: Template updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/templates.yaml#/TemplateDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'
      '422':
        $ref: '../components/responses/problem-responses.yaml#/UnprocessableEntityError'

  delete:
    operationId: deleteTemplate
    summary: Delete a template
    description: Delete a document template.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '204':
        description: Template deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'

template-validate:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  post:
    operationId: validateTemplateData
    summary: Validate template input data
    description: |
      Validate input data against the template's JSON Schema before submitting a generation job.
      This endpoint provides pre-flight validation to catch schema violations early, enabling
      faster feedback during development and before batch submission.

      Besides `errors`, the result says which fields are missing (`missingFields`) and which supplied
      values are wrong (`invalidFields`), each with a JSON Pointer into `data` and the field's JSON
      Schema, so a client can ask for exactly those. The data is checked against the release that
      would be rendered for the same selection (`versionRange`, `environmentKey`, or the highest
      release), and the optional fields that release's template reads are reported as missing too.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_VIEW]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/validation.yaml#/ValidateTemplateDataRequest'
    responses:
      '200':
        description: Validation completed (check the 'valid' field for result)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/validation.yaml#/TemplateDataValidationResult'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

template-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  post:
    operationId: markTemplateReady
    summary: Mark every variant of the template ready
    description: |
      Marks each variant of the template ready, including its data contract, in one action. Returns
      the template with the status of each variant.
    tags:
      - Templates
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '200':
        description: The template, with each variant's status
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/templates.yaml#/TemplateDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
