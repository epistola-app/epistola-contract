  get:
    operationId: listEnvironmentOverrides
    summary: List an environment's overrides
    description: |
      Every catalog the environment overrides, at most one override per catalog: the release it uses
      in place of the highest it serves, or the draft it follows. See `setEnvironmentOverride`.
    tags:
      - Environments
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: The environment's overrides
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentOverrideListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

environment-override:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: environmentKey
      in: path
      required: true
      description: Key of the environment
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 30
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  put:
    operationId: setEnvironmentOverride
    summary: Override which version of a catalog an environment uses
    description: |
      Sets which version of the catalog the environment uses as its latest, replacing any override
      it had for the catalog:

      - **a release** it serves (`releaseVersion`), such as an earlier one to roll back to without
        undeploying anything; or
      - **a draft** of the catalog (`catalogVersion`: `next` or a `draftId`), rendered live with no
        release, to try the next version or long-term work. Following the next version follows the
        catalog's next version, whichever draft that is.

      A generation or preview request through the environment (`environmentKey`) that names no
      `version`, or a version range, gets the override; one naming an exact release still gets that
      release. A document rendered from a draft carries the draft's id and its name at render time
      (`draftId`, `draftLabel`), and its PDF a preview watermark.

      A **production** environment uses only published versions: a draft there is refused with 409
      (`environment-override-refused`), and so is a release the environment does not serve.
      Neither or both of `releaseVersion` and `catalogVersion` is refused with 400.

      The override ends when the release it names is undeployed (`undeployRelease`) or the draft it
      follows is discarded (`deleteCatalogDraft`). Promoting long-term work (`promoteCatalogDraft`)
      moves environments following the next version to the new next version. Every change is
      recorded in the deployment history (`override-set`, `override-cleared`).
    tags:
      - Environments
    x-required-permissions: [ENVIRONMENT_DEPLOY]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/environments.yaml#/SetEnvironmentOverrideRequest'
    responses:
      '200':
        description: The override
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentOverrideDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/EnvironmentOverrideRefusedError'

  delete:
    operationId: clearEnvironmentOverride
    summary: Clear an environment's override of a catalog
    description: |
      The environment uses the highest release of the catalog it serves again (or the highest that
      satisfies a request's `version`). Clearing a catalog the environment does not override changes
      nothing and succeeds.
    tags:
      - Environments
    x-required-permissions: [ENVIRONMENT_DEPLOY]
    responses:
      '204':
        description: The environment no longer overrides the catalog
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

