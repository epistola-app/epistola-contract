environments:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listEnvironments
    summary: List environments for a tenant
    description: Retrieve all environments configured for a specific tenant.
    tags:
      - Environments
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of environments
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createEnvironment
    summary: Create a new environment
    description: |
      Create a new environment for the specified tenant. `production` marks it as a production
      environment, which uses only published versions.
    tags:
      - Environments
    x-required-permissions: [TENANT_SETTINGS]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/environments.yaml#/CreateEnvironmentRequest'
    responses:
      '201':
        description: Environment created successfully
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

environments-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: environmentKey
      in: path
      required: true
      description: Key of the environment (e.g., "production", "staging")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 30

  get:
    operationId: getEnvironment
    summary: Get environment by ID
    description: Retrieve details of a specific environment.
    tags:
      - Environments
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Environment details
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateEnvironment
    summary: Update an environment
    description: |
      Update an existing environment's name, or whether it is a production environment. Marking it
      production while it follows a draft of any catalog is refused with 409
      (`environment-override-refused`): a production environment uses only published versions.
    tags:
      - Environments
    x-required-permissions: [TENANT_SETTINGS]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/environments.yaml#/UpdateEnvironmentRequest'
    responses:
      '200':
        description: Environment updated successfully
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/EnvironmentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/EnvironmentOverrideRefusedError'

  delete:
    operationId: deleteEnvironment
    summary: Delete an environment
    description: Delete an environment. Refused while it serves any catalog release; undeploy them first.
    tags:
      - Environments
    x-required-permissions: [TENANT_SETTINGS]
    responses:
      '204':
        description: Environment deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

environment-deployments:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: environmentKey
      in: path
      required: true
      description: Key of the environment
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 30

  get:
    operationId: listEnvironmentDeployments
    summary: List what an environment serves
    description: |
      Every catalog release the environment serves; one catalog can have several. Generation naming
      the environment renders the highest of them, or the highest that satisfies the request's
      `version`, unless the environment overrides the catalog (`listEnvironmentOverrides`).
    tags:
      - Environments
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: The environment's deployments
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/DeploymentListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

environment-deployment-release:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: environmentKey
      in: path
      required: true
      description: Key of the environment
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 30
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - name: releaseVersion
      in: path
      required: true
      description: The release of the catalog
      schema:
        type: string
        minLength: 1
        maxLength: 50

  put:
    operationId: deployRelease
    summary: Deploy a catalog release to an environment
    description: |
      The environment serves this release of the catalog from now on, beside any other releases of
      it that it already serves (unless `replace=true`, below). Generation naming the environment
      renders the highest release it serves, or the highest that satisfies the request's `version`;
      so deploying a higher release moves such requests to it, and undeploying it moves them back. Requests already accepted keep
      the release they were bound to. An environment override of the catalog
      (`setEnvironmentOverride`) takes precedence for requests naming no version or a range.
      Deploying a release the environment already serves changes nothing, apart from what
      `replace=true` stops.

      A release renders with the releases of other catalogs it was cut with (its `dependencies`,
      direct and through other dependencies), from the tenant's copy whatever the environment
      serves. Deploying it makes the environment use them implicitly: they are not deployed, and
      nothing else the environment serves changes. A dependency release the tenant does not have yet
      is installed first: fetched from its registry, through the registry's configured mirrors, and
      checked against the fingerprint it was recorded with. When one cannot be had
      (`UNAVAILABLE`), the deployment is refused with
      `release-dependencies-missing` (409), whose `missingDependencies` lists those. Nothing is
      deployed.

      With `includeDependencies=true`, the dependency releases the environment does not serve are
      also deployed explicitly, in the same transaction, all or nothing.

      With `replace=true`, the environment also stops serving the catalog's other releases, in the
      same transaction: each is undeployed, and logged as undeployed in the deployment history, just
      as `undeployRelease` would. Without it, the release is added beside the others.

      Epistola Suite may not implement installing missing dependency releases yet.
    tags:
      - Environments
    x-required-permissions: [ENVIRONMENT_DEPLOY]
    parameters:
      - name: includeDependencies
        in: query
        required: false
        description: |
          Also deploy, explicitly, the dependency releases the environment does not serve. When
          false or omitted, the environment uses them implicitly, without deploying them.
        schema:
          type: boolean
          default: false
      - name: replace
        in: query
        required: false
        description: |
          Also stop serving the catalog's other releases in this environment, each undeployed (and
          logged as undeployed). When false or omitted, the release is added beside the others the
          environment serves.
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: The deployment
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/environments.yaml#/DeploymentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ReleaseDependenciesMissingError'

  delete:
    operationId: undeployRelease
    summary: Stop an environment serving a catalog release
    description: |
      The environment stops serving this release. Generation naming the environment then renders
      the highest release of the catalog it still serves, and fails for the catalog's templates when
      it serves none. An override naming this release (`setEnvironmentOverride`) ends with it.
    tags:
      - Environments
    x-required-permissions: [ENVIRONMENT_DEPLOY]
    responses:
      '204':
        description: The environment no longer serves the release
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

environment-overrides:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: environmentKey
      in: path
      required: true
      description: Key of the environment
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
