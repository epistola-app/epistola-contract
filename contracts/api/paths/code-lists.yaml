code-lists:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
  get:
    operationId: listCodeLists
    summary: List code lists in a catalog
    description: |
      Retrieve all code lists in the given tenant + catalog. Code lists from
      a SUBSCRIBED catalog (e.g. the bundled `system` catalog) are flagged
      `readOnly: true`.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of code lists.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  post:
    operationId: createCodeList
    summary: Create a new code list
    description: |
      Create a new code list. SUBSCRIBED catalogs are read-only; writes return
      409. Duplicate key within the same tenant + catalog returns 409.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/code-lists.yaml#/CreateCodeListRequest'
    responses:
      '201':
        description: Code list created.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

code-lists-key:
  parameters:
    - name: tenantKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: codeListKey
      in: path
      required: true
      description: Key of the code list.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  get:
    operationId: getCodeList
    summary: Get a code list
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_VIEW]
    responses:
      '200':
        description: Code list.
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  patch:
    operationId: updateCodeList
    summary: Update a code list
    description: |
      Patch a code list. All fields optional. Providing `entries` replaces them
      atomically. Updates to a SUBSCRIBED-catalog code list return 409.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/code-lists.yaml#/UpdateCodeListRequest'
    responses:
      '200':
        description: Code list updated.
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'
  delete:
    operationId: deleteCodeList
    summary: Delete a code list
    description: |
      Delete a code list. Returns 409 if any attribute still binds to it
      (unbind it first) or if the catalog is SUBSCRIBED.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_EDIT]
    responses:
      '204':
        description: Code list deleted.
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

code-list-refresh:
  parameters:
    - name: tenantKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: codeListKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  post:
    operationId: refreshCodeList
    summary: Refresh a URL-sourced code list from its source
    description: |
      Re-fetches entries from the code list's `sourceUrl`. Only valid for
      `sourceType: URL` — 400 otherwise. `lastRefreshedAt` is updated on
      success; `lastRefreshError` is set and the previous entries are kept
      on failure.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_EDIT]
    responses:
      '200':
        description: Refresh succeeded; returns the updated code list.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

code-list-entries:
  parameters:
    - name: tenantKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: codeListKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: includeHidden
      in: query
      required: false
      description: "Include entries flagged `hidden: true`. Defaults to false."
      schema:
        type: boolean
        default: false
  get:
    operationId: listCodeListEntries
    summary: List entries of a code list
    description: |
      Returns entries ordered by `sortOrder` ascending, then `code` ascending.
      Hidden entries are filtered out unless `includeHidden=true`.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_VIEW]
    responses:
      '200':
        description: List of entries.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListEntriesResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

code-list-entry-hidden:
  parameters:
    - name: tenantKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: codeListKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: code
      in: path
      required: true
      description: Code-list entry code.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  patch:
    operationId: updateCodeListEntryHidden
    summary: Hide or show a code-list entry
    description: |
      Set the `hidden` flag for one entry. Hidden entries remain valid for
      existing variants, but are filtered from pickers and from
      `listCodeListEntries` unless `includeHidden=true`.
    tags:
      - CodeLists
    x-required-permissions: [REFERENCE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/code-lists.yaml#/UpdateCodeListEntryHiddenRequest'
    responses:
      '200':
        description: Updated entry.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/code-lists.yaml#/CodeListEntryDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
