themes:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: listThemes
    summary: List the themes in a catalog version
    description: Retrieve the themes of this catalog version.
    tags:
      - Themes
    x-required-permissions: [THEME_VIEW]
    parameters:
      - name: q
        in: query
        description: Search term to filter themes by name
        schema:
          type: string
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of themes
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/themes.yaml#/ThemeListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createTheme
    summary: Create a new theme
    description: Create a theme in the draft.
    tags:
      - Themes
    x-required-permissions: [THEME_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/themes.yaml#/CreateThemeRequest'
    responses:
      '201':
        description: Theme created successfully
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The theme's address (`getTheme`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/themes.yaml#/ThemeDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

themes-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: themeKey
      in: path
      required: true
      description: Key of the theme
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getTheme
    summary: Get a theme by key
    description: Retrieve details of a specific theme.
    tags:
      - Themes
    x-required-permissions: [THEME_VIEW]
    responses:
      '200':
        description: Theme details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/themes.yaml#/ThemeDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateTheme
    summary: Update a theme
    description: |
      Update an existing theme. Only provided fields will be updated.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Themes
    x-required-permissions: [THEME_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/themes.yaml#/UpdateThemeRequest'
    responses:
      '200':
        description: Theme updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/themes.yaml#/ThemeDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteTheme
    summary: Delete a theme
    description: |
      Delete the theme from the draft. Refused with 409 in a released version, and while anything
      in the draft still uses it: a template or variant that names it, or the version's default
      theme (`defaultTheme`). A render never falls back to other styles because a theme
      it names is missing; change those references first.
    tags:
      - Themes
    x-required-permissions: [THEME_EDIT]
    responses:
      '204':
        description: Theme deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
