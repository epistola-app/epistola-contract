attributes:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
  get:
    operationId: listAttributes
    summary: List the attribute definitions in a catalog version
    description: >-
      Retrieve the attribute definitions of this catalog version.
      Attribute definitions describe the keys that can be used for variant selection.
    tags:
      - Attributes
    x-required-permissions: [REFERENCE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of attribute definitions
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/attributes.yaml#/AttributeListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  post:
    operationId: createAttribute
    summary: Create a new attribute definition
    description: Create an attribute definition in the draft.
    tags:
      - Attributes
    x-required-permissions: [REFERENCE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/attributes.yaml#/CreateAttributeRequest'
    responses:
      '201':
        description: Attribute definition created successfully
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/attributes.yaml#/AttributeDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

attributes-key:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: attributeKey
      in: path
      required: true
      description: The attribute key (e.g., "language", "brand")
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  get:
    operationId: getAttribute
    summary: Get an attribute definition
    description: Retrieve a specific attribute definition by key.
    tags:
      - Attributes
    x-required-permissions: [REFERENCE_VIEW]
    responses:
      '200':
        description: Attribute definition details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/attributes.yaml#/AttributeDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  patch:
    operationId: updateAttribute
    summary: Update an attribute definition
    description: |
      Update an attribute definition's `displayName`, `description` and constraint: its inline
      `allowedValues`, or the code list it binds (`codeListBinding`). Omitted members are left as
      they are. The constraint may switch kind, as `UpdateAttributeRequest` describes; mixing both
      kinds is refused with 400 `validation-error`, and an attribute of a SUBSCRIBED catalog with
      409.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Attributes
    x-required-permissions: [REFERENCE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/attributes.yaml#/UpdateAttributeRequest'
    responses:
      '200':
        description: Attribute definition updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/attributes.yaml#/AttributeDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'
  delete:
    operationId: deleteAttribute
    summary: Delete an attribute definition
    description: Delete an attribute definition. Existing variant attributes using this key are not affected.
    tags:
      - Attributes
    x-required-permissions: [REFERENCE_EDIT]
    responses:
      '204':
        description: Attribute definition deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
