catalogs:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'

  get:
    operationId: listCatalogs
    summary: List catalogs for a tenant
    description: Returns all catalogs (authored and subscribed) for the specified tenant.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of catalogs
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-available-releases:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: listAvailableCatalogReleases
    summary: List the releases a subscribed catalog's source offers that the tenant has not installed
    description: |
      Read-only. Lists every release of a subscribed catalog that its source, the catalog's registry
      (or a mirror of it the server is configured with), offers and the tenant has not installed,
      lowest first. Not only those above the highest installed release: a fix to an older line
      (`1.4.1`) is listed while the tenant has `2.0.0`.

      For each, the release it is compared to (`comparedTo`): the closest installed release whose
      version is below it, or null when the tenant has none below it. What it added, modified and removed
      against `comparedTo` (everything added when `comparedTo` is null), and the releases of other
      catalogs it pins, each with whether the tenant has it already.

      Nothing is installed: `POST .../available-releases/{version}/install` installs one of
      them, beside the others. A catalog that is not subscribed has no source and is refused with
      409 `conflict`. When the source cannot be reached, or answers with an error or with something
      that is not a valid answer, the request fails with `catalog-source-unavailable`: 503 when it
      could not be reached or did not answer in time, possibly with `Retry-After`, and 502 when it
      answered badly.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The releases the source offers that the tenant has not installed
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/AvailableCatalogReleases'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '502':
        $ref: '../components/responses/problem-responses.yaml#/CatalogSourceBadGatewayError'
      '503':
        $ref: '../components/responses/problem-responses.yaml#/CatalogSourceUnavailableError'

catalog-available-release-install:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - name: version
      in: path
      required: true
      description: The version of the release to install, one the source offers
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ReleaseVersion'
  post:
    operationId: installCatalogRelease
    summary: Install a release of a subscribed catalog from its source
    description: |
      Install a release of a subscribed catalog fetched from its source, exactly as `importCatalog`
      installs the release an archive carries. It is fetched from the catalog's registry, through
      a mirror of it the server is configured with, and installed as an immutable release, side by side
      with the releases of the catalog the tenant has, whether its version is above theirs or below.
      Nothing is updated in place and nothing is removed: the releases installed before stay, and
      every draft, deployment and catalog that uses them keeps doing so. Which release an
      environment serves is decided by deploying it (`deployCatalogRelease`).
      `GET .../available-releases` lists the releases the source offers that the tenant lacks.

      - **A release the tenant does not have** is installed (`newlyInstalled: true`).
      - **The same version with the same fingerprint** is the release the tenant has already: nothing
        changes (`newlyInstalled: false`).
      - **The same version with a different fingerprint** is different content under one name: the
        install is refused with 409 `conflict`, and nothing changes.

      The releases of other catalogs the release pins (`catalogDependencies`), directly or through
      other pins, are installed first, each before every release that pins it, as an import
      installs the releases an archive carries: those the tenant lacks are fetched and installed
      (`installedDependencies`), each in a subscribed catalog when the tenant does not have that
      catalog; those it has with the same fingerprint are left alone (`presentDependencies`). One
      the tenant has under the same version with a different fingerprint refuses the install with
      409 `conflict`; one that cannot be fetched, or does not match its pin's
      `releaseFingerprint`, refuses it with 409 `release-dependencies-missing`, listing each
      (`unavailable`). Installing is all or nothing, in one transaction.

      A catalog that is not subscribed has no source and is refused with 409 `conflict`. A
      `version` the source does not offer is refused with 404 `not-found`. When the
      catalog's source cannot be reached, or answers with an error or with something that is not a
      valid answer, the request fails with `catalog-source-unavailable` and nothing is installed:
      503 when it could not be reached or did not answer in time, possibly with `Retry-After`, and
      502 when it answered badly.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    responses:
      '200':
        description: The release is installed, or was already present
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/InstallCatalogReleaseResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ReleaseDependenciesMissingError'
      '502':
        $ref: '../components/responses/problem-responses.yaml#/CatalogSourceBadGatewayError'
      '503':
        $ref: '../components/responses/problem-responses.yaml#/CatalogSourceUnavailableError'

catalog-changes:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: getCatalogChanges
    summary: List a release's changes since its base
    description: |
      Every resource of the release that is `new`, `modified` or `ready`, and the resources removed
      since its base, the release the draft started from. For a draft, `releasable` says whether
      releasing it would be accepted now; once released it has no changes and is not releasable.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The release's changes
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  post:
    operationId: markCatalogReady
    summary: Mark every changed resource of a draft ready
    description: |
      Marks each `new` or `modified` resource of the draft ready in one action, and returns the
      changes that remain. Refused with 409 outside a draft.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT, STENCIL_EDIT]
    responses:
      '200':
        description: The draft's changes after marking ready
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-dependencies:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: listCatalogDependencies
    summary: List the catalogs a release depends on
    description: |
      The dependencies declared in the release, each with the exact release it pins, or, in
      a draft, the draft of it the draft uses. A resource can reference another catalog's resources
      only through a declared dependency.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The declared dependencies
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateCatalogDependencies
    summary: Replace the catalogs a draft depends on
    description: |
      Replaces the dependencies declared in a draft of an authored catalog. The change is released
      with the draft, like any other change. Each catalog is declared at most once, with the exact
      release the catalog renders with (`version`), so a release renders with exactly the
      releases its dependencies pin. A declaration names an exact release, never a range.

      In a draft, a declaration may name a **draft** of the other catalog instead (`releaseId`), to
      build on work that is not released yet: this draft then renders with that draft, live. A
      release never pins a draft, so releasing this one is refused until that draft is released,
      or the release takes it along (`releaseDependencies` on `releaseCatalogDraft`).

      Refused with 409 outside a draft, and for a subscribed catalog, whose dependencies are its
      publisher's.

      Send the `ETag` from `listCatalogDependencies` or `getCatalogRelease` as `If-Match` to have
      the update refused with 412 `resource-modified` if the draft's settings or dependency
      declarations changed since; without it, the last write wins.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpdateCatalogDependenciesRequest'
    responses:
      '200':
        description: The declared dependencies after the change
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

catalog-releases:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: listCatalogReleases
    summary: List a catalog's releases
    description: |
      The catalog's releases, drafts included: its drafts, oldest first, then its released
      releases, highest version first. A subscribed catalog lists the releases it installed, and has
      no drafts.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - name: status
        in: query
        required: false
        description: Only releases with this status. Omitted, every release.
        schema:
          $ref: '../components/schemas/catalogs.yaml#/CatalogReleaseStatus'
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: The catalog's releases
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogReleaseListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createCatalogRelease
    summary: Start a draft release
    description: |
      Starts a release of an authored catalog, always as a draft. A catalog has any number of
      drafts, each named, and each released on its own. A draft has no version until it is
      released, and keeps its `releaseId` and its name when it is.

      - With `from` a released release, it starts as a copy of it, which is its base. A fix to an
        older line is a draft from a release of that line (`1.4.0`, released as `1.4.1` while
        `2.0.0` exists).
      - With `from` another draft's `releaseId`, it starts as a copy of that draft, unreleased
        changes included, on that draft's base.
      - Without `from`, it starts as a copy of the catalog's highest release, or empty,
        with no base, when the catalog has none.


      The base is fixed. Nothing is merged: the draft is an independent copy, and the releases it is
      **behind** are listed (see `CatalogReleaseDto.behind`).

      Refused with 409 when another draft of the catalog has the name, and for a subscribed catalog.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/CreateCatalogReleaseRequest'
    responses:
      '201':
        description: The draft
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The draft's address, by its `releaseId` (`getCatalogRelease`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogReleaseDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-release:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: getCatalogRelease
    summary: Get a release of a catalog
    description: |
      One release of the catalog: a draft, by its `releaseId`, or a released one, by its
      `releaseId` or its version, which return the same release. A released one also lists
      the releases of other catalogs it renders with. Both list the environments that serve them.
      The id of a discarded draft addresses nothing: 404.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The release
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogReleaseDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateCatalogRelease
    summary: Update a draft release's name, default theme or presets
    description: |
      Changes a draft's own settings: its name, its default theme (the theme a template that names
      none renders with) and its declared presets (the block styles its content may name). Each
      changes only when the request names it: an omitted member keeps its value, and null clears a
      default theme or the presets (an empty array clears the presets too). Its address, its
      `releaseId`, does not change, and it keeps its name when it is released. Refused with 409 for
      a name another draft of the catalog has, and outside a draft: a released release cannot be
      changed, its name included; with 400 for a default theme that cannot be found or names a
      catalog the draft does not declare, and for presets that repeat a key.

      Send the `ETag` from `getCatalogRelease` or `listCatalogDependencies` as `If-Match` to have
      the update refused with 412 `resource-modified` if the draft's settings or dependency
      declarations changed since; without it, the last write wins.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpdateCatalogReleaseRequest'
    responses:
      '200':
        description: The draft, as changed
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogReleaseDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteCatalogRelease
    summary: Discard a draft release
    description: |
      Discards a draft and everything changed in it; its `releaseId` then addresses nothing. Where
      the draft is deployed (`deployCatalogRelease`), the deployment ends, recorded as `undeployed`.

      Refused with 409 outside a draft (a released release is never deleted), while a dependency
      declaration in a draft of another catalog names this draft, and while the draft alone holds a resource something outside it
      still uses (a theme another catalog's templates or variants name, or another catalog names
      as its default theme, `defaultTheme`; a code list another catalog's attribute binds).
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    responses:
      '204':
        description: The draft is discarded
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-release-preview:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  get:
    operationId: previewCatalogDraftRelease
    summary: Preview the version a draft is released as
    description: |
      The version releasing the draft would give it, **without releasing it**: the kind of change it
      holds against its base, why, the version that needs (`needed`), and the version it gets
      (`suggested`): `needed`, or the next free version of the same kind when another release
      already has it. Refused with 409 outside a draft.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The version, and why
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDraftReleasePreview'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-release-action:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'

  post:
    operationId: releaseCatalogDraft
    summary: Release a draft
    description: |
      Releases a draft of an authored catalog. Any draft can be released, whatever else
      the catalog has released since it started.

      **The version** follows from the kind of change against the draft's base: corrections raise
      the patch, additions the minor, breaking changes the major (`previewCatalogDraftRelease`).
      Omitted `version`: that version, or the next free one of the same kind when another
      release already has it (`suggested`). A given `version` must be one no release of the
      catalog has, above the base and no lower than the changes need (`needed`), or the request is
      refused with 400. From `1.4.0`, while `1.5.0` and `2.0.0` exist, a fix becomes `1.4.1`, and a breaking
      redesign `3.0.0`.

      A release contains the whole draft: it is refused while any resource is `new` or `modified`.

      A draft that is **behind** (see `CatalogReleaseDto.behind`, recomputed for the version it is
      released as) does not contain those releases' changes unless an author applied them by hand,
      which the server cannot tell. Releasing it is refused with 409 unless `acknowledgedBehind`
      names every one.

      Each declared dependency pins one release, and the releases it pins pin theirs in turn; the
      release records them all. It is refused when a resource references a catalog that is not
      declared, when a declaration pins no release or one the tenant does not have, or when two
      paths through the dependencies pin different releases of one catalog. A declaration that
      names a **draft** of another catalog is refused with 409 (`release-dependencies-unreleased`,
      listing each such draft), unless `releaseDependencies` releases those drafts along with it:
      each first, recursively, as the version its own changes need, in the same transaction, all
      or nothing, and the new release pins them as released (`releasedDependencies`).

      The draft becomes released at that version, immutable. It keeps its `releaseId`, which
      addresses it as the version does, and its name; writes through either are refused with 409.
      Where the draft, or a draft released along with it, is deployed, the environment now serves
      it as released, an explicit deployment recorded as `released` in the deployment history.
      Other drafts are untouched; the response names those the release puts behind (`draftsBehind`).
