catalogs:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listCatalogs
    summary: List catalogs for a tenant
    description: Returns all catalogs (authored and subscribed) for the specified tenant.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of catalogs
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade-preview:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: previewCatalogUpgrade
    summary: Preview a catalog upgrade
    description: |
      Preview what upgrading a SUBSCRIBED catalog to its source's latest
      release would do, **without applying it**. Re-fetches the source
      manifest and diffs it against the installed release (source-vs-source):
      added / removed / changed / unchanged resources (each `type/key`), plus
      any cross-catalog conflicts that would block removals.

      Read-only. Apply the returned change set with `POST .../upgrade`.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The upgrade diff.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogUpgradeDiff'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
  post:
    operationId: upgradeCatalog
    summary: Upgrade a subscribed catalog
    description: |
      Re-fetch the source catalog and install its latest release in an existing SUBSCRIBED
      catalog. The releases installed before stay: catalogs whose dependencies resolve to one of
      them, and environments that serve one, keep rendering it.

      The whole manifest is reconciled: resources added since the installed release are
      installed, changed ones are updated in place, and resources the publisher no longer
      publishes are removed — the last only when nothing outside the catalog still references
      them, otherwise the upgrade is rejected and nothing changes. Use
      `GET .../upgrade-preview` to see all three before applying.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    responses:
      '200':
        description: Upgrade result.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/UpgradeCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-changes:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: getCatalogChanges
    summary: List a catalog version's changes since its base
    description: |
      Every resource of the version that is `new`, `modified` or `ready`, and the resources removed
      since its base, the release the draft started from. For a draft, `releasable` says whether
      releasing it would be accepted now; a released version has no changes and is not releasable.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The version's changes
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  post:
    operationId: markCatalogReady
    summary: Mark every changed resource of a draft ready
    description: |
      Marks each `new` or `modified` resource of the draft ready in one action, and returns the
      changes that remain. Refused with 409 for a released version.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT, STENCIL_EDIT]
    responses:
      '200':
        description: The draft's changes after marking ready
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-dependencies:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: listCatalogDependencies
    summary: List the catalogs a catalog version depends on
    description: |
      The dependencies declared in the catalog version, each with the exact release it pins, or, in
      a draft, the draft of it the draft uses. A resource can reference another catalog's resources
      only through a declared dependency.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The declared dependencies
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateCatalogDependencies
    summary: Replace the catalogs a draft depends on
    description: |
      Replaces the dependencies declared in a draft of an AUTHORED catalog. The change is released
      with the draft, like any other change. Each catalog is declared at most once, with the exact
      release the catalog renders with (`releaseVersion`), so a release renders with exactly the
      releases its dependencies pin. A declaration names an exact release, not a range; ranges
      (such as `^1.0.0`) may come in a later 2.x, as an addition.

      In a draft, a declaration may name a **draft** of the other catalog instead (`versionId`), to
      build on work that is not released yet: this draft then renders with that draft, live. A
      release never pins a draft, so releasing this one is refused until that draft is released,
      or the release takes it along (`releaseDependencies` on `releaseCatalogDraft`).

      Refused with 409 for a released version, and for a SUBSCRIBED catalog, whose dependencies are
      its publisher's.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpdateCatalogDependenciesRequest'
    responses:
      '200':
        description: The declared dependencies after the change
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-versions:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: listCatalogVersions
    summary: List a catalog's versions
    description: |
      The catalog's versions: its drafts, oldest first, then its released versions, highest first.
      A SUBSCRIBED catalog lists the releases it installed, and has no drafts.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - name: status
        in: query
        required: false
        description: Only versions with this status. Omitted, every version.
        schema:
          $ref: '../components/schemas/catalogs.yaml#/CatalogVersionStatus'
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: The catalog's versions
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createCatalogDraft
    summary: Start a draft
    description: |
      Starts a draft of an AUTHORED catalog (ADR 0002). A catalog has any number of drafts, each
      named, and each released on its own. A draft has no number until it is released.

      - With `from` a released version, it starts as a copy of that release, which is its base. A
        fix to an older line is a draft from a release of that line (`1.4.0`, released as `1.4.1`
        while `2.0.0` exists).
      - With `from` another draft's `versionId`, it starts as a copy of that draft, unreleased changes included, on
        that draft's base.
      - Without `from`, it starts as a copy of the catalog's highest release, or empty, with no
        base, when the catalog has no release.

      The base is fixed. Nothing is merged: the draft is an independent copy, and the releases it is
      **behind** are listed (see `CatalogVersionDto.behind`).

      Refused with 409 when another draft of the catalog has the name, and for a SUBSCRIBED catalog.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/CreateCatalogDraftRequest'
    responses:
      '201':
        description: The draft
        headers:
          Location:
            description: The draft's address, by its `versionId`
            schema:
              type: string
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: getCatalogVersion
    summary: Get a catalog version
    description: |
      One version of the catalog: a draft, by its `versionId`, or a released version, by its
      `versionId` or its number, which return the same version. A released version also lists the
      releases of other catalogs it renders with and the environments that serve it. The id of a
      discarded draft addresses nothing: 404.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The version
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: renameCatalogDraft
    summary: Rename a draft
    description: |
      Gives a draft another name. Its address, its `versionId`, does not change. Refused with 409 for a name
      another draft of the catalog has, and for a released version.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/RenameCatalogDraftRequest'
    responses:
      '200':
        description: The draft, under its new name
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

  delete:
    operationId: deleteCatalogDraft
    summary: Discard a draft
    description: |
      Discards a draft and everything changed in it; its `versionId` then addresses nothing. Environment
      overrides that follow the draft end (`setEnvironmentOverride`, recorded as `override-cleared`).

      Refused with 409 for a released version, while a dependency declaration in a draft of another
      catalog names this draft, and while the draft alone holds a resource something outside it
      still uses (the tenant's default theme, a code list another catalog's attribute binds, a theme
      another catalog's template uses).
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    responses:
      '204':
        description: The draft is discarded
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version-release-preview:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: previewCatalogDraftRelease
    summary: Preview the number a draft is released as
    description: |
      The number releasing the draft would give it, **without releasing it**: the kind of change it
      holds against its base, why, the number that needs (`needed`), and the number it gets
      (`suggested`): `needed`, or the next free number of the same kind when another release already
      has it. Refused with 409 for a released version.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The number, and why
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDraftReleasePreview'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version-release:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  post:
    operationId: releaseCatalogDraft
    summary: Release a draft
    description: |
      Releases a draft of an AUTHORED catalog (ADR 0002). Any draft can be released, whatever else
      the catalog has released since it started.

      **The number** follows from the kind of change against the draft's base: corrections raise
      the patch, additions the minor, breaking changes the major (`previewCatalogDraftRelease`).
      Omitted `version`: that number, or the next free one of the same kind when another release
      already has it (`suggested`). A given `version` must be one no release of the catalog has,
      above the base and no lower than the changes need (`needed`), or the request is refused with
      400. From `1.4.0`, while `1.5.0` and `2.0.0` exist, a fix becomes `1.4.1`, and a breaking
      redesign `3.0.0`.

      A release contains the whole draft: it is refused while any resource is `new` or `modified`.

      A draft that is **behind** (see `CatalogVersionDto.behind`, recomputed for the number it is
      released as) does not contain those releases' changes unless an author applied them by hand,
      which the server cannot tell. Releasing it is refused with 409 unless `acknowledgedBehind`
      names every one.

      Each declared dependency pins one release, and the releases it pins pin theirs in turn; the
      release records them all. It is refused when a resource references a catalog that is not
      declared, when a declaration pins no release or one the tenant does not have, or when two
      paths through the dependencies pin different releases of one catalog. A declaration that
      names a **draft** of another catalog is refused with 409 (`release-dependencies-unreleased`,
      listing each such draft), unless `releaseDependencies` releases those drafts along with it:
      each first, recursively, numbered by its own changes, in the same transaction, all or
      nothing, and the new release pins the releases they became (`releasedDependencies`).

      The draft becomes the released version at that number, immutable. Its `versionId` stays and
      addresses the release, as the number does; writes through either are refused with 409.
      Environment overrides that followed the draft end (`override-cleared`). Other
      drafts are untouched; the response names those the release puts behind (`draftsBehind`).
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogDraftRequest'
    responses:
      '200':
        description: The draft is released
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogDraftResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ReleaseDependenciesUnreleasedError'
