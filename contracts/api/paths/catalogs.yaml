catalogs:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listCatalogs
    summary: List catalogs for a tenant
    description: Returns all catalogs (authored and subscribed) for the specified tenant.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of catalogs
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade-preview:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: previewCatalogUpgrade
    summary: Preview a catalog upgrade
    description: |
      Preview what upgrading a SUBSCRIBED catalog to its source's latest
      release would do, **without applying it**. Re-fetches the source
      manifest and diffs it against the installed release (source-vs-source):
      added / removed / changed / unchanged resources (each `type/key`), plus
      any cross-catalog conflicts that would block removals.

      Read-only. Apply the returned change set with `POST .../upgrade`.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The upgrade diff.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogUpgradeDiff'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
  post:
    operationId: upgradeCatalog
    summary: Upgrade a subscribed catalog
    description: |
      Re-fetch the source catalog and install its latest release in an existing SUBSCRIBED
      catalog. The releases installed before stay: catalogs whose dependencies resolve to one of
      them, and environments that serve one, keep rendering it.

      The whole manifest is reconciled: resources added since the installed release are
      installed, changed ones are updated in place, and resources the publisher no longer
      publishes are removed — the last only when nothing outside the catalog still references
      them, otherwise the upgrade is rejected and nothing changes. Use
      `GET .../upgrade-preview` to see all three before applying.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    responses:
      '200':
        description: Upgrade result.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/UpgradeCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-changes:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: getCatalogChanges
    summary: List a catalog version's changes since its base
    description: |
      Every resource of the version that is `new`, `modified` or `ready`, and the resources removed
      since its base, the highest released version below it. For a draft, `releasable` says whether
      releasing it would be accepted now; a released version has no changes and is not releasable.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The version's changes
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  post:
    operationId: markCatalogReady
    summary: Mark every changed resource of a draft ready
    description: |
      Marks each `new` or `modified` resource of the draft ready in one action, and returns the
      changes that remain. Refused with 409 for a released version.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT, STENCIL_EDIT]
    responses:
      '200':
        description: The draft's changes after marking ready
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-dependencies:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: listCatalogDependencies
    summary: List the catalogs a catalog version depends on
    description: |
      The dependencies declared in the catalog version, each with the release it resolves to now
      (for a released version: the release it was cut with). A resource can reference another catalog's resources only through a declared dependency.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The declared dependencies
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateCatalogDependencies
    summary: Replace the catalogs a draft depends on
    description: |
      Replaces the dependencies declared in a draft of an AUTHORED catalog. The change is released
      with the draft, like any other change. Each catalog is declared at most once, so a release
      renders with one release of every catalog it depends on.

      Refused with 409 for a released version, and for a SUBSCRIBED catalog, whose dependencies are
      its publisher's.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpdateCatalogDependenciesRequest'
    responses:
      '200':
        description: The declared dependencies after the change
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-versions:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: listCatalogVersions
    summary: List a catalog's versions
    description: |
      The catalog's versions: its drafts, the next version first and then long-term work, oldest
      first; then its released versions, highest first. A SUBSCRIBED catalog lists the releases it
      installed, and has no drafts.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - name: status
        in: query
        required: false
        description: Only versions with this status. Omitted, every version.
        schema:
          $ref: '../components/schemas/catalogs.yaml#/CatalogVersionStatus'
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: The catalog's versions
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createCatalogDraft
    summary: Start long-term work
    description: |
      Starts long-term work on an AUTHORED catalog (ADR 0002): a named draft next to the
      next version, for a change that is not ready to be released with everyday work. It has no number
      until it is released.

      - Without `from`, it starts as a copy of the next version, unreleased changes included, on the
        next version's base.
      - With `from`, a released version, it starts as a copy of that release, which is its base.

      Nothing is merged: the draft is an independent copy. Every release published after it started
      is one it is **behind** (see `CatalogVersionDto.behind`).

      Refused with 409 when another draft of the catalog has the name, and for a SUBSCRIBED catalog.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/CreateCatalogDraftRequest'
    responses:
      '201':
        description: The draft
        headers:
          Location:
            description: The draft's address, by its id
            schema:
              type: string
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: getCatalogVersion
    summary: Get a catalog version
    description: |
      One version of the catalog: a draft, by `next` or its id, or a released version, by its number.
      A released version also lists the releases of other catalogs it renders with and the
      environments that serve it.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The version
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: renameCatalogDraft
    summary: Rename long-term work
    description: |
      Gives long-term work another name. Its address, its id, does not change. Refused with 409 for
      the next version, which has no name of its own, for a name another draft has, and for a
      released version.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/RenameCatalogDraftRequest'
    responses:
      '200':
        description: The draft, under its new name
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

  delete:
    operationId: deleteCatalogDraft
    summary: Discard a draft
    description: |
      Discards a draft and everything changed in it. Discarding the **next version** throws its
      changes away: it starts again as a copy of the latest release (empty when there is none), under
      a new id, so everyday work always has somewhere to go. Long-term work is gone. Environment
      overrides that follow the draft end (`setEnvironmentOverride`).

      Refused with 409 for a released version, and while the draft alone holds a resource something
      outside it still uses (the tenant's default theme, a code list another catalog's attribute
      binds, a theme another catalog's template uses).
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    responses:
      '204':
        description: The draft is discarded
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version-release-preview:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  get:
    operationId: previewCatalogDraftRelease
    summary: Preview the number a draft is released as
    description: |
      The number releasing the draft would give it, **without releasing it**: the kind of change it
      holds against the latest release, why, and the lowest number that fits. Refused with 409 for a
      released version.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The number, and why
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDraftReleasePreview'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-version-release:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  post:
    operationId: releaseCatalogDraft
    summary: Release the next version
    description: |
      Releases the next version of an AUTHORED catalog (ADR 0002), numbering it: as
      `version`, or, when that is omitted, as its changes need against the latest release
      (`previewCatalogDraftRelease`). A given number must be above every release and no lower than
      the changes need, or the request is refused with 400. A release contains the whole draft: it is
      refused while any resource is `new` or `modified`.

      Only the next version is released: the catalog's history moves forward. Releasing long-term
      work is refused with 409 (`catalog-draft-kind`). Long-term work is tried by pointing an
      environment at it (`setEnvironmentOverride`), and released after it is made the next version
      (`promoteCatalogDraft`).

      A next version that is **behind** (see `CatalogVersionDto.behind`) does not contain those
      releases' changes unless an author applied them by hand, which the server cannot tell.
      Releasing it is refused with 409 unless `acknowledgedBehind` names every one of those
      versions.

      Each declared dependency is resolved to one release, and so are the dependencies of those
      releases in turn; the release records them all. It is refused when a resource references a
      catalog that is not declared, when a dependency resolves to no release, or when two paths
      through the dependencies need different releases of one catalog.

      After the release, the next version continues, as a draft on it. Long-term work is untouched
      and now behind it; the response names it (`draftsBehind`).
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogDraftRequest'
    responses:
      '200':
        description: The next version is released
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogDraftResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogDraftKindError'

catalog-version-promote:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'

  post:
    operationId: promoteCatalogDraft
    summary: Make long-term work the next version
    description: |
      Makes long-term work the catalog's next version (ADR 0002), when it is ready to go
      out with everyday work. It must contain every release published since it started, or
      `acknowledgedBehind` names those it leaves out; it then continues on the latest release and is
      behind nothing. The draft that was the next version is discarded with its changes, or kept as
      long-term work under `keepPreviousAs`. Environments following the next version
      (`setEnvironmentOverride`) move to the new next version.

      Refused with 409 for the next version itself, for work behind a release not acknowledged, for
      a name another draft has, and while the discarded next version alone holds a resource something
      outside it uses.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/PromoteCatalogDraftRequest'
    responses:
      '200':
        description: The work, now the next version
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogVersionDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
