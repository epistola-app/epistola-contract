    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The working copy's changes
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-mark-ready:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  post:
    operationId: markCatalogReady
    summary: Mark every changed resource of the catalog ready
    description: |
      Marks each `new` or `modified` resource of the catalog ready in one action, and returns the
      changes that remain. Stencil instances the change breaks are held back, as for a single stencil.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT, STENCIL_EDIT]
    responses:
      '200':
        description: The catalog's changes after marking ready
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogChangesDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-dependencies:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: listCatalogDependencies
    summary: List the catalogs a catalog depends on
    description: |
      The dependencies declared in the catalog's working copy, each with the release it resolves to
      now. A resource can reference another catalog's resources only through a declared dependency.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The declared dependencies
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateCatalogDependencies
    summary: Replace the catalogs a catalog depends on
    description: |
      Replaces the dependencies declared in an AUTHORED catalog's working copy. The change is
      released with the catalog's next release. Each catalog is declared at most once, so a release
      renders with one release of every catalog it depends on.

      Refused with 409 for a SUBSCRIBED catalog, whose dependencies are its publisher's.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/UpdateCatalogDependenciesRequest'
    responses:
      '200':
        description: The declared dependencies after the change
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogDependencyListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
