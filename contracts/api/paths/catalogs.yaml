catalogs:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  get:
    operationId: listCatalogs
    summary: List catalogs for a tenant
    description: Returns all catalogs (authored and subscribed) for the specified tenant.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of catalogs
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-upgrade-preview:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'

  get:
    operationId: previewCatalogUpgrade
    summary: Preview a catalog upgrade
    description: |
      Preview what upgrading a SUBSCRIBED catalog to its source's latest
      release would do, **without applying it**. Re-fetches the source
      manifest and diffs it against the installed release (source-vs-source):
      added / removed / changed / unchanged resources (each `type/slug`), plus
      any cross-catalog conflicts that would block removals.

      Read-only. Apply the returned change set with `POST .../upgrade`.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_VIEW]
    responses:
      '200':
        description: The upgrade diff.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/CatalogUpgradeDiff'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

catalog-release:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
  post:
    operationId: releaseCatalog
    summary: Release an authored catalog
    description: |
      Cut a new immutable SemVer release for an AUTHORED catalog. A release contains the whole
      working copy, and refuses while any resource is `new` or `modified`: mark them ready first.

      Each declared dependency is resolved to one release, and so are the dependencies of those
      releases in turn; the release records them all. It is refused when a resource references a
      catalog that is not declared, when a dependency resolves to no release, or when two paths
      through the dependencies need different releases of one catalog.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_RELEASE]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogRequest'
    responses:
      '200':
        description: Catalog released.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/ReleaseCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

catalog-upgrade:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
  post:
    operationId: upgradeCatalog
    summary: Upgrade a subscribed catalog
    description: |
      Re-fetch the source catalog and install its latest release in an existing SUBSCRIBED
      catalog. The releases installed before stay: catalogs whose dependencies resolve to one of
      them, and environments that serve one, keep rendering it.

      The whole manifest is reconciled: resources added since the installed release are
      installed, changed ones are updated in place, and resources the publisher no longer
      publishes are removed — the last only when nothing outside the catalog still references
      them, otherwise the upgrade is rejected and nothing changes. Use
      `GET .../upgrade-preview` to see all three before applying.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    responses:
      '200':
        description: Upgrade result.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/catalogs.yaml#/UpgradeCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

