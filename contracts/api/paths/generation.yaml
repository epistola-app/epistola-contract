# Document Generation Endpoints

preview-document:
  post:
    operationId: previewDocument
    summary: Preview a document (synchronous)
    description: |
      Generate a preview PDF synchronously and return it directly in the response body.

      **This endpoint is for preview purposes only:**
      - The output is **not PDF/A compliant**
      - The endpoint is **rate-limited** — do not use for production document generation
      - There are **no guarantees on latency or throughput**
      - Generated documents are **not stored** — use the async generation endpoints for production use
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_GENERATE]
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/generation.yaml#/PreviewDocumentRequest'
    responses:
      '200':
        description: Preview PDF document
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '400':
        $ref: '../components/responses/problem-responses.yaml#/TemplateDataInvalidError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '429':
        $ref: '../components/responses/problem-responses.yaml#/RateLimitedError'

generate-document:
  post:
    operationId: generateDocument
    summary: Generate a single document asynchronously
    description: |
      Submit a request to generate a single PDF document. Returns immediately with a job ID for
      tracking progress.

      The target is resolved when the request is accepted, and each item is bound to the version it
      renders (`releaseVersion`, or `versionId` for a deployed draft). Refused with 404
      `not-found`, and nothing is accepted, when the tenant, the catalog, the template, the named
      variant or the environment does not exist, when no variant matches the `attributes`, or when
      no version matches: no release satisfies `versionRange`, or the environment serves no
      version of the catalog that matches. The template data is not checked against the
      template's data contract here; it is checked when the item renders, and an item whose data
      breaks the contract fails (`FAILED`, with its `errorMessage`). Check it first with
      `validateTemplateData` to find out before submitting.
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_GENERATE]
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/generation.yaml#/GenerateDocumentRequest'
    responses:
      '202':
        description: Generation request accepted
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/generation.yaml#/GenerationJobResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '429':
        $ref: '../components/responses/problem-responses.yaml#/RateLimitedError'

generate-batch:
  post:
    operationId: generateDocumentBatch
    summary: Generate multiple documents in a batch
    description: |
      Submit a batch request to generate multiple PDF documents. Returns immediately with a job ID
      for tracking progress.

      The target is resolved when the request is accepted, and each item is bound to the version it
      renders (`releaseVersion`, or `versionId` for a deployed draft). Refused with 404
      `not-found`, and nothing is accepted, when the tenant, the catalog, the template, the named
      variant or the environment does not exist, when no variant matches the `attributes`, or when
      no version matches: no release satisfies `versionRange`, or the environment serves no
      version of the catalog that matches. The template data is not checked against the
      template's data contract here; it is checked when the item renders, and an item whose data
      breaks the contract fails (`FAILED`, with its `errorMessage`). Check it first with
      `validateTemplateData` to find out before submitting. A batch is
      accepted whole or not at all: an item that cannot be resolved refuses the batch.
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_GENERATE]
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/generation.yaml#/GenerateBatchRequest'
    responses:
      '202':
        description: Batch generation request accepted
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/generation.yaml#/GenerationJobResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '429':
        $ref: '../components/responses/problem-responses.yaml#/RateLimitedError'

jobs:
  get:
    operationId: listGenerationJobs
    summary: List generation jobs
    description: List all generation jobs for a tenant with optional status filtering
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_VIEW]
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
      - name: status
        in: query
        description: Filter by job status
        schema:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED, CANCELLED]
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: List of generation jobs
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/generation.yaml#/GenerationJobListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

job-detail:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: requestId
      in: path
      required: true
      description: Generation request ID
      schema:
        type: string
        format: uuid

  get:
    operationId: getGenerationJobStatus
    summary: Get generation job status
    description: Get detailed status of a generation job including all items and their progress
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_VIEW]
    responses:
      '200':
        description: Job status with items
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/generation.yaml#/GenerationJobDetail'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  delete:
    operationId: cancelGenerationJob
    summary: Cancel a generation job
    description: Cancel a pending or in-progress generation job
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_GENERATE]
    responses:
      '204':
        description: Job cancelled successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

documents:
  get:
    operationId: listDocuments
    summary: List generated documents
    description: |
      List the tenant's generated documents, optionally filtered by catalog (`registry`,
      `namespace`, `catalogKey`), template within that catalog (`templateKey`) and correlation ID.
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_VIEW]
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
      - name: templateKey
        in: query
        description: |
          Filter by template key. A template key is unique only within its catalog, so it is
          given together with `namespace` and `catalogKey` (and `registry` when the catalog is not
          in the default registry); without them the request is refused with 400.
        schema:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
      - name: correlationId
        in: query
        description: Filter by client-provided correlation ID
        schema:
          type: string
          maxLength: 255
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - name: registry
        in: query
        description: |
          Filter by the registry of the template's catalog, together with `namespace` and
          `catalogKey`. Omitted or `~`: the default registry. Given without
          `namespace` and `catalogKey`, the request is refused with 400. Documents generated before
          contract 2.0 record no catalog and match no catalog filter.
        schema:
          type: string
          pattern: '^(~|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)$'
          minLength: 1
          maxLength: 253
      - name: namespace
        in: query
        description: |
          Filter by the namespace of the template's catalog. Given with `catalogKey`, or alone to
          list the documents of every catalog in that namespace.
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 63
      - name: catalogKey
        in: query
        description: |
          Filter by the key of the template's catalog. Requires `namespace`; without it the request
          is refused with 400.
        schema:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
    responses:
      '200':
        description: List of documents
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/generation.yaml#/DocumentListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

document-detail:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: documentId
      in: path
      required: true
      description: Document ID
      schema:
        type: string
        format: uuid

  get:
    operationId: downloadDocument
    summary: Download a generated document
    description: Download the PDF content of a generated document
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_VIEW]
    responses:
      '200':
        description: Document content
        content:
          application/pdf:
            schema:
              type: string
              format: binary
        headers:
          Content-Disposition:
            schema:
              type: string
            description: Attachment filename
          Content-Length:
            schema:
              type: integer
            description: File size in bytes
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  delete:
    operationId: deleteDocument
    summary: Delete a generated document
    description: Permanently delete a generated document
    tags:
      - Generation
    x-required-permissions: [DOCUMENT_GENERATE]
    responses:
      '204':
        description: Document deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
