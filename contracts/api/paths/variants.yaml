variants:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: listVariants
    summary: List variants for a template
    description: Retrieve all variants of a specific template.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of variants
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createVariant
    summary: Create a new variant
    description: |
      Create a variant of the template in the draft, with its `key`, `title`, and optionally a
      `description` and the `attributes` that select it. It starts with status `new`.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/CreateVariantRequest'
    responses:
      '201':
        description: Variant created successfully
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: The variant's address (`getVariant`)
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'

variants-id:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
    - name: variantKey
      in: path
      required: true
      description: Key of the variant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getVariant
    summary: Get a variant by key
    description: Retrieve a variant's details in this release, with its status against the release's base.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Variant details
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateVariant
    summary: Update a variant
    description: |
      Update a variant's metadata in the draft: its `title` (required), `description` and the
      `attributes` that select it. Its content is updated with `updateVariantContent`, and which
      variant is the default with `setDefaultVariant`.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/UpdateVariantRequest'
    responses:
      '200':
        description: Variant updated successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

  delete:
    operationId: deleteVariant
    summary: Delete a variant
    description: Delete the variant from the draft. Cannot delete the default variant — reassign default first. Refused with 409 outside a draft.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '204':
        description: Variant deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'

variant-set-default:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
    - name: variantKey
      in: path
      required: true
      description: Key of the variant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  post:
    operationId: setDefaultVariant
    summary: Set default variant
    description: |
      Set a variant as the default for its template. The previous default is cleared.
      Send the `ETag` of the variant being made default as `If-Match` to have this refused with 412
      `resource-modified` if that variant changed since; without it, the last write wins.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    responses:
      '200':
        description: Default variant set successfully
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

variant-content:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
    - name: variantKey
      in: path
      required: true
      description: Key of the variant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  get:
    operationId: getVariantContent
    summary: Get the variant's content
    description: |
      The variant's content in this release, with its status against the release's base
      (the release the draft started from). Editing a draft changes what is generated only where
      the draft is rendered: generation renders a release, or a draft deployed to the environment
      a request names (see "Deploying"), and preview can name a draft.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: The variant's content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateVariantContent
    summary: Update the variant's content in a draft
    description: |
      Replaces the variant's template model in the draft. An edit clears the ready mark, so
      the variant has to be marked ready again before the catalog can be released.
      Send the `ETag` from a read as `If-Match` to have the update refused with 412
      `resource-modified` if the resource changed since; without it, the last write wins.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - $ref: '../components/parameters/concurrency.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/vnd.epistola.v2+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/UpdateVariantContentRequest'
    responses:
      '200':
        description: The updated content
        headers:
          ETag:
            $ref: '../components/headers/concurrency.yaml#/ETag'
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
      '412':
        $ref: '../components/responses/problem-responses.yaml#/ResourceModifiedError'

variant-mark-ready:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: templateKey
      in: path
      required: true
      description: Key of the template
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
    - name: variantKey
      in: path
      required: true
      description: Key of the variant
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'

  post:
    operationId: markVariantReady
    summary: Mark the variant ready
    description: |
      Records that the variant's current content is reviewed and may be released. A catalog release
      refuses while any resource is modified and not ready. Marking content that is already ready,
      or unchanged since the release's base, changes nothing.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '200':
        description: The variant's content, now ready
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
