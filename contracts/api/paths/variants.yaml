variant-content:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: templateId
      in: path
      required: true
      description: Slug identifier of the template
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: variantId
      in: path
      required: true
      description: Slug identifier of the variant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: getVariantContent
    summary: Get the variant's content
    description: |
      The variant's content as it is being edited, with its status against the catalog's latest
      release. Editing never changes what is generated: generation renders a release.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: The variant's content
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  put:
    operationId: updateVariantContent
    summary: Update the variant's content in a draft
    description: |
      Replaces the variant's template model in the draft. An edit clears the ready mark, so
      the variant has to be marked ready again before the catalog can be released.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/UpdateVariantContentRequest'
    responses:
      '200':
        description: The updated content
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

variant-mark-ready:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: templateId
      in: path
      required: true
      description: Slug identifier of the template
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: variantId
      in: path
      required: true
      description: Slug identifier of the variant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  post:
    operationId: markVariantReady
    summary: Mark the variant ready
    description: |
      Records that the variant's current content is reviewed and may be released. A catalog release
      refuses while any resource is modified and not ready. Marking content that is already ready,
      or unchanged since the version's base, changes nothing.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '200':
        description: The variant's content, now ready
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantContentDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
