variants:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: templateId
      in: path
      required: true
      description: Slug identifier of the template
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: listVariants
    summary: List variants for a template
    description: Retrieve all variants of a specific template.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
      - $ref: '../components/parameters/sorting.yaml#/Sort'
      - $ref: '../components/parameters/sorting.yaml#/Direction'
    responses:
      '200':
        description: List of variants
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  post:
    operationId: createVariant
    summary: Create a new variant
    description: Create a new variant for the specified template with optional tags.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/CreateVariantRequest'
    responses:
      '201':
        description: Variant created successfully
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

variants-id:
  parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique slug identifier of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/CatalogVersion'
    - name: templateId
      in: path
      required: true
      description: Slug identifier of the template
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: variantId
      in: path
      required: true
      description: Slug identifier of the variant
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50

  get:
    operationId: getVariant
    summary: Get variant by ID
    description: Retrieve details of a specific variant including version summary.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Variant details
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

  patch:
    operationId: updateVariant
    summary: Update a variant
    description: Update a variant's tags.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        application/vnd.epistola.v1+json:
          schema:
            $ref: '../components/schemas/variants.yaml#/UpdateVariantRequest'
    responses:
      '200':
        description: Variant updated successfully
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/variants.yaml#/VariantDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

  delete:
    operationId: deleteVariant
    summary: Delete a variant
    description: Delete a variant and all its versions. Cannot delete the default variant — reassign default first.
    tags:
      - Variants
    x-required-permissions: [TEMPLATE_EDIT]
    responses:
      '204':
        description: Variant deleted successfully
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

