import-catalog:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: importCatalog
    summary: Install the release a catalog archive carries
    description: |
      Install the release a self-contained catalog ZIP archive carries. The ZIP must contain a
      `catalog.json` manifest and resource detail files matching the catalog exchange protocol.

      An import never touches a draft. It installs **the archive's release**, at its number
      (`release.version`), as an immutable release of the catalog the archive names (registry +
      namespace + key), side by side with the releases of that catalog the tenant already has, the
      same way installing from an exchange does (ADR 0003). Nothing is merged, no resource is
      updated in place, and no draft is created or changed.

      - **A release the tenant does not have** is installed. The catalog's other releases, and every
        draft, deployment and catalog that uses them, are left as they are; which release an
        environment serves is decided by deploying it (`deployRelease`).
      - **The same number with the same fingerprint** is the release the tenant already has: nothing
        changes, and the response says it was already present (`newlyInstalled: false`).
      - **The same number with a different fingerprint** is different content under one name: the
        import is refused with 409 `conflict`, and nothing changes.
      - **A new catalog** is created by the import, of type `catalogType`, holding that release and
        no draft. To edit it, an author starts a draft from the release
        (`createCatalogDraft` with `from`), which only an AUTHORED catalog allows.

      The fingerprint compared is the release's `release.fingerprint`, or the fingerprint of its
      content when the archive records none. Every catalog wire version requires `release.version`,
      so an archive without a release is not a valid archive: it is refused with 400
      `bad-request`, as any archive that fails validation is. Installing is all or nothing: when a
      resource cannot be installed, nothing is.

      It may also be a **catalog bundle** (a fat export: `bundle.json` and one catalog archive per
      catalog, see `docs/catalog-bundle.md`): the releases of the catalogs the bundled catalog uses
      are installed first, each in a SUBSCRIBED catalog, when this tenant does not have them
      (`installedDependencies`); those it has already are left alone (`presentDependencies`).
      A release the tenant has with the same number but a different fingerprint refuses the whole
      import with 409 `conflict`, naming each, and nothing changes. The bundled catalog's own release
      is then installed as above.
    tags:
      - Catalogs
    x-required-permissions: [CATALOG_MANAGE]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: The catalog ZIP archive, or a catalog bundle
              registry:
                type: string
                pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
                maxLength: 253
                description: |
                  Registry of the catalog to install the release in. Omitted: the registry the
                  archive names. An archive from before catalog wire version 8 names none, and the
                  server then uses the default registry.
              namespace:
                type: string
                pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
                minLength: 3
                maxLength: 63
                description: |
                  Namespace, within the registry, of the catalog to install the release in.
                  Omitted: the namespace the archive names. An archive from before catalog wire
                  version 8 names none, and the server then chooses one (typically the tenant's
                  own).
              catalogType:
                type: string
                enum: [AUTHORED, SUBSCRIBED]
                default: AUTHORED
                description: |
                  Type of the catalog the import creates when the tenant does not have it: AUTHORED
                  allows drafts to be started from its releases (`createCatalogDraft`); SUBSCRIBED
                  only installs releases and is upgraded from its source (`upgradeCatalog`).
                  Ignored for a catalog the tenant has, whose type does not change.
    responses:
      '200':
        description: The release is installed, or was already present
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/import.yaml#/ImportCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
