import-catalog:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant (e.g., "acme-corp")
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63

  post:
    operationId: importCatalog
    summary: Import a catalog from a ZIP archive
    description: |
      Import a self-contained catalog ZIP archive. The ZIP must contain a `catalog.json` manifest
      and resource detail files matching the catalog exchange protocol.

      It may also be a **catalog bundle** (a fat export: `bundle.json` and one catalog archive per
      catalog, see `docs/catalog-bundle.md`): the releases of the catalogs the bundled catalog uses
      are installed first, each in a SUBSCRIBED catalog, when this tenant does not have them
      (`installedDependencies`); those it has already are left alone (`presentDependencies`).
      Releases are immutable and stay side by side: other releases of those catalogs that the
      tenant has are left as they are. A release the tenant has with the same number but a different
      fingerprint refuses the whole import with 409, naming each, and nothing changes. The bundled
      catalog itself is then imported as below.

      - If the catalog (registry + namespace + key) already exists and is AUTHORED: resources are merged into
        the draft `catalogVersion`, or replaced, per `authoredMode` (default `MERGE` — upsert and keep local-only
        resources; `REPLACE` also deletes local-only resources, conflict-checked first)
      - If the catalog (registry + namespace + key) already exists and is SUBSCRIBED: the ZIP is applied as a
        full upgrade (conflict-checked; on a failed resource the upgrade is aborted
        before any pruning and the catalog stays on its previous release — see
        `aborted` in the response)
      - If the catalog is new: a new catalog is created with the specified type. A new AUTHORED
        catalog gets one draft, with no base, named after the catalog, which the archive fills.

      Resources are installed in dependency order: assets → attributes → themes → stencils → templates.
    tags:
      - Catalogs
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: The catalog ZIP archive
              registry:
                type: string
                pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
                maxLength: 253
                description: |
                  Registry to import the catalog into. Omitted: the registry the archive names. An
                  archive from before catalog wire version 8 names none, and the server then uses
                  the default registry.
              namespace:
                type: string
                pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
                minLength: 3
                maxLength: 63
                description: |
                  Namespace, within the registry, to import the catalog into. Omitted: the
                  namespace the archive names. An archive from before catalog wire version 8 names
                  none, and the server then chooses one (typically the tenant's own).
              catalogVersion:
                type: string
                pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                maxLength: 36
                description: |
                  For an existing AUTHORED catalog, the draft to import into, by its id. Omitted:
                  the catalog's only draft; refused with 400 when it has none or several. Ignored
                  for a new catalog, whose one draft it fills, and for a SUBSCRIBED catalog, which
                  installs the archive's release.
              catalogType:
                type: string
                enum: [AUTHORED, SUBSCRIBED]
                default: AUTHORED
                description: Type of catalog to create if it doesn't exist
              authoredMode:
                type: string
                enum: [MERGE, REPLACE]
                default: MERGE
                description: |
                  For a ZIP that targets an **existing AUTHORED** catalog:
                  `MERGE` upserts the ZIP's resources and keeps resources that
                  exist locally but not in the ZIP; `REPLACE` additionally
                  deletes those local-only resources (conflict-checked before
                  any mutation). Release state is never changed either way.
                  Ignored for a newly-created or SUBSCRIBED catalog.
    responses:
      '200':
        description: Catalog imported successfully
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/import.yaml#/ImportCatalogResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
