images:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
  get:
    operationId: listImages
    summary: List images in a catalog
    description: |
      List the images in a catalog, as metadata. Images of a catalog that cannot be changed in this
      installation are flagged `readOnly: true`.

      Only images are listed. The binaries behind font faces are not images; the Fonts API
      describes them as faces of a family.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - name: search
        in: query
        required: false
        description: Case-insensitive substring match on image name.
        schema:
          type: string
          maxLength: 255
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: List of images.
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/images.yaml#/ImageListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  post:
    operationId: uploadImage
    summary: Upload an image
    description: |
      Upload an image into a draft of a catalog that can be changed (`CatalogDto.editable`); a
      catalog that cannot is refused with 409 `catalog-read-only`. The contract sets no size limit;
      a server may set one, and refuses content over it with 400.
      Supported image types are deployment-configured; common ones are `image/png`, `image/jpeg`,
      `image/svg+xml`, and `image/webp`. Content whose media type is not a supported image type is
      rejected with 400.

      The response carries the new image's generated `key`.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Image content.
              name:
                type: string
                minLength: 1
                maxLength: 255
                description: Optional display name; defaults to the uploaded filename.
              mediaType:
                type: string
                description: Optional MIME override; defaults to the part content type.
    responses:
      '201':
        description: Image uploaded.
        headers:
          Location:
            $ref: '../components/headers/location.yaml#/Location'
            description: "The image's address, `…/images/{imageKey}`; its bytes are at `…/content` (`downloadImageContent`)"
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '../components/schemas/images.yaml#/ImageDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'

image-content:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: imageKey
      in: path
      required: true
      description: The image's `key`.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
  get:
    operationId: downloadImageContent
    summary: Download image content
    description: |
      Download the image's bytes, served with the image's own media type. Returns 404 when the
      catalog has no image with this key, including when the key belongs to a font binary.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Image content.
        headers:
          Cache-Control:
            description: Long-lived immutable cache directive for content-addressed images.
            schema:
              type: string
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

image-resource:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique key of the tenant.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/TenantKey'
    - $ref: '../components/parameters/catalog.yaml#/Registry'
    - $ref: '../components/parameters/catalog.yaml#/Namespace'
    - $ref: '../components/parameters/catalog.yaml#/CatalogKey'
    - $ref: '../components/parameters/catalog.yaml#/Release'
    - name: imageKey
      in: path
      required: true
      description: The image's `key`.
      schema:
        $ref: '../components/schemas/identifiers.yaml#/ResourceKey'
  delete:
    operationId: deleteImage
    summary: Delete an image
    description: |
      Delete an image from a draft of a catalog that can be changed (409 `catalog-read-only`
      otherwise). Returns 409 when the image is still referenced
      by templates unless `force=true` is supplied. Returns 404 when the catalog has no image
      with this key, including when the key belongs to a font binary.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '204':
        description: Image deleted.
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/CatalogReadOnlyError'
