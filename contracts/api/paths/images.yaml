images:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique slug identifier of the tenant.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogKey
      in: path
      required: true
      description: Slug identifier of the catalog.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
  get:
    operationId: listImages
    summary: List images in a catalog
    description: |
      List the images in a catalog, as metadata. Images from a SUBSCRIBED catalog are flagged
      `readOnly: true`.

      Only images are listed. The binaries behind font faces are not images; the Fonts API
      describes them as faces of a family.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_VIEW]
    parameters:
      - name: search
        in: query
        required: false
        description: Case-insensitive substring match on image name.
        schema:
          type: string
          maxLength: 255
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Size'
    responses:
      '200':
        description: List of images.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/images.yaml#/ImageListResponse'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
  post:
    operationId: uploadImage
    summary: Upload an image
    description: |
      Upload an image into an AUTHORED catalog. The suite currently limits image content to
      5 MiB. Supported image types are deployment-configured; common ones are `image/png`,
      `image/jpeg`, `image/svg+xml`, and `image/webp`. Content whose media type is not a
      supported image type is rejected with 400.

      The response carries the new image's generated `key`.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_EDIT]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Image content.
              name:
                type: string
                minLength: 1
                maxLength: 255
                description: Optional display name; defaults to the uploaded filename.
              mediaType:
                type: string
                description: Optional MIME override; defaults to the part content type.
              sensitive:
                type: boolean
                default: false
                description: Store content in a tenant-isolated deduplication scope.
    responses:
      '201':
        description: Image uploaded.
        content:
          application/vnd.epistola.v1+json:
            schema:
              $ref: '../components/schemas/images.yaml#/ImageDto'
      '400':
        $ref: '../components/responses/problem-responses.yaml#/ValidationFailedError'
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'

image-content:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique slug identifier of the tenant.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogKey
      in: path
      required: true
      description: Slug identifier of the catalog.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: imageKey
      in: path
      required: true
      description: The image's `key`.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 50
  get:
    operationId: downloadImageContent
    summary: Download image content
    description: |
      Download the image's bytes, served with the image's own media type. Returns 404 when the
      catalog has no image with this key, including when the key belongs to a font binary.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_VIEW]
    responses:
      '200':
        description: Image content.
        headers:
          Cache-Control:
            description: Long-lived immutable cache directive for content-addressed images.
            schema:
              type: string
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'

image-resource:
  parameters:
    - name: tenantKey
      in: path
      required: true
      description: Unique slug identifier of the tenant.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 63
    - name: catalogKey
      in: path
      required: true
      description: Slug identifier of the catalog.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 50
    - name: imageKey
      in: path
      required: true
      description: The image's `key`.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 50
  delete:
    operationId: deleteImage
    summary: Delete an image
    description: |
      Delete an image from an AUTHORED catalog. Returns 409 when the image is still referenced
      by templates unless `force=true` is supplied. Returns 404 when the catalog has no image
      with this key, including when the key belongs to a font binary.
    tags:
      - Images
    x-required-permissions: [TEMPLATE_EDIT]
    parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '204':
        description: Image deleted.
      '401':
        $ref: '../components/responses/auth-errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/auth-errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/problem-responses.yaml#/NotFoundError'
      '409':
        $ref: '../components/responses/problem-responses.yaml#/ConflictError'
