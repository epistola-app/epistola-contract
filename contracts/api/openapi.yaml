openapi: 3.1.0
info:
  title: Epistola API
  description: |
    Document template management API for Epistola Suite.

    ## Versioning
    This API uses header-based versioning via the Accept header.
    Use `application/vnd.epistola.v1+json` for API version 1.

    ## Catalog versions
    A catalog is versioned as a whole, never resource by resource. It consists of **versions**,
    addressed as `/catalogs/{registry}/{namespace}/{catalogKey}/versions/{catalogVersion}`, with the
    catalog's resources below it (ADR 0002, amendment 2).

    A **draft** is edited, its changed resources marked ready, and **released**, after which it is
    immutable: every write to it is refused with 409. A draft has no number until it is released; it
    is addressed as `next` or by its `draftId`, and a released version by its SemVer number.

    - Every AUTHORED catalog has one **next version** (`next`): the draft everyday work goes into, and
      the only one that is released. Releasing numbers it from the kind of change against the latest
      release (`previewCatalogDraftRelease`), and it then continues, as a draft on that release.
    - **Long-term work** is any other draft: named, started from the next version or a release, and
      kept apart until it is ready. It is not released: it is tried by pointing a non-production
      environment at it (an environment override, `setEnvironmentOverride`), and released after it
      becomes the next version (`promoteCatalogDraft`).
    - A draft's **base** is the released version it started from, which its changes are measured
      against. It does not move when other versions are released.
    - Drafts are independent copies: releasing one does not change another, and nothing is merged.
      A draft is **behind** every release above its base; it does not contain their changes unless an
      author applied them by hand. `getCatalogVersion` lists them, and releasing a draft that is
      behind must be acknowledged.

    Documents are rendered from a released version, and version selectors never match a draft. Two
    things render a draft: preview, naming it by `next` or its id, and an environment that follows
    a draft (see "Environment overrides").

    ## Catalog identity
    A catalog is identified by three parts together, never by its key alone: two publishers can
    each publish a catalog called `letters`.

    - The **registry**: an exchange (`exchange.epistola.app`) or a domain that publishes its own
      catalogs (`acme.com`), in normal domain order.
    - The **namespace**: a slug within the registry (`acme-corp`). Every namespace lives in a
      registry; the same namespace in two registries is two different namespaces.
    - The **catalog key**: a slug within the namespace (`letters`).

    A server is configured with a **default registry**. Which one it is is configuration, not part
    of this contract. In a URL path the registry is a segment of its own, and `~` there means the
    default registry: `/catalogs/~/acme-corp/letters/…` and
    `/catalogs/exchange.epistola.app/acme-corp/letters/…` address the same catalog when
    `exchange.epistola.app` is the default. A client may send `~` percent-encoded as `%7E`.

    In a body, a catalog is named by separate `registry`, `namespace` and `catalogKey` members.
    Two rules say what an omitted `registry` or `namespace` means:

    1. **A request that names a catalog** (a generation or preview target, a dependency
       declaration): `registry` is optional, and omitted or null means the default registry. (An
       import's `registry` part defaults to the registry the archive names first.) Every response writes the registry in full, by its name, never `~` and never null
       for a catalog that exists, so a value read from one installation means the same catalog on
       another.
    2. **A reference relative to another catalog** (a code-list binding on an attribute, an
       attribute qualifier in variant selection, a reference inside a catalog's content):
       `registry` and `namespace` are both optional, and each omitted one means the value of the
       catalog the reference is relative to (the attribute's catalog, the template's catalog, the
       owning catalog), not the default registry: content means the same in every installation.
       A `registry` without a `namespace` is invalid. A reference the server resolved is written
       in full in a response; content documents are returned as they were stored.

    A catalog depends on other catalogs by declaring them, each once, with a version selector. A
    reference from one catalog's resources into another's names the catalog (registry, namespace
    and key) but never a version: it renders with the release the declaration resolves to, so a
    release renders with exactly one release of every catalog it depends on.

    ## Version selectors
    Wherever a request selects a release (generation, preview, validation, dependencies), it takes
    a **version selector** in the npm SemVer range grammar: an exact version (`1.4.0`), a caret
    (`^1.4.0`), a tilde (`~1.4.0`), comparators (`>=1.0.0 <2.0.0`), a hyphen range
    (`1.0.0 - 2.0.0`), or a `||` union of these. The highest release that satisfies the selector is
    chosen. A server that does not support ranges yet accepts an exact version only and refuses a
    range as a validation failure on that field; responses always name the exact release used.

    ## Environment overrides
    An environment serves catalog releases, and a request through it (`environmentKey`) renders the
    highest one it serves, or the highest that satisfies the request's `version`. An environment
    can **override** that for a catalog (`setEnvironmentOverride`): it then uses one of the releases
    it serves (a rollback), or a **draft** of the catalog, the next version or long-term work,
    rendered live with no release. This is how the next version and long-term work are tried.

    - A request through the environment that names **no version, or a version range**, gets the
      override. A request naming an **exact release** still gets that release.
    - An environment marked **production** (`EnvironmentDto.production`) uses only published
      versions: an override there may name a release, never a draft.
    - A document rendered from a draft carries the draft's id and its name at render time
      (`draftId`, `draftLabel`, with a null `releaseVersion`), and its PDF a preview watermark.
    - Undeploying the release an override names ends the override, and so does discarding the draft
      it follows. Promoting long-term work moves environments following the next version to the new
      next version.

    ## Authentication
    The API accepts authentication through the `Authorization` header:
    - **API key**: `Authorization: ApiKey <key>` for static tenant API keys. This is
      the supported method. A tenant manager issues each key for one tenant with a
      set of tenant roles.
    - **Bearer JWT** (**experimental**): `Authorization: Bearer <jwt>`, either issued
      by an OAuth 2.0 identity provider or self-signed with a key pair registered
      through the Consumers API. Epistola Suite may not implement the consumer model
      these rely on yet, and the flow may still change.

    The legacy `X-API-Key` header remains supported for existing integrations, but
    is deprecated. New API-key integrations should use `Authorization: ApiKey <key>`.

    See the [Authentication Guide](/docs/auth.md) for details.

    ## Client Identity

    All requests must include the following headers for client identification:

    - **`User-Agent`** (required) — identifies the client software stack using standard
      [RFC 9110 §10.1.5](https://www.rfc-editor.org/rfc/rfc9110#name-user-agent) product tokens.
      The first token **must** be `epistola-contract/{version}` indicating the contract
      version the client was built against. Additional product/version pairs can be
      appended to describe the full software stack.
      Example: `epistola-contract/x.y.z valtimo-epistola-plugin/1.2.0 gzac/5.0.0`
    - **`X-EP-Node-Id`** (required) — identifies the specific client node. Use the
      Kubernetes pod name, container ID, or hostname. In local/dev environments,
      the machine hostname is acceptable.

    The generated Epistola client libraries set both headers automatically — `User-Agent`
    with the contract version, and `X-EP-Node-Id` with the hostname. Consumers wrapping
    the client library can append additional product tokens to `User-Agent` for their
    own software and override the node ID as needed.

    ## Error Responses

    The API uses [RFC 9457 Problem Details](https://www.rfc-editor.org/rfc/rfc9457)
    for error responses. Error responses have `Content-Type: application/problem+json`
    and include the following fields:

    - `type` (string, URI) — identifies the problem type; the stable,
      machine-readable discriminator clients should switch on
    - `title` (string) — short human-readable summary
    - `status` (integer) — HTTP status code
    - `detail` (string, optional) — human-readable explanation of this occurrence
    - `instance` (string, URI, optional) — identifies this specific occurrence

    Problem `type` URIs use the `https://epistola.app/errors/{slug}` namespace
    and resolve to human-readable HTML documentation for that problem type.
    A response may also carry domain-specific extension members as top-level
    fields; clients should ignore members they do not recognize.

    For validation errors (`type: .../validation-error`), the response also
    includes an `errors` array with field-level details.

    The canonical problem `type` slugs are registered in
    [`docs/error-types.md`](docs/error-types.md); the machine-readable
    registry is this document's top-level `x-problem-types` extension.

    ## Concurrency
    Templates, variants, themes, stencils, code lists and attributes carry a
    revision. Reading one, or updating it, returns the revision as a strong `ETag`
    response header: a quoted decimal integer such as `"7"`. Send it back as
    `If-Match` on an update to make the update conditional: if the resource changed
    since you read it, the server refuses with 412 `resource-modified` and changes
    nothing. Read the resource again, reapply your change and retry with the new
    `ETag`. Without `If-Match` an update is applied unconditionally, and the last
    write wins.

    A template's `ETag` covers its own properties (name, theme, data contract); a
    variant's covers its title, attributes and template model, so `getVariant` and
    `getVariantContent` return the same `ETag` for a variant, and either can be sent
    to `updateVariant` or `updateVariantContent`.

    ## Authorization
    Access is controlled via Suite permissions such as `TEMPLATE_VIEW`,
    `TEMPLATE_EDIT`, `DOCUMENT_GENERATE`, and `CATALOG_MANAGE`. Tenant permissions
    are derived from the Suite tenant roles (`CONTENT_VIEWER`, `CONTENT_AUTHOR`,
    `DOCUMENT_GENERATOR`, `CONTENT_PUBLISHER`, `TENANT_ADMINISTRATOR`) or from
    the roles stored on an API key. Platform-only tenant management uses the
    `TENANT_MANAGER` platform role.
  version: "2.0.0"
