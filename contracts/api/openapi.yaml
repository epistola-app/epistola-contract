    description: Base API path

# Machine-readable registry of the canonical problem `type` slugs
# (human-facing registry: docs/error-types.md — a CI check keeps the two in
# sync). The Kotlin client's KnownProblemSlugs constants are generated from
# this list, and guard tests in both Kotlin modules assert their hand-written
# error helpers agree with it. The slug list is open: new types may be added
# without a major version bump, so clients switching on the slug must keep an
# else branch.
x-problem-types:
  base: https://epistola.app/errors/
  types:
    - slug: validation-error
      status: 400
      schema: ValidationProblemDetail
      description: >-
        The request body or parameters failed validation; the `errors[]`
        array carries the field-level failures.
    - slug: bad-request
      status: 400
      schema: ProblemDetail
      description: >-
        The request is malformed or not applicable to the resource's current
        state, but not a field-level validation failure (no `errors[]`).
    - slug: unauthorized
      status: 401
      schema: ProblemDetail
      description: Missing or invalid authentication credentials.
    - slug: api-key-auth-disabled
      status: 401
      schema: ProblemDetail
      description: >-
        API-key authentication is disabled for this deployment. Use
        `Authorization: Bearer <jwt>` instead, or ask an administrator to enable
        API-key authentication.
    - slug: forbidden
      status: 403
      schema: ProblemDetail
      description: >-
        Authenticated, but the caller lacks the required role or tenant
        permission.
    - slug: not-found
      status: 404
      schema: ProblemDetail
      description: The addressed resource does not exist.
    - slug: conflict
      status: 409
      schema: ProblemDetail
      description: The request conflicts with the current state of the resource.
    - slug: data-model-validation-error
      status: 422
      schema: DataModelValidationProblemDetail
      description: >-
        The request is well-formed but semantically invalid; the
        `validationErrors` member maps each data-example name to its failures.
    - slug: rate-limited
      status: 429
      schema: ProblemDetail
      description: >-
        Too many requests; the `Retry-After` header indicates how long to
        wait.

tags:
  - name: System
    description: |
      System-level endpoints for health checking and metadata exchange.

      ## Ping / Pong

      The `POST /ping` endpoint enables bidirectional metadata exchange between
      clients and the server. It serves two purposes:

      1. **Health checking** — Any client (including load balancers and monitoring
         probes) can send an unauthenticated ping to verify the server is alive.
         The response contains only `status` and `timestamp`.

      2. **Metadata exchange** — Authenticated clients receive a full response
         including server version, API spec version, and node identity. Clients
         can also send their own metadata (name, version, node ID) in the request
         body for server-side logging and diagnostics.

      ### Recommended ping intervals

      - **On startup**: Always ping once before making business requests.
      - **Periodic**: Every 30–60 seconds for ongoing health monitoring.
      - **After failures**: Ping to check server availability before retrying.
  - name: Tenants
    description: Multi-tenant management operations
  - name: Templates
    description: Document template operations
  - name: Themes
    description: Reusable style collections for templates
  - name: Environments
    description: Tenant environment configuration (staging, production, etc.)
  - name: Attributes
    description: Attribute definitions for variant selection criteria
  - name: Variants
    description: Template variant operations (language, brand variations)
  - name: Versions
    description: Template version lifecycle (draft, publish, archive)
  - name: Contracts
    description: Template data-contract version lifecycle and compatibility previews
  - name: Stencils
    description: Reusable template component operations (CRUD, versioning, usage tracking)
  - name: Catalogs
    description: Catalog import and management operations
  - name: CodeLists
    description: |
      Reusable `{code, label}` collections that attributes can bind to.
      Code lists are tenant + catalog scoped; SUBSCRIBED-catalog code
      lists (e.g. the bundled `system` catalog's BCP-47, ISO 639-1,
      ISO 3166-1 alpha-2) are read-only — PATCH/DELETE return 409.
  - name: Fonts
    description: |
      Font families (tenant + catalog scoped) and the weight/italic faces
      they ship. Read-only over REST; families and their binaries are managed
      through the UI and catalog exchange only.
      SUBSCRIBED-catalog families (the bundled `system` fonts) are flagged
      `readOnly: true`.
  - name: Assets
    description: Catalog-scoped binary asset metadata, upload, download, and delete operations
  - name: Consumers
    description: |
      Tenant-scoped consumer application registration and lifecycle management.

      Each tenant independently manages which applications can access their resources.
      The same application can register in multiple tenants with separate approvals.

      ## Onboarding

      Two registration paths are supported:

      - **Self-signed JWT**: Application calls `POST /tenants/{tenantId}/consumers/register`
        with a public key. Created as `pending` until a tenant manager approves.
      - **OAuth**: First authenticated request to a tenant auto-registers the consumer
        as `pending`. A tenant manager must approve before resources are accessible.

      ## Permissions

      Consumers declare what permissions they need at registration time (or via
      OAuth scopes). The tenant manager reviews and grants equal or fewer permissions
      on approval. Permissions are per-resource (`read`, `write`, `publish`) and
      managed in Epistola's consumer record.

      ## Authentication

      Bearer JWT calls use `Authorization: Bearer <jwt>`. For self-signed JWT consumers,
      the JWT is short-lived (60s) and signed with the consumer's private key.
  - name: Generation
    description: Asynchronous document generation operations

# Global security — any method is accepted.
# bearerAuth (JWT) and authorizationApiKeyAuth are the current Authorization-header
# paths. apiKeyAuth is deprecated and retained for backwards compatibility.
security:
  - bearerAuth: []
  - authorizationApiKeyAuth: []
  - apiKeyAuth: []

