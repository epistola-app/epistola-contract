  parameters:
    # The required client-identity headers (User-Agent, X-EP-Node-Id) are described
    # normatively in info.description ("Client Identity") rather than modeled per
    # operation: OpenAPI has no global-parameter mechanism, so referencing them from
    # every operation would add two arguments to every generated client method and
    # server interface. The generated clients set both headers automatically.
    Page:
      $ref: './components/parameters/pagination.yaml#/Page'
    Size:
      $ref: './components/parameters/pagination.yaml#/Size'
    # Shared sort params. `sort` is a free-form string (allowed fields and the
    # per-resource default are enforced server-side); `direction` is asc/desc,
    # default desc.
    Sort:
      $ref: './components/parameters/sorting.yaml#/Sort'
    Direction:
      $ref: './components/parameters/sorting.yaml#/Direction'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token. Two authentication paths are supported:

        **OAuth (recommended for environments with an IdP):**
        Obtain a token via OAuth 2.0 Client Credentials flow from your
        Identity Provider (Keycloak, Azure AD, or any OIDC-compliant IdP).
        The JWT `client_id` claim identifies the consumer.

        **Self-signed JWT (no IdP required):**
        Register via `POST /consumers/register` with a public key.
        After admin approval, create short-lived JWTs (60s) signed with
        your private key. Required claims: `iss` (consumer ID), `exp`,
        `jti` (unique nonce for replay protection).

        In both cases, the JWT proves identity only. Granted permissions,
        allowed tenants, and expiry are managed in Epistola's consumer record,
        set by an administrator during approval.

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      # OpenAPI has no `deprecated` flag for security schemes; this vendor extension
      # makes the deprecation (also stated in the description) machine-readable.
      x-deprecated: true
      description: |
        **Deprecated — use JWT Bearer authentication (OAuth or self-signed) instead.**

        Static API key for legacy environments. Keys are issued by administrators
        and stored server-side with associated Suite roles and tenant access.
        Prefer `Authorization: ApiKey <key>` for new API-key integrations.

    authorizationApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Static API key sent through the standard `Authorization` header:

        `Authorization: ApiKey <key>`

        The auth scheme token is case-insensitive; examples use `ApiKey`.
        Keys are issued by administrators and stored server-side with associated
        Suite roles and tenant access. This is the preferred API-key
        transport. The legacy `X-API-Key` header remains supported but deprecated.
