  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      # OpenAPI has no `experimental` flag for security schemes; this vendor extension
      # makes the status (also stated in the description) machine-readable.
      x-experimental: true
      description: |
        **Experimental**, and may still change: see "Experimental parts and server support" in
        the API description. Use an API key (`Authorization: ApiKey <key>`) for production
        integrations.

        JWT Bearer token. Two authentication paths are defined:

        **OAuth (for environments with an IdP):**
        Obtain a token via OAuth 2.0 Client Credentials flow from your
        Identity Provider (Keycloak, Azure AD, or any OIDC-compliant IdP).
        The JWT `client_id` claim identifies the consumer.

        **Self-signed JWT (no IdP required):**
        Register via `POST /tenants/{tenantKey}/consumers/register` with a public key.
        After admin approval, create short-lived JWTs (60s) signed with
        your private key. Required claims: `iss` (consumer ID), `exp`,
        `jti` (unique nonce for replay protection).

        In both cases, the JWT proves identity only. Granted permissions,
        allowed tenants, and expiry are managed in Epistola's consumer record,
        set by an administrator during approval.

    authorizationApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Static API key sent through the standard `Authorization` header:

        `Authorization: ApiKey <key>`

        The scheme name is case-insensitive; examples use `ApiKey`. A tenant manager issues
        each key for one tenant, with the tenant roles it grants. This is the supported
        authentication method.
