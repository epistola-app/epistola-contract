id: list-deployment-history
title: An environment's history reads every event kind, an override of a draft included
why: >
  The history lists every deploy, undeploy and override change on an environment, newest first.
  `action` is an enum whose values carry a hyphen (`override-set`, `override-cleared`), which is
  where generated enums go wrong: a client must report the wire value, not a constant name.

  An override that named a draft has no release: `releaseVersion` is null, and `draftLabel` names
  the draft as it was called at the time. A system change has no `changedBy`. Optional members are
  sent as null on some entries and left out on others, and a client must read both as missing.

  The page is the caller's: `page` and `size` go out as given.

action:
  name: list-deployment-history
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: acceptance
    page: 0
    size: 50

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          action: override-set
          releaseVersion: null
          draftLabel: Redesign 2027
          changedAt: "2026-10-18T09:00:00Z"
          changedBy: Jane Smith
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          action: override-cleared
          releaseVersion: 1.3.2
          draftLabel: null
          changedAt: "2026-10-17T16:00:00Z"
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          action: undeployed
          releaseVersion: 1.3.2
          changedAt: "2026-10-17T16:00:00Z"
          changedBy: Jane Smith
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          action: deployed
          releaseVersion: 1.4.0
          changedAt: "2026-10-02T07:30:00Z"
          changedBy: null
      page: { number: 0, size: 50, totalElements: 4, totalPages: 1 }

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/environments/acceptance/deployment-history
      queryParams:
        page: "0"
        size: "50"
      headers:
        Accept:
          contains: application/vnd.epistola.v2+json
  report:
    catalogKeys: letters,letters,letters,letters
    actions: override-set,override-cleared,undeployed,deployed
    releaseVersions: null,1.3.2,1.3.2,1.4.0
    # Names are free text, so they are joined with `|`.
    draftLabels: Redesign 2027|null|null|null
    changedAt: 2026-10-18T09:00:00Z,2026-10-17T16:00:00Z,2026-10-17T16:00:00Z,2026-10-02T07:30:00Z
    changedBy: Jane Smith|null|Jane Smith|null
    totalElements: "4"
