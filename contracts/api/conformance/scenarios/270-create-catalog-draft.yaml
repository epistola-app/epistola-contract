id: create-catalog-draft
title: Starting a draft from a release sends its name and the release number, and reads back a draft with no number
why: >
  A draft has no number until it is released (ADR 0002). Starting one is a POST to the catalog's
  versions with the draft's `name` in the body; `from` names what to start from, here a released
  version by its number, which becomes the draft's base. That is how an older line is fixed: a
  draft from `1.4.0` is released as `1.4.1` whatever was released since. Python's generated model
  calls that member `var_from`, because `from` is a keyword, and a client that sends the alias
  instead of the wire name starts the draft from the highest release without saying so.

  The answer is a draft: `version` is null, and it is addressed by its `versionId` (which `Location`
  carries). A draft has no release data either: `releasedAt` and `fingerprint` are null and
  `dependencies` and `deployedTo` empty. A client that turns a null `version` into an empty string
  makes a draft look like a broken release.

action:
  name: create-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    name: Fixes 1.4
    from: 1.4.0

script:
  - status: 201
    contentType: application/vnd.epistola.v2+json
    headers:
      Location: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/r4t8w2nc
    body:
      version: null
      versionId: r4t8w2nc
      name: Fixes 1.4
      status: draft
      base: 1.4.0
      createdFrom: null
      createdAt: "2026-10-15T09:00:00Z"
      behind: []
      releasedAt: null
      notes: null
      fingerprint: null
      dependencies: []
      deployedTo: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          name: Fixes 1.4
          from: 1.4.0
        jsonAbsent: [version, var_from]
  report:
    version: 'null'
    versionId: r4t8w2nc
    name: Fixes 1.4
    status: draft
    base: 1.4.0
    createdFrom: 'null'
    releasedAt: 'null'
