id: create-catalog-draft
title: Starting long-term work sends its name and its release, and reads back a draft with no number
why: >
  A draft has no number until it is released (ADR 0002, amendment 2). Starting long-term work is a
  POST to the catalog's versions with the work's `name` in the body; `from` names the released
  version to start from, which becomes its base. Python's generated model calls that member
  `var_from`, because `from` is a keyword, and a client that sends the alias instead of the wire
  name starts the work from the next version without saying so.

  The answer is a draft: `version` is null, it is addressed by its `draftId` (which `Location`
  carries), and it is not the next version. A draft has no release data either: `releasedAt`
  and `fingerprint` are null and `dependencies` and `deployedTo` empty. A client
  that turns a null `version` into an empty string, or a false `isNext` into a missing one, makes a
  draft look like a broken release.

action:
  name: create-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    name: Redesign 2027
    from: 1.4.0

script:
  - status: 201
    contentType: application/vnd.epistola.v1+json
    headers:
      Location: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
    body:
      version: null
      draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
      isNext: false
      name: Redesign 2027
      status: draft
      base: 1.4.0
      createdFrom: null
      createdAt: "2026-10-15T09:00:00Z"
      behind: []
      releasedAt: null
      notes: null
      fingerprint: null
      dependencies: []
      deployedTo: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v1\+json(;.*)?$'
      body:
        json:
          name: Redesign 2027
          from: 1.4.0
        jsonAbsent: [version, var_from]
  report:
    version: 'null'
    draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
    isNext: 'false'
    name: Redesign 2027
    status: draft
    base: 1.4.0
    createdFrom: 'null'
    releasedAt: 'null'
