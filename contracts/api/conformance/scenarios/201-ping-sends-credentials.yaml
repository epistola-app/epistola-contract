id: ping-sends-credentials
title: A ping from a client configured with an API key carries the key
why: >
  Authentication on `/ping` is optional: an unauthenticated probe gets `status` and `timestamp`,
  and only an authenticated ping gets `details` (server version, node identity, the partition
  assignment a node uses to compute routing keys at startup). The contract once declared
  `security: []`, which tells a generated client the operation takes no credentials, so a client
  that follows the declaration sends none and `details` is out of reach whatever it is configured
  with. The operation now declares authentication optional (`{}` and every scheme), and a
  configured client must send its credentials here as everywhere else.

action:
  name: ping
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      status: UP
      timestamp: "2026-04-21T10:30:00Z"
      details:
        serverVersion: "2.0.0"
        apiVersion: "2.0.0"
        nodeId: epistola-server-pod-3a2d1e

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/ping
      headers:
        Authorization: ApiKey epk_conformance_0123456789
        X-API-Key: { absent: true }
