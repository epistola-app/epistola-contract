id: preview-catalog-draft-release
title: A release preview of the next version surfaces the number, the kind of change and every reason
why: >
  A draft is numbered when it is released, from the kind of change it holds against the latest
  release (ADR 0002, amendment 2). The preview is what an author sees before releasing: the latest
  release, the kind of change (`none`, `additive` or `breaking`), each change that makes it more
  than a fix, breaking first, and the lowest number that fits, which releasing without a `version`
  uses. A client that drops a reason hides why the number is a major.

  The next version is addressed as `next`, a literal path segment. The preview takes no query
  parameters: the renumber preview it replaced took the target number as `to`, and a client that
  still sends one sends a parameter the contract does not have.

action:
  name: preview-catalog-draft-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: next

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      latest: 1.6.0
      changeKind: breaking
      reasons:
        - "template 'invoice': removed"
        - "template 'reminder': added"
      suggested: 2.0.0

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/next/release-preview
      query: ""
  report:
    latest: 1.6.0
    changeKind: breaking
    # Reasons are free text, so they are joined with `|`.
    reasons: "template 'invoice': removed|template 'reminder': added"
    suggested: 2.0.0
