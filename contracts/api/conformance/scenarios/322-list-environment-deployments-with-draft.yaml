id: list-environment-deployments-with-draft
title: Listing what an environment serves reads a draft beside releases, in order
why: >
  An environment serves releases and at most one draft per catalog (ADR 0003, "Deploying"). The
  list mixes both, so a client must read a null `releaseVersion` beside set ones, and a null
  `draftName` beside a set one, without refusing the response or inventing values. `kind` says
  which each is; every entry has a `versionId`, a release's as much as a draft's.

action:
  name: list-environment-deployments
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: acceptance

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          versionId: r4t8w2nc
          kind: draft
          releaseVersion: null
          draftName: Redesign 2027
          deployedAt: "2026-10-18T09:00:00Z"
          lastUsedAt: "2026-10-18T10:15:00Z"
          documentsRequested: 12
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: letters
          versionId: m3q8v5tw
          kind: release
          releaseVersion: 1.4.0
          draftName: null
          deployedAt: "2026-10-02T07:30:00Z"
          lastUsedAt: null
          documentsRequested: 0

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/environments/acceptance/deployments
      query: ""
  report:
    registries: exchange.epistola.app,exchange.epistola.app
    catalogKeys: letters,letters
    versionIds: r4t8w2nc,m3q8v5tw
    kinds: draft,release
    releaseVersions: null,1.4.0
    # Names are free text, so they are joined with `|`.
    draftNames: Redesign 2027|null
    deployedAt: 2026-10-18T09:00:00Z,2026-10-02T07:30:00Z
    lastUsedAt: 2026-10-18T10:15:00Z,null
    documentsRequested: 12,0
