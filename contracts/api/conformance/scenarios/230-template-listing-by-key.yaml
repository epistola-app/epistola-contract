id: template-listing-by-key
title: A template listing is read by key, the only address a 2.0 server sends
why: >
  Contract 1.3.0 added `slug` beside the `id` it duplicated, optional so that a 1.x client could
  still read a server from before 1.3.0. Contract 2.0.0 names a resource's address `key`, removes
  both `id` and `slug`, and requires `key` (epistola-app/epistola-contract#84), so every client must
  read the address from `key` alone. A generated model that still looked for `id` or `slug`, or
  treated `key` as optional and dropped it, would surface nothing here.

  The first template carries the optional plain-text `description` (#97); the second has none.

action:
  name: list-templates
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: main
    release: 2.0.0

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - key: invoice
          tenantKey: acme-corp
          name: Invoice
          description: "Monthly invoice; the payment block follows the 2026 house style."
          createdAt: '2026-08-20T10:00:00Z'
          lastModified: '2026-08-20T10:00:00Z'
        - key: reminder-letter
          tenantKey: acme-corp
          name: Reminder letter
          createdAt: '2026-08-20T10:00:00Z'
          lastModified: '2026-08-21T09:30:00Z'
      page: { number: 0, size: 20, total: 2, totalPages: 1 }

expect:
  requestCount: 1
  report:
    templateKeys: invoice,reminder-letter
    # A template's description reads back as sent; one the server leaves out reads as null, not
    # as an empty string.
    templateDescriptions: "Monthly invoice; the payment block follows the 2026 house style.|null"
