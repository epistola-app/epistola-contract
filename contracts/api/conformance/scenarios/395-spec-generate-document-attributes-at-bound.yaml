id: spec-generate-document-attributes-at-bound
title: A generation request at its bounds, 50 attribute criteria and a 255-character value, goes out whole
why: >
  Contract 2.0 bounds variant selection: a request carries at most 50 attribute criteria, and a
  criterion's value is at most 255 characters, as a variant's attribute values are. Inputs at the
  bound are valid, and a client must send them as given: neither refuse them before sending, nor
  truncate a value or drop criteria. Prism holds the request to the spec, so one over a bound would
  fail here too; the body check holds each client to sending all 50 criteria, in order, the long
  value included.

backend: prism

