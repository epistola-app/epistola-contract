id: collect-compression
title: A gzipped result stream is decoded, and the offer says what the client can decode
why: >
  Compression is negotiated per request and the server honours whatever the client offered, so a
  client that offers a codec it cannot decode gets a stream it cannot read — in production, under
  load, on the endpoint that carries every result. The offer and the decode have to agree, and they
  live in different places in every client.

action:
  name: collect
  config:
    nodeId: conformance-node-1
    tenantId: acme-corp
    batchSize: 10
    minIntervalMs: 150
    maxIntervalMs: 2000
    multiplier: 3
    runForMs: 400

script:
  - status: 200
    contentType: application/vnd.epistola.v1+ndjson
    gzip: true
    ndjson:
      - { sequence: 900, requestId: 55555555-5555-4555-8555-000000000900, templateId: invoice, status: COMPLETED, documentId: 66666666-6666-4666-8666-000000000900, correlationId: gz-1, completedAt: "2026-02-01T08:05:00Z" }
      - { _meta: true, hasMore: false, lastSequence: 900, count: 1, partitions: { total: 8, mine: [0, 3], hash: murmur3 } }
  - status: 200
    contentType: application/vnd.epistola.v1+ndjson
    gzip: true
    ndjson:
      - { _meta: true, hasMore: false, lastSequence: 900, count: 0, partitions: { total: 8, mine: [0, 3], hash: murmur3 } }

expect:
  requestCountAtLeast: 1
  everyRequest:
    headers:
      Accept-Encoding:
        # gzip is the one every client can decode without an optional library, so it is the one the
        # offer must always contain. lz4 and zstd are allowed to appear when present.
        matches: '(^|[ ,])gzip($|[ ,;])'
  # The client only passes this if it actually inflated the body.
  report:
    resultsHandled: 1
    correlationIds: gz-1
