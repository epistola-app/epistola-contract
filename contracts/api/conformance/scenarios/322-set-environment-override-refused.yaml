id: set-environment-override-refused
title: A production environment refuses to follow a draft, and the client surfaces the problem type
why: >
  A production environment uses only published versions, so an override there may name a release,
  never a draft (ADR 0002). The server refuses with 409
  `environment-override-refused`. A client must surface that slug, which says the request can never
  succeed against this environment, rather than a bare conflict an integration would retry.

action:
  name: set-environment-override
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: production
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    versionId: r4t8w2nc

script:
  - status: 409
    contentType: application/problem+json
    body:
      type: https://epistola.app/errors/environment-override-refused
      title: Environment Override Refused
      status: 409
      detail: "production uses only published versions: it cannot follow a draft of letters"

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/environments/production/overrides/~/acme-corp/letters
      body:
        json:
          versionId: r4t8w2nc
        jsonAbsent: [releaseVersion]
  report:
    problemTypeSlug: environment-override-refused
    problemStatus: 409
