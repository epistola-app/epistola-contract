id: catalog-dependencies-update-resource-modified
title: Replacing a draft's dependencies sends If-Match as given, and a stale one surfaces as resource-modified
why: >
  A draft's dependency declarations share its revision with its name, default theme and presets:
  `getCatalogRelease` and `listCatalogDependencies` answer with the same `ETag`, and
  `updateCatalogDependencies` takes it as `If-Match`. Two authors replacing the declarations at
  once would otherwise each overwrite the other's pins without either noticing. The client must send
  the tag byte for byte, quotes included, and surface the 412 as `resource-modified`, which tells
  the caller to read the declarations again rather than retry the same replacement.

action:
  name: update-catalog-dependencies
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa
    ifMatch: '"5"'
    dependencies:
      - { namespace: epistola, catalogKey: system, version: 1.3.0 }

script:
  - status: 412
    contentType: application/problem+json
    body:
      type: https://epistola.app/errors/resource-modified
      title: Resource Modified
      status: 412
      detail: "The draft changed since revision 5 was read; it is now at revision 6"

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/dependencies
      headers:
        if-match: '"5"'
      body:
        json:
          dependencies:
            - { namespace: epistola, catalogKey: system, version: 1.3.0 }
  report:
    problemTypeSlug: resource-modified
    problemStatus: 412
