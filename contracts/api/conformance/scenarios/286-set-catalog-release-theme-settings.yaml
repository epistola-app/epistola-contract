id: set-catalog-release-theme-settings
title: Setting a draft's default theme and presets sends only those, and reads them back
why: >
  A release names a default theme and declares its presets (ADR 0007). They are set with the
  same PATCH that renames a draft, and a member the request leaves out keeps its value: a client that
  sends a `name` it was not given, even as null, renames or blanks the draft by accident. The default
  theme is qualified like every cross-catalog reference: an unqualified `namespace` or `registry` is
  left out or null, both meaning the catalog's own, and never a value the caller did not give. The
  response carries both back on the draft, a preset's `description` absent or null when it has
  none.

action:
  name: set-catalog-release-theme-settings
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: onboarding
    release: h3v9p6db
    defaultThemeKey: corporate
    defaultThemeCatalogKey: brand
    presets:
      - key: muted
        name: Muted
        description: Grey, smaller text for asides
      - key: label
        name: Label

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      version: null
      releaseId: h3v9p6db
      name: Redesign 2027
      status: draft
      base: null
      createdFrom: null
      behind: []
      dependencies: []
      deployedTo: []
      defaultTheme:
        key: corporate
        catalogKey: brand
      presets:
        - key: muted
          name: Muted
          description: Grey, smaller text for asides
        - key: label
          name: Label
          description: null

expect:
  requestCount: 1
  requests:
    - method: PATCH
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/onboarding/releases/h3v9p6db
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          defaultTheme:
            key: corporate
            catalogKey: brand
            namespace:
              whenPresent:
                oneOf: [null]
            registry:
              whenPresent:
                oneOf: [null]
          presets:
            - key: muted
              name: Muted
              description: Grey, smaller text for asides
            - key: label
              name: Label
              description:
                whenPresent:
                  oneOf: [null]
        jsonAbsent: [name]
  report:
    releaseId: h3v9p6db
    name: Redesign 2027
    defaultThemeKey: corporate
    defaultThemeCatalogKey: brand
    presetKeys: muted,label
    presetNames: Muted|Label
    presetDescriptions: Grey, smaller text for asides|null
