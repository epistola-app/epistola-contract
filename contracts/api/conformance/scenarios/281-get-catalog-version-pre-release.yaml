id: get-catalog-version-pre-release
title: A pre-release is addressed by its full number, label and count included, and reads back as one
why: >
  Long-term work is released as a pre-release (ADR 0002, amendment 2): the number its changes need,
  a label from its name, and a count, `2.0.0-redesign-2027.1`. It is addressed by that number in
  the path, the same way as a release. The number carries `-` and `.`, both unreserved in RFC 3986,
  so a client sends them as they are. One that validates the address against the old pattern (three
  numbers only) refuses to read the pre-release at all, and one that percent-encodes or strips the
  label reads another version.

  The answer is a released version, so its `draftId` and `name` are null and it is not the next
  version; `preRelease` is true. A client that drops `preRelease` makes the pre-release look like
  the catalog's latest release.

action:
  name: get-catalog-version
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 2.0.0-redesign-2027.1

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      version: 2.0.0-redesign-2027.1
      draftId: null
      isNext: false
      preRelease: true
      name: null
      status: released
      base: 1.4.0
      createdFrom: null
      createdAt: "2026-10-10T09:00:00Z"
      behind: []
      releasedAt: "2026-10-17T12:00:00Z"
      notes: null
      fingerprint: v5:3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c
      contentRetained: true
      dependencies: []
      deployedTo: [acceptance]

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/2.0.0-redesign-2027.1
  report:
    version: 2.0.0-redesign-2027.1
    draftId: 'null'
    isNext: 'false'
    preRelease: 'true'
    name: 'null'
    status: released
    deployedTo: acceptance
    behind: ""
