id: delete-catalog-draft
title: Discarding long-term work addresses it by its id, and its empty answer is a success
why: >
  A draft has no number, so discarding long-term work is a DELETE on the address its `draftId`
  gives it (ADR 0002, amendment 2). The answer is a 204 with no body and no content type, which a
  client must treat as success rather than fail to deserialize.

action:
  name: delete-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192

script:
  - status: 204

expect:
  requestCount: 1
  requests:
    - method: DELETE
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
