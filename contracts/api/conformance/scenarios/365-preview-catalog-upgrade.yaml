id: preview-catalog-upgrade
title: The upgrade preview lists the releases the source offers, what each changed, and its pins
why: >
  Releases are immutable and installed side by side (contract 2.0), so an upgrade has nothing to
  reconcile, and the preview has no conflicts, no removals to block and no "added, not installed".
  It lists the releases the source offers above the highest installed one (`installedVersion`),
  lowest first. For each, the resources it added, modified or removed against `installedVersion`,
  so a caller can choose a release rather than take the highest; and the releases it pins, each
  with whether the tenant has it, so a caller can see which an upgrade would have to fetch.

  A client must surface every release in order, every change with its kind, and every pin with its
  registry as written and `present` as a boolean, including `false`; and a release without pins as
  an empty list.

action:
  name: preview-catalog-upgrade
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      installedVersion: 1.4.0
      available:
        - version: 1.5.0
          changes:
            - { type: template, key: invoice, change: modified }
            - { type: theme, key: corporate, change: added }
          dependencies:
            - registry: exchange.epistola.app
              namespace: epistola
              catalogKey: system
              releaseVersion: 3.2.0
              present: true
            - registry: registry.gemeente-x.nl
              namespace: huisstijl
              catalogKey: branding
              releaseVersion: 1.5.0
              present: false
        - version: 2.0.0
          changes:
            - { type: stencil, key: letter-shell, change: removed }
          dependencies: []

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/upgrade-preview
      query: ""
  report:
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    installedVersion: 1.4.0
    availableChanges: 1.5.0=template/invoice:modified+theme/corporate:added;2.0.0=stencil/letter-shell:removed
    availableDependencies: 1.5.0=exchange.epistola.app/epistola/system@3.2.0:true+registry.gemeente-x.nl/huisstijl/branding@1.5.0:false;2.0.0=
