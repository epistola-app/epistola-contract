id: release-catalog-draft-pre-release-version
title: Releasing long-term work under a pre-release number the author chose sends that number as given
why: >
  The author may choose the pre-release's number, `2.0.0-beta.1` rather than the label the server
  derives from the work's name (ADR 0002, amendment 2). The number travels as `version` in the
  body, and `ReleaseCatalogDraftRequest.version` accepts a SemVer pre-release. A client that still
  validates it against three numbers refuses the request before it is sent; one that trims the
  label releases `2.0.0`, which for long-term work the server refuses.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192
    version: 2.0.0-beta.1

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      catalogVersion:
        version: 2.0.0-beta.1
        draftId: null
        isNext: false
        preRelease: true
        name: null
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-17T12:00:00Z"
        notes: null
        fingerprint: v5:4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d
        contentRetained: true
        dependencies: []
        deployedTo: []
      unchangedContent: false
      draftsBehind: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/0193a6b2-8a10-7d2e-8b3c-4d5e6f708192/release
      body:
        json:
          version: 2.0.0-beta.1
        jsonAbsent: [notes, acknowledgedBehind]
  report:
    version: 2.0.0-beta.1
    status: released
    preRelease: 'true'
