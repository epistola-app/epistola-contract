id: newer-server-unknown-members
title: A response member the client does not know is ignored, at the top and nested
why: >
  A minor version may add response members ("Compatibility within 2.x" in the API description),
  so a 2.0.0 client meets members it was not generated with as soon as a server runs 2.1. Ignoring
  them is the only behaviour that lets the contract grow without a major version: a client that
  fails on one fails on every response of every operation that gained one. The Kotlin client did,
  through the recommended `epistolaMessageConverters()`, until 2.0.0.

  The job carries an unknown scalar, an unknown object and an unknown array. The client must read
  every member it does know exactly as without them.

