id: undeploy-release
title: Undeploying stops one release, and its empty answer is a success
why: >
  Undeploying stops the environment serving one release; generation naming the environment then
  renders the highest release it still serves. A client that addressed the catalog rather than the
  release would stop every release of it, which is not an operation the contract has any more.

  The answer is a 204 with no body and no content type, which a client must treat as success
  rather than fail to deserialize.

action:
  name: undeploy-release
  config:
    nodeId: conformance-node-1
    tenantId: acme-corp
    environmentId: production
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 1.3.0

script:
  - status: 204

expect:
  requestCount: 1
  requests:
    - method: DELETE
      path: /api/tenants/acme-corp/environments/production/deployments/acme-corp/letters/1.3.0
