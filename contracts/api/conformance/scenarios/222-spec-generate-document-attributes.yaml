id: spec-generate-document-attributes
title: A generation request selects its variant by attribute criteria, one in another catalog by its alias
why: >
  An attribute criterion names its attribute one way: `key` is the attribute's resource key, and
  `catalogKey` the alias the rendering release's dependency declarations give the catalog that
  defines it, omitted for the template's own catalog (contract ADR 0003). A criterion names no
  registry or namespace: the declaration does. The contract used to accept a dotted
  `<catalogKey>.<key>` too, and a bare key looked up tenant-wide; both are gone, and `key` has the
  resource key rule, so a client that checks patterns refuses a dotted key before sending it.

  Prism holds the request to the spec, and the body check holds each client to sending every
  criterion as given: the one in another catalog with its alias, the bare one without, and
  `required: false` where the scenario sets it, and neither with a registry or namespace. A client
  that drops the alias or rewrites the list fails here.

backend: prism

action:
  name: generate-document
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantKey: acme-corp
    namespace: acme-corp
    catalogKey: letters
    templateKey: invoice
    attributes:
      - catalogKey: system
        key: locale
        value: nl-NL
      - key: brand
        value: acme
        required: false
    data:
      customerName: Acme B.V.

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/documents/generate
      body:
        json:
          templateKey: invoice
          attributes:
            - catalogKey: system
              key: locale
              value: nl-NL
            - key: brand
              value: acme
              required: false
