id: partial-update
title: A partial update sends only the fields the caller set
why: >
  The generated models are plain nullable properties with no way to distinguish "not set" from
  "explicitly null", so whatever the serializer does with an unset property *is* the semantics.
  The contract now keeps a member that is null, as it keeps one that is omitted, and removes a
  value with an empty string or an explicit flag instead (`update-consumer-remove-values`). Contracts
  before 2.0 documented `description` and `contact` as "null to clear" and `expiresAt` as "null to
  remove expiry", though, and a server built to one of those still reads a null as an instruction.

  A serializer that writes nulls therefore turns "rename this consumer" into "rename it and erase
  its description, contact and expiry" against such a server — silently, with a 200 back. That is
  data loss, and no client's own tests look at the body of a request that succeeded.

action:
  name: update-consumer
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantKey: acme-corp
    consumerId: billing-service
    name: Billing Service

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      id: billing-service
      tenantKey: acme-corp
      name: Billing Service
      authMethod: api-key
      status: active
      requestedPermissions: {}
      grantedPermissions: {}
      nodes: []
      createdAt: "2026-01-20T09:00:00Z"
      lastModified: "2026-10-20T08:30:00Z"

expect:
  requestCount: 1
  requests:
    - method: PATCH
      path: /api/tenants/acme-corp/consumers/billing-service
      body:
        json:
          name: Billing Service
        # Not sent as null. The caller said nothing about these, and a server built to a contract
        # before 2.0 reads a null on them as an instruction to erase.
        jsonAbsent: [description, contact, expiresAt, permissions, roles]
  # The consumer's lastModified is required; every client reads it from the response, here moved
  # past createdAt by the update.
  report:
    id: billing-service
    name: Billing Service
    lastModified: "2026-10-20T08:30:00Z"
    etag: 'null'
