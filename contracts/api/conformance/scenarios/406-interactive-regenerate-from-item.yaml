id: interactive-regenerate-from-item
title: An item's data goes back into a generation request unchanged
why: >
  Rendering again, to correct something or for a newer release, is a generation request with an
  earlier item's `data` and `variantKey` (ADR 0011). That only works if the client hands the item's
  `data` to the request as it is, with no conversion, and serializes it back exactly: every JSON type
  kept, nested objects and arrays intact, numbers still numbers. A client whose response `data` has
  a different type than its request `data`, or that reformats a number, breaks resubmission in a way
  no compiler notices.

