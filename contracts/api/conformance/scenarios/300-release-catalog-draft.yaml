id: release-catalog-version
title: Releasing a draft reports which drafts its changes flowed into, and how many conflict
why: >
  Releasing changes a draft's status, not its number, so the request goes to the draft's own
  address and carries only the notes. Nothing is merged into other drafts, so what the author
  needs next is in the answer: every higher open draft that is now behind this release
  (`draftsBehind`), which will not contain its changes unless someone applies them by hand. A
  client that drops `draftsBehind` hides that a fix may be lost from the next version.

  This draft is not behind anything, so the client sends no `acknowledgedBehind`.

  `openedDraft` is null here, because a draft above the release was already open.

action:
  name: release-catalog-version
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 1.5.0
    notes: Finished improvements, ahead of 2.0.0.

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      catalogVersion:
        version: 1.5.0
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-15T10:00:00Z"
        notes: Finished improvements, ahead of 2.0.0.
        fingerprint: v5:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
        contentRetained: true
        dependencies: []
        deployedTo: []
      unchangedContent: false
      draftsBehind: [2.0.0]
      openedDraft: null

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/1.5.0/release
      body:
        json:
          notes: Finished improvements, ahead of 2.0.0.
        jsonAbsent: [acknowledgedBehind]
  report:
    version: 1.5.0
    status: released
    draftsBehind: 2.0.0
    openedDraft: 'null'
