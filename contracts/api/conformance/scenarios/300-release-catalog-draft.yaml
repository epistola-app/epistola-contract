id: release-catalog-draft
title: Releasing a draft lets the server choose its version, and names the drafts now behind it
why: >
  A draft has no version until it is released (ADR 0002), so the request goes to the draft's
  address, `…/releases/{releaseId}/release`. Without a `version` the server chooses its version as its
  changes need against its base, so a client must leave `version` out rather than send one it was
  not given; it carries only the notes. The answer is the release, under its new version, no longer
  a draft. It keeps its `releaseId`, which now addresses the release as its version does, and its name.

  Nothing is merged into other drafts, so what the author needs next is in the answer: the drafts
  this release puts behind (`draftsBehind`), which will not contain its changes unless someone
  applies them by hand. Each is named in full, by its catalog and its `releaseId`, because a draft
  has no version and its name can change. A client that drops `draftsBehind`, or any member of its
  entries, hides that a fix may be lost from that work.

  The draft is not behind anything, so the client sends no `acknowledgedBehind`, and it does not
  ask to release dependencies, so it sends no `releaseDependencies`, or `false`, its default.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa
    notes: Finished improvements, ahead of the redesign.

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      release:
        version: 1.5.0
        releaseId: k7m2x9qa
        name: Spring fixes
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-15T10:00:00Z"
        notes: Finished improvements, ahead of the redesign.
        fingerprint: v6:332102ae9816ed0d53b0657b25f4b6a96ce09bb995b159c594154b49cd0b1818
        contentHash: v6:332102ae9816ed0d53b0657b25f4b6a96ce09bb995b159c594154b49cd0b1818
        dependencies: []
        deployedTo: []
      unchangedContent: false
      draftsBehind:
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: letters, releaseId: d7k2m9px, releaseName: Redesign 2027 }
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: letters, releaseId: a3c5e7g9, releaseName: Accessibility pass }
      releasedDependencies: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/release
      body:
        json:
          notes: Finished improvements, ahead of the redesign.
          # Its default is false, so a client may send `false` or leave it out, never `true`.
          releaseDependencies: { whenPresent: { equals: false } }
        jsonAbsent: [version, acknowledgedBehind]
  report:
    version: 1.5.0
    status: released
    releaseId: k7m2x9qa
    # Released under V6, so its content hash is its fingerprint; the content is new to the catalog.
    contentHash: v6:332102ae9816ed0d53b0657b25f4b6a96ce09bb995b159c594154b49cd0b1818
    unchangedContent: 'false'
    # Each as registry/namespace/catalogKey#releaseId=releaseName; names are free text, so joined with `|`.
    # The registry is written in full, never `~`, although the request addressed the catalog by it.
    draftsBehind: exchange.epistola.app/acme-corp/letters#d7k2m9px=Redesign 2027|exchange.epistola.app/acme-corp/letters#a3c5e7g9=Accessibility pass
    releasedDependencies: ""
