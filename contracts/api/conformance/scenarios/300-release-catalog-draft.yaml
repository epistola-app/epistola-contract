id: release-catalog-draft
title: Releasing the next version lets the server number it, and names the long-term work now behind it
why: >
  Only the next version is released, and a draft has no number until then (ADR 0002, amendment 2),
  so the request goes to `…/versions/next/release`. Without a `version` the server numbers it as
  its changes need against the latest release, so a client must leave `version` out rather than
  send one it was not given; it carries only the notes. The answer is the release, under its new
  number, no longer a draft: its `draftId` is null and it is not the next version, which continues
  as a draft on it.

  Nothing is merged into other drafts, so what the author needs next is in the answer: the
  long-term work now behind this release (`draftsBehind`), by name, which will not contain its
  changes unless someone applies them by hand. A client that drops `draftsBehind` hides that a fix
  may be lost from that work.

  The next version is not behind anything, so the client sends no `acknowledgedBehind`.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: next
    notes: Finished improvements, ahead of the redesign.

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      catalogVersion:
        version: 1.5.0
        draftId: null
        isNext: false
        name: null
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-15T10:00:00Z"
        notes: Finished improvements, ahead of the redesign.
        fingerprint: v5:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
        dependencies: []
        deployedTo: []
      unchangedContent: false
      draftsBehind: [Redesign 2027, Accessibility pass]

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/next/release
      body:
        json:
          notes: Finished improvements, ahead of the redesign.
        jsonAbsent: [version, acknowledgedBehind]
  report:
    version: 1.5.0
    status: released
    draftId: 'null'
    isNext: 'false'
    # Names are free text, so they are joined with `|`.
    draftsBehind: Redesign 2027|Accessibility pass
