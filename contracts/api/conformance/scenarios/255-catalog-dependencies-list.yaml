id: catalog-dependencies-list
title: Listing a catalog's dependencies addresses the catalog by registry, namespace and key
why: >
  The schema is validated by Prism, which checks the request against the path's registry and
  namespace patterns (`~` for the default registry) and answers with a body generated from the
  response schema. A client whose model rejects a registry written in full, or a null
  `resolvedVersion`, fails here without a scripted fixture having thought of it.

backend: prism

action:
  name: list-catalog-dependencies
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: next

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/next/dependencies
