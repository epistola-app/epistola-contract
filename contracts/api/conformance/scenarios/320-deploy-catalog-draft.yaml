id: deploy-catalog-draft
title: Deploying a draft addresses it by its releaseId, and reads back a deployment with no release
why: >
  A draft is tried by deploying it to a non-production environment, which then renders it live
  with no release (ADR 0003, "Deploying"). It has no version, so the path ends in its `releaseId`,
  exactly as given; the request has no body, and no query string when no flag is set.

  The answer is a deployment with status `draft`: `version` is null and `releaseName` names the
  draft. A client that requires `version`, or reads `status` into a closed type that does not
  know `draft`, cannot read what an environment serves.

action:
  name: deploy-catalog-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: acceptance
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      releaseId: k7m2x9qa
      status: draft
      version: null
      releaseName: Spring fixes
      deployedAt: "2026-10-18T09:00:00Z"
      lastUsedAt: null
      documentsRequested: 0

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/environments/acceptance/deployments/~/acme-corp/letters/k7m2x9qa
      query: ""
  report:
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    releaseId: k7m2x9qa
    status: draft
    version: 'null'
    # Names are free text, so a driver reports them as given.
    releaseName: Spring fixes
    lastUsedAt: 'null'
    documentsRequested: "0"
