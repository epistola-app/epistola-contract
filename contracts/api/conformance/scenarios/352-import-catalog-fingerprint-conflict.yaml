id: import-catalog-fingerprint-conflict
title: A release with a version the tenant has, but other content, is refused as a number taken
why: >
  A release is immutable, and its version names one content. An archive that carries a release the
  tenant has under the same version but with a different fingerprint is different content under one
  name, so the import is refused with 409 `release-number-taken` (one number names one release), as
  publishing to a registry that holds the number is, and nothing changes: neither the release the
  tenant has nor any draft. The client must surface that as a problem with its slug and status, so
  a caller can tell it from a failed upload or another conflict and does not retry it.

action:
  name: import-catalog
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantKey: acme-corp
    filename: letters-1.2.0.zip
    fileContentType: application/zip
    fileBase64: UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==

script:
  - status: 409
    contentType: application/problem+json
    body:
      type: https://epistola.app/errors/release-number-taken
      title: Release Number Taken
      status: 409
      detail: >-
        This tenant has letters 1.2.0 with other content (fingerprint v5:9f3a1c2b, the archive's
        v5:1c2b9f3a); one number names one release.

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/import
      body:
        multipart:
          file:
            filename: letters-1.2.0.zip
            byteLength: 22
          release:
            absent: true
          authoredMode:
            absent: true
  report:
    problemTypeSlug: release-number-taken
    problemStatus: 409
