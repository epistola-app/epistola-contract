id: set-environment-override-release
title: Overriding an environment with a release sends that release alone, and reads back the override
why: >
  An environment can use one of the releases it serves as its latest in place of the highest one, a
  rollback without undeploying anything (ADR 0002, amendment 2). The override is addressed by the
  catalog, like a deployment: `…/environments/{environmentKey}/overrides/{registry}/{namespace}/{catalogKey}`,
  with `~` for the default registry, and the release goes in the body as `releaseVersion`.

  The body names exactly one of `releaseVersion` and `catalogVersion`; a client that sends the other
  as null sends a member the caller never set, which the server cannot tell from a request naming
  both. The answer is the override: the registry in full, the release, no draft.

action:
  name: set-environment-override
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: production
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 1.3.0

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      environmentKey: production
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      releaseVersion: 1.3.0
      draftId: null
      draftLabel: null
      setAt: "2026-10-18T09:00:00Z"

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/environments/production/overrides/~/acme-corp/letters
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v1\+json(;.*)?$'
      body:
        json:
          releaseVersion: 1.3.0
        jsonAbsent: [catalogVersion]
        matches: '^\s*\{\s*"releaseVersion"\s*:\s*"1\.3\.0"\s*\}\s*$'
  report:
    environmentKey: production
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 1.3.0
    draftId: 'null'
    draftLabel: 'null'
    setAt: "2026-10-18T09:00:00Z"
