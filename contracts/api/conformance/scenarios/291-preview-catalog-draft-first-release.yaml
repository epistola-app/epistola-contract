id: preview-catalog-draft-first-release
title: A release preview with nothing to compare with reads a null kind of change, not a failure
why: >
  A draft of a catalog that was never released has no base to be measured against, so the
  preview's `base` and `changeKind` are null and there are no reasons; the version it needs and gets
  is `1.0.0` (ADR 0002).

  `changeKind` is a nullable enum, and that is where the generators differ: one that models the enum
  without its null value rejects this body, so a client that previews every other catalog cannot
  preview the first release of a new one.

action:
  name: preview-catalog-draft-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: onboarding
    release: k7m2x9qa

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      base: null
      changeKind: null
      reasons: []
      needed: 1.0.0
      suggested: 1.0.0

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/onboarding/releases/k7m2x9qa/release-preview
      query: ""
  report:
    base: 'null'
    changeKind: 'null'
    reasons: ""
    needed: 1.0.0
    suggested: 1.0.0
