id: preview-catalog-draft-first-release
title: A release preview with nothing to compare with reads a null kind of change, not a failure
why: >
  A catalog that was never released has no latest release to measure its next version against, so
  the preview's `latest` and `changeKind` are null and there are no reasons; only the suggested
  number is given (ADR 0002, amendment 2).

  `changeKind` is a nullable enum, and that is where the generators differ: one that models the enum
  without its null value rejects this body, so a client that previews every other catalog cannot
  preview the first release of a new one.

action:
  name: preview-catalog-draft-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: onboarding
    catalogVersion: next

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      latest: null
      changeKind: null
      reasons: []
      suggested: 1.0.0

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/onboarding/versions/next/release-preview
      query: ""
  report:
    latest: 'null'
    changeKind: 'null'
    reasons: ""
    suggested: 1.0.0
