id: release-catalog-draft-dependencies-unreleased
title: A release refused for unreleased dependency drafts says which drafts they are
why: >
  Releasing a draft whose dependency declarations name drafts of other catalogs, without asking to
  release them along (`releaseDependencies`), is refused with `release-dependencies-unreleased`
  (ADR 0002). Its `unreleasedDependencies` member is the reason: each such draft, named in full by
  its catalog, its id and its name, including one reached only through another draft's
  declarations. Without it a caller knows only that something conflicted, and cannot tell which
  drafts to release or take along.

  A client's problem parser must surface the member, every entry in order, with the registry as
  written and the name as sent.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa

script:
  - status: 409
    contentType: application/problem+json
    body:
      type: https://epistola.app/errors/release-dependencies-unreleased
      title: Release dependencies unreleased
      status: 409
      detail: letters uses drafts of other catalogs
      instance: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/release
      unreleasedDependencies:
        - registry: exchange.epistola.app
          namespace: acme-corp
          catalogKey: branding
          releaseId: r4t8w2nc
          releaseName: House style 2027
        - registry: registry.gemeente-x.nl
          namespace: huisstijl
          catalogKey: fonts
          releaseId: h3v9p6db
          releaseName: New typefaces, round 2

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/release
      body:
        json:
          # Its default is false, so a client may send `false` or leave it out, never `true`.
          releaseDependencies: { whenPresent: { equals: false } }
  report:
    problemTypeSlug: release-dependencies-unreleased
    problemStatus: 409
    # Draft names are free text, so entries are joined with `|`.
    problemUnreleasedDependencies: exchange.epistola.app/acme-corp/branding#r4t8w2nc=House style 2027|registry.gemeente-x.nl/huisstijl/fonts#h3v9p6db=New typefaces, round 2
