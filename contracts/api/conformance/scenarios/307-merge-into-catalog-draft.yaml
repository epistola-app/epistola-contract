id: merge-into-catalog-draft
title: Merging a release into a draft sends the release and every resolution, and reports what it did
why: >
  Merging is alpha (ADR 0005). The request names the release merged in and resolves each conflict,
  by `resourceType/resourceKey`, to `ours` or `theirs`. A client that drops the resolutions, or
  sends a side in another spelling, gets the merge refused as unresolved. The response lists what
  was taken from the release, removed because the release removed it, and kept as the draft has it.
  A catalog setting is resolved and reported the same way (`catalog/defaultTheme`), and so is each
  catalog used (`catalogDependency/shared`: re-pinned by the release, taken; `catalogDependency/legacy`:
  no longer declared by the release, removed).
  Without a preview token to check (`expectedToken`), none goes out: `null` is not a token.

action:
  name: merge-into-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa
    version: 1.5.0
    resolutions:
      catalog/defaultTheme: theirs
      catalogDependency/shared: theirs
      template/invoice: theirs
      stencil/header: ours

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      release: 1.5.0
      taken: [catalog/defaultTheme, catalog/presets, catalogDependency/shared, template/invoice, theme/corporate]
      removed: [catalogDependency/legacy, theme/winter]
      kept: [stencil/header]

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/merge
      body:
        json:
          release: { equals: 1.5.0 }
          resolutions:
            catalog/defaultTheme: theirs
            catalogDependency/shared: theirs
            template/invoice: theirs
            stencil/header: ours
          expectedToken: { absent: true }
  report:
    release: 1.5.0
    taken: catalog/defaultTheme,catalog/presets,catalogDependency/shared,template/invoice,theme/corporate
    removed: catalogDependency/legacy,theme/winter
    kept: stencil/header
