id: catalog-dependencies-update-draft
title: A draft that builds on another catalog's draft declares it by its id, and no release
why: >
  In a draft, a dependency declaration may name a draft of the other catalog (`draftId`) instead of
  a release, to build on work that is not released yet (ADR 0002). Exactly one of `releaseVersion`
  and `draftId` is given: a client that sends a `releaseVersion` it was not given, even as an
  empty string, sends a declaration naming both, which is refused.

  The second entry pins a release as usual. The response names the draft for the first entry and a
  null `releaseVersion`, and the release for the second and a null `draftId`; a client must surface
  both nulls as null, or a draft dependency reads as a release that pins nothing.

action:
  name: update-catalog-dependencies
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 0193a6b2-7f4e-7c1d-9a2b-3c4d5e6f7a8b
    dependencies:
      - { namespace: acme-corp, catalogKey: branding, draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192 }
      - { namespace: epistola, catalogKey: system, releaseVersion: 1.3.0 }

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: branding, releaseVersion: null, draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192 }
        - { registry: exchange.epistola.app, namespace: epistola, catalogKey: system, releaseVersion: 1.3.0, draftId: null }

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/0193a6b2-7f4e-7c1d-9a2b-3c4d5e6f7a8b/dependencies
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          dependencies:
            # Omitted or null is "not given"; any other value names a release or a draft.
            - { registry: { whenPresent: { equals: null } }, namespace: acme-corp, catalogKey: branding, draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192, releaseVersion: { whenPresent: { equals: null } } }
            - { registry: { whenPresent: { equals: null } }, namespace: epistola, catalogKey: system, releaseVersion: 1.3.0, draftId: { whenPresent: { equals: null } } }
  report:
    registries: exchange.epistola.app,exchange.epistola.app
    namespaces: acme-corp,epistola
    catalogKeys: branding,system
    releaseVersions: null,1.3.0
    draftIds: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192,null
