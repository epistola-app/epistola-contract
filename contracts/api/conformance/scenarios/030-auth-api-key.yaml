id: auth-api-key
title: "An API key goes in Authorization: ApiKey, the one header the contract defines for it"
why: >
  The contract defines one way to send an API key: the `Authorization` header with the `ApiKey`
  scheme. A key sent in any other header, such as the `X-API-Key` some APIs use, is not
  authentication here, and a test that only asserts "the call succeeded" against a lenient server
  cannot tell the two apart. So the key must arrive in `Authorization`, and nowhere else.

action:
  name: list-templates
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: main
    release: 2.0.0

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items: []
      page: { number: 0, size: 20, total: 0, totalPages: 0 }

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/main/releases/2.0.0/templates
      headers:
        Authorization: ApiKey epk_conformance_0123456789
        X-API-Key: { absent: true }
