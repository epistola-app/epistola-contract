id: collect-result-release
title: A collected result names the catalog and the release it rendered
why: >
  A version means nothing without its catalog: `1.4.0` of one catalog has no relation to
  `1.4.0` of another. A result therefore carries the registry, namespace and key of the template's
  catalog next to `version`, and a consumer auditing which release produced a document needs
  all four. The registry is written in full, never `~`. Some result collectors parse results by
  hand rather than through a generated model, and a field added to the contract reaches their
  consumers only if the collector was taught it.

  A result rendered from a draft, deployed to the environment the request named, has no release:
  its `version` is null and its `releaseId` names the draft. A collector must surface that
  null as missing, not as an empty string or a failure to parse the line.

action:
  name: collect
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    batchSize: 5
    minIntervalMs: 120
    maxIntervalMs: 2000
    multiplier: 3
    runForMs: 600

script:
  - status: 200
    contentType: application/vnd.epistola.v2+ndjson
    ndjson:
      - { sequence: 601, requestId: 11111111-1111-4111-8111-000000000601, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: letters, templateKey: invoice, version: 1.4.0, status: completed, documentId: 22222222-2222-4222-8222-000000000601, correlationId: rel-1, completedAt: "2026-02-01T08:05:00Z" }
      - { sequence: 602, requestId: 11111111-1111-4111-8111-000000000602, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: letters, templateKey: invoice, version: null, releaseId: h3v9p6db, draftLabel: Redesign 2027, status: completed, documentId: 22222222-2222-4222-8222-000000000602, correlationId: rel-2, completedAt: "2026-02-01T08:05:00Z" }
      - { _meta: true, hasMore: false, lastSequence: 602, resultCount: 2, partitions: { total: 8, mine: [0, 3], hash: murmur3 } }
  - status: 200
    contentType: application/vnd.epistola.v2+ndjson
    ndjson:
      - { _meta: true, hasMore: false, lastSequence: 602, resultCount: 0, partitions: { total: 8, mine: [0, 3], hash: murmur3 } }

expect:
  requestCountAtLeast: 1
  report:
    resultsHandled: 2
    # Each result as registry/namespace/catalogKey@version, a null release written as null.
    releases: exchange.epistola.app/acme-corp/letters@1.4.0,exchange.epistola.app/acme-corp/letters@null
