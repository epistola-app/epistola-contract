id: create-catalog-release-from-draft
title: Starting a draft from another draft sends that draft's id, and reads back where it came from
why: >
  A draft can start as a copy of another draft, unreleased changes included (ADR 0002): `from`
  then carries that draft's id instead of a version, in the same member. The new draft takes
  the other draft's base, and `createdFrom` names the draft it was copied from. A client that only
  accepts a version in `from`, or reads `createdFrom` as one, cannot copy a draft.

action:
  name: create-catalog-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    name: Redesign 2027
    from: k7m2x9qa

script:
  - status: 201
    contentType: application/vnd.epistola.v2+json
    headers:
      Location: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/r4t8w2nc
    body:
      version: null
      releaseId: r4t8w2nc
      name: Redesign 2027
      status: draft
      base: 1.5.0
      createdFrom: k7m2x9qa
      createdAt: "2026-10-15T09:00:00Z"
      behind: []
      releasedAt: null
      notes: null
      fingerprint: null
      dependencies: []
      deployedTo: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          name: Redesign 2027
          from: k7m2x9qa
        jsonAbsent: [version, var_from]
  report:
    version: 'null'
    releaseId: r4t8w2nc
    name: Redesign 2027
    status: draft
    location: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/r4t8w2nc
    base: 1.5.0
    createdFrom: k7m2x9qa
    releasedAt: 'null'
