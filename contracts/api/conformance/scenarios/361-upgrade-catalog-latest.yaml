id: upgrade-catalog-latest
title: Upgrading without a release installs the highest the source offers, and says when it was present
why: >
  `releaseVersion` is not set, so no query string is sent: the server installs the highest release
  the catalog's source offers. A client that fills in a value of its own chooses the release for
  the caller.

  The tenant already has that release, with the same fingerprint, so nothing changes and the
  response says so with `newlyInstalled: false`. A client that drops a false boolean tells its
  caller a release was installed when nothing happened. The response carries no dependency lists;
  a client must surface them as empty, not fail on them.

action:
  name: upgrade-catalog
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: registry.gemeente-x.nl
    namespace: huisstijl
    catalogKey: branding

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: registry.gemeente-x.nl
      namespace: huisstijl
      catalogKey: branding
      releaseVersion: 1.4.2
      newlyInstalled: false
      total: 3

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/registry.gemeente-x.nl/huisstijl/branding/upgrade
      query: ""
  report:
    registry: registry.gemeente-x.nl
    namespace: huisstijl
    catalogKey: branding
    releaseVersion: 1.4.2
    newlyInstalled: 'false'
    total: '3'
    installedDependencies: ''
    presentDependencies: ''
