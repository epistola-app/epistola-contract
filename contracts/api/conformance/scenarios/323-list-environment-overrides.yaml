id: list-environment-overrides
title: Listing an environment's overrides reads both forms, a release and a draft, in order
why: >
  An environment overrides at most one version per catalog: a release it serves, or a draft it
  follows (ADR 0002, amendment 2). The list mixes both, so a client must read a null
  `releaseVersion` beside a set one, and a null `draftId` and `draftLabel` beside set ones, without
  refusing the response or inventing values.

action:
  name: list-environment-overrides
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: acceptance

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - { environmentKey: acceptance, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: letters, releaseVersion: null, draftId: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192, draftLabel: Redesign 2027, setAt: "2026-10-18T09:00:00Z" }
        - { environmentKey: acceptance, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: invoices, releaseVersion: 2.1.0, draftId: null, draftLabel: null, setAt: "2026-10-17T15:30:00Z" }

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/environments/acceptance/overrides
  report:
    catalogKeys: letters,invoices
    releaseVersions: null,2.1.0
    draftIds: 0193a6b2-8a10-7d2e-8b3c-4d5e6f708192,null
    # Names are free text, so they are joined with `|`.
    draftLabels: Redesign 2027|null
