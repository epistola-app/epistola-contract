id: install-catalog-release
title: Installing a release a subscribed catalog's source offers puts it beside the others, with its pins
why: >
  Nothing is upgraded in contract 2.0: installing a release of a subscribed catalog fetches it from
  the catalog's source and installs it as an import installs the release an archive carries, beside
  the releases the tenant has, nothing updated in place, nothing removed. The release is named in
  the path, `…/available-releases/1.5.0/install`, here rather than the newer `2.0.0` the source also
  offers; the request has no query and no body. A client that sends the version anywhere else, or
  drops it, installs something the caller did not ask for.

  The catalog is in the default registry, addressed as `~`; the response names it in full.

  The response reports the release as an import does: `newlyInstalled` as a boolean, and the
  releases installed first because the release pins them (`installedDependencies`) and those the
  tenant had (`presentDependencies`), in order. Each is named in full, registry, namespace and
  key, with its version and `releaseId`: a catalog's key alone is not unique, so the client must
  read every member, not a label.

action:
  name: install-catalog-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    version: 1.5.0

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      version: 1.5.0
      newlyInstalled: true
      total: 9
      installedDependencies:
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: shared, version: 1.1.0, releaseId: s4k8m2qa }
        - { registry: exchange.epistola.app, namespace: epistola, catalogKey: system, version: 3.2.0, releaseId: y7c3n5vb }
      presentDependencies:
        - { registry: brand.example.com, namespace: acme-corp, catalogKey: branding, version: 1.4.2, releaseId: b2h6w9td }

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/available-releases/1.5.0/install
      query: ""
  report:
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    version: 1.5.0
    newlyInstalled: 'true'
    total: '9'
    installedDependencies: exchange.epistola.app/acme-corp/shared@1.1.0#s4k8m2qa,exchange.epistola.app/epistola/system@3.2.0#y7c3n5vb
    presentDependencies: brand.example.com/acme-corp/branding@1.4.2#b2h6w9td
