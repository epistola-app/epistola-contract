id: install-catalog-release
title: Installing a release a subscribed catalog's source offers puts it beside the others, with its pins
why: >
  Nothing is upgraded in contract 2.0: installing a release of a subscribed catalog fetches it from
  the catalog's source and installs it as an import installs the release an archive carries, beside
  the releases the tenant has, nothing updated in place, nothing removed. The release is named in
  the path, `…/available-releases/1.5.0/install`, here rather than the newer `2.0.0` the source also
  offers; the request has no query and no body. A client that sends the number anywhere else, or
  drops it, installs something the caller did not ask for.

  The catalog is in the default registry, addressed as `~`; the response names it in full.

  The response reports the release as an import does: `newlyInstalled` as a boolean, and the
  releases installed first because the release pins them (`installedDependencies`) and those the
  tenant had (`presentDependencies`), in order.

action:
  name: install-catalog-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 1.5.0

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      releaseVersion: 1.5.0
      newlyInstalled: true
      total: 9
      installedDependencies: ["shared v1.1.0", "system v3.2.0"]
      presentDependencies: ["branding v1.4.2"]

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/available-releases/1.5.0/install
      query: ""
  report:
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 1.5.0
    newlyInstalled: 'true'
    total: '9'
    installedDependencies: shared v1.1.0,system v3.2.0
    presentDependencies: branding v1.4.2
