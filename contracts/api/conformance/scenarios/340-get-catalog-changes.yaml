id: get-catalog-changes
title: A draft's changes read every change kind, in order, and whether it is releasable
why: >
  The changes are what an author reviews before releasing: every resource of the draft that is
  `new`, `modified` or `ready`, and every resource of the base that is `removed`. `change` is an
  enum with all four values in this answer, so a client that knows only the three it shares with
  ResourceStatus fails on the fourth. `releasable` is false here, because resources are still new
  and modified; a client that misreads it offers a release the server will refuse.

  The invoice holds content merged from both sides of a conflict that no one has reviewed yet
  (`mergedForReview`), so it stays `modified` until it is marked ready. Beside the resources, the
  draft's catalog-level content changed too (`catalogChanges`, named as merge entries are): it
  re-pinned the catalog it declares as `shared`, added one as `fonts`, and set a default theme.
  What the content hash covers outside the resources is a change of its own; a client that reads
  only `changes` tells an author a draft with only a re-pinned dependency has nothing to release.

action:
  name: get-catalog-changes
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      base: 1.4.0
      releasable: false
      dependenciesChanged: true
      changes:
        - { type: template, key: invoice, change: modified, mergedForReview: true }
        - { type: stencil, key: corporate-header, change: ready, mergedForReview: false }
        - { type: theme, key: house-style, change: new }
        - { type: theme, key: legacy, change: removed }
      catalogChanges:
        - { type: catalogDependency, key: shared, change: modified }
        - { type: catalogDependency, key: fonts, change: added }
        - { type: catalog, key: defaultTheme, change: added }

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/changes
      query: ""
      headers:
        Accept:
          contains: application/vnd.epistola.v2+json
  report:
    base: 1.4.0
    releasable: "false"
    dependenciesChanged: "true"
    # One entry per change, as type/key:change.
    changes: template/invoice:modified,stencil/corporate-header:ready,theme/house-style:new,theme/legacy:removed
    # Only the resource whose merged content waits for review; absent means false.
    mergedForReview: template/invoice
    catalogChanges: catalogDependency/shared:modified,catalogDependency/fonts:added,catalog/defaultTheme:added
