id: catalog-dependencies-update
title: Declaring a catalog's dependencies sends each catalog once, with its version selector
why: >
  A catalog's references into other catalogs carry no version; the declared dependency decides
  which release they render with. So the declaration is the whole answer to "what does this
  release render with", and a client that drops a field from it changes that answer.

  The two dependencies cover both namespace forms: a short one on the default exchange
  (`epistola`) and a domain (`acme.com`). The request may use the short form; the response writes
  every namespace in full, and a client must surface it as written rather than shorten it back.

  `resolvedVersion` is null when no installed release satisfies the selector. That is the state
  that blocks a release, so a client that turns null into an empty string or drops the entry hides
  exactly the thing the caller needs to see.

action:
  name: update-catalog-dependencies
  config:
    nodeId: conformance-node-1
    tenantId: acme-corp
    namespace: acme-corp
    catalogKey: letters
    dependencies:
      - { namespace: epistola, catalogKey: system, version: 1.3.0 }
      - { namespace: acme.com, catalogKey: house-style, version: 2.1.0 }

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      items:
        - { namespace: exchange.epistola.app/epistola, catalogKey: system, version: 1.3.0, resolvedVersion: 1.3.0 }
        - { namespace: acme.com, catalogKey: house-style, version: 2.1.0, resolvedVersion: null }

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/catalogs/acme-corp/letters/dependencies
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v1\+json(;.*)?$'
      body:
        json:
          dependencies:
            - { namespace: epistola, catalogKey: system, version: 1.3.0 }
            - { namespace: acme.com, catalogKey: house-style, version: 2.1.0 }
  report:
    namespaces: exchange.epistola.app/epistola,acme.com
    catalogKeys: system,house-style
    versions: 1.3.0,2.1.0
    resolvedVersions: 1.3.0,null
