id: catalog-dependencies-update
title: Declaring a catalog's dependencies sends each catalog once, with the exact release it pins
why: >
  A catalog's references into other catalogs carry no version; the declared dependency pins the
  exact release they render with (`version`), never a range. So the declaration is the whole
  answer to "what does this release render with", and a client that drops a field from it changes
  that answer.

  The two dependencies cover both ways to name a registry. The first leaves `registry` out, which
  means the default registry; the client must not send one it was not given. The second names a
  registry in full (`acme.com`). The response writes every registry in full, the default one by its
  real name, and a client must surface it as written rather than leave it out again.

  A write goes to a draft, addressed by its `releaseId` (ADR 0002); a released release's version would
  be refused with 409.

action:
  name: update-catalog-dependencies
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa
    dependencies:
      - { namespace: epistola, catalogKey: system, version: 1.3.0 }
      - { registry: acme.com, namespace: acme, catalogKey: house-style, version: 2.1.0 }

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      items:
        - { registry: exchange.epistola.app, namespace: epistola, catalogKey: system, version: 1.3.0, releaseId: null }
        - { registry: acme.com, namespace: acme, catalogKey: house-style, version: 2.1.0, releaseId: null }

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/dependencies
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
        if-match: { absent: true }
      body:
        json:
          dependencies:
            # Omitted or null both mean the default registry; a value the caller never gave is not.
            - { registry: { whenPresent: { equals: null } }, namespace: epistola, catalogKey: system, version: 1.3.0, releaseId: { whenPresent: { equals: null } } }
            - { registry: acme.com, namespace: acme, catalogKey: house-style, version: 2.1.0, releaseId: { whenPresent: { equals: null } } }
  report:
    registries: exchange.epistola.app,acme.com
    namespaces: epistola,acme
    catalogKeys: system,house-style
    versions: 1.3.0,2.1.0
    releaseIds: null,null
