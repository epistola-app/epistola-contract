id: spec-generate-document
title: A generation request body satisfies the schema it is generated from
why: >
  Bodies are where a generator has the most room to disagree with the contract, and the request-body
  scenario can only check the fields it thought to list. Prism checks the schema: required
  properties, the slug patterns on namespace, catalogKey and templateId, and the types
  of everything inside. A client that omitted a required field, or sent a number where the schema
  says string, fails here without anyone having predicted it.

backend: prism

action:
  name: generate-document
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantId: acme-corp
    namespace: acme-corp
    catalogKey: default
    templateId: invoice
    correlationId: inv-2026-0042
    routingKey: acme-node-1
    data:
      customerName: Acme B.V.
      lineCount: 3
      amountDue: 19.99
      paid: false
      address: { city: Sittard }

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/documents/generate
