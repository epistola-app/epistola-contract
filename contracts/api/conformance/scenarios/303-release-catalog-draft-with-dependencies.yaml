id: release-catalog-draft-with-dependencies
title: Releasing a draft with its dependencies asks for it, and reads back the releases made along
why: >
  A release pins only releases, so a draft whose dependency declarations name drafts of other
  catalogs is released together with them when the request asks (`releaseDependencies: true`):
  those drafts first, each released as the version its own changes need, all in one transaction (ADR 0002). The flag
  is a JSON boolean; a client that drops it, or sends it as a string, gets the release refused with
  `release-dependencies-unreleased`.

  The answer lists the releases made along (`releasedDependencies`), dependencies first, each with
  the draft it was and the version it became, and the new release pins them. A client that drops
  the list hides that other catalogs were released too.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: k7m2x9qa
    notes: Letters in the 2027 house style.
    releaseDependencies: true

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      release:
        version: 1.5.0
        releaseId: k7m2x9qa
        name: Letters 2027
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-19T10:00:00Z"
        notes: Letters in the 2027 house style.
        fingerprint: v5:3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b
        dependencies:
          - { alias: null, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: fonts, version: 1.1.0, direct: false }
          - { alias: branding, registry: exchange.epistola.app, namespace: acme-corp, catalogKey: branding, version: 3.0.0, direct: true }
        deployedTo: []
      unchangedContent: false
      draftsBehind: []
      releasedDependencies:
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: fonts, releaseId: h3v9p6db, version: 1.1.0 }
        - { registry: exchange.epistola.app, namespace: acme-corp, catalogKey: branding, releaseId: r4t8w2nc, version: 3.0.0 }

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/releases/k7m2x9qa/release
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          notes: Letters in the 2027 house style.
          releaseDependencies: true
        jsonAbsent: [version, acknowledgedBehind]
  report:
    version: 1.5.0
    status: released
    releaseId: k7m2x9qa
    draftsBehind: ""
    releasedDependencies: exchange.epistola.app/acme-corp/fonts@1.1.0,exchange.epistola.app/acme-corp/branding@3.0.0
