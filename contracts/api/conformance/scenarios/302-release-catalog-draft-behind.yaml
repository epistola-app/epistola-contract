id: release-catalog-draft-behind
title: Releasing a draft that is behind names the releases the author acknowledges
why: >
  A draft started from `1.4.0` that holds breaking changes is released as `2.0.0`. It is behind
  `1.5.0` and `1.6.0`, released from other drafts while it was apart and numbered between its base
  and `2.0.0`, and nothing is merged into it (ADR 0002).

  The server refuses to release it unless the request names every release it is behind in
  `acknowledgedBehind`, the author's confirmation that they applied those changes by hand or left
  them out on purpose. That is what stops a fix shipped in `1.5.0` from silently disappearing in
  `2.0.0`.

  The list is an array of version strings in the JSON body. A client that drops it, sends it as a
  single string, or reorders it into something else gets the release refused. No `version` was
  given, so the server numbers it, and the client sends none.

action:
  name: release-catalog-draft
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: k7m2x9qa
    notes: The 2.0 house style.
    acknowledgedBehind: [1.5.0, 1.6.0]

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      catalogVersion:
        version: 2.0.0
        versionId: k7m2x9qa
        name: null
        status: released
        base: 1.4.0
        createdFrom: null
        behind: []
        releasedAt: "2026-10-16T10:00:00Z"
        notes: The 2.0 house style.
        fingerprint: v5:1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a
        dependencies: []
        deployedTo: []
      unchangedContent: false
      draftsBehind: []
      releasedDependencies: []

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/k7m2x9qa/release
      body:
        json:
          notes: The 2.0 house style.
          acknowledgedBehind: [1.5.0, 1.6.0]
          # Its default is false, so a client may send `false` or leave it out, never `true`.
          releaseDependencies: { whenPresent: { equals: false } }
        jsonAbsent: [version]
  report:
    version: 2.0.0
    status: released
    versionId: k7m2x9qa
    draftsBehind: ""
    releasedDependencies: ""
