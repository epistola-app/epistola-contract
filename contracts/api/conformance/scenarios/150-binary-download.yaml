id: binary-download
title: A downloaded document arrives byte for byte
why: >
  Every scenario before this one moves JSON. Documents are the product, and they come back as
  `application/pdf` — bytes that are not text and must not be treated as text. A stack that decodes
  them as UTF-8, or that normalises line endings, corrupts every document it fetches: silently, with
  a 200, and irreversibly, because the caller writes the result to disk and the original is gone.

  The four clients hand back four different things — a `java.io.File`, a `FileParameter` wrapping a
  stream, a `bytearray` — and that is fine; the bytes inside them are not allowed to differ. So the
  fixture is a PDF header followed by all 256 byte values, which is deliberately not valid UTF-8:
  any client that round-trips it through a string mangles the 0x80–0xFF range and fails on the
  digest rather than on a length that might coincidentally survive.

action:
  name: download-document
  config:
    nodeId: conformance-node-1
    auth: api-key
    apiKey: epk_conformance_0123456789
    tenantId: acme-corp
    documentId: 99999999-9999-4999-8999-000000000001

script:
  - status: 200
    contentType: application/pdf
    # "%PDF-1.7\n" + every byte 0x00-0xFF + "\n%%EOF\n"
    bodyBase64: >-
      

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/documents/99999999-9999-4999-8999-000000000001
  report:
    byteLength: 272
    sha256: 5c5169485479e6214e3b5f010689289166910f3cd32691774541ef7e7b65c5ce
