id: set-environment-override-draft
title: Overriding an environment with a draft sends the draft alone, and reads back its id and name
why: >
  A draft is tried by pointing a non-production environment at it: the environment then renders
  the draft live, with no release (ADR 0002). The draft goes in the body as `versionId`, exactly
  as given; `releaseVersion` is left out. A client that sent `"releaseVersion": null`
  would send a request naming both.

  The answer has no release: `releaseVersion` is null, and the draft is named by its id and by its
  name at the time. A client that requires `releaseVersion` cannot read an environment that follows
  a draft.

action:
  name: set-environment-override
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: acceptance
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    versionId: k7m2x9qa

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      environmentKey: acceptance
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      releaseVersion: null
      versionId: k7m2x9qa
      draftLabel: Spring fixes
      setAt: "2026-10-18T09:00:00Z"

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/environments/acceptance/overrides/~/acme-corp/letters
      headers:
        Content-Type:
          matches: '^application/vnd\.epistola\.v2\+json(;.*)?$'
      body:
        json:
          versionId: k7m2x9qa
        jsonAbsent: [releaseVersion]
        matches: '^\s*\{\s*"versionId"\s*:\s*"k7m2x9qa"\s*\}\s*$'
  report:
    environmentKey: acceptance
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    releaseVersion: 'null'
    versionId: k7m2x9qa
    # Names are free text, so a driver reports them as given.
    draftLabel: Spring fixes
    setAt: "2026-10-18T09:00:00Z"
