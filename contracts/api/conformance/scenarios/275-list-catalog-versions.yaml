id: list-catalog-versions
title: Listing a catalog's versions filters by status and keeps drafts without a base
why: >
  Drafts and released versions share one collection, told apart by `status`. The filter is a query
  parameter with an enum value; a client that sends it in another case, or drops it, lists the
  wrong versions.

  The first draft of a catalog that was never released has no base. A client that cannot read a
  null `base` cannot list a new catalog at all.

  `2.0.0` is behind release `1.5.0`: it was opened from `1.4.0`, and nothing is merged into a draft,
  so it holds 1.5.0's changes only if an author applied them by hand.

action:
  name: list-catalog-versions
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    status: draft

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      items:
        - { version: 2.0.0, status: draft, base: 1.4.0, createdFrom: null, behind: [{ version: 1.5.0, changes: [{ type: template, key: invoice, change: modified }] }], dependencies: [], deployedTo: [] }
        - { version: 1.4.1, status: draft, base: 1.4.0, createdFrom: null, behind: [], dependencies: [], deployedTo: [] }
        - { version: 0.1.0, status: draft, base: null, createdFrom: null, behind: [], dependencies: [], deployedTo: [] }
      page: { number: 0, size: 20, totalElements: 3, totalPages: 1 }

expect:
  requestCount: 1
  requests:
    - method: GET
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions
      queryParams:
        status: draft
        page: { whenPresent: '0' }
        size: { whenPresent: '20' }
  report:
    versions: 2.0.0,1.4.1,0.1.0
    statuses: draft,draft,draft
    bases: 1.4.0,1.4.0,null
    # How many releases each draft is behind: 2.0.0 does not contain release 1.5.0.
    behindCounts: 1,0,0
