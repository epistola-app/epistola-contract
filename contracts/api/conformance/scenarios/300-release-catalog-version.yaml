id: release-catalog-version
title: Releasing a draft reports which drafts its changes flowed into, and how many conflict
why: >
  Releasing changes a draft's status, not its number, so the request goes to the draft's own
  address and carries only the notes. What the author needs next is in the answer: every higher
  draft the changes flowed into, with how many merged and how many conflict, because a conflict
  blocks releasing that draft. A client that drops `flowedInto` hides that the next release is now
  blocked.

  `openedDraft` is null here, because a draft above the release was already open.

action:
  name: release-catalog-version
  config:
    nodeId: conformance-node-1
    tenantId: acme-corp
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    catalogVersion: 1.5.0
    notes: Finished improvements, ahead of 2.0.0.

script:
  - status: 200
    contentType: application/vnd.epistola.v1+json
    body:
      catalogVersion:
        version: 1.5.0
        status: released
        base: 1.4.0
        createdFrom: null
        openConflicts: 0
        releasedAt: "2026-10-15T10:00:00Z"
        notes: Finished improvements, ahead of 2.0.0.
        fingerprint: v5:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
        contentRetained: true
        dependencies: []
        deployedTo: []
      unchangedContent: false
      flowedInto:
        - { version: 2.0.0, merged: 4, conflicts: 1 }
      openedDraft: null

expect:
  requestCount: 1
  requests:
    - method: POST
      path: /api/tenants/acme-corp/catalogs/~/acme-corp/letters/versions/1.5.0/release
      body:
        json:
          notes: Finished improvements, ahead of 2.0.0.
  report:
    version: 1.5.0
    status: released
    flowedInto: 2.0.0:4:1
    openedDraft: 'null'
