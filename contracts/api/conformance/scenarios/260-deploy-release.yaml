id: deploy-release
title: Deploying addresses one release of a catalog, and `~` in the path addresses the default registry
why: >
  An environment can serve several releases of one catalog, so a deployment is addressed by the
  release, not by the catalog: the path ends in the version (or, for a draft, its
  `releaseId`) and the request has no body. A client that still sends the version in a body
  deploys nothing a server can identify.

  The catalog is in the default registry, addressed as `~`. `~` is an unreserved character, so a
  client may send it as is or percent-encoded as `%7E`, which RFC 3986 makes equivalent (the
  harness records `%7E` as `~`). What no client may do is encode it as anything else, drop the
  segment, or replace it with a registry of its own choosing: only the server knows its default.

  The response names the registry in full, by its real name, never `~`. A client must surface
  that name as written, so a value read here means the same catalog on another installation.

  `includeDependencies` and `replace` are not set, so no query string is sent: the server's
  defaults (false) apply.

  The deployment says what it serves: a `released` release (`status`), by its `releaseId` and its
  version, with a null `releaseName`, as a release installed from elsewhere has. A release just deployed has not been used yet: `lastUsedAt` is null
  and `documentsRequested` is 0. A client must surface the null as a missing instant, not fail on
  it or invent one.

action:
  name: deploy-catalog-release
  config:
    nodeId: conformance-node-1
    tenantKey: acme-corp
    environmentKey: production
    registry: "~"
    namespace: acme-corp
    catalogKey: letters
    release: 1.4.0

script:
  - status: 200
    contentType: application/vnd.epistola.v2+json
    body:
      registry: exchange.epistola.app
      namespace: acme-corp
      catalogKey: letters
      releaseId: m3q8v5tw
      status: released
      version: 1.4.0
      releaseName: null
      deployedAt: "2026-10-02T07:30:00Z"
      lastUsedAt: null
      documentsRequested: 0

expect:
  requestCount: 1
  requests:
    - method: PUT
      path: /api/tenants/acme-corp/environments/production/deployments/~/acme-corp/letters/1.4.0
      # Without `config.includeDependencies` or `config.replace` the driver leaves the flags unset,
      # so nothing is sent.
      query: ""
  report:
    registry: exchange.epistola.app
    namespace: acme-corp
    catalogKey: letters
    releaseId: m3q8v5tw
    status: released
    version: 1.4.0
    releaseName: 'null'
    lastUsedAt: "null"
    documentsRequested: "0"
