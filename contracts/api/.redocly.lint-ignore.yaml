# Lint findings Redocly's linter ignores, each one location and rule, with why.
#
# UpdateVariantContentRequest's example is the template model guide's worked letter. Redocly cannot
# validate it: the catalog schema it is checked against resolves its references relative to its
# own $id (template-shared.schema.json#/$defs/NodeId), which Redocly's example validator does not
# follow ("can't resolve reference"). The example is checked instead by the server stubs'
# ExampleTemplateModelTest, against the catalog's TemplateValidator and the guide's source file.
components/schemas/variants.yaml:
  no-invalid-schema-examples:
    - '#/UpdateVariantContentRequest/schema'
#
# A document's content and a job share the `documents/` prefix, so `documents/jobs/content` matches
# both templates. Neither operation is ever reached that way: a `documentId` and a `requestId` are
# both UUIDs, and `jobs` and `content` are not, so whichever operation a router picks, it answers
# 400 or 404 for that path. No real request is ambiguous.
openapi.yaml:
  no-ambiguous-paths:
    - '#/paths/~1tenants~1{tenantKey}~1documents~1{documentId}~1content'
