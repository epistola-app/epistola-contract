# Shared version catalog for all three Gradle builds
# (the Kotlin API client, server stubs, and catalog).
# Each settings.gradle.kts imports this file explicitly; there are no
# module-local catalogs. Renovate tracks this single file.
#
# The client deliberately targets Spring Boot 3 / Jackson 2 (artifact
# `client-spring3-restclient`), the server Spring Boot 4 / Jackson 3 —
# hence the spring-boot3/spring-boot4 and jackson2/jackson3 aliases.
#
# The Jakarta client (artifact `client-jakarta`) pins the *Jakarta EE 10* /
# *MicroProfile 6* API levels on purpose. They are the widest common
# denominator across WildFly, Open Liberty, Payara and Quarkus, every one of
# them supplies the implementation, and an EE 11 server still accepts code
# compiled against them. Every jakarta-* / microprofile-* entry below is a
# `compileOnly` dependency — nothing here is ever shipped in the jar.

[versions]
kotlin = "2.3.10"
ktlint = "14.0.1"
kover = "0.9.6"
dokka = "2.2.0"
openapi-generator = "7.19.0"
maven-publish = "0.36.0"
# Published libraries stay consumable on JDK 21; do not bump to match the mise JDK.
java-toolchain = "21"
# client (Spring Boot 3 / Jackson 2)
spring-boot3 = "3.5.1"
jackson2 = "2.19.0"
json-schema-validator = "1.5.7"
mockk = "1.14.2"
nimbus-jose-jwt = "10.3"
# server (Spring Boot 4 / Jackson 3)
spring-boot4 = "4.0.2"
jackson3 = "3.0.4"
springdoc = "2.8.9"
jakarta-validation = "3.1.1"
# jakarta client (Jakarta EE 10 / MicroProfile 6 APIs — all compileOnly)
jakarta-ws-rs = "3.1.0"
jakarta-json = "2.1.3"
jakarta-json-bind = "3.0.1"
jakarta-annotation = "2.1.1"
jakarta-cdi = "4.0.1"
jakarta-inject = "2.0.1"
microprofile-rest-client = "3.0.1"
microprofile-config = "3.1"
# jakarta client test-only runtime: a real MicroProfile Rest Client stack, so the
# generated interfaces are exercised over the wire instead of being merely compiled.
resteasy = "6.2.12.Final"
resteasy-microprofile = "3.0.1.Final"
smallrye-config = "3.13.4"
yasson = "3.0.4"
parsson = "1.1.7"
junit = "5.14.1"
testcontainers = "1.21.3"
# epistola-catalog
# (json-kotlin-gradle stays inline in its buildscript block — catalog
# accessors are not available there; Renovate tracks it in the build file)
jackson-annotations = "2.21"
jsonata = "0.9.10"
commons-compress = "1.28.0"
networknt-json-schema = "3.0.5"

[libraries]
# client (Spring Boot 3 / Jackson 2)
spring-boot3-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot3" }
jackson2-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2" }
jackson2-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
# server (Spring Boot 4 / Jackson 3)
spring-boot4-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot4" }
spring-boot4-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot4" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson3" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# jakarta client — container-provided APIs (compileOnly, never shipped)
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-ws-rs" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
jakarta-json-bind-api = { module = "jakarta.json.bind:jakarta.json.bind-api", version.ref = "jakarta-json-bind" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
# CDI + inject are used only by the deployment smoke application, never by the client itself
jakarta-enterprise-cdi-api = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api", version.ref = "jakarta-cdi" }
jakarta-inject-api = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject" }
microprofile-rest-client-api = { module = "org.eclipse.microprofile.rest.client:microprofile-rest-client-api", version.ref = "microprofile-rest-client" }
microprofile-config-api = { module = "org.eclipse.microprofile.config:microprofile-config-api", version.ref = "microprofile-config" }
# jakarta client — test-only implementations of those APIs
resteasy-client = { module = "org.jboss.resteasy:resteasy-client", version.ref = "resteasy" }
resteasy-json-binding-provider = { module = "org.jboss.resteasy:resteasy-json-binding-provider", version.ref = "resteasy" }
resteasy-microprofile-rest-client = { module = "org.jboss.resteasy.microprofile:microprofile-rest-client", version.ref = "resteasy-microprofile" }
yasson = { module = "org.eclipse:yasson", version.ref = "yasson" }
smallrye-config = { module = "io.smallrye.config:smallrye-config", version.ref = "smallrye-config" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
# epistola-catalog
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jsonata = { module = "com.dashjoin:jsonata", version.ref = "jsonata" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
networknt-json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt-json-schema" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
