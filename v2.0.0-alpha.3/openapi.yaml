openapi: 3.1.0
info:
  title: Epistola API
  description: |
    Epistola generates documents, PDFs, from templates. Authors design the templates; applications
    send data and get documents back. This API manages templates and the catalogs that hold them, and
    generates documents from them, asynchronously and at volume.

    ## Glossary

    - **Tenant**: an organisation, isolated from every other. Everything else lives in one, under
      `/tenants/{tenantKey}`.
    - **Catalog**: a set of templates and everything they use, released as a whole. A catalog is
      named by three parts together: a **registry**, the DNS name of where it is published
      (`exchange.epistola.app`, or a domain that publishes its own, `acme.com`); a **namespace**, its
      publisher within that registry (`acme-corp`); and its key (`letters`). In a path, `~` stands
      for the server's default registry. The registry `local` names catalogs that never leave the
      organisation: valid within its own installations, refused by an Exchange.
    - **Release**: the catalog as a whole at one point, in one of two statuses. A **draft release**,
      or **draft**, is editable and has no version; a **released** release is immutable and has a
      version. "Release `1.4.0`" means the released one.
    - **Version**: the number of a released release, its `version` (`1.4.0`), a SemVer core
      version, or a patch release number (`1.3.1-gemeente-x.1`, see "Versions and version
      ranges"). A **version range**, `versionRange` (`^1.4.0`), selects the highest release that
      satisfies it, for a request that renders; it never matches a draft.
    - **Content hash**: what identifies a released release, its `contentHash` (`v6:…`), a hash of
      its content alone, not of its name or number: two releases with one content hash are the same
      release, whatever they are called. Names and numbers point at content hashes.
    - **Releasing**: turning a draft into a released release, as a version. A release keeps its id,
      its `releaseId`, assigned by the server, and its name when it is released, so a draft released
      as `1.4.1` is the same release, addressed by its `releaseId` or by `1.4.1`.
    - **Publishing**: making a catalog available in a registry, for other tenants and installations
      to install from. Only released releases are ever published; releasing is not
      publishing.
    - **Base**: the release a draft started from; its changes are measured against it. A
      draft is **behind** a release whose changes it may lack (see "Releases"). A changed resource
      is **ready** once someone marks it reviewed; a draft is released only when it changed
      something and all its changes are (`getCatalogChanges`).
    - **Editable** catalogs: every catalog has releases and drafts, wherever its releases come from
      (its **source**: an exchange, a registry, a file, or the server itself). Whether a catalog can
      be changed depends on the installation, which may only receive and run releases, and on
      whether the server supplies the catalog itself (`CatalogDto.editable`, `readOnlyReason`).
    - **Environment**: where documents are generated for a purpose, such as `staging` or
      `production`. A **deployment** makes an environment serve a release of a catalog; a request
      through the environment renders what it serves.
    - **Template**: one kind of document, with its data contract (the JSON Schema its data must meet)
      and data examples. A **variant** is one rendering of a template, for a language or a brand,
      chosen by its key or by **attributes** (such as `locale`); an attribute's values may come from a
      **code list** of `{code, label}` entries. A **stencil** is reusable template content, a
      **theme** a reusable set of styles, and a **preset** a named block style a catalog declares and
      its themes style.
    - **Consumer** (experimental): an application registered in a tenant, with its own permissions.

    ## Getting started

    1. **Get an API key** from a tenant manager. A key belongs to one tenant and carries the roles it
       was issued with: `CONTENT_VIEWER` to find templates and read jobs and documents, and
       `DOCUMENT_GENERATOR` to generate.
    2. **Send these headers** on every request (the client libraries set all but the key):

       ```
       Authorization: ApiKey <key>
       Accept: application/vnd.epistola.v2+json
       Content-Type: application/vnd.epistola.v2+json      (with a request body)
       User-Agent: epistola-contract/2.0.0 your-app/1.0
       X-EP-Node-Id: <this host or pod>
       ```

    3. **Find your template.** `GET /tenants/{tenantKey}/catalogs` lists the catalogs, each with its
       `registry`, `namespace`, `catalogKey` and `highestVersion`. `GET
       /tenants/{tenantKey}/catalogs/{registry}/{namespace}/{catalogKey}/releases/{release}/templates`,
       with that version as `{release}`, lists that release's templates, and `getTemplate` shows a
       template's data contract.
    4. **Generate.** `POST /tenants/{tenantKey}/documents/generate` with the template and its data:

       ```json
       {"namespace": "acme-corp", "catalogKey": "letters", "templateKey": "invoice",
        "variantKey": "english", "data": {"customer": {"name": "Jane Smith"}}}
       ```

       It answers `202` with a `requestId` and, in `Location`, the job's address. Without a
       `versionRange` or an `environmentKey`, the catalog's highest release renders.
    5. **Poll the job**, `GET /tenants/{tenantKey}/documents/jobs/{requestId}`, until
       `request.status` is `completed` (or `failed` or `cancelled`). Each item names its
       `documentId`.
    6. **Download** the PDF: `GET /tenants/{tenantKey}/documents/{documentId}`.

    `validateTemplateData` checks data against a template's contract before you submit it, and
    `previewDocument` renders one document synchronously, for previews only. For high volume, poll no
    jobs: collect finished results as a stream instead (`collectGenerationResults`), each delivered
    to the node that asked for it and acknowledged when handled. That is the advanced path; the client
    libraries' result collectors implement it.

    ## Template model

    A variant's content (`getVariantContent`, `updateVariantContent`) and a stencil's are a template
    document: a flat graph of nodes and slots, linked by id. A node is one block, of a component
    type such as `text`, `table` or `conditional`; a slot is a named place in a node that holds child
    nodes, such as a table's `cell-0-1` or a conditional's `body` and `else`. The catalog contract's
    [component registry](https://github.com/epistola-app/epistola-contract/blob/main/contracts/catalog/registry/component-registry.json)
    and [style registry](https://github.com/epistola-app/epistola-contract/blob/main/contracts/catalog/registry/style-registry.json)
    define every component and style, with examples, and the
    [template model guide](https://github.com/epistola-app/epistola-contract/blob/main/contracts/api/docs/template-model.md)
    walks through a complete letter: the example `updateVariantContent` shows.

    ## Media types

    The media type carries the API's major version. Contract 2.x uses
    `application/vnd.epistola.v2+json`, and `application/vnd.epistola.v2+ndjson` for the result
    stream, in `Accept` and in `Content-Type`. Problems are `application/problem+json`.

    ## Client identity

    Every request identifies the client with two headers:

    - **`User-Agent`** (required): [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110#name-user-agent)
      product tokens, the first of which **must** be `epistola-contract/{version}`, the contract
      version the client was built against. Further tokens describe the rest of the stack:
      `epistola-contract/x.y.z valtimo-epistola-plugin/1.2.0 gzac/5.0.0`.
    - **`X-EP-Node-Id`** (required): the client node, such as its Kubernetes pod name, container id
      or hostname.

    The client libraries set both, the contract version and the hostname; an application can append
    its own product tokens and override the node id.

    ## Releases

    A catalog consists of releases, addressed as
    `/catalogs/{registry}/{namespace}/{catalogKey}/releases/{release}`, with the catalog's
    resources below each. A draft is addressed by its `releaseId`; a released release by its
    `releaseId` or its version, which address the same release. Every write to a released release
    is refused with 409.

    - A catalog that can be changed has **any number of drafts**, each named, each started from a released
      release (its base) or from another draft (`createCatalogRelease`). The base never moves.
      `listCatalogReleases` lists a catalog's releases, drafts included, each with its `status`
      (`?status=draft` for the drafts only) and, once released, its `contentHash`
      (`?contentHash=` for the releases with that content); a catalog (`CatalogDto`) does not list
      them.
    - **Any draft can be released.** Its version follows from the kind of change against its base:
      fixes raise the patch, additions the minor, anything that breaks callers the major
      (`previewCatalogDraftRelease`). The author may choose a higher version, never a lower one or
      one another release has. A fix to an older line is a draft from a release of that line: from
      `1.4.0`, while `1.5.0` and `2.0.0` exist, it is released as `1.4.1`.
    - **Drafts are independent copies**: releasing one changes no other. A draft is **behind** each
      release whose version is between its base and the version it would get, and each release
      released after it was started whose version is below that one; it lacks their changes unless
      an author applied them by hand. `getCatalogRelease` lists them, and releasing a draft that is
      behind must acknowledge them.
    - **Merging a release into a draft** (alpha, `x-experimental`): `previewCatalogDraftMerge`
      shows, per resource, per catalog setting (default theme and presets, entries of type
      `catalog`) and per catalog used (entries of type `catalogDependency`), each with the entries
      it goes with (`needs`), against the merge base (the closest release
      both descend from), what only the draft changed (`ours`), what only the release changed
      (`theirs`) and what both changed differently (`conflict`); `mergeIntoCatalogDraft` takes
      theirs and applies a resolution, `ours` or `theirs`, per conflict. The draft then contains
      the release and is no longer behind it; its base does not move. The preview's `token`, sent
      back as `expectedToken`, makes the merge apply what the preview showed or nothing
      (`merge-preview-outdated`). A conflict can also be resolved to content combined from its
      sides (`getCatalogDraftMergeSides`, then `mergedContent`), reviewed before the draft is
      released. The merge needs the merge base installed; the preview names one
      that is not (`missingBase`), and the merge is refused with `merge-base-missing`.
    - **Release registries** (alpha, `x-experimental`, ADR 0008) move releases between
      installations: an Epistola Exchange the installation is connected to, or a container registry
      it is configured with (`listReleaseRegistries`). A released release is published to one
      (`publishReleaseToRegistry`), and another installation lists the releases of a catalog there
      (`listRegistryReleases`) and installs one (`installRegistryRelease`) as an import does. A
      release registry is named by the installation; it is not the `{registry}` of a catalog's name.

    Documents are rendered from releases, and a version range never matches a draft. A
    draft renders only in a preview that names its `releaseId`, and in an environment it is
    deployed to.

    Importing a catalog archive (`importCatalog`) installs the release the archive carries, at its
    version, beside the releases the tenant already has; it never creates or changes a draft. A
    catalog with a source (`CatalogDto.source`) installs releases from it the same way
    (`installCatalogRelease`), and `listAvailableCatalogReleases` lists those the tenant does not
    have yet, older lines included. Nothing is updated in place or removed: deploying decides what an
    environment serves. A release keeps its id and number wherever it moves, so it is the same
    release in every installation. There are no catalog types: receiving releases works whether or
    not the catalog can be changed, and every write to one that cannot is refused with 409
    `catalog-read-only`.

    ## Deploying

    An environment serves releases of catalogs (`deployCatalogRelease`): released ones, several of
    one catalog if need be, and at most one draft per catalog, rendered live. A request through the environment
    (`environmentKey`) renders:

    - with **no `versionRange`**: the catalog's deployed draft if there is one, else the highest
      release the environment serves;
    - with a **range or an exact version**: the highest served release that satisfies it. A draft
      never matches: it has no version.

    Rollback is undeploying the newer release. Deploying a draft replaces the draft the environment
    served for that catalog, and an environment marked **production** (`EnvironmentDto.production`)
    serves no draft. A document rendered from a draft carries the draft's `releaseId` and its name
    at render time (`draftLabel`), with a null `version`, and its PDF a preview watermark. Releasing a deployed draft keeps its `releaseId`, so the environment then serves it
    as released; discarding the draft ends the deployment.

    ## Versions and version ranges

    A version (`ReleaseVersion`) is a SemVer core version, `MAJOR.MINOR.PATCH` without leading
    zeros, as the holder of the catalog's namespace issues it, or a **patch release** number,
    `MAJOR.MINOR.PATCH-<namespace>.<N>`, at most 128 characters. Wherever the contract names one
    exact version it has that form, and is called `version`; every member called `version` is one.

    A patch release is how someone who does not hold a catalog's namespace fixes a release of it (a
    municipality fixing a supplier's catalog): it is labelled with a namespace they hold, and
    numbered from 1, `1.3.1-gemeente-x.1`. As a SemVer pre-release it sorts below its core and above
    every release below that, `1.3.0` < `1.3.1-gemeente-x.1` < `1.3.1`, so the holder's next
    release supersedes it, and the two never collide: the holder never uses a label, the patcher
    never issues a plain number (contract ADR 0003). Which namespaces a tenant holds is the
    installation's to know; the contract checks the shape. "Highest" always means by this order, a
    patch release included.

    A request that selects a release to render or check (generation, preview, validation) takes a
    version range, `versionRange`, in the npm SemVer range grammar: an exact version (`1.4.0`), a caret
    (`^1.4.0`), a tilde (`~1.4.0`), comparators (`>=1.0.0 <2.0.0`), a hyphen range
    (`1.0.0 - 2.0.0`), or a `||` union of these. The highest release that satisfies it renders, and
    responses name the exact release used. A range is at most 256 characters, so an exact release
    number (at most 128) always fits, and a comparator pair of patch release numbers usually does.
    A range matches a patch release as npm matches a pre-release: only when one of its comparators
    names a pre-release of the same `MAJOR.MINOR.PATCH`, such as the exact number
    (`1.3.1-gemeente-x.1`) or `>=1.3.1-gemeente-x.1 <1.4.0`; `^1.3.0` never selects one.

    ## Catalog dependencies

    A catalog that uses another catalog's resources declares that catalog once, with the exact
    release of it that it renders with (`version`), never a range. References into the other
    catalog name the catalog but no version, so a release renders with exactly the releases its
    declarations pin.

    In a draft, a declaration may name a draft of the other catalog instead (`releaseId`), to build on
    work that is not released yet. A released release pins only released releases: releasing such a
    draft is refused (`release-dependencies-unreleased`) unless the request releases those drafts
    along with it (`releaseDependencies`), in one transaction.

    ## Catalog identity

    A catalog's key alone is not unique: two publishers can each publish `letters`. The registry and
    the namespace complete its name, and the same namespace in two registries is two namespaces. Which
    registry is a server's default is configuration; in a path, `/catalogs/~/acme-corp/letters/…` and
    `/catalogs/exchange.epistola.app/acme-corp/letters/…` address the same catalog when
    `exchange.epistola.app` is the default, and `~` may be sent percent-encoded as `%7E`.

    In a body, a catalog is named by separate `registry`, `namespace` and `catalogKey` members, and
    a reference into another catalog by an alias:

    1. **A request that names a catalog** (a generation or preview target, a dependency declaration)
       may omit `registry`, or send null, for the default registry. (An import's `registry` defaults to
       the one the archive names.)
    2. **A reference from one catalog's release to a resource of another** names that catalog by the
       **alias** the release's dependency declarations give it (`CatalogAlias`, in the member
       `catalogKey`), never by registry or namespace: a template model's `themeRef`, its stencil and
       image nodes, a `fontFamily` (catalog content, portable catalog wire v8, contract ADR 0003),
       and the references this API reads and writes beside it, a release's default theme
       (`CatalogThemeReference`), an attribute's code-list binding and an attribute criterion in
       variant selection (`VariantSelectionAttribute`, resolved through the release that renders).
       Omitted or null, or the catalog's own key, is the catalog itself. A declaration
       (`CatalogDependencyDto`, `listCatalogDependencies`) maps each alias to the catalog's full
       name and the release it pins; that is where a client finds the name. Because content names
       the alias, it means the same in every installation and under any name, and pinning another
       release changes no content. An alias is by default the catalog's key
       (`CatalogDependencyRequirement.alias`).

    Responses write every registry in full, by its name, never `~`, so a value read from one
    installation means the same catalog on another. Content documents are returned as stored.

    ## Concurrency

    Updates can be made conditional. Templates, variants, themes, stencils, code lists, attributes,
    releases, environments, tenants and consumers carry a revision, which reading or updating
    one returns as a strong `ETag` header: a quoted decimal integer such as `"7"`. Send it back as
    `If-Match` on an update: if the resource changed since you read it, the update is refused with 412
    `resource-modified` and nothing changes; read it again, reapply your change and retry. Without
    `If-Match` an update applies unconditionally, and the last write wins.

    What a revision covers:

    - a template: its own properties, data contract and data examples;
    - a variant: its title, description, attributes and template model, so `getVariant` and
      `getVariantContent` return the same `ETag`, and `updateVariant` and `updateVariantContent` take
      either;
    - a release: its name, default theme, presets and dependency declarations, so
      `getCatalogRelease` and `listCatalogDependencies` return the same `ETag`, and
      `updateCatalogRelease` and `updateCatalogDependencies` take either;
    - a code list: its properties and entries, whether each is hidden included, so
      `updateCodeListEntryHidden` takes the code list's `ETag`;
    - an environment: its name and production mark, not what it serves.

    ## Authentication

    Credentials go in the `Authorization` header:

    - **API key**, `Authorization: ApiKey <key>`: the supported method. A tenant manager issues each
      key for one tenant, with a set of tenant roles. The scheme name is case-insensitive.
    - **Bearer JWT** (**experimental**), `Authorization: Bearer <jwt>`: issued by an OAuth 2.0
      identity provider, or self-signed with a key pair registered through the Consumers API.

    The [authentication guide](https://github.com/epistola-app/epistola-contract/blob/main/contracts/api/docs/auth.md)
    has the details.

    ## Authorization

    Each operation names the permissions it requires (`x-required-permissions`), such as
    `TEMPLATE_VIEW`, `TEMPLATE_EDIT`, `DOCUMENT_GENERATE` and `CATALOG_MANAGE`. A caller has them
    through its tenant roles (`CONTENT_VIEWER`, `CONTENT_AUTHOR`, `DOCUMENT_GENERATOR`,
    `CONTENT_PUBLISHER`, `TENANT_ADMINISTRATOR`), the roles stored on its API key. Managing tenants
    needs the platform role `TENANT_MANAGER`.

    ## Errors

    Errors are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem details, with
    `Content-Type: application/problem+json`:

    - `type` (URI): what went wrong, the stable value to switch on. It is
      `https://epistola.app/errors/{slug}`, which documents the problem type;
    - `title`: a short summary;
    - `status`: the HTTP status code;
    - `detail` (optional): what happened this time;
    - `instance` (optional): this occurrence.

    A problem may add members of its own, such as the field-level `errors` of a `validation-error`;
    ignore members you do not recognize. The problem types are listed, machine-readably, in this
    document's `x-problem-types` extension, and in the
    [error type registry](https://github.com/epistola-app/epistola-contract/blob/main/contracts/api/docs/error-types.md).
    New types may be added in a minor version, so keep a fallback when switching on them.

    ## Experimental parts and server support

    Operations and members marked `x-experimental: true`, the consumer model (Bearer JWT and the
    Consumers API) among them, may still change. Epistola Suite, the server that implements this
    contract, may not implement them yet, nor every part of the rest: deploying a draft, installing
    missing dependency releases when deploying, and recording who requested a document among them.
  version: 2.0.0
  contact:
    name: Epistola Team
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
  - authorizationApiKeyAuth: []
tags:
  - name: System
    description: |
      System-level endpoints for health checking and metadata exchange.

      ## Ping / Pong

      The `POST /ping` endpoint enables bidirectional metadata exchange between
      clients and the server. It serves two purposes:

      1. **Health checking** — Any client (including load balancers and monitoring
         probes) can send an unauthenticated ping to verify the server is alive.
         The response contains only `status` and `timestamp`.

      2. **Metadata exchange** — Authenticated clients receive a full response
         including server version, API spec version, and node identity. Clients
         can also send their own metadata (name, version, node ID) in the request
         body for server-side logging and diagnostics.

      ### Recommended ping intervals

      - **On startup**: Always ping once before making business requests.
      - **Periodic**: Every 30–60 seconds for ongoing health monitoring.
      - **After failures**: Ping to check server availability before retrying.
  - name: Tenants
    description: Tenants, the organisations everything else lives in. Creating and deleting one is a platform operation.
  - name: Templates
    description: |
      Templates in a release of a catalog: one kind of document each, with its data contract and
      data examples. Edited in a draft, read in any release.
  - name: Themes
    description: Reusable sets of styles that templates render with, in a release of a catalog
  - name: Environments
    description: |
      Environments (such as `staging` and `production`) and what they serve: deploying and
      undeploying releases of catalogs, and the history of those changes
  - name: Attributes
    description: The criteria variants are selected by (such as `locale`), in a release of a catalog
  - name: Variants
    description: |
      A template's variants, one rendering each (for a language or a brand), and their content,
      in a release of a catalog
  - name: Stencils
    description: |
      Reusable template content in a release of a catalog: its content, readiness and where it is
      used. A stencil has no releases of its own; it is released with its catalog.
  - name: Catalogs
    description: |
      Catalogs and their releases, draft and released: dependencies and changes, releasing a draft;
      importing an archive and installing the releases a catalog's source offers
  - name: CodeLists
    description: |
      Reusable `{code, label}` collections that attributes can bind to.
      Code lists are tenant + catalog scoped; the code lists of a catalog
      that cannot be changed (e.g. the bundled `system` catalog's BCP-47,
      ISO 639-1, ISO 3166-1 alpha-2) are read-only — PATCH/DELETE return
      409 `catalog-read-only`.
  - name: Fonts
    description: |
      Font families (tenant + catalog scoped) and the weight/italic faces
      they ship. Read-only over REST; families and their binaries are managed
      through the UI and catalog exchange only.
      Families of a catalog that cannot be changed (the bundled `system`
      fonts) are flagged `readOnly: true`.
  - name: Images
    description: |
      Catalog-scoped images: metadata, upload, download, and delete. An image is what a
      template places in an image node, referenced by the image's `key`.
      Images of a catalog that cannot be changed are flagged `readOnly: true`.
  - name: Consumers
    description: |
      Tenant-scoped consumer application registration and lifecycle management.

      **Experimental**, like every operation in this group (`x-experimental: true`): see
      "Experimental parts and server support" in the API description.

      Each tenant independently manages which applications can access their resources.
      The same application can register in multiple tenants with separate approvals.

      ## Onboarding

      Two registration paths are supported:

      - **Self-signed JWT**: Application calls `POST /tenants/{tenantKey}/consumers/register`
        with a public key. Created as `pending` until a tenant manager approves.
      - **OAuth**: First authenticated request to a tenant auto-registers the consumer
        as `pending`. A tenant manager must approve before resources are accessible.

      ## Permissions

      Consumers declare what permissions they need at registration time (or via
      OAuth scopes). The tenant manager reviews and grants equal or fewer permissions
      on approval. Permissions are per resource type, each with its own levels, a higher level
      implying the lower ones: `none`, `read` and `write` for most; `deploy` above `write` for
      environments, `release` above `write` for catalogs, and `manage` above `read` for consumers
      (see `ConsumerPermissions`). They are managed in Epistola's consumer record.

      ## Authentication

      Bearer JWT calls use `Authorization: Bearer <jwt>`. For self-signed JWT consumers,
      the JWT is short-lived (60s) and signed with the consumer's private key.
  - name: Generation
    description: |
      Generating documents: synchronous preview, asynchronous single and batch generation, jobs,
      documents, and collecting results as a stream
paths:
  /ping:
    post:
      operationId: ping
      summary: Ping the server and exchange metadata
      description: |
        Bidirectional metadata exchange endpoint for health checking and version discovery.

        ## Two-tier response

        Authentication is optional. A client configured with credentials sends them, as on every
        other operation; without them the request is still answered:

        - **Unauthenticated**: Returns only `status` and `timestamp` — useful for load balancers,
          monitoring probes, and basic liveness checks.
        - **Authenticated**: Returns the full response including `details` with server version,
          API spec version, and node identity. The client can also send its own metadata
          (name, version, node ID) in the request body for server-side diagnostics.

        ## Recommended usage

        - **On startup**: Always ping once to verify the server is reachable and discover its
          version before making business requests.
        - **Periodic health check**: Ping every **30–60 seconds** for ongoing health monitoring.
          More frequent pings add unnecessary load; less frequent pings delay issue detection.
        - **On-demand after failures**: When a business request fails, ping to determine whether
          the server is still available before retrying.

        ## Request body

        The request body is entirely optional. An empty body (`{}`) or no body at all is valid
        and returns a basic health response. Include client metadata when you want the server
        to log which clients are connected or to enable future compatibility features.
      tags:
        - System
      security:
        - {}
        - bearerAuth: []
        - authorizationApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/PingRequest'
      responses:
        '200':
          description: Server health status and optional metadata
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/PongResponse'
  /tenants:
    get:
      operationId: listTenants
      summary: List all tenants
      description: Retrieve a paginated list of all tenants with optional search filtering.
      tags:
        - Tenants
      x-required-authentication: true
      parameters:
        - name: q
          in: query
          description: Search term for filtering tenants by name
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
