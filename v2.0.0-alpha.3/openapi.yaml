          type: array
          description: List of template usages
          items:
            $ref: '#/components/schemas/StencilUsageDto'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        items:
          - templateKey: monthly-invoice
            templateName: Monthly Invoice
            variantKey: english
