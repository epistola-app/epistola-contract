        (`installRegistryRelease`), each by its name and kind (`exchange`, `container`). Names and
        kinds only: credentials and addresses stay in the installation's configuration. Empty when
        it has none, which is what keeps the feature out of sight.

        A release registry is not the `{registry}` of a catalog's path, which is part of the
        catalog's name (ADR 0003): a container registry carries releases without granting names, and
        the catalogs it carries keep the names their archives give them. A release registry's paths
        name a catalog in full, `{registry}` (its authority) included, under the release registry
        `{name}`: a container registry keeps a catalog's releases at
        `<prefix>/<authority>/<namespace>/<catalogKey>`, tagged by release number, so two catalogs that
        differ only in their authority are two repositories (ADR 0008, amendment of 2026-10-22).
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_VIEW
      responses:
        '200':
          description: The release registries this installation has
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/ReleaseRegistryListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /tenants/{tenantKey}/release-registries/{name}/catalogs/{registry}/{namespace}/{catalogKey}/releases:
    parameters:
      - name: tenantKey
        in: path
