      - $ref: '#/components/parameters/CatalogKey'
    get:
      operationId: listRegistryReleases
      x-experimental: true
      summary: List the releases of a catalog in a release registry (alpha)
      description: |
        **Alpha** (`x-experimental`, ADR 0008): may still change in a minor release.

        The releases of the catalog `{registry}/{namespace}/{catalogKey}` that the release registry
        `{name}` holds, highest version first, each with what the registry says of it: its fingerprint, and
        its content hash, id and base when the registry records them. Best effort: what the registry can say, and
        only a label, never trusted; installing checks the release itself. Nothing is installed by
        reading it.

        A registry this installation does not have is 404 `release-registry-not-found`. When the
        registry cannot be reached, or answers with an error or with something that is not a valid
        answer, the request fails with `catalog-source-unavailable`: 503 when it could not be reached
        or did not answer in time, possibly with `Retry-After`, and 502 when it answered badly.
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_VIEW
      responses:
        '200':
          description: The releases of the catalog the registry holds
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/RegistryReleaseListResponse'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/ReleaseRegistryNotFoundError'
        '502':
          $ref: '#/components/responses/CatalogSourceBadGatewayError'
        '503':
          $ref: '#/components/responses/CatalogSourceUnavailableError'
  /tenants/{tenantKey}/release-registries/{name}/catalogs/{registry}/{namespace}/{catalogKey}/releases/{version}/install:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant
        schema:
          $ref: '#/components/schemas/TenantKey'
      - $ref: '#/components/parameters/ReleaseRegistryName'
      - $ref: '#/components/parameters/Registry'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/CatalogKey'
      - name: version
        in: path
        required: true
        description: The version of the release to install, one the registry holds
        schema:
          $ref: '#/components/schemas/ReleaseVersion'
    post:
      operationId: installRegistryRelease
      x-experimental: true
      summary: Install a release of a catalog from a release registry (alpha)
      description: |
        **Alpha** (`x-experimental`, ADR 0008): may still change in a minor release.

        Fetches release `{version}` of the catalog `{registry}/{namespace}/{catalogKey}` from the
        release registry `{name}` and installs it exactly as `importCatalog` installs the release an archive
        carries: an immutable release, side by side with the releases of the catalog the tenant has,
        whether its version is above theirs or below, with nothing updated in place or removed. The
        catalog is the one the release's archive names (registry, namespace and key); what the
        registry says of it is never trusted, and the release's fingerprint is recomputed from its
        content.

        - **A catalog the tenant does not have** is created, holding the release, with that release
          registry as its source (`CatalogDto.source`), so its later releases can be listed and
          installed from there.
        - **A catalog the tenant has** gets the release beside its others. One that is another
          catalog under the same key, or receives its releases from another source, is refused with
          409 `conflict` before anything is fetched.

        Refused as importing is, with nothing installed: the same version with a different
        fingerprint, or a release id another release or a draft of the catalog has here (one number
        and one id name one release), with 409 `release-number-taken`; releases it pins that cannot be had with 409
        `release-dependencies-missing`; a release that is not a valid catalog archive, or not the
        catalog and version asked for, with 400 `bad-request`; one rendering with rendering defaults
        this installation does not have with 400 `catalog-rendering-defaults-too-new`. The same
        version with the same fingerprint is the release the tenant has: nothing changes
        (`newlyInstalled: false`). A registry this installation does not have is 404
        `release-registry-not-found`, a version the registry does not hold 404 `not-found`. When the
        registry cannot be used the request fails with `catalog-source-unavailable` (503 or 502) and
        nothing is installed. Nothing is merged: a draft with changes of its own stays as it is,
        behind the release, and can merge it (`mergeIntoCatalogDraft`, alpha).
      tags:
        - Catalogs
      x-required-permissions:
