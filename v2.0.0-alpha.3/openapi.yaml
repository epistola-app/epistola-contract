  /tenants/{tenantKey}/catalogs/{registry}/{namespace}/{catalogKey}/available-releases/{version}/install:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant
        schema:
          $ref: '#/components/schemas/TenantKey'
      - $ref: '#/components/parameters/Registry'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/CatalogKey'
      - name: version
        in: path
        required: true
        description: The version of the release to install, one the source offers
        schema:
          $ref: '#/components/schemas/ReleaseVersion'
    post:
      operationId: installCatalogRelease
      summary: Install a release of a catalog from its source
      description: |
        Install a release of a catalog fetched from its source (`CatalogDto.source`), exactly as
        `importCatalog` installs the release an archive carries. It is fetched from the source,
        through a mirror of it the server is configured with, and installed as an immutable release, side by side
        with the releases of the catalog the tenant has, whether its version is above theirs or below.
        Nothing is updated in place and nothing is removed: the releases installed before stay, and
        every draft, deployment and catalog that uses them keeps doing so. Which release an
        environment serves is decided by deploying it (`deployCatalogRelease`).
        `GET .../available-releases` lists the releases the source offers that the tenant lacks.

        - **A release the tenant does not have** is installed (`newlyInstalled: true`).
        - **The same version with the same fingerprint** is the release the tenant has already: nothing
          changes (`newlyInstalled: false`).
        - **The same version with a different fingerprint** is different content under one name: the
          install is refused with 409 `release-number-taken`, and nothing changes. So is a release
          whose id another release or a draft of the catalog has here: one number and one id name
          one release.

        The releases of other catalogs the release pins (`catalogDependencies`), directly or through
        other pins, are installed first, each before every release that pins it, as an import
        installs the releases an archive carries: those the tenant lacks are fetched and installed
        (`installedDependencies`), each in a catalog the install creates when the tenant does not
        have that catalog; those it has with the same fingerprint are left alone (`presentDependencies`). One
        the tenant has under the same version with a different fingerprint refuses the install with
        409 `release-number-taken`; one that cannot be fetched, or does not match its pin's
        `releaseFingerprint`, refuses it with 409 `release-dependencies-missing`, listing each
        (`unavailable`). A release whose `release.metadata` names rendering defaults this
        installation does not have, newer or unknown, is refused with 400
        `catalog-rendering-defaults-too-new` before anything is written, as `importCatalog` refuses it.
        Installing is all or nothing, in one transaction.

        A catalog without a source (`source` null) is refused with 409 `conflict`; whether the
        catalog can be changed does not matter, since receiving a release changes no draft. A
        `version` the source does not offer is refused with 404 `not-found`. When the
        catalog's source cannot be reached, or answers with an error or with something that is not a
        valid answer, the request fails with `catalog-source-unavailable` and nothing is installed:
        503 when it could not be reached or did not answer in time, possibly with `Retry-After`, and
        502 when it answered badly.
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_MANAGE
      responses:
        '200':
          description: The release is installed, or was already present
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/InstallCatalogReleaseResponse'
        '400':
          $ref: '#/components/responses/CatalogInstallBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ReleaseDependenciesMissingError'
        '502':
          $ref: '#/components/responses/CatalogSourceBadGatewayError'
        '503':
          $ref: '#/components/responses/CatalogSourceUnavailableError'
  /tenants/{tenantKey}/catalogs/{registry}/{namespace}/{catalogKey}/releases/{release}/publish:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant
        schema:
          $ref: '#/components/schemas/TenantKey'
      - $ref: '#/components/parameters/Registry'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/CatalogKey'
      - $ref: '#/components/parameters/Release'
    post:
      operationId: publishReleaseToRegistry
      x-experimental: true
      summary: Publish a release to a release registry (alpha)
      description: |
        **Alpha** (`x-experimental`, ADR 0008): may still change in a minor release.

        Publishes the released release `{release}` of the catalog, exactly as it was released (its
        archive), to the release registry `to` names, so that other installations can install it
        from there (`installRegistryRelease`). Any released release may be published, not only the
        highest.

        **One number names one release.** The registry is asked first: when it holds this version
        with the same fingerprint, nothing is sent (`already-published`); with other content, the
        request is refused with 409 `release-number-taken` (release the changes under a new
        version). Between that look and the push another installation could still publish the same
        version; only a registry that refuses to overwrite a version closes that.

        The status says what happened: `published` when the registry holds it now (a container
        registry publishes while the request waits), `queued` when the registry publishes
        asynchronously (the Exchange's publication outbox: the Exchange decides later), also when it
        was queued already.

        Refused, with nothing sent:

        - 404 `release-registry-not-found`: this installation has no release registry called `to`;
          404 `not-found` when there is no such catalog or release;
        - 409 `conflict`: `{release}` names a draft; only a released release is published;
        - 409 `release-number-taken`: the registry holds this version with other content;
        - 409 `namespace-not-granted`: the registry grants namespaces (the Exchange) and does not
          grant this installation the catalog's namespace, which is always so for a catalog whose
          registry is `local`: such a name never leaves the organisation;
        - 502/503 `catalog-source-unavailable`: the registry could not be used.

        Publishing needs `CATALOG_PUBLISH`, not only `CATALOG_RELEASE`: the release leaves the
        installation, which being trusted to release it here does not cover.
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_PUBLISH
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/PublishReleaseToRegistryRequest'
      responses:
        '200':
          description: The release is published, was already, or is queued
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/ReleasePublicationDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/ReleaseRegistryNotFoundError'
        '409':
          $ref: '#/components/responses/ReleasePublicationConflictError'
        '502':
          $ref: '#/components/responses/CatalogSourceBadGatewayError'
        '503':
          $ref: '#/components/responses/CatalogSourceUnavailableError'
  /tenants/{tenantKey}/release-registries:
