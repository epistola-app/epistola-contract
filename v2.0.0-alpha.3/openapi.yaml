          changes included, on that draft's base.
        - Without `from`, it starts as a copy of the catalog's highest release, or empty,
          with no base, when the catalog has none.


        The base is fixed. The draft is an independent copy, and the releases it is **behind** are
        listed (see `CatalogReleaseDto.behind`); an author can merge one in (`mergeIntoCatalogDraft`,
        alpha).

        Refused with 409 when another draft of the catalog has the name, and with 409
        `catalog-read-only` when the catalog cannot be changed in this installation
        (`CatalogDto.editable`).
      tags:
        - Catalogs
      x-required-permissions:
        - TEMPLATE_EDIT
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/CreateCatalogReleaseRequest'
      responses:
        '201':
          description: The draft
          headers:
            Location:
              $ref: '#/components/headers/Location'
              description: The draft's address, by its `releaseId` (`getCatalogRelease`)
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/CatalogReleaseDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/CatalogReadOnlyError'
  /tenants/{tenantKey}/catalogs/{registry}/{namespace}/{catalogKey}/releases/{release}:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant
        schema:
          $ref: '#/components/schemas/TenantKey'
      - $ref: '#/components/parameters/Registry'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/CatalogKey'
      - $ref: '#/components/parameters/Release'
    get:
      operationId: getCatalogRelease
      summary: Get a release of a catalog
      description: |
        One release of the catalog: a draft, by its `releaseId`, or a released one, by its
        `releaseId` or its version, which return the same release. A released one also lists
        the releases of other catalogs it renders with. Both list the environments that serve them.
        The id of a discarded draft addresses nothing: 404.
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_VIEW
      responses:
        '200':
          description: The release
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/CatalogReleaseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateCatalogRelease
      summary: Update a draft release's name, default theme or presets
      description: |
        Changes a draft's own settings: its name, its default theme (the theme a template that names
        none renders with) and its declared presets (the block styles its content may name). Each
        changes only when the request names it: an omitted or null member keeps its value,
        `clearDefaultTheme: true` removes the default theme and an empty `presets` array removes the
        presets. Its address, its `releaseId`, does not change, and it keeps its name when it is
        released. Refused with 409 for
        a name another draft of the catalog has, with 409 `catalog-read-only` when the catalog cannot
        be changed, and with 409 outside a draft: a released release cannot be
        changed, its name included; with 400 for a default theme that cannot be found or names a
        catalog the draft does not declare, for a `defaultTheme` together with `clearDefaultTheme`,
        and for presets that repeat a key.

        Send the `ETag` from `getCatalogRelease` or `listCatalogDependencies` as `If-Match` to have
        the update refused with 412 `resource-modified` if the draft's settings or dependency
        declarations changed since; without it, the last write wins.
      tags:
        - Catalogs
      x-required-permissions:
        - TEMPLATE_EDIT
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogReleaseRequest'
      responses:
        '200':
          description: The draft, as changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/CatalogReleaseDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/CatalogReadOnlyError'
        '412':
          $ref: '#/components/responses/ResourceModifiedError'
    delete:
      operationId: deleteCatalogRelease
      summary: Discard a draft release
      description: |
        Discards a draft and everything changed in it; its `releaseId` then addresses nothing. Where
        the draft is deployed (`deployCatalogRelease`), the deployment ends, recorded as `undeployed`.

        Refused with 409 `catalog-read-only` when the catalog cannot be changed, and with 409 outside
        a draft (a released release is never deleted), while a dependency
        declaration in a draft of another catalog names this draft, and while the draft alone holds a resource something outside it
        still uses (a theme another catalog's templates or variants name, or another catalog names
        as its default theme, `defaultTheme`; a code list another catalog's attribute binds).
      tags:
        - Catalogs
