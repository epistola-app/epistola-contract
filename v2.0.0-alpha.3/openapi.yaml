  /tenants/{tenantKey}/generation/collect:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          $ref: '#/components/schemas/TenantKey'
    post:
      operationId: collectGenerationResults
      summary: Collect generation results
      description: |
        Collect completed and failed generation results as a compressed NDJSON stream.
        Each line is a self-contained JSON object representing one generation result.

        ## Partition-based routing

        Results are routed to nodes using consistent hashing on the `routingKey`
        from the generation request:

        1. Each result is assigned to a **partition**:
           `(murmur3_x86_32(utf8(routingKey), seed=0) & 0x7FFFFFFF) % total`, as
           `PartitionAssignment.hash` states it. If no routing key was provided, the request ID is
           used, in its canonical lowercase form.
        2. Partitions are **assigned to nodes** via consistent hashing. The server
           tracks which nodes are active based on poll frequency.
        3. Each node receives results from its **assigned partitions** only.

        ## Failover

        If a node stops polling (server-configured timeout, default: 60 seconds),
        its partitions are redistributed to the remaining active nodes. Results
        from those partitions are delivered to the new owners. When the node
        returns, partitions are rebalanced again.

        Consistent hashing minimizes disruption — when a node joins or leaves,
        only ~1/N of partitions move.

        ## Partition assignment

        The response metadata (`_meta` line) includes the current partition
        assignment: total partitions, which partitions are assigned to this node,
        and the hash algorithm. Clients can use this to compute routing keys
        that target specific nodes (e.g., to ensure results come back to the
        submitting node).

        ## Acknowledgment

        Each result includes a `sequence` number. Pass the highest successfully
        processed sequence as `acknowledgeUpTo` in the next poll to advance the cursor:

        1. First poll: omit `acknowledgeUpTo` (nothing to acknowledge yet).
        2. Process results. Track the highest `sequence` you successfully handled.
        3. Next poll: `{ "acknowledgeUpTo": 508, "limit": 100 }`.
        4. Server advances per-partition cursors, returns results after 508.

        **Partial acknowledgment**: if you processed results 500-505 out of 500-509,
        set `acknowledgeUpTo: 505`. Results 506-509 are redelivered.

        **After restart**: omit `acknowledgeUpTo`. The server resumes from the last
        acknowledged position. No data loss, no silent acknowledgment.

        ## Compression

        The client specifies preferred compression via `Accept-Encoding`:
        ```
        Accept-Encoding: lz4, zstd, gzip
        ```
        Supported: `lz4` (fastest), `zstd` (best ratio), `gzip` (universal).
        Defaults to `gzip` if not specified.

        ## NDJSON response format

        - **Result lines**: `GenerationResult` objects, one per line
        - **Meta line**: Last line, identified by `_meta: true`, contains `hasMore` and `resultCount`

        ## Adaptive polling

        Use the `hasMore` flag to control polling frequency:
        - `hasMore: true` — poll again immediately (more results available)
        - `hasMore: false` — wait before next poll (caught up)

        Recommended: exponential backoff (1s → 2s → 4s → ... → 30s max), reset on results.
      tags:
        - Generation
      x-required-permissions:
        - DOCUMENT_GENERATE
      parameters:
        - name: Accept-Encoding
          in: header
          required: false
          description: Preferred compression algorithm(s). Defaults to gzip.
          schema:
            type: string
            default: gzip
          example: lz4, zstd, gzip
      requestBody:
        required: false
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/CollectRequest'
      responses:
        '200':
          description: |
            NDJSON stream of generation results. Each line is a JSON object — either a
            `GenerationResult` or a `CollectMeta` (last line, identified by `_meta: true`).
          headers:
            Content-Encoding:
              description: Compression algorithm used.
              schema:
                type: string
                enum:
                  - lz4
                  - zstd
                  - gzip
          content:
            application/vnd.epistola.v2+ndjson:
              schema:
                type: string
                description: |
                  Newline-delimited JSON stream. Each line is a self-contained JSON object.
                  Result lines conform to the GenerationResult schema. The last line conforms
                  to the CollectMeta schema (identified by `_meta: true`).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
components:
  schemas:
    TenantKey:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 63
      description: |
        The key of a tenant: lowercase letters, digits and single hyphens, starting with a letter, 3 to
        63 characters.
      example: acme-corp
    Namespace:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 63
      description: |
        The namespace of a catalog, its publisher within its registry: lowercase letters, digits and
        single hyphens, starting with a letter, 3 to 63 characters.
      example: acme-corp
    CatalogKey:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 50
      description: |
        The key of a catalog, unique within its registry and namespace: lowercase letters, digits and
        single hyphens, starting with a letter, 3 to 50 characters.
      example: letters
    EnvironmentKey:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 30
      description: |
        The key of an environment, unique within its tenant: lowercase letters, digits and single
        hyphens, starting with a letter, 3 to 30 characters.
      example: production
    ConsumerId:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 63
      description: |
        The id of a consumer, unique within its tenant: lowercase letters, digits and single hyphens,
        starting with a letter, 3 to 63 characters.
      example: invoice-service
    ResourceKey:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      minLength: 3
      maxLength: 50
      description: |
        The key of a resource in a release of a catalog (a template, variant, stencil, theme, attribute,
        code list, font, image or data example), unique among its kind: lowercase letters, digits and
        single hyphens, 3 to 50 characters. It may start with a digit, because resource keys used to be
        UUIDs. The same rule as in the catalog archive.
      example: invoice
    PresetKey:
      type: string
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      minLength: 1
      maxLength: 50
      description: |
        The key of a block style preset, unique within a release's presets: lowercase letters,
        digits and single hyphens, starting with a letter, 1 to 50 characters. The same rule as in the
        catalog archive.
      example: muted
    Registry:
      type: string
      pattern: ^(local|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)$
      maxLength: 253
      description: |
        A registry, the authority of a catalog's name: the DNS name of where it is published
        (`exchange.epistola.app`, or a domain that publishes its own, `acme.com`), lowercase labels of
        letters, digits and inner hyphens joined by at least one dot, at most 253 characters; or
        `local`, the authority of names that never leave the organisation (`local/acme-hr/letters`), valid
        within its own installations and refused by an Exchange (contract ADR 0003). `local` is the only
        registry without a dot: `localhost` is not one. The same rule as the catalog archive's.
      example: exchange.epistola.app
    RegistryOrDefault:
      type: string
      pattern: ^(~|local|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)$
      minLength: 1
      maxLength: 253
      description: |
        A registry as a path or a query names it: a `Registry`, or `~` for the server's default
        registry, which the server configures. A client may send `~` percent-encoded as `%7E`.
      example: '~'
    ReleaseVersion:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?=[a-z0-9-]{3,63}\.)([a-z][a-z0-9]*(?:-[a-z0-9]+)*)\.([1-9][0-9]*))?$
      maxLength: 128
      description: |
        A release's version, its number, unique in its catalog, at most 128 characters: a SemVer core
        version, `MAJOR.MINOR.PATCH` without leading zeros (`1.4.0`), as the holder of the catalog's
        namespace issues it, or a **patch release** number, `MAJOR.MINOR.PATCH-<namespace>.<N>`
        (`1.3.1-gemeente-x.1`), as someone who does not hold it issues it: labelled with a namespace
        they hold (a `Namespace`, 3 to 63 characters) and a sequence number from 1 without leading
        zeros. The rule of the catalog archive's release number (portable catalog wire v8, contract
        ADR 0003). As a SemVer pre-release, a patch release sorts below its core and above every
        release below that: `1.3.0` < `1.3.1-gemeente-x.1` < `1.3.1`. Nothing else: no other
        pre-release form (`1.4.0-rc.1`, `1.4.0-beta`) and no build part (`1.4.0+build.5`).

        A draft has none until it is released. Never a range (that is a `versionRange`); wherever the
        API names one exact version, the member is called `version`.
      example: 1.4.0
    CatalogReleaseId:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      minLength: 4
      maxLength: 36
      description: |
        The id of one release of a catalog, opaque and assigned by the server, unique within its
        catalog. A release gets it when it is created as a draft and keeps it when it is released; a
        release installed by import or from its source gets one when it is installed. It addresses the
        release (`…/releases/{releaseId}`) for as long as the release exists, as a draft and once
        released alike: once released, it is addressed by its `releaseId` or by its version,
        interchangeably.

        Lowercase letters, digits and single hyphens, 4 to 36 characters. It never contains a dot, so
        it cannot be mistaken for a version. A UUID fits; a server is recommended, not required, to use
        a short random id instead, about 8 characters from a lowercase alphabet without look-alikes (no
        `0`/`o`, `1`/`l`/`i`), such as `k7m2x9qa`, which people can read and type.
      example: k7m2x9qa
    CatalogReleaseRef:
      type: string
      pattern: ^([a-z0-9]+(-[a-z0-9]+)*|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?=[a-z0-9-]{3,63}\.)([a-z][a-z0-9]*(?:-[a-z0-9]+)*)\.([1-9][0-9]*))?)$
      minLength: 4
      maxLength: 128
      description: |
        One release of a catalog, by its `CatalogReleaseId` or, once it is released, by its version
        (`ReleaseVersion`, a patch release number included): both name the same release, and as an id
        never contains a dot, the two cannot be confused. The pattern is the two rules' patterns joined.
      example: k7m2x9qa
    Fingerprint:
      type: string
      pattern: ^v[1-9][0-9]*:[0-9a-f]{64}$
      description: |
        The canonical fingerprint of a release's content, as its catalog archive carries it: the
        version of the algorithm that computed it (`v6` for a release made under V6, which covers the
        release's content only; `v5` and older for releases made before), a colon, and the lowercase
        hex SHA-256.
      example: v6:9f3a1c2b4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70
    PageMeta:
      type: object
      required:
        - number
        - size
        - total
        - totalPages
      properties:
        number:
          type: integer
          description: Current page index (0-based)
          example: 0
        size:
          type: integer
          description: Number of items per page
          example: 20
        total:
          type: integer
          format: int64
          description: Total number of elements across all pages
          example: 1
        totalPages:
          type: integer
          description: Total number of pages
          example: 1
    PingRequest:
      type: object
      description: |
        Client metadata sent to the server as part of a ping request.
        An empty object or no body works as a basic health probe.

        When authenticated, the server uses ping data to maintain a consumer registry.
        The optional `name`, `description`, and `contact` fields allow the application
        to announce itself with human-readable metadata. Combined with the required
        `User-Agent` and `X-EP-Node-Id` headers, the server builds a live view of
        which applications are connected, which nodes they run on, and what versions
        they use.
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Human-readable name of the consuming application.
            Stored by the server as part of the consumer registry.
          example: Invoice Service
        description:
          type: string
          maxLength: 1000
          description: |
            What this application does and why it uses Epistola.
          example: Generates PDF invoices for the billing pipeline
        contact:
          type: string
          maxLength: 255
          description: |
            Team or individual responsible for this application (email, Slack channel, etc.).
          example: billing-team@acme-corp.com
    PongResponse:
      type: object
      description: |
        Server response to a ping request.

        When the request is unauthenticated, only `status` and `timestamp` are returned
        (basic health check). When authenticated, the `details` object is included with
        full server metadata.
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - up
            - degraded
          description: |
            Current health status of the server.
            - `up`: All systems operational.
            - `degraded`: Service is running but with reduced capability.
            A server that is completely down cannot respond, so there is no `down` value.
          example: up
        timestamp:
          type: string
          format: date-time
          description: Server timestamp at the time of the response (ISO 8601)
          example: '2026-04-21T10:30:00Z'
        details:
          $ref: '#/components/schemas/PongDetailsDto'
    PongDetailsDto:
      type: object
      description: |
        Detailed server metadata, only included in the response when the request is authenticated.
      required:
        - serverVersion
        - apiVersion
      properties:
        serverVersion:
          type: string
          description: Semantic version of the running server application
          example: 2.1.0
        apiVersion:
          type: string
          description: The API spec version supported by this server
          example: 0.3.0
        nodeId:
          type: string
          description: Server node identifier (e.g. Kubernetes pod name, hostname)
          example: epistola-server-pod-3a2d1e
        partitions:
          description: |
            Partition assignment for generation result collection, if available.
            Included when the caller's credentials belong to one tenant (as an API key does) and the
            calling node has an active partition assignment there; `/ping` names no tenant, so it is
            that tenant's. Absent for a node that has not yet polled the collect endpoint, for
            credentials that span several tenants, and when the request is unauthenticated.

            Clients can use this on startup to compute routing keys that target
            their own node before submitting generation requests.
          $ref: '#/components/schemas/PartitionAssignment'
    ConsumerDto:
      type: object
      description: |
        Represents a consumer application registered within a tenant.

        **Experimental**, as the whole Consumers API is (see the Consumers tag).

        Consumers are tenant-scoped — each tenant independently manages which
        applications can access their resources. The same application can register
        in multiple tenants with separate approvals.

        Two registration paths are supported:
        - **Self-signed JWT**: Application calls `POST /tenants/{tenantKey}/consumers/register`
          with a public key and requested permissions. Created as `pending` until
          a tenant manager approves.
        - **OAuth**: First authenticated request to a tenant auto-registers the consumer
          as `pending`. Requested permissions are derived from JWT scopes.
      required:
        - id
        - tenantKey
        - name
        - status
        - authMethod
        - requestedPermissions
        - grantedPermissions
        - nodes
        - createdAt
        - lastModified
      properties:
        id:
          $ref: '#/components/schemas/ConsumerId'
          description: |
            Unique slug identifier of the consumer within this tenant.
            For self-signed JWT consumers, this is self-chosen at registration
            and used as the `iss` claim. For OAuth consumers, this is derived
            from the JWT `client_id` claim.
          example: invoice-service
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          description: Key of the tenant this consumer is registered in
          example: acme-corp
        name:
          type: string
          description: Human-readable name of the consuming application
          example: Invoice Service
        description:
          type:
            - string
            - 'null'
          description: What this application does and why it uses Epistola
          example: Generates PDF invoices for the billing pipeline
        contact:
          type:
            - string
            - 'null'
          description: Team or individual responsible for this application
          example: billing-team@acme-corp.com
        status:
          type: string
          enum:
            - pending
            - active
            - rejected
            - expired
            - inactive
          description: |
            Current lifecycle status:
            - `pending`: Registered but awaiting manager approval.
            - `active`: Approved and operational.
            - `rejected`: Manager rejected the registration.
            - `expired`: Approval has expired (expiresAt passed).
            - `inactive`: Manually deactivated by a manager.
          example: active
        authMethod:
          type: string
          enum:
            - oauth
            - self-signed-jwt
            - api-key
          description: |
            How this consumer authenticates:
            - `oauth` (**experimental**): JWT tokens issued by an external Identity Provider.
            - `self-signed-jwt` (**experimental**): Short-lived JWTs signed with the
              consumer's private key.
            - `api-key`: Long-lived static key provisioned by a tenant manager, sent as
              `Authorization: ApiKey <key>`. This is the supported method. The consumer cannot self-rotate an api key —
              `PUT /tenants/{tenantKey}/consumers/{consumerId}/public-key` does not apply; rotation requires
              a tenant manager to issue a new key and revoke the old one out of
              band.
          example: self-signed-jwt
        requestedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        publicKey:
          type:
            - string
            - 'null'
          description: |
            PEM-encoded public key for self-signed JWT consumers.
            Null unless `authMethod` is `self-signed-jwt`.
          example: null
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When this consumer's approval expires. Null means no expiry.
            After this time, the consumer transitions to `expired` status.
          example: '2027-04-22T00:00:00Z'
        rejectionReason:
          type:
            - string
            - 'null'
          description: Reason provided by manager when rejecting the consumer
          example: null
        nodes:
          type: array
          description: Known instances (nodes) of this consumer application
          items:
            $ref: '#/components/schemas/ConsumerNodeDto'
        totalPartitions:
          type:
            - integer
            - 'null'
          description: |
            Total number of partitions for generation result collection.
            Null if the consumer has not yet polled the collect endpoint.
          example: 12
        createdAt:
          type: string
          format: date-time
          description: When the consumer was registered
          example: '2026-04-22T10:00:00Z'
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server last received a request from this consumer
          example: '2026-04-22T14:30:00Z'
        lastModified:
          type: string
          format: date-time
          description: |
            When the consumer record was last changed. At registration it equals `createdAt`; every
            change to the consumer (an update, approval, rejection, key rotation, or a status change
            such as expiry) moves it forward.
          example: '2026-04-22T11:15:00Z'
    ConsumerNodeDto:
      type: object
      description: A known instance (node) of a consumer application
      required:
        - nodeId
        - lastSeenAt
      properties:
        nodeId:
          type: string
          description: Node identifier from the `X-EP-Node-Id` header
          example: invoice-service-pod-7f8b9c
        userAgent:
          type:
            - string
            - 'null'
          description: Last seen `User-Agent` header value from this node
          example: epistola-contract/x.y.z valtimo-epistola-plugin/1.2.0
        partitions:
          type: array
          items:
            type: integer
          description: |
            Partition numbers currently assigned to this node for generation
            result collection. Empty if the node has not polled the collect
            endpoint or has no assigned partitions.
          example:
            - 0
            - 1
            - 2
            - 3
        lastSeenAt:
          type: string
          format: date-time
          description: When the server last received a request from this node
          example: '2026-04-22T14:30:00Z'
    ConsumerPermissions:
      type: object
      description: |
        Resource-level permissions for a consumer. Each resource type has its own
        access levels. Higher levels imply lower levels (e.g., `write` implies `read`).
        All default to `none`.

        The generation result collection endpoint (`POST /generation/collect`) is
        accessible to consumers with `generation: read` or higher. No separate
        permission is needed.

        For OAuth consumers, requested permissions are derived from JWT scopes
        using the pattern `epistola:{resource}:{level}` (e.g., `epistola:generation:write`,
        `epistola:catalogs:release`, `epistola:environments:deploy`).
      properties:
        templates:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: |
            read = list/get templates, their variants' content and data contracts.
            write = create/update/delete templates, edit their content in drafts, mark ready + read.
        variants:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get variants, write = create/update/delete + read
        themes:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get themes, write = create/update/delete + read
        environments:
          type: string
          enum:
            - none
            - read
            - write
            - deploy
          default: none
          description: |
            read = list/get environments, what they serve and their deployment history.
            write = create/update/delete environments + read.
            deploy = deploy and undeploy releases of catalogs (drafts and released ones) + write.
        stencils:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: read = list/get stencils and their usage, write = create/update, edit their content in drafts, mark ready + read
        catalogs:
          type: string
          enum:
            - none
            - read
            - write
            - release
          default: none
          description: |
            read = list catalogs, their releases and a draft's changes.
            write = import catalogs + read.
            release = cut catalog releases + write.
        generation:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: |
            read = view jobs, documents, and collect generation results
            via POST /generation/collect.
            write = submit jobs/preview + read.
        consumers:
          type: string
          enum:
            - none
            - read
            - manage
          default: none
          description: |
            Consumer management within this tenant.
            read = list/view consumers.
            manage = approve/reject/update/delete consumers + read.
    RegisterConsumerRequest:
      type: object
      description: |
        Self-service registration for consumers using self-signed JWT authentication.
        The consumer declares what permissions it needs. A tenant manager will
        review and grant equal or fewer permissions on approval.
      required:
        - id
        - name
        - publicKey
        - requestedPermissions
      properties:
        id:
          $ref: '#/components/schemas/ConsumerId'
          description: |
            Self-chosen unique slug identifier for the consumer within this tenant.
            Used as the `iss` claim in self-signed JWTs.
          example: invoice-service
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name of the consuming application
          example: Invoice Service
        description:
          type: string
          maxLength: 1000
          description: What this application does and why it uses Epistola
          example: Generates PDF invoices for the billing pipeline
        contact:
          type: string
          maxLength: 255
          description: Team or individual responsible for this application
          example: billing-team@acme-corp.com
        publicKey:
          type: string
          maxLength: 8192
          description: |
            PEM-encoded public key (RSA 2048+ or Ed25519). The corresponding
            private key is used to sign short-lived JWTs for authentication.
          example: |-
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
        requestedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
    ApproveConsumerRequest:
      type: object
      description: |
        Tenant manager approval of a pending consumer. The manager reviews the
        requested permissions and grants equal or fewer. The consumer transitions
        from `pending` to `active`.
      required:
        - grantedPermissions
      properties:
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the approval expires. Null means no expiry.
          example: '2027-04-22T00:00:00Z'
    RejectConsumerRequest:
      type: object
      description: Tenant manager rejection of a pending consumer registration.
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Why the consumer was rejected
          example: Unknown application — contact the platform team for onboarding
    UpdateConsumerRequest:
      type: object
      description: |
        Update consumer metadata or permissions within this tenant.
        All fields are optional, and an omitted or null member keeps its current value: generated
        servers and clients cannot tell an omitted member from a null one, so null never means
        "remove". An empty string removes `description` or `contact`; `clearExpiresAt` removes the
        expiry.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated name
        description:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: |
            Updated description. Omitted or null keeps it; an empty string (or one of only whitespace)
            removes it.
        contact:
          type:
            - string
            - 'null'
          maxLength: 255
          description: |
            Updated contact. Omitted or null keeps it; an empty string (or one of only whitespace)
            removes it.
        status:
          type: string
          enum:
            - active
            - inactive
          description: |
            Set to `inactive` to deactivate, `active` to reactivate.
            Cannot change other statuses (use approve/reject instead).
        grantedPermissions:
          $ref: '#/components/schemas/ConsumerPermissions'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Updated expiry. Omitted or null keeps it; `clearExpiresAt` removes it.
        clearExpiresAt:
          type:
            - boolean
            - 'null'
          description: |
            True removes the consumer's expiry, so that it never expires. Omitted, null or false keeps
            it. True together with an `expiresAt` is refused with 400.
          example: true
    RotatePublicKeyRequest:
      type: object
      description: |
        Rotate the public key for a self-signed JWT consumer.
        Must authenticate with a valid JWT signed by the current key.
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          maxLength: 8192
          description: New PEM-encoded public key (RSA 2048+ or Ed25519)
          example: |-
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
    ConsumerListResponse:
      description: Paginated list of consumers within a tenant
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerDto'
        page:
          $ref: '#/components/schemas/PageMeta'
    TenantDto:
      type: object
      description: Represents a tenant in the system
      required:
        - key
        - name
        - createdAt
      properties:
        key:
          $ref: '#/components/schemas/TenantKey'
          description: |
            Unique key of the tenant (e.g., "acme-corp")
          example: acme-corp
        name:
          type: string
          description: Name of the tenant
          example: Acme Corporation
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the tenant was created
          example: '2026-01-15T09:00:00Z'
      example:
        key: acme-corp
        name: Acme Corporation
        createdAt: '2026-01-15T09:00:00Z'
    CreateTenantRequest:
      type: object
      description: Request body for creating a new tenant
      required:
        - key
        - name
      properties:
        key:
          $ref: '#/components/schemas/TenantKey'
          description: |
            Client-chosen unique key for the tenant, by the `TenantKey` rule.
            Reserved words (admin, api, www, system, internal, null, undefined) are not allowed.
          example: acme-corp
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the tenant to create
          example: Acme Corporation
    UpdateTenantRequest:
      type: object
      description: Request body for updating a tenant
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name for the tenant
          example: Acme Corporation Ltd.
    TenantListResponse:
      description: Paginated list of tenants
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          description: List of tenants on this page
          items:
            $ref: '#/components/schemas/TenantDto'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        items:
          - key: acme-corp
            name: Acme Corporation
            createdAt: '2026-01-15T09:00:00Z'
        page:
          number: 0
          size: 20
          total: 1
          totalPages: 1
    ThemeDto:
      type: object
      description: A theme defines reusable styling that can be applied across multiple templates
      required:
        - key
        - tenantKey
        - name
        - documentStyles
        - createdAt
        - lastModified
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: |
            Key of the theme (e.g., "corporate")
          example: corporate
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          description: Key of the tenant this theme belongs to
          example: acme-corp
        name:
          type: string
          description: Name of the theme
          example: Corporate Theme
        description:
          type: string
          description: Optional description of the theme
          example: Default corporate branding with Acme colors and fonts
        documentStyles:
          $ref: '#/components/schemas/DocumentStyles'
        pageSettings:
          $ref: '#/components/schemas/PageSettings'
        blockStylePresets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BlockStylePreset'
          description: |
            Named block style presets (like CSS classes). Key is the preset name, which the catalog's
            declared presets name (`CatalogReleaseDto.presets`). Absent when the theme styles none (as after an update
            sends null).
          example:
            heading:
              label: Heading
              styles:
                fontSize: 18pt
                fontWeight: bold
              applicableTo:
                - text
            caption:
              label: Caption
              styles:
                fontSize: 9pt
                color: '#666666'
        defaultBlockStyles:
          $ref: '#/components/schemas/DefaultBlockStyles'
          description: |
            The theme's baseline block spacing: the margin a flow block gets when nothing more specific
            sets one. Margin keys only. Absent when the theme sets none; the renderer then uses its own
            fallback.
          example:
            marginBottom: 6pt
        spacingUnit:
          type: number
          minimum: 1
          maximum: 16
          description: |
            Base spacing unit in points for the spacing scale system. All sp values
            are multiples of this value (e.g., with spacingUnit=4, 2sp resolves
            to 8pt). Absent when the theme sets none (as after an update sends null); the
            rendering default (4pt) then applies.
          example: 4
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the theme was created
          example: '2026-01-17T11:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the theme was last modified
          example: '2026-01-18T14:30:00Z'
      example:
        key: corporate
        tenantKey: acme-corp
        name: Corporate Theme
        description: Default corporate branding with Acme colors and fonts
        documentStyles:
          fontFamily: Helvetica
          fontSize: 12pt
          fontWeight: normal
          color: '#333333'
          lineHeight: '1.5'
          letterSpacing: 0.5pt
          textAlign: left
        pageSettings:
          format: A4
          orientation: portrait
          margins:
            top: 20
            right: 20
            bottom: 20
            left: 20
        blockStylePresets:
          heading:
            label: Heading
            styles:
              fontSize: 18pt
              fontWeight: bold
              marginBottom: 4sp
            applicableTo:
              - text
          caption:
            label: Caption
            styles:
              fontSize: 9pt
              color: '#666666'
        spacingUnit: 4
        createdAt: '2026-01-17T11:00:00Z'
        lastModified: '2026-01-18T14:30:00Z'
    DocumentStyles:
      type: object
      description: Document-level style overrides. Open object — the style-registry drives available properties.
    PageSettings:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/PageFormat'
          default: A4
        orientation:
          $ref: '#/components/schemas/Orientation'
          default: portrait
        margins:
          $ref: '#/components/schemas/Margins'
        backgroundColor:
          type: string
          description: Page background color (CSS color value).
      additionalProperties: false
    Margins:
      type: object
      description: Page margins in millimeters.
      properties:
        top:
          type: integer
          minimum: 0
          description: Top margin in mm.
        right:
          type: integer
          minimum: 0
          description: Right margin in mm.
        bottom:
          type: integer
          minimum: 0
          description: Bottom margin in mm.
        left:
          type: integer
          minimum: 0
          description: Left margin in mm.
      additionalProperties: false
    CreateThemeRequest:
      type: object
      description: Request body for creating a new theme
      required:
        - key
        - name
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: Client-chosen key for the theme
          example: corporate
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the theme
          example: Corporate Theme
        description:
          type: string
          description: Optional description of the theme
          example: Default corporate branding with Acme colors and fonts
        documentStyles:
          $ref: '#/components/schemas/DocumentStyles'
        pageSettings:
          $ref: '#/components/schemas/PageSettings'
        blockStylePresets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BlockStylePreset'
          description: Named block style presets. Key is the preset name.
          example:
            heading:
              label: Heading
              styles:
                fontSize: 18pt
                fontWeight: bold
        defaultBlockStyles:
          $ref: '#/components/schemas/DefaultBlockStyles'
          description: The theme's baseline block spacing, margin keys only. Omitted for none.
        spacingUnit:
          type: number
          minimum: 1
          maximum: 16
          description: Base spacing unit in points. Omitted, the theme sets none and the rendering default (4pt) applies.
          example: 4
    UpdateThemeRequest:
      type: object
      description: |
        Request body for updating a theme (partial update). An omitted or null member keeps its
        current value: generated servers and clients cannot tell an omitted member from a null one, so
        null never means "remove".
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name for the theme
          example: Corporate Theme v2
        description:
          type:
            - string
            - 'null'
          description: |
            New description for the theme. Omitted or null keeps it; an empty string (or one of only
            whitespace) removes it.
          example: Updated corporate branding for 2026
        documentStyles:
          $ref: '#/components/schemas/DocumentStyles'
        pageSettings:
          $ref: '#/components/schemas/PageSettings'
        blockStylePresets:
          type:
            - object
            - 'null'
          additionalProperties:
            $ref: '#/components/schemas/BlockStylePreset'
          description: |
            Named block style presets, replacing the current ones as a whole. Key is the preset name.
            Omitted or null keeps them; an empty object removes every preset.
        defaultBlockStyles:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            The theme's baseline block spacing, margin keys only, replacing the current one as a whole.
            Omitted or null keeps it; an empty object removes it.
        spacingUnit:
          type:
            - number
            - 'null'
