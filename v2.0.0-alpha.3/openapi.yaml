    get:
      operationId: listEnvironmentDeployments
      summary: List what an environment serves
      description: |
        Every release of a catalog the environment serves: released ones, several of one catalog
        possibly, and at most one draft per catalog. Generation naming the environment renders the catalog's
        deployed draft when the request names no `versionRange`, and otherwise the highest served
        release (that satisfies `versionRange`); see `deployCatalogRelease`.
      tags:
        - Environments
      x-required-permissions:
        - TEMPLATE_VIEW
      responses:
        '200':
          description: The environment's deployments
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
