    StencilContentDto:
      type: object
      description: |
        A stencil's content in one release: the TemplateDocument fragment that every instance
        of the stencil renders (instances refer to it rather than copy it), its parameters, and how it stands
        against that release's base.
      required:
        - stencilKey
        - content
        - status
        - lastModified
      properties:
        stencilKey:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the stencil
          example: corporate-header
        content:
          $ref: '#/components/schemas/TemplateDocument'
        parameterSchema:
          type:
            - object
            - 'null'
          description: Typed input parameters of the stencil, as a JSON Schema object
        status:
          $ref: '#/components/schemas/ResourceStatus'
        lastModified:
          type: string
          format: date-time
          description: When the content was last edited
          example: '2026-03-15T14:30:00Z'
        readyAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current content was marked ready; null unless the status is `ready`
          example: null
    UpdateStencilContentRequest:
      type: object
      description: |
        The stencil's new content, replacing its content in the draft. An edit clears the ready mark.
      properties:
        content:
          $ref: '#/components/schemas/TemplateDocument'
        parameterSchema:
          type:
            - object
            - 'null'
          description: |
            Optional typed input parameters for the stencil, as a JSON Schema
            object (`{ "type": "object", "properties": {...}, "required": [...] }`). Property
            types are limited to string / number / integer / boolean (optionally
            `format: date`/`date-time`) or arrays of those primitives.

            Omitted or null, the stencil keeps the parameter schema it has, so a client that only
            changes the content cannot drop the parameters the templates using it bind. A schema
            replaces it whole. A schema that declares no parameters (`{}`, or an object schema
            without properties) removes it: the stencil then has no parameters, and reports none.
          example:
            type: object
            properties:
              recipientName:
                type: string
            required:
              - recipientName
    MarkStencilReadyResponse:
      type: object
      description: |
        The stencil, now ready, and the instances of it that do not fit its content.

        Marking a stencil ready records that its content is reviewed, and nothing else: every instance
        refers to the stencil, so it already renders the stencil as it is. An instance the content breaks (it fills a
        placeholder the stencil no longer has, or leaves a required parameter unbound) is listed in
        `notFitting`, and the catalog release refuses until its template variant is edited.
      required:
        - stencil
        - notFitting
      properties:
        stencil:
          $ref: '#/components/schemas/StencilContentDto'
        notFitting:
          type: array
          description: The instances that do not fit the stencil's content; empty when every one fits
          items:
            $ref: '#/components/schemas/StencilUsageDto'
    Node:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/NodeId'
        type:
          type: string
          minLength: 1
          description: 'The component type, one of the component registry''s types (contracts/catalog/registry/component-registry.json): text, container, columns, table, conditional, loop, stencil, image and so on. It decides which slots, props and styles the node may have.'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotId'
          description: 'The ids of the slots this node owns, in order. Their names follow the component''s slot rules: children for a container, body and else for a conditional, cell-<row>-<col> for a table.'
        styles:
          type: object
          description: 'Style properties for this node only, CSS-like key and value pairs from the catalog''s style registry (contracts/catalog/registry/style-registry.json): marginBottom, fontSize, backgroundColor. They override what the theme and preset supply. Lengths are pt or sp (spacing units of the theme), and some also take %.'
        stylePreset:
          type: string
          description: 'Names one of the catalog''s available block style presets: the presets its manifest declares (catalog.presets) plus those of the catalogs it depends on. The rendering theme''s blockStylePresets supplies the styles; a theme that does not style it leaves the block with its own styles only. While a catalog declares no presets, the presets its themes style stand in for the list.'
        props:
          type: object
          description: 'The component''s own properties, as its registry entry declares them: a text node''s content (a rich-text document whose expression nodes insert JSONata values from the data), a conditional''s condition, a table''s rows and columns, a stencil instance''s stencilKey and parameterBindings.'
      required:
        - id
        - type
        - slots
      additionalProperties: false
    Slot:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SlotId'
        nodeId:
          $ref: '#/components/schemas/NodeId'
          description: Parent node that owns this slot.
        name:
          type: string
          minLength: 1
          description: 'The slot''s name, as the owning component defines its slots: children, column-0, cell-0-1, body, else, fill.'
        children:
          type: array
          items:
            $ref: '#/components/schemas/NodeId'
          description: Ordered child node IDs in this slot.
      required:
        - id
        - nodeId
        - name
        - children
      additionalProperties: false
    ThemeRef:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - inherit
            - override
        themeKey:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: 'Key of the theme resource: the same rule as every resource key.'
        catalogKey:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          minLength: 3
          maxLength: 50
          description: 'The alias of the catalog containing the theme, as the owning catalog''s dependency list (catalogDependencies) declares it: the catalog key rule. Omitted, or the owning catalog''s own key, means the same catalog as the owning template.'
      additionalProperties: false
      allOf:
        - if:
            properties:
              type:
                const: inherit
            required:
              - type
          then:
            not:
              anyOf:
                - required:
                    - themeKey
                - required:
                    - catalogKey
        - if:
            properties:
              type:
                const: override
            required:
              - type
          then:
            required:
              - themeKey
    BlockStylePreset:
      type: object
      properties:
        label:
          type: string
          description: Human-readable label for the preset.
        styles:
          type: object
          description: CSS-like style properties for this preset.
        applicableTo:
          type: array
          items:
            type: string
          description: Node types this preset can be applied to. Empty or absent means all types.
      required:
        - label
        - styles
      additionalProperties: false
    PreviewDocumentRequest:
      type: object
      description: |
        Request to preview a single document synchronously. Returns the PDF directly.

        **Important**: This endpoint is for preview purposes only.
        - The output is **not PDF/A compliant**
        - The endpoint is **rate-limited** — do not use for production document generation
        - There are **no guarantees on latency or throughput**
        - Generated documents are **not stored** — use the async generation endpoint for production use

        Specify either variantKey (explicit) or attributes (auto-select) but not both.
      required:
        - namespace
        - catalogKey
        - templateKey
        - data
      properties:
        registry:
          oneOf:
            - $ref: '#/components/schemas/Registry'
            - type: 'null'
          description: |
            Registry of the catalog containing the template: the exchange or domain its namespace lives
            in. Omitted or null: the default registry, which the server configures. A response always
            names it in full.
          example: null
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog containing the template, within its registry
          example: acme-corp
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog containing the template, unique within its registry and namespace
          example: letters
        templateKey:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the template to use for preview
          example: invoice
        variantKey:
          oneOf:
            - $ref: '#/components/schemas/ResourceKey'
            - type: 'null'
          description: Key of the variant to use (mutually exclusive with attributes)
          example: english
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/VariantSelectionAttribute'
          description: Attribute criteria for auto-selecting a variant (mutually exclusive with variantKey)
        versionRange:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          description: |
            Which release of the template's catalog to render, as a version range (see "Version
            ranges" in the API description); the highest release that satisfies it is rendered.
            With `environmentKey`, only the releases that environment serves are considered (see
            "Deploying"); a draft deployed there never matches a range. Omitted: the highest release,
            or with `environmentKey` the catalog's draft deployed to that environment if there is one,
            else the highest release it serves.
          example: null
        environmentKey:
          oneOf:
            - $ref: '#/components/schemas/EnvironmentKey'
            - type: 'null'
          description: |
            Key of an environment. With no `versionRange`, the catalog's draft deployed to the
            environment is rendered live if there is one (the document then carries `releaseId` and
            `draftLabel`), else the highest release of the template's catalog the environment serves.
            With a `versionRange`, the highest served release that satisfies it; a draft never matches
            a range (`deployCatalogRelease`). The request is refused with 404 `not-found` when the
            environment serves no such release.
          example: null
        draft:
          oneOf:
            - $ref: '#/components/schemas/CatalogReleaseId'
            - type: 'null'
          description: |
            Render a draft of the template's catalog, including changes not yet released, by its
            `releaseId` (a `CatalogReleaseId`; mutually exclusive with versionRange and environmentKey). A
            version range never matches a draft; a generated document renders one only through an
            environment it is deployed to (`deployCatalogRelease`).
          example: null
        data:
          type: object
          description: JSON data to populate the template
          example:
            customer:
              name: Jane Smith
              email: jane.smith@example.com
              taxId: US123456789
              address:
                street: 123 Main Street
                city: Springfield
                postalCode: '62704'
                country: US
            invoiceNumber: INV-2026-001
            issueDate: '2026-02-01'
            dueDate: '2026-03-01'
            lineItems:
              - description: Consulting Services (40h)
                quantity: 40
                unitPrice: 150
                taxRate: 21
              - description: Software License - Enterprise
                quantity: 1
                unitPrice: 2500
                taxRate: 21
              - description: Travel Expenses
                quantity: 1
                unitPrice: 384.5
                taxRate: 0
            notes: Payment due within 30 days. Please reference invoice number on transfer.
            currency: EUR
