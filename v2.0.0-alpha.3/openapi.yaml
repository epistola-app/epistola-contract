  /tenants/{tenantKey}/environments/{environmentKey}/deployments/{registry}/{namespace}/{catalogKey}/{release}:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant
        schema:
          $ref: '#/components/schemas/TenantKey'
      - name: environmentKey
        in: path
        required: true
        description: Key of the environment
        schema:
          $ref: '#/components/schemas/EnvironmentKey'
      - $ref: '#/components/parameters/Registry'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/CatalogKey'
      - $ref: '#/components/parameters/Release'
    put:
      operationId: deployCatalogRelease
      summary: Deploy a release of a catalog, released or a draft, to an environment
      description: |
        The environment serves this release of the catalog from now on: a **released** one, by its
        version or its `releaseId`, beside any other releases of it the environment already serves
        (unless `replace=true`, below); or a **draft**, by its `releaseId`, rendered live with no
        version.

        A generation or preview request through the environment (`environmentKey`) renders:

        - when it names **no `versionRange`**: the catalog's deployed draft if there is one, else the
          highest release the environment serves;
        - when it names a **range or an exact version**: the highest served release that satisfies
          it. A draft never matches a range or a version, as it has no version, so a breaking draft
          based on `1.2.0` is never served to `^1.2.0`. A patch release matches as a SemVer
          pre-release does (see "Versions and version ranges").

        So deploying a higher release moves such requests to it, and undeploying it moves them back:
        rollback is undeploying the newer release, and holding one back is not deploying it. Requests
        already accepted keep the release they were bound to. Deploying a release the environment
        already serves changes nothing, apart from what `replace=true` stops.

        **A draft.** An environment serves at most one draft of a catalog: deploying a draft replaces
        the one it served, which is logged as undeployed. A **production** environment serves only
        releases, never a draft: deploying a draft there is refused with 409 (`environment-deployment-refused`). A
        document rendered from a draft carries the draft's id and its name at render time
        (`releaseId`, `draftLabel`, with a null `version`), and its PDF a preview watermark.
        The deployment follows the draft's lifecycle:

        - when the draft is released (`releaseCatalogDraft`), it keeps its `releaseId`, so the
          deployment stays, as an explicit deployment of the release, logged as `released`;
        - when the draft is discarded (`deleteCatalogRelease`), the deployment ends, logged as
          `undeployed`.

        **Dependencies.** A release renders with the releases of other catalogs it was cut with (its
        `dependencies`, direct and through other dependencies), from the tenant's copy whatever the
        environment serves; so does a draft with the releases its declarations pin. Deploying it makes
        the environment use them implicitly: they are not deployed, and nothing else the environment
        serves changes. A declaration in a draft that names a draft of another catalog renders that
        draft live. A dependency release the tenant does not have yet is installed first: fetched
        from its registry, through the registry's configured mirrors, and checked against the
        fingerprint it was recorded with. When one cannot be had (`unavailable`), the deployment is
        refused with `release-dependencies-missing` (409), whose `missingDependencies` lists those.
        Nothing is deployed.

        With `includeDependencies=true`, the dependency releases the environment does not serve are
        also deployed explicitly, in the same transaction, all or nothing. Drafts a declaration names
        are never deployed along.

        With `replace=true`, the environment also stops serving the catalog's other releases, its
        deployed draft included, in the same transaction: each is undeployed, and logged as undeployed
        in the deployment history, just as `undeployCatalogRelease` would. Without it, a release is
        added beside the others.
      tags:
        - Environments
      x-required-permissions:
        - ENVIRONMENT_DEPLOY
      parameters:
        - name: includeDependencies
          in: query
          required: false
          description: |
            Also deploy, explicitly, the dependency releases the environment does not serve (never a
            draft a declaration names). When false or omitted, the environment uses them implicitly,
            without deploying them.
          schema:
            type: boolean
            default: false
        - name: replace
          in: query
          required: false
          description: |
            Also stop serving the catalog's other releases in this environment, its deployed draft
            included, each undeployed (and logged as undeployed). When false or omitted, a release is
            added beside the others the environment serves.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The deployment
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/DeploymentDto'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/EnvironmentDeploymentConflictError'
    delete:
      operationId: undeployCatalogRelease
      summary: Stop an environment serving a release of a catalog
      description: |
        Removes an explicit deployment: the environment stops serving this release, released or a
        draft, addressed by its version or its `releaseId`. Generation naming the environment then
        renders the highest release of the catalog it still serves, and fails for the catalog's
        templates when it serves none.

        It is never refused because another release the environment serves renders with this one.
        That release is pinned to it and renders it from the tenant's copy, so it keeps rendering it:
        the release stays in use implicitly. Only the environment no longer serves this catalog's own
        templates through it.

        A release the environment uses only implicitly, as a dependency of a release it serves, is not
        deployed and cannot be undeployed: 404, as for a release the environment does not use at all.
      tags:
        - Environments
      x-required-permissions:
        - ENVIRONMENT_DEPLOY
      responses:
        '204':
          description: The environment no longer serves the release
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
