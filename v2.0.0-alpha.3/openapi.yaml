          totalPages: 1
    VariantContentDto:
      type: object
      description: |
        A variant's content in one release, and how it stands against that release's base.
      required:
        - variantKey
        - templateModel
        - status
        - lastModified
      properties:
        variantKey:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the variant
          example: english
        templateModel:
          $ref: '#/components/schemas/TemplateDocument'
        status:
          $ref: '#/components/schemas/ResourceStatus'
        lastModified:
          type: string
          format: date-time
          description: When the content was last edited
          example: '2026-01-28T11:30:00Z'
        readyAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current content was marked ready; null unless the status is `ready`
          example: null
    UpdateVariantContentRequest:
      type: object
      description: |
        The variant's new template model, replacing its content in the draft. The model is a flat graph
        of nodes and slots; the
        [template model guide](https://github.com/epistola-app/epistola-contract/blob/main/contracts/api/docs/template-model.md)
        explains it with this example, a letter with a heading, an expression, a conditional with an
        `else` branch, a table and a stencil instance.
      required:
        - templateModel
      properties:
        templateModel:
          $ref: '#/components/schemas/TemplateDocument'
      example:
        templateModel:
          modelVersion: 1
          root: root
          nodes:
            root:
              id: root
              type: root
              slots:
                - root-children
            heading:
              id: heading
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: heading
                      attrs:
                        level: 1
                      content:
                        - type: text
                          text: Order confirmation
            greeting:
              id: greeting
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: 'Dear '
                        - type: expression
                          attrs:
                            expression: customer.name
                        - type: text
                          text: ', thank you for your order '
                        - type: expression
                          attrs:
                            expression: order.number
                        - type: text
                          text: .
            paid-check:
              id: paid-check
              type: conditional
              slots:
                - paid-check-body
                - paid-check-else
              props:
                condition:
                  raw: order.paid
                  language: jsonata
                inverse: false
            paid-text:
              id: paid-text
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: We have received your payment.
            unpaid-text:
              id: unpaid-text
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: 'Please pay '
                        - type: expression
                          attrs:
                            expression: $formatNumber(order.total, '#,##0.00')
                        - type: text
                          text: ' within 14 days.'
            order-table:
              id: order-table
              type: table
              slots:
                - order-table-cell-0-0
                - order-table-cell-0-1
                - order-table-cell-1-0
                - order-table-cell-1-1
              styles:
                marginBottom: 6pt
              props:
                rows: 2
                columns: 2
                columnWidths:
                  - 70
                  - 30
                headerRows: 1
                merges: []
                cellStyles:
                  0-0:
                    backgroundColor: '#f1f5f9'
                  0-1:
                    backgroundColor: '#f1f5f9'
            cell-item-h:
              id: cell-item-h
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: Item
            cell-amount-h:
              id: cell-amount-h
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: Amount
            cell-item:
              id: cell-item
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: expression
                          attrs:
                            expression: order.item
            cell-amount:
              id: cell-amount
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: expression
                          attrs:
                            expression: $formatNumber(order.total, '#,##0.00')
            signature:
              id: signature
              type: stencil
              slots:
                - signature-children
              props:
                stencilKey: signature-block
                parameterBindings:
                  signerName: sender.name
            signature-closing:
              id: signature-closing
              type: placeholder
              slots:
                - signature-closing-fill
              props:
                name: closing
            closing-text:
              id: closing-text
              type: text
              slots: []
              props:
                content:
                  type: doc
                  content:
                    - type: paragraph
                      content:
                        - type: text
                          text: Kind regards,
          slots:
            root-children:
              id: root-children
              nodeId: root
              name: children
              children:
                - heading
                - greeting
                - paid-check
                - order-table
                - signature
            paid-check-body:
              id: paid-check-body
              nodeId: paid-check
              name: body
              children:
                - paid-text
            paid-check-else:
              id: paid-check-else
              nodeId: paid-check
              name: else
              children:
                - unpaid-text
            order-table-cell-0-0:
              id: order-table-cell-0-0
              nodeId: order-table
              name: cell-0-0
              children:
                - cell-item-h
            order-table-cell-0-1:
              id: order-table-cell-0-1
              nodeId: order-table
              name: cell-0-1
              children:
                - cell-amount-h
            order-table-cell-1-0:
              id: order-table-cell-1-0
              nodeId: order-table
              name: cell-1-0
              children:
                - cell-item
            order-table-cell-1-1:
              id: order-table-cell-1-1
              nodeId: order-table
              name: cell-1-1
              children:
                - cell-amount
            signature-children:
              id: signature-children
              nodeId: signature
              name: children
              children:
                - signature-closing
            signature-closing-fill:
              id: signature-closing-fill
              nodeId: signature-closing
              name: fill
              children:
                - closing-text
          themeRef:
            type: inherit
    ResourceStatus:
      type: string
      enum:
        - new
        - modified
        - ready
        - released
      description: |
        How a resource in a release of a catalog stands against the release's **base**: the released
        release it started from (see `CatalogReleaseDto.base`).

        - `new`: not in the base, and not marked ready.
        - `modified`: changed since the base, and not marked ready since.
        - `ready`: changed since the base (or new), and marked ready since its last edit.
        - `released`: the same as in the base. Every resource of a released one has this status.

        Releasing a draft is refused while any resource is `new` or `modified`; a release contains the
        whole draft, so marking ready is a review checkpoint, not a filter.
      example: ready
    StencilDto:
      type: object
      description: |
        Full stencil with all details.
        A stencil is a reusable template component that can be inserted into any template. Its content
        is edited in a draft of its catalog and marked ready. A template holds an instance of it by
        reference, not a copy, and renders the stencil's content as it is in the same release
        (or, for a stencil in another catalog, in the release that dependency pins), whatever its
        status: marking it ready is a review checkpoint, not what makes templates use it.
      required:
        - key
        - tenantKey
        - name
        - status
        - createdAt
        - lastModified
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: |
            Key of the stencil (e.g., "corporate-header")
          example: corporate-header
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          description: Key of the tenant this stencil belongs to
          example: acme-corp
        name:
          type: string
          description: Display name of the stencil
          example: Corporate Header
        description:
          type:
            - string
            - 'null'
          description: Optional description of what this stencil provides
          example: Standard corporate header with logo, company name, and address block
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization and search
          example:
            - header
            - corporate
        status:
          $ref: '#/components/schemas/ResourceStatus'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stencil was created
          example: '2026-03-01T10:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the stencil was last modified
          example: '2026-03-15T14:30:00Z'
      example:
        key: corporate-header
        tenantKey: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        status: ready
        createdAt: '2026-03-01T10:00:00Z'
        lastModified: '2026-03-15T14:30:00Z'
    StencilSummaryDto:
      type: object
      description: Summary view of a stencil for list displays
      required:
        - key
        - tenantKey
        - name
        - status
        - createdAt
        - lastModified
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: |
            Key of the stencil
          example: corporate-header
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          description: Key of the tenant this stencil belongs to
          example: acme-corp
        name:
          type: string
          description: Display name of the stencil
          example: Corporate Header
        description:
          type:
            - string
            - 'null'
          description: Optional description of what this stencil provides
          example: Standard corporate header with logo, company name, and address block
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization and search
          example:
            - header
            - corporate
        status:
          $ref: '#/components/schemas/ResourceStatus'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stencil was created
          example: '2026-03-01T10:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the stencil was last modified
          example: '2026-03-15T14:30:00Z'
      example:
        key: corporate-header
        tenantKey: acme-corp
        name: Corporate Header
        description: Standard corporate header with logo, company name, and address block
        tags:
          - header
          - corporate
        status: released
        createdAt: '2026-03-01T10:00:00Z'
        lastModified: '2026-03-15T14:30:00Z'
    CreateStencilRequest:
      type: object
      description: Request body for creating a new stencil
      required:
        - key
        - name
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: Client-chosen key for the stencil
          example: corporate-header
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Display name of the stencil
          example: Corporate Header
        description:
          type: string
          maxLength: 1000
          description: Optional description of what this stencil provides
          example: Standard corporate header with logo, company name, and address block
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          description: Tags for categorization and search
          example:
            - header
            - corporate
        content:
          $ref: '#/components/schemas/TemplateDocument'
        parameterSchema:
          type:
            - object
            - 'null'
          description: |
            Optional typed input parameters for the stencil's initial content, as a
            JSON Schema object (`{ "type": "object", "properties": {...}, "required": [...] }`).
            Property types are limited to string / number / integer / boolean (optionally
            `format: date`/`date-time`) or arrays of those primitives. Omit it, send null, or send
            a schema that declares no parameters (`{}`) to declare none.
          example:
            type: object
            properties:
              recipientName:
                type: string
            required:
              - recipientName
    UpdateStencilRequest:
      type: object
      description: Request body for updating a stencil's metadata (all fields optional)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New display name for the stencil
          example: Corporate Header (Updated)
        description:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: |
            Updated description. Omitted or null keeps it; an empty string (or one of only whitespace)
            removes it. Null cannot mean "remove": generated servers and clients cannot tell an omitted
            member from a null one.
          example: Updated corporate header with new branding
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          description: Updated tags (replaces existing tags)
          example:
            - header
            - corporate
            - branding
    StencilUsageDto:
      type: object
      description: |
        A template variant that uses the stencil, and whether its instance fits the stencil's content in
        this release. An instance refers to the stencil and renders the stencil as it is; one that does not fit
        (it fills a placeholder the stencil no longer has, or leaves a required parameter unbound) blocks
        the catalog release until its template variant is edited.
      required:
        - templateKey
        - templateName
        - variantKey
        - fits
        - problems
      properties:
        templateKey:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the template using this stencil
          example: monthly-invoice
        templateName:
          type: string
          description: Display name of the template
          example: Monthly Invoice
        variantKey:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the variant
          example: english
        fits:
          type: boolean
          description: True when the instance fits the stencil's content; false blocks the release
          example: true
        problems:
          type: array
          description: Why the instance does not fit; empty when it fits
          items:
            type: string
          example: []
      example:
        templateKey: monthly-invoice
        templateName: Monthly Invoice
        variantKey: english
        fits: true
        problems: []
    StencilListResponse:
      description: List of stencils
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          description: List of stencil summaries
          items:
            $ref: '#/components/schemas/StencilSummaryDto'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        items:
          - key: corporate-header
            tenantKey: acme-corp
            name: Corporate Header
            description: Standard corporate header with logo, company name, and address block
            tags:
              - header
              - corporate
            status: released
            createdAt: '2026-03-01T10:00:00Z'
            lastModified: '2026-03-15T14:30:00Z'
        page:
          number: 0
          size: 20
          total: 1
