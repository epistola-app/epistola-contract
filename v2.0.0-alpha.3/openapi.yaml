        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/ReleaseRegistryNotFoundError'
        '409':
          $ref: '#/components/responses/ReleaseDependenciesMissingError'
        '502':
          $ref: '#/components/responses/CatalogSourceBadGatewayError'
        '503':
          $ref: '#/components/responses/CatalogSourceUnavailableError'
  /tenants/{tenantKey}/catalogs/import:
    parameters:
      - name: tenantKey
        in: path
        required: true
        description: Unique key of the tenant (e.g., "acme-corp")
        schema:
          $ref: '#/components/schemas/TenantKey'
    post:
      operationId: importCatalog
      summary: Install the release a catalog archive carries
      description: |
        Install the release a self-contained catalog ZIP archive carries. The ZIP must contain a
        `catalog.json` manifest and resource detail files matching the catalog exchange protocol.

        An import never changes a draft's own changes. It installs **the archive's release**, at its number
        (`release.version`), as an immutable release of the catalog the archive names (registry +
        namespace + key), side by side with the releases of that catalog the tenant already has, the
        same way installing from an exchange does: releases are immutable and live side by side, and
        deploying chooses which one is used. Nothing is merged, and no resource is updated in place.
        A server may move a draft with no changes of its own along to the new release (a fast-forward,
        as Epistola Suite does for the draft it calls the next version); a draft with changes of its
        own is left as it is, behind the release, and can merge it (`mergeIntoCatalogDraft`, alpha).

        - **A release the tenant does not have** is installed. The catalog's other releases, and every
          draft, deployment and catalog that uses them, are left as they are; which release an
          environment serves is decided by deploying it (`deployCatalogRelease`).
        - **The same number with the same fingerprint** is the release the tenant already has: nothing
          changes, and the response says it was already present (`newlyInstalled: false`).
        - **The same number with a different fingerprint** is different content under one name: the
          import is refused with 409 `release-number-taken`, and nothing changes. So is a release
          whose id (`release.releaseId`) another release or a draft of the catalog has here: one
          number and one id name one release.
        - **A catalog under the same key in another registry or namespace** is another catalog: the
          import is refused with 409 `conflict`, and nothing changes.
        - **A new catalog** is created by the import, holding that release: a catalog received from
          elsewhere, like any other. There are no catalog types. Whether it can be changed here
          depends on the installation (`CatalogDto.editable`); where it can, an author starts a draft
          from the release (`createCatalogRelease` with `from`).
        - **A catalog the tenant has** gets the release beside its others, whether its releases were
          made here or received. That is how a catalog's releases move from one installation to
          another (test, acceptance, production) as a file, the same release, with the same number
          and fingerprint, everywhere.

        An import works whether or not the catalog can be changed in this installation: receiving a
        release is not changing the catalog. The release keeps the id the archive carries
        (`release.releaseId`, catalog wire v8) and its producer `metadata`, so it is the same release
        in every installation; an archive that carries no id gets one when it is installed.

        The fingerprint compared is the release's `release.fingerprint`, or the fingerprint of its
        content when the archive records none. Every catalog wire version requires `release.version`,
        so an archive without a release is not a valid archive: it is refused with 400
        `bad-request`, as any archive that fails validation is. A release whose `release.metadata`
        names rendering defaults this installation does not have, newer or unknown, is refused with
        400 `catalog-rendering-defaults-too-new` before anything is written: rendering it with other
        defaults would change its documents, so Epistola must be upgraded to receive it. Installing is
        all or nothing: when a resource cannot be installed, nothing is.

        The archive may also carry the releases its catalog pins (`catalogDependencies`), each an
        ordinary catalog archive at `dependencies/{registry}/{namespace}/{catalogKey}/{version}.zip`,
        found from the pin alone: every release reachable through the pins, a dependency's own pins
        included, once, in the outer archive, and none in the archives it carries. An
        embedded release must match its pin's `releaseFingerprint` and name that catalog and number,
        or the archive is refused with 400 `bad-request`, as is a file under `dependencies/` that no
        pin reaches. The embedded releases this tenant lacks are installed first, each before every
        release that pins it, each in a catalog the import creates when the tenant does not have it
        (`installedDependencies`); those it has already, with the same fingerprint, are left alone
        (`presentDependencies`). Each is installed side by side with the releases of that catalog the
        tenant has, which are left as they are. A release the tenant has with the same number but a
        different fingerprint refuses the whole import with 409 `release-number-taken`, naming it,
        and nothing changes. A pin the archive does not carry is resolved from what the tenant has or the server
        can fetch from its registry, or from the mirrors of that registry the server is configured
        with; one that
        cannot be had, because its source could not be reached, answered with an error, or offered
        a copy that does not match its pin's `releaseFingerprint`, refuses the import with 409
        `release-dependencies-missing`, listing each (`unavailable`), as `installCatalogRelease`
        treats the releases a release pins. An import therefore never fails with
        `catalog-source-unavailable` (502/503): the archive's own release is never fetched. The
        archive's own release is then installed as above, all in one transaction.
      tags:
        - Catalogs
      x-required-permissions:
        - CATALOG_MANAGE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The catalog ZIP archive, possibly carrying the releases it pins
                registry:
                  type: string
                  pattern: ^(local|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)$
                  maxLength: 253
                  description: |
                    Registry of the catalog to install the release in. Omitted: the registry the
                    archive names. An archive from before catalog wire version 8 names none, and is
                    then refused with 400 `bad-request` unless the request names it: a catalog's
                    name must not change when its releases move between installations, so it is
                    never derived from the installation's host or default registry.
                namespace:
                  type: string
                  pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
                  minLength: 3
                  maxLength: 63
                  description: |
                    Namespace, within the registry, of the catalog to install the release in.
                    Omitted: the namespace the archive names. An archive from before catalog wire
                    version 8 names none, and is then refused with 400 `bad-request` unless the
                    request names it: a catalog's name must not change when its releases move
                    between installations, so it is never derived from the tenant's key.
      responses:
        '200':
          description: The release is installed, or was already present
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/ImportCatalogResponse'
        '400':
          $ref: '#/components/responses/CatalogImportBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ReleaseDependenciesMissingError'
  /tenants/{tenantKey}/documents/preview:
    post:
      operationId: previewDocument
      summary: Preview a document (synchronous)
      description: |
        Generate a preview PDF synchronously and return it directly in the response body.

        **This endpoint is for preview purposes only:**
        - The output is **not PDF/A compliant**
        - The endpoint is **rate-limited** — do not use for production document generation
        - There are **no guarantees on latency or throughput**
        - Generated documents are **not stored** — use the async generation endpoints for production use
      tags:
        - Generation
      x-required-permissions:
        - DOCUMENT_GENERATE
      parameters:
        - name: tenantKey
          in: path
          required: true
          description: Unique key of the tenant (e.g., "acme-corp")
          schema:
            $ref: '#/components/schemas/TenantKey'
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/PreviewDocumentRequest'
      responses:
        '200':
          description: Preview PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/TemplateDataInvalidError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
  /tenants/{tenantKey}/documents/generate:
    post:
      operationId: generateDocument
      summary: Generate a single document asynchronously
      description: |
        Submit a request to generate a single PDF document. Returns immediately with a job ID for
        tracking progress.

        The target is resolved when the request is accepted, and each item is bound to the release it
        renders (`version`, or `releaseId` for a deployed draft). Refused with 404
        `not-found`, and nothing is accepted, when the tenant, the catalog, the template, the named
        variant or the environment does not exist, when no variant matches the `attributes`, or when
        no release matches: no release satisfies `versionRange`, or the environment serves no
        release of the catalog that matches. The template data is not checked against the
        template's data contract here; it is checked when the item renders, and an item whose data
        breaks the contract fails (`failed`, with its `errorMessage`). Check it first with
        `validateTemplateData` to find out before submitting.
      tags:
        - Generation
      x-required-permissions:
        - DOCUMENT_GENERATE
      parameters:
        - name: tenantKey
          in: path
          required: true
          description: Unique key of the tenant (e.g., "acme-corp")
          schema:
            $ref: '#/components/schemas/TenantKey'
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/GenerateDocumentRequest'
      responses:
        '202':
          description: Generation request accepted
          headers:
            Location:
              $ref: '#/components/headers/Location'
              description: The job's address (`getGenerationJobStatus`), by its `requestId`
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/GenerationJobResponse'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
  /tenants/{tenantKey}/documents/generate/batch:
    post:
      operationId: generateDocumentBatch
      summary: Generate multiple documents in a batch
      description: |
        Submit a batch request to generate multiple PDF documents. Returns immediately with a job ID
        for tracking progress.

        The target is resolved when the request is accepted, and each item is bound to the release it
        renders (`version`, or `releaseId` for a deployed draft). Refused with 404
        `not-found`, and nothing is accepted, when the tenant, the catalog, the template, the named
        variant or the environment does not exist, when no variant matches the `attributes`, or when
        no release matches: no release satisfies `versionRange`, or the environment serves no
        release of the catalog that matches. The template data is not checked against the
        template's data contract here; it is checked when the item renders, and an item whose data
        breaks the contract fails (`failed`, with its `errorMessage`). Check it first with
        `validateTemplateData` to find out before submitting. A batch is
        accepted whole or not at all: an item that cannot be resolved refuses the batch.
      tags:
        - Generation
      x-required-permissions:
        - DOCUMENT_GENERATE
      parameters:
        - name: tenantKey
          in: path
          required: true
          description: Unique key of the tenant (e.g., "acme-corp")
          schema:
            $ref: '#/components/schemas/TenantKey'
      requestBody:
        required: true
        content:
          application/vnd.epistola.v2+json:
            schema:
              $ref: '#/components/schemas/GenerateBatchRequest'
      responses:
        '202':
          description: Batch generation request accepted
          headers:
            Location:
              $ref: '#/components/headers/Location'
              description: The job's address (`getGenerationJobStatus`), by its `requestId`
          content:
            application/vnd.epistola.v2+json:
              schema:
                $ref: '#/components/schemas/GenerationJobResponse'
        '400':
          $ref: '#/components/responses/ValidationFailedError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
  /tenants/{tenantKey}/documents/jobs:
    get:
