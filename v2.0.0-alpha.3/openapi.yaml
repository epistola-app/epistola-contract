        that is `new`, `modified` or `ready`, and the resources removed since the base (`changes`,
        each marked `mergedForReview` when it holds merged content no one has marked ready); and its
        catalog-level content outside the resources (`catalogChanges`): each dependency declaration
        added, removed or re-pinned, by its alias, and its default theme, presets and license when
        they changed. Together that is what the release's content hash covers; the catalog's
        presentation (its name, description and the like) is not content and is not listed.

        For a draft, `releasable` says whether releasing it would be accepted now: something changed,
        and every changed resource is ready, among the rest `CatalogChangesDto.releasable` lists.
        Once released it has no changes and is not releasable.
      tags:
