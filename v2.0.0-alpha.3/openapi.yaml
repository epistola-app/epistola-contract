          total: 2
          totalPages: 1
    DeploymentDto:
      type: object
      description: |
        One release of a catalog an environment serves: a released one, or a draft rendered live. An
        environment serves at most one draft of a catalog.
      required:
        - registry
        - namespace
        - catalogKey
        - releaseId
        - status
        - version
        - releaseName
        - deployedAt
        - lastUsedAt
        - documentsRequested
      properties:
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog: the exchange or domain its namespace lives in. Always written in
            full, the default registry by its name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog, within its registry
          example: acme-corp
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog, unique within its registry and namespace
          example: letters
        releaseId:
          $ref: '#/components/schemas/CatalogReleaseId'
          description: |
            The release the environment serves, by its `releaseId`. A draft keeps it when it is
            released, so a deployed draft that is released stays deployed, as the same release.
        status:
          $ref: '#/components/schemas/CatalogReleaseStatus'
          description: |
            The release's status: `released`, served at its `version`; or `draft`, rendered live with no
            version. A draft is never served by a production environment.
        version:
          oneOf:
            - $ref: '#/components/schemas/ReleaseVersion'
            - type: 'null'
          description: The version of the release the environment serves. Null for a draft.
          example: 1.4.0
        releaseName:
          type:
            - string
            - 'null'
          maxLength: 100
          description: |
            The release's name. Null for a release that has none, as one installed by import or from
            its source.
          example: Redesign 2027
        deployedAt:
          type: string
          format: date-time
          example: '2026-10-02T07:30:00Z'
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When a generation request through this environment was last accepted for this release; null
            when none has been since it was deployed.

            A request is counted when it names this environment and is accepted and rendered with this
            deployed release. Requests naming no environment are not counted. Updated within about a
            minute of the request, and reset when the release is undeployed; a deployed draft that is
            released keeps its counts, as the same deployment. Together with `documentsRequested` it
            shows which deployed releases nobody uses any more, before undeploying them.
          example: '2026-10-17T14:05:00Z'
        documentsRequested:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many generation requests through this environment were accepted for this release since
            it was deployed. Counted, updated and reset as `lastUsedAt` describes.
          example: 1284
    MissingReleaseDependency:
      type: object
      description: A release of another catalog that a release renders with, which could not be served
      required:
        - registry
        - namespace
        - catalogKey
        - version
        - reason
      properties:
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog depended on. Always written in full, the default registry by its
            name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog depended on, within its registry
          example: epistola
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog depended on, unique within its registry and namespace
          example: system
        version:
          $ref: '#/components/schemas/ReleaseVersion'
          description: |
            The version of the release of the catalog depended on that the deployed release renders
            with
        reason:
          $ref: '#/components/schemas/MissingReleaseDependencyReason'
    MissingReleaseDependencyReason:
      type: string
      description: |
        Why a dependency release cannot be used:

        - `unavailable`: the tenant does not have the release, and it could not be fetched from its
          registry or any configured mirror, or the copy did not match its recorded fingerprint.
      enum:
        - unavailable
      example: unavailable
    DeploymentListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentDto'
    DeploymentEventDto:
      type: object
      description: One change to what an environment serves
      required:
        - registry
        - namespace
        - catalogKey
        - releaseId
        - status
        - version
        - releaseName
        - action
        - changedAt
      properties:
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog: the exchange or domain its namespace lives in. Always written in
            full, the default registry by its name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog, within its registry
          example: acme-corp
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog, unique within its registry and namespace
          example: letters
        action:
          type: string
          description: |
            - `deployed`, `undeployed`: the environment started or stopped serving the release. A
              draft replaced by deploying another, and a deployed draft that was discarded, are
              `undeployed`.
            - `released`: the deployed draft was released; the environment now serves it as released,
              at `version`, with the same `releaseId` and name.
          enum:
            - deployed
            - undeployed
            - released
          example: deployed
        releaseId:
          $ref: '#/components/schemas/CatalogReleaseId'
          description: The release deployed, undeployed or released, by its `releaseId`
        status:
          $ref: '#/components/schemas/CatalogReleaseStatus'
          description: |
            The release's status after the change: `draft` for a draft deployed or undeployed,
            `released` for a released one, and for a draft that was `released`.
        version:
          oneOf:
            - $ref: '#/components/schemas/ReleaseVersion'
            - type: 'null'
          description: |
            The version of the release deployed or undeployed, or the version a deployed draft was
            released as. Null for a draft deployed or undeployed.
          example: 1.4.1
        releaseName:
          type:
            - string
            - 'null'
          maxLength: 100
          description: |
            The release's name at the time of the change. Null for a release that has none, as one
            installed by import or from its source.
          example: Redesign 2027
        changedAt:
          type: string
          format: date-time
          example: '2026-10-02T07:30:00Z'
        changedBy:
          type:
            - string
            - 'null'
          description: Display name of who made the change; null for a system change
          example: Jane Smith
    DeploymentHistoryResponse:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentEventDto'
        page:
          $ref: '#/components/schemas/PageMeta'
    ImageDto:
      type: object
      description: |
        An image in a catalog, as metadata. The image itself is fetched through
        `GET .../images/{imageKey}/content`.

        A template places an image by referencing its `key` from an image node, as `props.imageKey`
        alongside the owning catalog's `props.catalogKey`.
      required:
        - key
        - tenantKey
        - registry
        - namespace
        - catalogKey
        - readOnly
        - name
        - mediaType
        - sizeBytes
        - createdAt
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: |
            The image's key, unique within its catalog. It is the value a template references as
            `props.imageKey`, the image's key in a catalog export, and the `{imageKey}` that addresses
            the image in this API.

            An image this installation creates has a generated UUID as its key. An image from a catalog
            published elsewhere may have a readable one, such as `municipality-mark`. Treat it as an
            opaque string either way.
          example: 4a64f2f9-2c7a-4d26-9cf7-d34c7ce92280
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          example: acme-corp
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog: the exchange or domain its namespace lives in. Always written in
            full, the default registry by its name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog, within its registry
          example: acme-corp
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog this resource lives in, unique within its registry and namespace
          example: default
        readOnly:
          type: boolean
          description: |
            True when the image's catalog cannot be changed in this installation (its `CatalogDto.editable`
            is false; `readOnlyReason` there says why). Clients disable editing affordances; writes to
            it are refused with 409 `catalog-read-only`.
          example: false
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: logo.svg
        mediaType:
          type: string
          description: |
            The image's MIME type. Supported image types are deployment-configured; common ones are
            `image/png`, `image/jpeg`, `image/svg+xml`, and `image/webp`.
          example: image/svg+xml
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 5242880
          example: 12482
        width:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Width in pixels when known; null for SVG.
          example: 512
        height:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Height in pixels when known; null for SVG.
          example: 128
        createdAt:
          type: string
          format: date-time
          example: '2026-07-23T10:00:00Z'
    ImageListResponse:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageDto'
        page:
          $ref: '#/components/schemas/PageMeta'
