      description: |
        The name a catalog's dependency declarations give another catalog, by which the catalog's
        content and the references this API reports name it (portable catalog wire v8, contract ADR
        0003): "theme `corporate` of `shared`". The catalog key rule: lowercase letters, digits and
        single hyphens, starting with a letter, 3 to 50 characters. Unique among a release's
        declarations, never the catalog's own key, and by default the depended-on catalog's own key;
        a declaration gives another one when two catalogs it depends on share a key. A reference
        resolves it through the declarations of the release it is in, which name the catalog in full
        (`registry`, `namespace`, `catalogKey`) and the release they pin. The same rule as
        `CatalogAliases` in the catalog archive.
      example: shared
    AttributeDto:
      type: object
      description: |
        An attribute definition for variant selection within a tenant.

        An attribute is constrained in exactly one of three ways:
          - **Free format** — `allowedValues` is empty and `codeListBinding` is null.
          - **Inline values** — `allowedValues` is non-empty; `codeListBinding` is null.
          - **Bound to a code list** — `codeListBinding` is set; `allowedValues` is empty.

        Attributes of a catalog that cannot be changed in this installation (e.g. the bundled `system`
        catalog) are flagged `readOnly: true`. Writes to them return 409 `catalog-read-only`.
      required:
        - key
        - tenantKey
        - registry
        - namespace
        - catalogKey
        - displayName
        - readOnly
        - allowedValues
        - createdAt
        - lastModified
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: |
            Key of the attribute (unique within `tenant + catalog`).
          example: locale
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
          description: Key of the tenant this attribute belongs to.
          example: acme-corp
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog: the exchange or domain its namespace lives in. Always written in
            full, the default registry by its name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog, within its registry
          example: epistola
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog this resource lives in, unique within its registry and namespace
          example: system
        displayName:
          type: string
          description: Human-readable display name.
          example: Locale
        description:
          type:
            - string
            - 'null'
          description: Human-readable description of the attribute.
          example: BCP-47 language + region tag (e.g. en-US, nl-NL).
        allowedValues:
          type: array
          items:
            type: string
          description: |
            Allowed values when the attribute uses the inline-values constraint.
            Empty for free-format and code-list-bound attributes.
          default: []
          example: []
        codeListBinding:
          type:
            - object
            - 'null'
          description: |
            Set when the attribute is bound to a code list. The bound list may live in this same
            catalog or in another catalog the attribute's release declares as a dependency (a local
            attribute binding to `bcp-47` of `system`), named by the declaration's alias, as the
            attribute's catalog content names it (catalog wire v8); `listCatalogDependencies` names
            that catalog in full.
          required:
            - catalogKey
            - key
          properties:
            catalogKey:
              oneOf:
                - $ref: '#/components/schemas/CatalogAlias'
                - type: 'null'
              description: |
                The alias of the catalog the bound code list belongs to, as the release's dependency
                declarations give it; null when it is the attribute's own catalog.
              example: system
            key:
              $ref: '#/components/schemas/ResourceKey'
              description: Code list key within that catalog.
              example: bcp-47
        readOnly:
          type: boolean
          description: |
            True when the attribute's catalog cannot be changed in this installation (its `CatalogDto.editable`
            is false; `readOnlyReason` there says why). Clients disable editing affordances; writes to
            it are refused with 409 `catalog-read-only`.
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-01-16T10:00:00Z'
        lastModified:
          type: string
          format: date-time
          example: '2026-05-11T12:00:00Z'
      example:
        key: locale
        tenantKey: acme-corp
        registry: exchange.epistola.app
        namespace: epistola
        catalogKey: system
        displayName: Locale
        description: BCP-47 language + region tag (e.g. en-US, nl-NL).
        allowedValues: []
        codeListBinding:
          catalogKey: null
          key: bcp-47
        readOnly: true
        createdAt: '2026-01-16T10:00:00Z'
        lastModified: '2026-05-11T12:00:00Z'
    AttributeListResponse:
      description: List of attribute definitions
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          description: List of attribute definitions
          items:
            $ref: '#/components/schemas/AttributeDto'
        page:
          $ref: '#/components/schemas/PageMeta'
      example:
        items:
          - key: locale
            tenantKey: acme-corp
            registry: exchange.epistola.app
            namespace: epistola
            catalogKey: system
            displayName: Locale
            allowedValues: []
            codeListBinding:
              catalogKey: null
              key: bcp-47
            readOnly: true
            createdAt: '2026-01-16T10:00:00Z'
            lastModified: '2026-05-11T12:00:00Z'
          - key: priority
            tenantKey: acme-corp
            registry: exchange.epistola.app
            namespace: acme-corp
            catalogKey: default
            displayName: Priority
            allowedValues:
              - low
              - normal
              - high
            codeListBinding: null
            readOnly: false
            createdAt: '2026-01-16T10:30:00Z'
            lastModified: '2026-01-16T10:30:00Z'
        page:
          number: 0
          size: 20
          total: 2
          totalPages: 1
    CreateAttributeRequest:
      type: object
      description: |
        Request body for creating a new attribute definition.

        Exactly one constraint shape is allowed:
          - Omit both `allowedValues` and `codeListBinding` for free-format.
          - Provide a non-empty `allowedValues` for inline values.
          - Provide `codeListBinding` for code-list-bound (and leave `allowedValues` empty).
        Mixing the two is refused with 400 `validation-error`.
      required:
        - key
        - displayName
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          example: priority
        displayName:
          type: string
          example: Priority
        description:
          type:
            - string
            - 'null'
          example: Customer-facing priority of the document.
        allowedValues:
          type: array
          items:
            type: string
          default: []
          example:
            - low
            - normal
            - high
        codeListBinding:
          type:
            - object
            - 'null'
          description: |
            The code list the attribute's values come from: in the attribute's own catalog, or in a
            catalog its draft declares as a dependency, named by the declaration's alias. An alias the
            draft does not declare is refused with 400.
          required:
            - key
          properties:
            catalogKey:
              oneOf:
                - $ref: '#/components/schemas/CatalogAlias'
                - type: 'null'
              description: |
                The alias of the catalog the bound code list belongs to, as the draft's dependency
                declarations give it. Omitted or null, or the attribute's own catalog key: the
                attribute's own catalog.
              example: system
            key:
              $ref: '#/components/schemas/ResourceKey'
              description: Key of the bound code list
              example: iso-639-1
    UpdateAttributeRequest:
      type: object
      description: |
        Request body for updating an attribute definition. All fields are optional
        (PATCH semantics): an omitted or null member keeps its current value, since generated servers
        and clients cannot tell an omitted member from a null one. Constraint kind may switch — send
        `clearCodeListBinding: true` with `allowedValues` to move from bound to inline, or a
        `codeListBinding` with an empty `allowedValues` to move from inline to bound. Attempting to
        update an attribute of a catalog that cannot be changed returns 409 `catalog-read-only`.
      properties:
        displayName:
          type: string
        description:
          type:
            - string
            - 'null'
        allowedValues:
          type: array
          items:
            type: string
        codeListBinding:
          type:
            - object
            - 'null'
          required:
            - key
          properties:
            catalogKey:
              oneOf:
                - $ref: '#/components/schemas/CatalogAlias'
                - type: 'null'
              description: |
                The alias of the catalog the bound code list belongs to, as the draft's dependency
                declarations give it. Omitted or null, or the attribute's own catalog key: the
                attribute's own catalog.
            key:
              $ref: '#/components/schemas/ResourceKey'
              description: Key of the bound code list
          description: |
            The code list the attribute's values come from: in the attribute's own catalog, or in a
            catalog its draft declares as a dependency, named by the declaration's alias (an alias the
            draft does not declare is refused with 400). Omitted or null keeps the current binding;
            `clearCodeListBinding` removes it.
        clearCodeListBinding:
          type:
            - boolean
            - 'null'
          description: |
            True removes the attribute's code list binding. Omitted, null or false keeps it. True
            together with a `codeListBinding` is refused with 400.
          example: true
    UpdateCodeListEntryHiddenRequest:
      type: object
      description: Request body for hiding or showing a single code-list entry.
      required:
        - hidden
      properties:
        hidden:
          type: boolean
          description: True to hide the entry from pickers; false to show it again.
          example: true
    FontVariantDto:
      type: object
      description: One face of a font family — CSS numeric `weight` (1–1000) + `italic`.
      required:
        - weight
        - italic
      properties:
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          description: CSS font-weight (400 = regular, 700 = bold).
          example: 400
        italic:
          type: boolean
          example: false
    FontDto:
      type: object
      description: |
        A font family: a thin, tenant + catalog scoped grouping over the
        weight/italic faces it ships. Faces are backed by uploaded assets or
        bundled classpath files; this view exposes metadata only (no binaries).

        A family of a catalog that cannot be changed in this installation (e.g. the bundled `system`
        catalog's `inter`, `roboto`, …) is flagged `readOnly: true`. A catalog carries its faces as
        resources of its releases, the `system` catalog included.

        **Read-only over REST.** Font families and their binaries are managed
        through the UI and catalog exchange only — there is no create/update/delete
        via this API, unlike images, which can be uploaded (`uploadImage`) and
        deleted (`deleteImage`). (Write access may be revisited later.)
      required:
        - key
        - name
        - kind
        - registry
        - namespace
        - catalogKey
        - readOnly
        - variants
        - createdAt
        - lastModified
      properties:
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: Key (unique within `tenant + catalog`).
          example: inter
        name:
          type: string
          description: Human-readable family name.
          example: Inter
        kind:
          type: string
          enum:
            - sans
            - serif
            - mono
            - condensed
            - display
          description: Broad typeface classification, used by the editor picker.
          example: sans
        registry:
          $ref: '#/components/schemas/Registry'
          description: |
            Registry of the catalog: the exchange or domain its namespace lives in. Always written in
            full, the default registry by its name, never `~`.
          example: exchange.epistola.app
        namespace:
          $ref: '#/components/schemas/Namespace'
          description: Namespace of the catalog, within its registry
          example: epistola
        catalogKey:
          $ref: '#/components/schemas/CatalogKey'
          description: Key of the catalog this resource lives in, unique within its registry and namespace
          example: system
        readOnly:
          type: boolean
          description: |
            True when the family's catalog cannot be changed in this installation (its `CatalogDto.editable`
            is false; `readOnlyReason` there says why). Clients disable editing affordances; writes to
            it are refused with 409 `catalog-read-only`.
        variants:
          type: array
          description: The weight/italic faces this family ships.
          items:
            $ref: '#/components/schemas/FontVariantDto'
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    FontListResponse:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FontDto'
        page:
          $ref: '#/components/schemas/PageMeta'
    NodeId:
      type: string
      minLength: 1
      description: Unique identifier for a node within a document.
    SlotId:
      type: string
      minLength: 1
      description: Unique identifier for a slot within a document.
    TemplateDocument:
      title: TemplateDocument
      description: 'An Epistola template document: a flat graph of nodes (blocks) and slots (named places in a node that hold child nodes), linked by id. root names the one node of type root, whose children slot is the document body. Which component types exist, their slots, properties and applicable styles are defined by the catalog''s component registry (contracts/catalog/registry/component-registry.json), with an example per component; the template model guide (https://github.com/epistola-app/epistola-contract/blob/main/contracts/api/docs/template-model.md) walks through a complete letter.'
      type: object
      properties:
        modelVersion:
          type: integer
          const: 1
          description: Schema version for forward-compatibility detection.
        root:
          $ref: '#/components/schemas/NodeId'
          description: ID of the root node in the document tree.
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Node'
          description: Every node of the document, keyed by its id. A node appears in exactly one slot's children, except the root.
        slots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Slot'
          description: Every slot of the document, keyed by its id. A slot belongs to the node named by its nodeId and is listed in that node's slots.
        themeRef:
          $ref: '#/components/schemas/ThemeRef'
        pageSettingsOverride:
          $ref: '#/components/schemas/PageSettings'
        documentStylesOverride:
          $ref: '#/components/schemas/DocumentStyles'
      required:
        - modelVersion
        - root
        - nodes
        - slots
        - themeRef
      additionalProperties: false
      $defs:
        Node:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/NodeId'
            type:
              type: string
              minLength: 1
              description: 'The component type, one of the component registry''s types (contracts/catalog/registry/component-registry.json): text, container, columns, table, conditional, loop, stencil, image and so on. It decides which slots, props and styles the node may have.'
            slots:
              type: array
              items:
                $ref: '#/components/schemas/SlotId'
              description: 'The ids of the slots this node owns, in order. Their names follow the component''s slot rules: children for a container, body and else for a conditional, cell-<row>-<col> for a table.'
            styles:
              type: object
              description: 'Style properties for this node only, CSS-like key and value pairs from the catalog''s style registry (contracts/catalog/registry/style-registry.json): marginBottom, fontSize, backgroundColor. They override what the theme and preset supply. Lengths are pt or sp (spacing units of the theme), and some also take %.'
            stylePreset:
              type: string
              description: 'Names one of the catalog''s available block style presets: the presets its manifest declares (catalog.presets) plus those of the catalogs it depends on. The rendering theme''s blockStylePresets supplies the styles; a theme that does not style it leaves the block with its own styles only. While a catalog declares no presets, the presets its themes style stand in for the list.'
            props:
              type: object
              description: 'The component''s own properties, as its registry entry declares them: a text node''s content (a rich-text document whose expression nodes insert JSONata values from the data), a conditional''s condition, a table''s rows and columns, a stencil instance''s stencilKey and parameterBindings.'
          required:
            - id
            - type
            - slots
          additionalProperties: false
        Slot:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/SlotId'
            nodeId:
              $ref: '#/components/schemas/NodeId'
              description: Parent node that owns this slot.
            name:
              type: string
              minLength: 1
              description: 'The slot''s name, as the owning component defines its slots: children, column-0, cell-0-1, body, else, fill.'
            children:
              type: array
              items:
                $ref: '#/components/schemas/NodeId'
              description: Ordered child node IDs in this slot.
          required:
            - id
            - nodeId
            - name
            - children
          additionalProperties: false
    ContentHash:
      type: string
      pattern: ^v6:[0-9a-f]{64}$
      description: |
        The content hash of a release: its V6 catalog fingerprint (`v6:` and the lowercase hex
        SHA-256), which covers the release's content and nothing else, not its catalog's name, its
        number, its release metadata or the catalog's presentation (portable catalog wire v8, contract
        ADR 0003). It identifies the release: two releases with the same content hash are the same
        release, whatever they are called and wherever they come from, and a release fetched by it
        verifies itself. Several numbers can name one content hash: in one catalog (a release whose
        changes restore an earlier one's content, or one received again under another number with
        only its notes changed), and across names (a mirror, a renamed catalog). For a
        release made under V6 it equals the recorded `fingerprint`; for one recorded with an earlier
        algorithm (`v5:`) it is computed from the release's content.
      example: v6:4ef99d5bdefa57bcb76c8644383ad652d7223fdbe9f9818608a172017d475edb
    CatalogLevelChangeDto:
      type: object
      description: |
        One part of a release's catalog-level content, outside its resources, that differs from its
        base: what its content hash covers beside the resources (contract ADR 0003), never the
        catalog's presentation. Named by `type` and `key` as the entries of a merge are.
      required:
        - type
        - key
        - change
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            `catalog` for a setting of the release, `catalogDependency` for a catalog it declares it
            uses. A string, not an enum: a client keeps a type it does not know.
          example: catalogDependency
        key:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            For `catalog`, the setting: `defaultTheme`, `presets` or `license`. For
            `catalogDependency`, the declaration's alias (`CatalogAlias`).
          example: shared
        change:
          type: string
          enum:
            - added
            - modified
            - removed
          description: |
            - `added`: the base has none (no default theme, presets or license, or no declaration
              under this alias) and the release has one;
            - `modified`: both have one, and it differs: another default theme, other presets, another
              license; for a declaration, another release pinned (re-pinned), a draft named instead,
              or another catalog under the same alias;
            - `removed`: the base has one and the release does not.
          example: modified
    ReleaseRegistryName:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      minLength: 1
      maxLength: 63
      description: |
        The name an installation gives a release registry it has configured or is connected to
        (`acme`, `exchange`): lowercase letters, digits and single hyphens, at most 63 characters.
        Installation configuration, not a catalog's name: it is not the `{registry}` of a catalog
        path (ADR 0008).
      example: acme
    VariantSelectionAttribute:
      type: object
      description: |
        An attribute criterion for variant selection: the attribute, by its key and the catalog that
        defines it, and the value a variant must have for it.

        Without `catalogKey`, `key` names an attribute of the template's own catalog. With `catalogKey`,
        it names an attribute of the catalog with that alias in the dependency declarations of the
        release that renders (`listCatalogDependencies`), as the template's content names that catalog
        (see "Catalog identity"); the template's own catalog key names its own catalog. An alias the
        release does not declare names no attribute, so no variant has a value for it.
      required:
        - key
        - value
      properties:
        catalogKey:
          oneOf:
            - $ref: '#/components/schemas/CatalogAlias'
            - type: 'null'
          description: |
            The alias of the catalog that defines the attribute, as the dependency declarations of the
            release that renders give it. Omitted or null: the template's own catalog.
          example: system
        key:
          $ref: '#/components/schemas/ResourceKey'
          description: Key of the attribute, in the catalog that defines it.
          example: locale
        value:
          type: string
          description: Attribute value to match.
          example: en-US
        required:
          type: boolean
          default: true
          description: If true, variant MUST match this attribute. If false, it's preferred but not mandatory.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number (0-based)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Field to sort by. The set of allowed fields depends on the resource; an
        unsupported value is rejected by the server, which also applies the
        per-resource default when omitted.
      schema:
        type: string
    Direction:
      name: direction
      in: query
      required: false
      description: |
        Sort direction, applied when a `sort` field is selected. An unsupported value
        is rejected.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `ETag` of the resource as you last read it, as the server returned it (a quoted revision,
        e.g. `"7"`). When given and the resource has changed since, the update is refused with 412
        `resource-modified` and nothing changes. When left out, the update is applied regardless of
        concurrent changes: the last write wins.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: '"7"'
    Registry:
      name: registry
      in: path
      required: true
      description: |
        Registry of the catalog: the exchange (`exchange.epistola.app`) or the domain that publishes
        it (`acme.com`), in normal domain order, or `local` for a name that never leaves the
        organisation.

        `~` means the installation's **default registry**, which the server configures; it is not part
        of this contract. The default registry may also be named in full, and both address the same
        catalog. A client may send `~` as it is or percent-encoded as `%7E`; the server accepts both.
      schema:
        $ref: '#/components/schemas/RegistryOrDefault'
      example: '~'
    Namespace:
      name: namespace
      in: path
      required: true
      description: |
        Namespace of the catalog, within its registry. The same namespace in two registries is two
        different namespaces.
      schema:
        $ref: '#/components/schemas/Namespace'
      example: acme-corp
    CatalogKey:
      name: catalogKey
      in: path
      required: true
      description: Key of the catalog, unique within its registry and namespace
      schema:
        $ref: '#/components/schemas/CatalogKey'
      example: letters
    Release:
      name: release
      in: path
      required: true
      description: |
        A release of the catalog, by its `releaseId` (`CatalogReleaseId`) or, once it is released, by
        its exact version: both address the same release. A draft has no version until it is released,
        so it is addressed by its `releaseId` alone; releasing it keeps the id. Once it is released,
        every write to it is refused with 409, whichever way it is addressed. A `releaseId` never
        contains a dot, so the two cannot be confused. A discarded draft's id addresses nothing (404).
      schema:
        $ref: '#/components/schemas/CatalogReleaseRef'
      example: k7m2x9qa
    ReleaseRegistryName:
      name: name
      in: path
      required: true
      description: |
        The release registry, by the name this installation gives it (`listReleaseRegistries`). Not a
        catalog's registry: a release registry is where releases are published to and installed from.
      schema:
        $ref: '#/components/schemas/ReleaseRegistryName'
      example: acme
  headers:
    ETag:
      description: |
        The resource's current revision, as a strong entity tag: a quoted decimal integer, e.g. `"7"`.
        It changes whenever the resource changes. Send it as `If-Match` on an update to have the update
        refused with 412 `resource-modified` if someone changed the resource in the meantime.
      schema:
        type: string
        pattern: ^"[0-9]+"$
      example: '"7"'
    Location:
      description: |
        The address of what the request created, which a GET reads: a URI reference, usually an
        absolute path below the server's base path, such as
        `/api/tenants/acme-corp/environments/staging`. Resolve it against the request URL.
      schema:
        type: string
      example: /api/tenants/acme-corp/environments/staging
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-experimental: true
      description: |
        **Experimental**, and may still change: see "Experimental parts and server support" in
        the API description. Use an API key (`Authorization: ApiKey <key>`) for production
        integrations.

        JWT Bearer token. Two authentication paths are defined:

        **OAuth (for environments with an IdP):**
        Obtain a token via OAuth 2.0 Client Credentials flow from your
        Identity Provider (Keycloak, Azure AD, or any OIDC-compliant IdP).
        The JWT `client_id` claim identifies the consumer.

        **Self-signed JWT (no IdP required):**
        Register via `POST /tenants/{tenantKey}/consumers/register` with a public key.
        After admin approval, create short-lived JWTs (60s) signed with
        your private key. Required claims: `iss` (consumer ID), `exp`,
        `jti` (unique nonce for replay protection).

        In both cases, the JWT proves identity only. Granted permissions,
        allowed tenants, and expiry are managed in Epistola's consumer record,
        set by an administrator during approval.
    authorizationApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Static API key sent through the standard `Authorization` header:

        `Authorization: ApiKey <key>`

        The scheme name is case-insensitive; examples use `ApiKey`. A tenant manager issues
        each key for one tenant, with the tenant roles it grants. This is the supported
        authentication method.
  responses:
    ValidationFailedError:
      description: The request body or parameters failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          example:
            type: https://epistola.app/errors/validation-error
            title: Bad Request
            status: 400
            detail: The request body failed validation
            errors:
              - field: name
                message: must not be blank
    UnauthorizedError:
      description: Missing or invalid authentication credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Invalid or expired access token
    ForbiddenError:
      description: Authenticated but insufficient permissions for the requested resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/forbidden
            title: Forbidden
            status: 403
            detail: Access denied to tenant 'acme-corp'
    ConflictError:
      description: The request conflicts with the current state of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/conflict
            title: Conflict
            status: 409
            detail: The request conflicts with the current state of the resource
    NotFoundError:
      description: The requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/not-found
            title: Not Found
            status: 404
            detail: The requested resource was not found
    ResourceModifiedError:
      description: The resource changed since the `ETag` sent as `If-Match` was read, so the update was refused and nothing changed. Read the resource again, reapply your change to what you read, and send the update with the new `ETag`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/resource-modified
            title: Resource Modified
            status: 412
            detail: The resource changed since revision 7 was read; it is now at revision 8
    CatalogReadOnlyError:
      description: 'The request conflicts with the current state of the resource. When the catalog cannot be changed in this installation (`CatalogDto.editable` is false), the problem is `catalog-read-only` and `readOnlyReason` says why: the installation only receives and runs releases (`editing-disabled`), or the server supplies the catalog itself (`supplied-by-epistola`). Other conflicts use `conflict`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogReadOnlyProblemDetail'
          example:
            type: https://epistola.app/errors/catalog-read-only
            title: Catalog Read Only
            status: 409
            detail: exchange.epistola.app/epistola/system is supplied by Epistola and cannot be changed
            readOnlyReason: supplied-by-epistola
    EnvironmentDeploymentRefusedError:
      description: 'The request conflicts with the current state of the resource. When the environment is marked production while it serves a draft of a catalog, the problem is `environment-deployment-refused`: a production environment serves only releases. Other conflicts use `conflict`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/environment-deployment-refused
            title: Environment Deployment Refused
            status: 409
            detail: 'production serves only releases: it serves the draft Spring fixes of letters'
    EnvironmentDeploymentConflictError:
      description: The request conflicts with the current state of the resource. When the release cannot be deployed to this environment, a draft to a production environment, the problem is `environment-deployment-refused`. When the release renders with releases of other catalogs that the tenant does not have and that cannot be fetched, the problem is `release-dependencies-missing` and `missingDependencies` lists each one and why. Other conflicts use `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReleaseDependenciesMissingProblemDetail'
          examples:
            draftOnProduction:
              summary: A draft deployed to a production environment
              value:
                type: https://epistola.app/errors/environment-deployment-refused
                title: Environment Deployment Refused
                status: 409
                detail: 'production serves only releases: it cannot serve a draft of letters'
            dependenciesMissing:
              summary: Dependency releases that cannot be had
              value:
                type: https://epistola.app/errors/release-dependencies-missing
                title: Release Dependencies Missing
                status: 409
                detail: 'letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0'
                missingDependencies:
                  - registry: exchange.epistola.app
                    namespace: epistola
                    catalogKey: system
                    version: 3.2.0
                    reason: unavailable
    BadRequestError:
      description: The request is malformed or not applicable to the resource's current state, but not a field-level validation failure (no `errors[]`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/bad-request
            title: Bad Request
            status: 400
            detail: The request cannot be applied to the resource's current state
    UnprocessableEntityError:
      description: The request was well-formed but cannot be processed because its content is semantically invalid (e.g. supplied data examples do not match the data model).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DataModelValidationProblemDetail'
          example:
            type: https://epistola.app/errors/data-model-validation-error
            title: Data Model Validation Error
            status: 422
            detail: Data examples failed validation against schema
            validationErrors:
              Example 1:
                - path: /name
                  message: required property 'name' not found
    ReleaseDependenciesUnreleasedError:
      description: The request conflicts with the current state of the resource. When the draft's dependency declarations name drafts of other catalogs and the request does not release them along (`releaseDependencies`), the problem is `release-dependencies-unreleased` and `unreleasedDependencies` lists each such draft. When the catalog cannot be changed in this installation, the problem is `catalog-read-only` (`readOnlyReason`). Other conflicts (a draft that is behind releases not acknowledged, a draft taken along that cannot be released) use `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReleaseDependenciesUnreleasedProblemDetail'
          example:
            type: https://epistola.app/errors/release-dependencies-unreleased
            title: Release Dependencies Unreleased
            status: 409
            detail: 'letters uses drafts of other catalogs: acme-corp/branding (House style 2027)'
            unreleasedDependencies:
              - registry: exchange.epistola.app
                namespace: acme-corp
                catalogKey: branding
                releaseId: r4t8w2nc
                releaseName: House style 2027
    MergeSidesConflictError:
      description: The sides of the entry cannot be read (alpha). When this installation does not have the merge base (the closest release both lines descend from), the problem is `merge-base-missing`, and `version` and `fingerprint` name that release, to install first. Other conflicts (the path names a released release, not a draft) use `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MergeBaseMissingProblemDetail'
          example:
            type: https://epistola.app/errors/merge-base-missing
            title: Merge Base Missing
            status: 409
            detail: To merge v1.0.1, this installation needs v1.0.0, the release both come from.
            version: 1.0.0
            fingerprint: v5:9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b9f3a1c2b
    MergeConflictError:
      description: The request conflicts with the current state of the draft (alpha). When conflicts of the merge have no resolution, the problem is `merge-conflicts-unresolved` and `unresolvedConflicts` lists each. When the result would hold a reference that does not resolve (a resource the release removes that the draft still uses, or a reference within the catalog or into another catalog, through the release a declared dependency pins, that the result lacks), it is `merge-refused`, and its `detail` names what is missing and what to choose. When the draft or the release changed since the preview named by `expectedToken`, it is `merge-preview-outdated`. When this installation does not have the merge base (the closest release both lines descend from), it is `merge-base-missing`, and `version` and `fingerprint` name that release. When the catalog cannot be changed in this installation, it is `catalog-read-only` (`readOnlyReason`). Other conflicts (the path names a released release, not a draft) use `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MergeConflictsUnresolvedProblemDetail'
          example:
            type: https://epistola.app/errors/merge-conflicts-unresolved
            title: Merge Conflicts Unresolved
            status: 409
            detail: 'Merging 1.5.0 into Redesign 2027 needs a choice for: template/invoice'
            unresolvedConflicts:
              - template/invoice
    MergeNotApplicableError:
      description: 'The merge does not apply (alpha): the draft already contains the release (its base, or merged before), or a resolution names a resource that is not a conflict of the merge.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/merge-not-applicable
            title: Merge Not Applicable
            status: 422
            detail: Redesign 2027 of letters already contains 1.5.0
    CatalogSourceBadGatewayError:
      description: The catalog's source, its registry or a mirror of it the server is configured with, or the release registry the request names (alpha), answered with an error or with something that is not a valid answer, so the request could not be carried out and nothing was installed or published. The problem is `catalog-source-unavailable`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/catalog-source-unavailable
            title: Catalog Source Unavailable
            status: 502
            detail: registry.gemeente-x.nl answered 500 for huisstijl/branding
    CatalogSourceUnavailableError:
      description: The catalog's source, its registry or a mirror of it the server is configured with, or the release registry the request names (alpha), could not be reached or did not answer in time, so the request could not be carried out and nothing was installed or published. The problem is `catalog-source-unavailable`. `Retry-After`, when present, says how long to wait before trying again.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when the server can tell
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/catalog-source-unavailable
            title: Catalog Source Unavailable
            status: 503
            detail: registry.gemeente-x.nl could not be reached
    CatalogInstallBadRequestError:
      description: 'The request failed validation (`validation-error`, `errors[]`). When the release renders with rendering defaults this installation does not have, newer or unknown, as its `release.metadata` names them, the problem is `catalog-rendering-defaults-too-new`: `renderingDefaultsVersion` is what the release names and `supportedVersion` the newest this installation has; upgrade Epistola to receive it. Nothing was installed.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogRenderingDefaultsTooNewProblemDetail'
          examples:
            renderingDefaultsTooNew:
              summary: A release that renders with rendering defaults this installation lacks
              value:
                type: https://epistola.app/errors/catalog-rendering-defaults-too-new
                title: Catalog Rendering Defaults Too New
                status: 400
                detail: letters 1.1.0 renders with rendering defaults version 9, which this Epistola does not have (it has up to 6). Upgrade Epistola to receive this release.
                renderingDefaultsVersion: '9'
                supportedVersion: 6
            validationFailed:
              summary: A request that failed validation
              value:
                type: https://epistola.app/errors/validation-error
                title: Bad Request
                status: 400
                detail: The request failed validation
                errors:
                  - field: version
                    message: must be a release version
    ReleaseDependenciesMissingError:
      description: 'The release cannot be received (`importCatalog`, `installCatalogRelease`, `installRegistryRelease`), and nothing was installed. When the release renders with releases of other catalogs that the tenant does not have, that an imported archive does not carry, and that cannot be fetched, the problem is `release-dependencies-missing` and `missingDependencies` lists each one and why. When its number or id names another release here (the tenant has this version of the catalog, or of a release it pins, with another fingerprint, or another release or a draft of the catalog has its release id), it is `release-number-taken`: one number and one id name one release. Other conflicts (the tenant has a catalog under that key in another registry or namespace, one that receives its releases from another source, or a catalog without a source to install from) use `conflict`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReleaseDependenciesMissingProblemDetail'
          examples:
            releaseDependenciesMissing:
              summary: Releases it pins cannot be had
              value:
                type: https://epistola.app/errors/release-dependencies-missing
                title: Release Dependencies Missing
                status: 409
                detail: 'letters 1.4.0 renders with releases that cannot be had: exchange.epistola.app/epistola/system@3.2.0'
                missingDependencies:
                  - registry: exchange.epistola.app
                    namespace: epistola
                    catalogKey: system
                    version: 3.2.0
                    reason: unavailable
            releaseNumberTaken:
              summary: The tenant has this version with other content
              value:
                type: https://epistola.app/errors/release-number-taken
                title: Release Number Taken
                status: 409
                detail: This tenant has letters 1.4.0 with other content (fingerprint v5:9f3a…, the archive's v5:1c2b…); one number names one release.
    ReleaseRegistryNotFoundError:
      description: The addressed resource does not exist. When the release registry the request names is not one this installation has configured or is connected to (alpha), the problem is `release-registry-not-found`. Other missing resources (a catalog, a release, a version the registry does not hold) use `not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            registryNotFound:
              summary: A release registry this installation does not have
              value:
                type: https://epistola.app/errors/release-registry-not-found
                title: Release Registry Not Found
                status: 404
                detail: 'There is no release registry called ''acme''. This installation has: exchange'
            notFound:
              summary: A release the registry does not hold
              value:
                type: https://epistola.app/errors/not-found
                title: Not Found
                status: 404
                detail: acme has no release 1.4.0 of acme-corp/letters
    ReleasePublicationConflictError:
      description: 'The release cannot be published as asked (alpha), and nothing was sent. When the registry holds this version with other content, the problem is `release-number-taken`: one number names one release. When the registry grants namespaces (the Exchange) and does not grant this installation the catalog''s namespace, it is `namespace-not-granted`. Other conflicts (the path names a draft: only a released release is published) use `conflict`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            releaseNumberTaken:
              summary: The registry holds this version with other content
              value:
                type: https://epistola.app/errors/release-number-taken
                title: Release Number Taken
                status: 409
                detail: 'acme already has acme-corp/letters 1.4.0 with other content. One number names one release: release the changes under a new number.'
            namespaceNotGranted:
              summary: The Exchange does not grant the catalog's namespace
              value:
                type: https://epistola.app/errors/namespace-not-granted
                title: Namespace Not Granted
                status: 409
                detail: The Exchange connection does not grant the namespace acme-corp
    CatalogImportBadRequestError:
      description: 'The archive cannot be installed: it is not a valid catalog archive, or it fails validation (`bad-request`). When the release renders with rendering defaults this installation does not have, newer or unknown, as its `release.metadata` names them, the problem is `catalog-rendering-defaults-too-new`: `renderingDefaultsVersion` is what the release names and `supportedVersion` the newest this installation has; upgrade Epistola to receive it. Nothing was installed.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogRenderingDefaultsTooNewProblemDetail'
          examples:
            invalidArchive:
              summary: An archive that fails validation
              value:
                type: https://epistola.app/errors/bad-request
                title: Bad Request
                status: 400
                detail: The archive has no catalog.json
            renderingDefaultsTooNew:
              summary: A release that renders with rendering defaults this installation lacks
              value:
                type: https://epistola.app/errors/catalog-rendering-defaults-too-new
                title: Catalog Rendering Defaults Too New
                status: 400
                detail: letters 1.1.0 renders with rendering defaults version 9, which this Epistola does not have (it has up to 6). Upgrade Epistola to receive this release.
                renderingDefaultsVersion: '9'
                supportedVersion: 6
    TemplateDataInvalidError:
      description: 'The request failed validation. When the template data breaks the template''s data contract, the problem is `template-data-invalid`: `errors[]` lists each field (`field` a JSON Pointer into the request body), and `missingFields` and `invalidFields` describe what to supply or correct. Other request validation failures use `validation-error`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TemplateDataValidationProblemDetail'
          example:
            type: https://epistola.app/errors/template-data-invalid
            title: Template Data Invalid
            status: 400
            detail: 'Data validation failed: /customer/name: is required'
            errors:
              - field: /data/customer/name
                message: is required
            missingFields:
              - path: /customer/name
                required: true
                schema:
                  type: string
            invalidFields: []
    RateLimitedError:
      description: Too many requests; retry after the period indicated by the Retry-After header
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://epistola.app/errors/rate-limited
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded
x-epistola-catalog-contract:
  wireSchemaVersion: 8
  templateModelVersion: 1
x-client-identity:
  nodeIdHeader: X-EP-Node-Id
  contractProduct: epistola-contract
  userAgentProductSeparator: ' '
  userAgentVersionSeparator: /
x-problem-types:
  base: https://epistola.app/errors/
  types:
    - slug: validation-error
      status: 400
      schema: ValidationProblemDetail
      description: The request body or parameters failed validation; the `errors[]` array carries the field-level failures.
    - slug: template-data-invalid
      status: 400
      schema: TemplateDataValidationProblemDetail
      description: The template data breaks the template's data contract; `errors[]` lists each field, and `missingFields` and `invalidFields` describe what to supply or correct.
    - slug: bad-request
      status: 400
      schema: ProblemDetail
      description: The request is malformed or not applicable to the resource's current state, but not a field-level validation failure (no `errors[]`).
    - slug: catalog-rendering-defaults-too-new
      status: 400
      schema: CatalogRenderingDefaultsTooNewProblemDetail
      description: A release received from elsewhere (an imported archive, or a release installed from a catalog's source) renders with rendering defaults this installation does not have, newer or unknown, as its `release.metadata` names them; rendering it with other defaults would change its documents. Refused before anything was written; upgrade Epistola to receive it. `renderingDefaultsVersion` is what the release names, `supportedVersion` the newest this installation has.
    - slug: unauthorized
      status: 401
      schema: ProblemDetail
      description: Missing or invalid authentication credentials.
    - slug: api-key-auth-disabled
      status: 401
      schema: ProblemDetail
      description: 'API-key authentication is disabled for this deployment. Use `Authorization: Bearer <jwt>` instead, or ask an administrator to enable API-key authentication.'
    - slug: forbidden
      status: 403
      schema: ProblemDetail
      description: Authenticated, but the caller lacks the required role or tenant permission.
    - slug: not-found
      status: 404
      schema: ProblemDetail
      description: The addressed resource does not exist.
    - slug: release-registry-not-found
      status: 404
      schema: ProblemDetail
      description: The release registry the request names (alpha, ADR 0008) is not one this installation has configured or is connected to; nothing was published or installed. `listReleaseRegistries` lists those it has.
    - slug: conflict
      status: 409
      schema: ProblemDetail
      description: The request conflicts with the current state of the resource.
    - slug: release-dependencies-missing
      status: 409
      schema: ReleaseDependenciesMissingProblemDetail
      description: 'A release cannot be deployed or imported because releases of other catalogs it renders with (the releases it pins) cannot be had: the tenant does not have them, the import does not carry them, and they could not be fetched or verified; `missingDependencies` lists each one and why.'
    - slug: release-dependencies-unreleased
      status: 409
      schema: ReleaseDependenciesUnreleasedProblemDetail
      description: A draft cannot be released because its dependency declarations name drafts of other catalogs, and a release pins only releases; release them first, or along with it (`releaseDependencies`). `unreleasedDependencies` lists each such draft.
    - slug: catalog-read-only
      status: 409
      schema: CatalogReadOnlyProblemDetail
      description: 'The catalog cannot be changed in this installation, so a write to it (a draft started, edited, discarded, merged into or released) was refused and nothing changed; `readOnlyReason` says why (`editing-disabled`: the installation only receives and runs releases; `supplied-by-epistola`: the server supplies the catalog and replaces it on upgrade).'
    - slug: merge-conflicts-unresolved
      status: 409
      schema: MergeConflictsUnresolvedProblemDetail
      description: Merging a release into a draft (alpha) was refused because conflicts have no resolution; `unresolvedConflicts` lists each, as `resourceType/resourceKey`. Nothing changed.
    - slug: merge-refused
      status: 409
      schema: ProblemDetail
      description: 'Merging a release into a draft (alpha) cannot be applied as asked: the result would leave a reference that does not resolve, within the catalog (a resource the release removes that the draft still uses, or one a taken or kept entry refers to that the result lacks) or into another catalog through a declared dependency, checked against the release it pins (the catalog''s default theme included), or into a catalog the result does not declare. The `detail` names what is missing and what to choose. Nothing changed.'
    - slug: merge-preview-outdated
      status: 409
      schema: ProblemDetail
      description: Merging a release into a draft (alpha) was refused because the draft or the release changed since the preview its `expectedToken` names; preview again. Nothing changed.
    - slug: merge-base-missing
      status: 409
      schema: MergeBaseMissingProblemDetail
      description: Merging a release into a draft (alpha), or reading the sides of one of its entries, was refused because this installation does not have the merge base, the closest release both the draft and the release descend from; `version` and `fingerprint` name the release to get first. Nothing changed.
    - slug: release-number-taken
      status: 409
      schema: ProblemDetail
      description: 'A release could not be published or received because its number or id names another release: publishing to a release registry (alpha), the registry holds a release of the catalog under this version with other content; receiving one (importCatalog, installCatalogRelease, installRegistryRelease), the tenant has this version of the catalog, or of a release it pins, with another fingerprint, or another release or a draft of the catalog has its release id. One number and one id name one release. Nothing was sent or installed; release the changes under a new version.'
    - slug: namespace-not-granted
      status: 409
      schema: ProblemDetail
      description: Publishing a release to a release registry that grants namespaces (the Exchange, alpha) was refused because it does not grant this installation the catalog's namespace. Nothing was sent.
    - slug: environment-deployment-refused
      status: 409
      schema: ProblemDetail
      description: 'A production environment serves only releases: a draft cannot be deployed to it, and an environment that serves a draft cannot be marked production.'
    - slug: resource-modified
      status: 412
      schema: ProblemDetail
      description: 'An update sent `If-Match` with an `ETag` that is no longer current: the resource changed since it was read. Nothing changed; read it again and reapply the change.'
    - slug: data-model-validation-error
      status: 422
      schema: DataModelValidationProblemDetail
      description: The request is well-formed but semantically invalid; the `validationErrors` member maps each data-example name to its failures.
    - slug: merge-not-applicable
      status: 422
      schema: ProblemDetail
      description: 'Merging a release into a draft (alpha) does not apply: the draft already contains the release (its base, or merged before), or a resolution names a resource that is not a conflict of the merge.'
    - slug: rate-limited
      status: 429
      schema: ProblemDetail
      description: Too many requests; the `Retry-After` header indicates how long to wait.
    - slug: catalog-source-unavailable
      status: 503
      schema: ProblemDetail
      description: 'A catalog''s source (its registry, through the mirrors configured for it), or a release registry (alpha), could not be used, so releases could not be listed, installed or published and nothing was installed or published: 503 when it could not be reached or did not answer in time, possibly with `Retry-After`; 502 when it answered with an error or with something that is not a valid answer.'
